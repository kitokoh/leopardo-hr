# ============================================================================
# .trivyignore.yaml — acquittements Trivy documentés (issue #7997)
#
# Consommé par :
#   - .github/workflows/image-scan.yml (input `trivyignores` de trivy-action,
#     scans config ET image) ;
#   - edge/publish.sh (scan PAR DÉFAUT depuis #8024, opt-out TRIVY_ENFORCE=0).
#
# Convention du dépôt (à respecter pour TOUTE nouvelle entrée) :
#   - `statement` OBLIGATOIRE : justification honnête de l'acquittement —
#     jamais d'ignore muet (même règle que les baselines du dépôt) ;
#   - `paths` OBLIGATOIRE : l'acquittement est SCOPÉ au(x) fichier(s) visé(s),
#     il ne masque jamais le même défaut ailleurs (notamment dans un futur
#     Dockerfile) ;
#   - `expired_at` OBLIGATOIRE : l'acquittement est de la dette datée — à
#     l'échéance le constat redevient bloquant (fail-loud), ce qui force un
#     ré-examen explicite plutôt qu'un oubli éternel.
#
# #8024 — les acquittements doivent décrire l'état RÉEL du dépôt : trois
# entrées décrivaient un état antérieur à #7966/#7996 et ont été retirées
# (php84/Dockerfile et edge/Dockerfile sont non-root ; l'auto-référence
# `COPY --from` de edge/Dockerfile est corrigée dans le Dockerfile même).
# Un acquittement qui contredit le code est pire qu'aucun : il masque un
# défaut réapparu sans que personne ne le voie.
#
# Format : https://trivy.dev/latest/docs/configuration/filtering/#trivyignoreyaml
# ============================================================================

misconfigurations:
  # DS-0002 (HIGH) — « Specify at least 1 USER command with non-root user ».
  - id: AVD-DS-0002
    paths:
      - front/web/Dockerfile.dev
      - front/admin-dashboard/Dockerfile.dev
    statement: >-
      Images de développement local uniquement (suffixe .dev), jamais
      publiées ni déployées — surface d'attaque bornée au poste développeur.
      Vérifié le 2026-09-21 : ces deux fichiers n'ont aucune directive USER
      et ne sont construits ni par publish.sh ni par image-scan.yml.
    expired_at: 2027-03-21

  - id: AVD-DS-0002
    paths:
      - front/web-offline/Dockerfile
    statement: >-
      DETTE RÉELLE acquittée à court terme : cette image EST publiée en
      production (leopardo/edge-ui, construite par edge/publish.sh et scannée
      chaque lundi par image-scan.yml) et son nginx tourne en root.
      État réel vérifié le 2026-09-21 (#8024) : `nginx:1.27-alpine` sans
      directive USER — le master nginx démarre en root puis abandonne les
      workers à l'utilisateur `nginx`. Le port d'écoute est DÉJÀ
      non privilégié (`EXPOSE 3000`, nginx.conf : `listen 3000`), donc la
      remédiation n'est PAS un changement de port : elle consiste à fournir
      un pid/cache/log inscriptibles puis `USER nginx` (ou à basculer sur
      `nginxinc/nginx-unprivileged`). Le build n'est pas vérifiable en local
      sans Docker → lot dédié, avec smoke build.
    expired_at: 2027-03-21
