version: "3.9"

# ============================================================
# Leopardo Edge — Local Docker Stack
# Installé chez le client pour fonctionnement offline-first
# ============================================================

services:

  # ── Edge API (Laravel slim) ──────────────────────────────
  edge-api:
    image: leopardo/edge-api:latest
    build:
      # Audit #1711 : l'ancien `context: ./api` + `Dockerfile.edge` était
      # cassé — le Dockerfile vit dans edge/ et COPY api/ + edge/nginx.edge.conf.
      context: ..
      dockerfile: edge/Dockerfile.edge
    container_name: leopardo-edge-api
    restart: unless-stopped
    environment:
      APP_ENV: edge
      APP_KEY: "${EDGE_APP_KEY}"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/leopardo/edge.sqlite
      EDGE_NODE_ID: "${EDGE_NODE_ID}"
      EDGE_TOKEN: "${EDGE_TOKEN}"
      CLOUD_API_URL: "${CLOUD_API_URL:-https://api.leopardo.app}"
      CLOUD_SYNC_INTERVAL_MINUTES: "${SYNC_INTERVAL:-15}"
      LICENSE_PUBLIC_KEY_PATH: /var/leopardo/license.pub
    volumes:
      - edge_data:/var/leopardo
      - ./edge/license.pub:/var/leopardo/license.pub:ro
    ports:
      - "7878:80"       # http://leopardo.local:7878
    networks:
      - leopardo-local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/edge/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Edge Web UI (Next.js static export) ─────────────────
  edge-ui:
    image: leopardo/edge-ui:latest
    build:
      # Audit #1711 : Dockerfile.edge créé dans front/web (image serveur prod).
      context: ./front/web
      dockerfile: Dockerfile.edge
    container_name: leopardo-edge-ui
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: "http://edge-api/api"
      NEXT_PUBLIC_MODE: edge
    ports:
      - "7879:3000"     # http://leopardo.local:7879
    depends_on:
      - edge-api
    networks:
      - leopardo-local

  # ── Sync Daemon ─────────────────────────────────────────
  edge-sync:
    image: leopardo/edge-api:latest
    container_name: leopardo-edge-sync
    restart: unless-stopped
    command: ["php", "artisan", "edge:sync-daemon"]
    environment:
      APP_ENV: edge
      APP_KEY: "${EDGE_APP_KEY}"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/leopardo/edge.sqlite
      EDGE_NODE_ID: "${EDGE_NODE_ID}"
      EDGE_TOKEN: "${EDGE_TOKEN}"
      CLOUD_API_URL: "${CLOUD_API_URL:-https://api.leopardo.app}"
      CLOUD_SYNC_INTERVAL_MINUTES: "${SYNC_INTERVAL:-15}"
    volumes:
      - edge_data:/var/leopardo
    depends_on:
      - edge-api
    networks:
      - leopardo-local

  # ── Caddy Reverse Proxy (http://leopardo.local) ──────────
  edge-proxy:
    image: caddy:2-alpine
    container_name: leopardo-edge-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./edge/Caddyfile.edge:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - edge-api
      - edge-ui
    networks:
      - leopardo-local

volumes:
  edge_data:
  caddy_data:

networks:
  leopardo-local:
    driver: bridge
