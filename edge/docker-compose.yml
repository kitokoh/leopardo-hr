# ============================================================
# Leopardo Edge — Local Docker Stack
# (#7847 : clé obsolète `version:` retirée — ignorée par Compose v2)
# Installé chez le client pour fonctionnement offline-first
#
# Issue #3972 — reproductibilité des installs : les images Leopardo sont
# taggées par version (${EDGE_VERSION:-1.0.0}, aligné sur edge/publish.sh),
# jamais `latest` flottant. Caddy est pinné par digest multi-arch. Une
# install identique livre donc le même logiciel, quelle que soit la date.
# ⚠️ Depuis #6604, le compose construit localement (clés `build:`) :
#    edge-api/edge-sync via edge/Dockerfile.edge, edge-ui via
#    front/web-offline/Dockerfile (l'image publiée leopardo/edge-ui n'existait
#    pas — fantôme). Les tags image: restent pour le pinning de version.
# ============================================================

services:

  # ── Edge API (Laravel slim) ──────────────────────────────
  edge-api:
    image: leopardo/edge-api:${EDGE_VERSION:-1.0.0}
    build:
      context: ..
      dockerfile: Dockerfile.edge
    container_name: leopardo-edge-api
    restart: unless-stopped
    environment:
      APP_ENV: edge
      APP_KEY: "${EDGE_APP_KEY}"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/leopardo/edge.sqlite
      EDGE_NODE_ID: "${EDGE_NODE_ID}"
      EDGE_TOKEN: "${EDGE_TOKEN}"
      CLOUD_API_URL: "${CLOUD_API_URL:-https://gestionemployerbackend.onrender.com}"
      CLOUD_SYNC_INTERVAL_MINUTES: "${SYNC_INTERVAL:-15}"
      LICENSE_PUBLIC_KEY_PATH: /var/leopardo/license.pub
    volumes:
      - edge_data:/var/leopardo
      # #6604 / #6700 : une seule copie de la clé publique dans le repo
      # (edge/keys/edge_license_public.pem — servie aussi par l'API cloud,
      # le doublon edge/license.pub a été supprimé). Chemins relatifs au
      # fichier compose (edge/), cf. #2751. #7653 : montage dédupliqué
      # (il était déclaré deux fois). Le chemin conteneur reste stable.
      - ./keys/edge_license_public.pem:/var/leopardo/license.pub:ro
    # #7653 : plus AUCUNE publication directe en clair sur l'hôte —
    # l'API n'est joignable que via edge-proxy (TLS interne, port 7878).
    networks:
      - leopardo-local
    healthcheck:
      # #3908 : /api/edge/health n'existe pas — le health endpoint réel de
      # l'Edge API est versionné : GET /api/v1/edge/health (EdgeController).
      test: ["CMD", "curl", "-f", "http://localhost/api/v1/edge/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Edge Web UI (Next.js static export) ─────────────────
  edge-ui:
    image: leopardo/edge-ui:${EDGE_VERSION:-1.0.0}
    build:
      context: ../front/web-offline
      dockerfile: Dockerfile
    container_name: leopardo-edge-ui
    restart: unless-stopped
    environment:
      # #7653 : vide = same-origin — le proxy TLS route /api/* vers edge-api
      # sur chaque origine UI (lue par web-offline, next.config.js — #6595).
      NEXT_PUBLIC_EDGE_API: ""
    # #7653 : plus de publication directe en clair (`7879:3000`) — l'UI
    # n'est joignable que via edge-proxy (TLS interne, port 7879).
    depends_on:
      - edge-api
    networks:
      - leopardo-local

  # ── Sync Daemon ─────────────────────────────────────────
  edge-sync:
    image: leopardo/edge-api:${EDGE_VERSION:-1.0.0}
    build:
      context: ..
      dockerfile: Dockerfile.edge
    container_name: leopardo-edge-sync
    restart: unless-stopped
    # #7847 : même utilisateur non-root que les programmes de l'API
    # (supervisord.edge.conf) — évite des fichiers root sur le volume
    # edge_data partagé (SQLite + journaux) que php-fpm ne pourrait plus écrire.
    user: "www-data"
    # #4411 : migration SQLite idempotente avant le daemon (l'API migre au
    # démarrage via supervisord, mais ce service est un conteneur séparé).
    command: ["sh", "-c", "php artisan migrate --path=database/migrations/tenant/2026_06_29_000001_create_edge_sync_tables.php --database=sqlite --force --no-interaction && php artisan edge:sync-daemon"]
    environment:
      APP_ENV: edge
      APP_KEY: "${EDGE_APP_KEY}"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/leopardo/edge.sqlite
      EDGE_NODE_ID: "${EDGE_NODE_ID}"
      EDGE_TOKEN: "${EDGE_TOKEN}"
      CLOUD_API_URL: "${CLOUD_API_URL:-https://gestionemployerbackend.onrender.com}"
      CLOUD_SYNC_INTERVAL_MINUTES: "${SYNC_INTERVAL:-15}"
    volumes:
      - edge_data:/var/leopardo
    depends_on:
      - edge-api
    networks:
      - leopardo-local

  # ── Caddy Reverse Proxy (http://leopardo.local) ──────────
  edge-proxy:
    # #3972 : digest multi-arch de caddy:2-alpine (vérifié 2026-08-15).
    image: caddy@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: leopardo-edge-proxy
    restart: unless-stopped
    # #7653 : le proxy est le SEUL point d'entrée LAN — TLS interne
    # (`tls internal`, CA locale Caddy) par défaut. :80 ne fait que
    # rediriger vers HTTPS ; 7878/7879 (ports historiques API/UI) sont
    # conservés mais servis en TLS.
    ports:
      - "80:80"
      - "443:443"
      - "7878:7878"
      - "7879:7879"
    environment:
      # Noms de site pour lesquels la CA interne émet les certificats
      # (écrits dans .env par install.sh).
      EDGE_DOMAIN: "${EDGE_DOMAIN:-leopardo.local}"
      EDGE_LAN_IP: "${EDGE_LAN_IP:-127.0.0.1}"
    volumes:
      # Issue #2751 — ./edge/Caddyfile.edge résolvait edge/edge/…
      - ./Caddyfile.edge:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - edge-api
      - edge-ui
    networks:
      - leopardo-local

  # ── Chaîne vidéo (MediaMTX) — profil `cameras` ───────────
  # Issue #7424 : versionnée ici, elle ne démarre PAS dans une installation
  # Edge standard (profil explicite) :
  #   docker compose --profile cameras up -d
  # La lecture est protégée par un jeton signé par Leopardo : MediaMTX
  # interroge /internal/camera-token/verify à chaque accès (voir
  # mediamtx/README.md). L'API de contrôle n'écoute qu'en local.
  mediamtx:
    # #3972 : même règle que le reste de la stack — image taggée, jamais
    # `latest` flottant.
    image: bluenviron/mediamtx:${MEDIAMTX_VERSION:-1.9.3}
    container_name: leopardo-edge-mediamtx
    restart: unless-stopped
    profiles:
      - cameras
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - mediamtx_recordings:/var/leopardo/cameras
    ports:
      # WebRTC (lecture navigateur) et HLS (repli) — exposés sur l'hôte local.
      - "8889:8889"
      - "8888:8888"
      # 9997 (API de contrôle) est délibérément NON publié : elle n'écoute que
      # dans le conteneur, pour l'agent Edge.
    networks:
      - leopardo-local
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9997/v3/config/global/get"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  edge_data:
  caddy_data:
  mediamtx_recordings:

networks:
  leopardo-local:
    driver: bridge
