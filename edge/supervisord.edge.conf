[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
; #7966 — pidfile dans /tmp : /run (et /var/run) appartiennent à root et
; supervisord tourne désormais en www-data (voir ci-dessous).
pidfile=/tmp/supervisord.pid

; #7966 — exécution 100% non-root (remplace le modèle #7847 « supervisord
; root + programmes déprivilégiés ») : supervisord est lancé en www-data
; (USER www-data dans les Dockerfiles, `-u www-data` en filet de sécurité —
; no-op si l'uid courant est déjà www-data, cf. drop_privileges()). nginx
; écoute sur :8080 (> 1024, cf. nginx.edge.conf) — plus besoin de root pour
; le bind, son master tourne donc en www-data lui aussi. php-fpm (pool sur
; 127.0.0.1:9000) et edge-migrate conservent `user=www-data` : même uid que
; supervisord → setuid no-op, aucun droit root requis. Prérequis gérés au
; build : /var/log/supervisor, /var/lib/nginx, /var/log/nginx et /run/nginx
; chownés www-data (logs supervisord + temp/lock nginx du paquet Alpine).

# #4411 : provisionne le schéma SQLite de l'Edge au démarrage (avant les
# programmes serveur). Sans lui, un nœud frais tournait avec edge.sqlite vide
# et le daemon de sync bouclait sur « no such table: sync_queue » en silence.
[program:edge-migrate]
command=php artisan migrate --path=database/migrations/tenant/2026_06_29_000001_create_edge_sync_tables.php --database=sqlite --force --no-interaction
user=www-data
autostart=true
autorestart=false
startsecs=0
priority=1
logfile_maxbytes=10MB
logfile_backups=5
stderr_logfile=/var/log/supervisor/edge-migrate.err.log
stdout_logfile=/var/log/supervisor/edge-migrate.out.log

[program:php-fpm]
command=php-fpm -F
user=www-data
autostart=true
logfile_maxbytes=10MB
logfile_backups=5
stopasgroup=true
killasgroup=true
autorestart=true
stderr_logfile=/var/log/supervisor/php-fpm.err.log
stdout_logfile=/var/log/supervisor/php-fpm.out.log

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
logfile_maxbytes=10MB
logfile_backups=5
stopasgroup=true
killasgroup=true
autorestart=true
stderr_logfile=/var/log/supervisor/nginx.err.log
stdout_logfile=/var/log/supervisor/nginx.out.log
