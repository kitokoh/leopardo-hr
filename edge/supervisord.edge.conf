[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log

; #7847 — durcissement non-root : supervisord tourne root (gestion des
; process + nginx master qui bind :80), mais les PROGRAMMES applicatifs
; tournent en `user=www-data` (php-fpm maître inclus — son directive de pool
; `user` est alors ignorée avec un avertissement bénin, les workers héritent
; de www-data ; il écoute sur 127.0.0.1:9000, > 1024). nginx reste lancé
; root pour le bind :80 — ses workers sont déprivilégiés par le paquet Alpine.

# #4411 : provisionne le schéma SQLite de l'Edge au démarrage (avant les
# programmes serveur). Sans lui, un nœud frais tournait avec edge.sqlite vide
# et le daemon de sync bouclait sur « no such table: sync_queue » en silence.
[program:edge-migrate]
command=php artisan migrate --path=database/migrations/tenant/2026_06_29_000001_create_edge_sync_tables.php --database=sqlite --force --no-interaction
user=www-data
autostart=true
autorestart=false
startsecs=0
priority=1
logfile_maxbytes=10MB
logfile_backups=5
stderr_logfile=/var/log/supervisor/edge-migrate.err.log
stdout_logfile=/var/log/supervisor/edge-migrate.out.log

[program:php-fpm]
command=php-fpm -F
user=www-data
autostart=true
logfile_maxbytes=10MB
logfile_backups=5
stopasgroup=true
killasgroup=true
autorestart=true
stderr_logfile=/var/log/supervisor/php-fpm.err.log
stdout_logfile=/var/log/supervisor/php-fpm.out.log

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
logfile_maxbytes=10MB
logfile_backups=5
stopasgroup=true
killasgroup=true
autorestart=true
stderr_logfile=/var/log/supervisor/nginx.err.log
stdout_logfile=/var/log/supervisor/nginx.out.log
