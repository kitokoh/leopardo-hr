# render.prod.yaml — Leopardo RH PRODUCTION infrastructure on Render
# https://render.com/docs/infrastructure-as-code
#
# Ce blueprint N'EST JAMAIS synchronisé automatiquement sur push. Il est
# déployé uniquement via le hook de déploiement Render déclenché par
# .github/workflows/deploy-prod.yml, lui-même déclenché uniquement par un
# tag git validé (vX.Y.Z, checks requis verts — voir release.yml). Voir
# docs/ops/RENDER_DEV_PROD_TOPOLOGY.md pour le détail de la topologie
# dev/prod et le plan de bascule vers un plan payant complet.
#
# ⚠️ #7845 — Ce fichier décrit l'**état provisionné** du workspace prod ;
# l'état CIBLE non provisionné (worker, bloqué billing) est conservé en bloc
# COMMENTÉ plus bas. Services DÉCLARÉS vs RÉELS (API Render, 2026-09-20) :
#   | Service                    | Blueprint        | Réel (workspace prod)   |
#   |----------------------------|------------------|-------------------------|
#   | leopardo-prod              | web, free        | ✅ web, free, frankfurt  |
#   | leopardo-redis-prod        | redis, free      | ✅ available, frankfurt  |
#   | leopardo-queue-worker-prod | commenté (cible) | ❌ absent — 402 billing  |
# Bloquant unique : moyen de paiement absent (Background Workers inéligibles
# au tier gratuit, #7649).
#
# ⚠️ INTÉRIM ASSUMÉ (et son plan de sortie) — #7845/#7649 :
#   La queue ET le scheduler prod tournent dans le conteneur web FREE-TIER
#   (docker-entrypoint.sh, gates WEB_QUEUE_DRAIN / WEB_SCHEDULER_LOOP, défaut
#   on). Conséquence : le web free spin-down après ~15 min d'inactivité → le
#   scheduler s'arrête avec lui ; toute tâche planifiée due pendant le
#   spin-down est PERDUE (pas de rattrapage), la queue n'est drainée qu'au
#   réveil. Supervision sans credentials : queue-supervision.yml (sonde HTTP).
#   SORTIE D'INTÉRIM (décision billing propriétaire) :
#     1. ajouter un moyen de paiement au workspace prod ;
#     2. dé-commenter leopardo-queue-worker-prod ci-dessous et provisionner
#        (blueprint sync ou API) — starter, ~7 $/mois ;
#     3. poser WEB_QUEUE_DRAIN=false et WEB_SCHEDULER_LOOP=false sur
#        leopardo-prod (sinon double consommation de la queue).
#
# ⚠️ PHASE 1 (tier gratuit Render, validation du pipeline) :
#   - Base de données : Neon Postgres (projet "LEOPARDO", branche
#     "production"), PAS le Postgres Render — le Postgres gratuit Render
#     expire après 30 jours et a été abandonné après test (même schéma
#     que le dev, qui utilise déjà Neon en pratique). DB_URL est donc
#     `sync: false` ci-dessous : valeur à saisir dans le dashboard Render
#     (ou via Pulumi ESC solarnyxss/leopardo-hr/prod, clé render.databaseUrl).
#   - Key Value (Redis) gratuit Render : en mémoire uniquement, perdu au
#     redémarrage — suffisant pour cache/session en Phase 1.
#   - Les Background Workers ne sont PAS éligibles au tier gratuit Render :
#     le worker fusionné `leopardo-queue-worker-prod` n'est donc PAS
#     provisionné (bloc commenté plus bas, #7845). Queue ET scheduler
#     tournent en intérim dans le conteneur web — cf. « INTÉRIM ASSUMÉ »
#     ci-dessus pour les limites (spin-down) et le plan de sortie.

services:
  # ──────────────────────────────────────────────────────────────────────────
  # Web Service — Laravel API (PROD)
  # ──────────────────────────────────────────────────────────────────────────
  - type: web
    name: leopardo-prod
    runtime: docker
    dockerfilePath: api/Dockerfile.prod
    dockerContext: .
    region: frankfurt
    plan: free
    healthCheckPath: /api/v1/health
    # Déploiement piloté exclusivement par le hook (deploy-prod.yml sur tag
    # validé) — jamais par un push direct, même sur main.
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      # Issue #7647 : tier de déploiement explicite, découplé d'APP_ENV
      # (le tier dev tourne aussi en APP_ENV=production — seule cette
      # variable distingue les tiers). docker-entrypoint.sh est fail-closed
      # dessus : RESET_TEST_DB_ONCE est catégoriquement refusé et
      # FORCE_SUPER_ADMIN_PASSWORD_RESET est vidée avant les seeders quand
      # DEPLOY_TIER != dev.
      - key: DEPLOY_TIER
        value: prod
      # Issue #7213 : doc API verrouillée en prod (comportement explicite).
      - key: API_DOCS_PUBLIC
        value: "false"
      - key: DISABLE_DEMO_SEEDING
        value: "true"
      - key: APP_URL
        fromService:
          name: leopardo-prod
          type: web
          property: host
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: SENTRY_LARAVEL_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
      # Database — Neon Postgres externe (projet "LEOPARDO", branche
      # "production"), pas un Postgres géré par Render. Voir note Phase 1
      # en tête de fichier.
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: DB_SEARCH_PATH
        value: shared_tenants,public
      # Redis (Key Value gratuit — en mémoire, cache/session uniquement)
      - key: REDIS_CLIENT
        value: predis
      - key: REDIS_URL
        fromDatabase:
          name: leopardo-redis-prod
          property: connectionString
      - key: REDIS_PASSWORD
        fromDatabase:
          name: leopardo-redis-prod
          property: password
      # #7967 : generateValue régénérait la clé à chaque re-sync du blueprint
      # (sessions + valeurs chiffrées invalidées). Valeur ÉPINGLÉE dans le
      # dashboard Render le 2026-09-20 (strictement identique à la valeur
      # générée — aucune rotation, aucun impact runtime) ; sync: false la
      # préserve désormais de toute re-sync.
      - key: APP_KEY
        sync: false
      # Queue drainée en mono-conteneur par le web service (voir en-tête) —
      # scheduler seul manquant en Phase 1.
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: redis
      - key: SESSION_DRIVER
        value: redis
      # #7980 : cookies de session HTTPS-only — la prod est servie en TLS,
      # sans ce flag un cookie peut transiter en clair sur une redirection.
      - key: SESSION_SECURE_COOKIE
        value: "true"
      # #7980 : SSL obligatoire vers Neon (fin du sslmode 'prefer' en dur).
      - key: DB_SSLMODE
        value: require
      # Paiements — clés réelles à saisir dans le dashboard Render (ou via
      # Pulumi ESC solarnyxss/leopardo-hr/prod) après rotation.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_BUSINESS
        sync: false
      - key: STRIPE_PRICE_ENTERPRISE
        sync: false
      - key: CHARGILY_API_KEY
        sync: false
      - key: CHARGILY_WEBHOOK_SECRET
        sync: false
      # Google OAuth
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URL
        sync: false
      # Firebase
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      # Mail
      - key: MAIL_MAILER
        value: resend
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      # Transport HTTP Resend (#5139 : le SMTP sortant est bloqué par Render).
      - key: RESEND_KEY
        sync: false
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        value: noreply@hurkonsan.com
      - key: MAIL_FROM_NAME
        value: "Leopardo RH"
      # Ops / admin
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: FORCE_SUPER_ADMIN_PASSWORD_RESET
        value: "true"
      - key: ADMIN_DASHBOARD_URL
        sync: false
      - key: DEMO_MODE_ENABLED
        value: "false"
      # Issue #7864 (D2) : FRONTEND_URL n'était déclaré dans aucun blueprint
      # alors que les emails d'activation/reset construisent leurs liens
      # dessus (config/app.php `frontend_url`) — sans elle, la prod retombait
      # sur le fallback codé en dur du tier dev. URL canonique du web client
      # prod documentée dans docs/ops/RENDER_DEV_PROD_TOPOLOGY.md (« CORS/
      # Sanctum API prod ») et docs/ops/DEPLOYMENT_URLS.md.
      - key: FRONTEND_URL
        value: https://leopardo-prod.vercel.app

  # ──────────────────────────────────────────────────────────────────────────
  # Background Worker — Queue + Scheduler (issue #7649)
  # ──────────────────────────────────────────────────────────────────────────
  # ⚠️ Issue #7649 — provisionnement TENTÉ via l'API Render le 2026-09-19
  # (POST /v1/services, type background_worker, plan starter) : refus 402
  # « Payment information is required » — le workspace prod n'a AUCUN moyen
  # de paiement et les Background Workers sont inéligibles au tier gratuit.
  # En attendant, la queue ET le scheduler tournent en intérim dans le
  # conteneur web (api/docker-entrypoint.sh, gates WEB_QUEUE_DRAIN /
  # WEB_SCHEDULER_LOOP, défaut on). Dès qu'une carte est ajoutée sur le
  # workspace : provisionner via blueprint sync (ou API), puis passer
  # WEB_QUEUE_DRAIN=false et WEB_SCHEDULER_LOOP=false sur leopardo-prod.
  # Un SEUL worker starter (~7 $/mois) porte queue:work ET schedule:work —
  # l'ancien second service « leopardo-scheduler-prod » est fusionné ici.
  # ⚠️ #7845 (audit 2026-09-20, vérifié via API Render) : ce worker n'a JAMAIS
  # été provisionné — le seul service réel du workspace prod est le web
  # « leopardo-prod » (free) + le Key Value « leopardo-redis-prod » (free).
  # Le déclarer comme un service actif faisait passer le blueprint pour
  # l'état réel alors qu'il décrit une CIBLE. Bloc conservé ci-dessous en
  # COMMENTAIRE (état cible, worker fusionné queue+scheduler, ~7 $/mois) :
  # dé-commenter tel quel dès qu'un moyen de paiement est ajouté, provisionner
  # (blueprint sync ou API), puis passer WEB_QUEUE_DRAIN=false et
  # WEB_SCHEDULER_LOOP=false sur leopardo-prod.
  #
#   - type: worker
#     name: leopardo-queue-worker-prod
#     runtime: docker
#     dockerfilePath: api/Dockerfile.prod
#     dockerContext: .
#     region: frankfurt
#     # starter = plan minimal des Background Workers (pas de tier gratuit).
#     plan: starter
#     # Pas de hook Render dédié pour les workers → autoDeploy:false (#6700).
#     autoDeploy: false
#     # exec sur queue:work : sa sortie (max-time 1 h ou crash) termine le
#     # conteneur, Render le redémarre → les DEUX processus repartent.
#     dockerCommand: >-
#       sh -c 'php artisan schedule:work >&2 &
#       exec php artisan queue:work
#       --queue=webhooks,audit,notifications,emails,pdf,payroll,documents,default
#       --tries=3
#       --timeout=300
#       --sleep=3
#       --max-jobs=500
#       --max-time=3600'
#     envVars:
#       - key: APP_ENV
#         value: production
#       - key: DEPLOY_TIER
#         value: prod
#       - key: APP_DEBUG
#         value: false
#       - key: DISABLE_DEMO_SEEDING
#         value: "true"
#       # #6558 : migrations UNIQUEMENT sur le service web — jamais au boot
#       # des workers (course de migrations à chaque redémarrage).
#       - key: RUN_MIGRATIONS
#         value: "false"
#       - key: APP_URL
#         fromService:
#           name: leopardo-prod
#           type: web
#           property: host
#       - key: LOG_CHANNEL
#         value: stderr
#       - key: LOG_LEVEL
#         value: info
#       # Database — Neon (DB_URL sync: false, cf. web service).
#       - key: DB_CONNECTION
#         value: pgsql
#       - key: DB_URL
#         sync: false
#       - key: DB_SEARCH_PATH
#         value: shared_tenants,public
#       # #3907 : APP_KEY référencé depuis le web service — une clé
#       # indépendante rendrait indéchiffrables les payloads chiffrés partagés.
#       - key: APP_KEY
#         fromService:
#           name: leopardo-prod
#           type: web
#           envVarKey: APP_KEY
#       - key: QUEUE_CONNECTION
#         value: database
#       - key: CACHE_STORE
#         value: file

databases:
  # Pas de Postgres Render : la base de données est Neon (projet
  # "LEOPARDO", externe, gérée hors Blueprint — voir DB_URL ci-dessus et
  # docs/ops/RENDER_DEV_PROD_TOPOLOGY.md).
  #
  # #7845 : contrairement aux workers, cette instance EXISTE bien dans le
  # workspace prod (vérifié via API Render 2026-09-20 : « leopardo-redis-prod »,
  # free, frankfurt, status available, créée 2026-09-03).
  # Plan gratuit : en mémoire uniquement, une seule instance par workspace.
  - name: leopardo-redis-prod
    plan: free
    type: redis
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []  # restricted to Render internal network
