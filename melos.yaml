name: leopardo-hr
repository: https://github.com/kitokoh/leopardo-hr

packages:
  - front/mobile_apps/leopardo_accounting
  - front/mobile_apps/leopardo_cameras
  - front/mobile_apps/leopardo_core
  - front/mobile_apps/leopardo_employee
  - front/mobile_apps/leopardo_hr
  - front/mobile_apps/leopardo_manager
  - front/mobile_apps/leopardo_platform_admin
  - front/mobile_apps/leopardo_pos_restaurant
  - front/mobile_apps/leopardo_pos_retail
  - front/mobile_apps/leopardo_public
  - front/mobile_apps/leopardo_marketing
  - front/mobile_apps/leopardo_travel_agent
  # Moteur commun des apps grand public (découverte, fiches, parcours des huit
  # verticales, identités de vitrine). Extrait de `leopardo_public` pour que les
  # huit apps dédiées le partagent au lieu d'en copier ~6 800 lignes.
  - front/mobile_apps/leopardo_surface
  # Applications grand public DÉDIÉES, une par verticale. Chacune n'assemble
  # que son identité, son routeur et son `main.dart` — le moteur est partagé.
  - front/mobile_apps/leopardo_restaurant_app
  - front/mobile_apps/leopardo_retail_app
  - front/mobile_apps/leopardo_hospitality_app
  - front/mobile_apps/leopardo_trade_app
  - front/mobile_apps/leopardo_travel_app
  - front/mobile_apps/leopardo_pharmacy_app
  - front/mobile_apps/leopardo_mobility_app
  - front/mobile_apps/leopardo_careers_app

command:
  bootstrap:
    usePubspecOverrides: true

scripts:
  # ── Analysis ───────────────────────────────────────────────
  analyze:
    run: dart analyze
    description: Run Dart analyzer on all packages
    exec:
      concurrency: 4

  format:
    run: dart format . --set-exit-if-changed
    description: Check formatting in all packages
    exec:
      concurrency: 4

  format:fix:
    run: dart format .
    description: Auto-fix formatting in all packages
    exec:
      concurrency: 4

  # ── Tests ─────────────────────────────────────────────────
  test:
    run: flutter test --reporter=expanded
    description: Run unit + widget tests
    exec:
      concurrency: 2
    packageFilters:
      dirExists: test

  test:coverage:
    run: flutter test --coverage
    description: Run tests with coverage
    exec:
      concurrency: 1
    packageFilters:
      dirExists: test

  # ── Build ─────────────────────────────────────────────────
  build:android:
    run: flutter build apk --release
    description: Build Android APK
    exec:
      concurrency: 1
    packageFilters:
      ignore:
        - leopardo_core   # Core is a library, not an app

  build:ios:
    run: flutter build ipa --release --no-codesign
    description: Build iOS (no signing for CI)
    exec:
      concurrency: 1
    packageFilters:
      ignore:
        - leopardo_core

  # ── Desktop (protocole P06, pilote BC Accounting #7056) ─────────
  build:windows:
    run: flutter build windows --release
    description: Build Windows desktop (release)
    exec:
      concurrency: 1
    packageFilters:
      ignore:
        - leopardo_core   # Core is a library, not an app

  build:macos:
    run: flutter build macos --release --no-codesign
    description: Build macOS desktop (release, no codesign for CI)
    exec:
      concurrency: 1
    packageFilters:
      ignore:
        - leopardo_core   # Core is a library, not an app

  # ── Codegen ───────────────────────────────────────────────
  gen:
    run: dart run build_runner build --delete-conflicting-outputs
    description: Run build_runner code generation
    exec:
      concurrency: 1

  l10n:
    run: flutter gen-l10n
    description: Generate localisation files
    exec:
      concurrency: 4
    packageFilters:
      dirExists: lib/l10n
