openapi: "3.0.3"

info:
  title: "Leopardo RH API"
  version: "4.16.190-2026-05-29"
  description: |
    OpenAPI alignee sur la surface API reellement exposee par origin/main.

    Cette specification sert de contrat pour les apps employee, manager,
    platform admin, kiosque, vitrine client et futurs integrateurs tiers.

    Regles generales :
    - base API stable sous /api/v1 ;
    - authentification Bearer Sanctum ;
    - listes paginees compatibles Laravel (data, links, meta) ;
    - erreurs JSON standardisees (error, message, errors) ;
    - isolation tenant stricte sur toutes les routes authentifiees.

externalDocs:
  description: "Guide integration partenaires et ecosysteme developpeur"
  url: "https://gestionemployerbackend.onrender.com/api-explorer"

servers:
  - url: "https://gestionemployerbackend.onrender.com/api/v1"
    description: "Staging/production Render actuel"
  - url: "https://api.leopardo-rh.com/api/v1"
    description: "Production future domaine dedie"
  - url: "http://localhost:8000/api/v1"
    description: "Local Docker"

security:
  - BearerAuth: []

tags:
  - name: "Health"
  - name: "Auth"
  - name: "Payrolls"
  - name: "HR Referentials"
  - name: "Notifications"
  - name: "Readiness"
  - name: "Dashboard"
  - name: "Schedules"
  - name: "Projects"
  - name: "Tasks"
  - name: "Evaluations"
  - name: "Platform"
  - name: "Employees"
  - name: "Attendance"
  - name: "Estimations"
  - name: "Me"
  - name: "Invitations"
  - name: "Biometrics"
  - name: "Privacy"
  - name: "Kiosks"
  - name: "Cameras"
  - name: "Vehicle Tracking"
  - name: "Fleet Management"
  - name: "Webhooks"
    description: "Evenements sortants documentes pour integrateurs; livraison effective selon configuration tenant."

paths:
  /health:
    get:
      tags: ["Health"]
      summary: "Healthcheck live + ready"
      security: []
      responses:
        "200":
          description: "API disponible"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: "Base de donnees indisponible"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /auth/login:
    post:
      tags: ["Auth"]
      summary: "Connexion employee"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: "Connexion reussie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "422":
          $ref: "#/components/responses/Validation422"

  /auth/me:
    get:
      tags: ["Auth"]
      summary: "Profil authentifie"
      responses:
        "200":
          description: "Profil employee courant"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CurrentEmployee"
        "401":
          $ref: "#/components/responses/Error401"

  /client-events:
    post:
      tags: ["Auth"]
      summary: "Persister un evenement UX client tenant-scope"
      description: "Endpoint authentifie pour les mesures produit non bloquantes du portail client. Les proprietes sont minimisee cote API."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientEventRequest"
      responses:
        "201":
          description: "Evenement stocke"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientEventResponse"
        "401":
          $ref: "#/components/responses/Error401"
        "422":
          $ref: "#/components/responses/Validation422"

  /launch-readiness:
    get:
      tags: ["Readiness"]
      summary: "Lire le score de readiness lancement du tenant"
      description: "Endpoint manager principal/RH pour verifier les pre-requis go-live avant campagne marketing ou onboarding client."
      responses:
        "200":
          description: "Readiness lancement"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LaunchReadinessResponse"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"

  /dashboard/manager-digest:
    get:
      tags: ["Dashboard"]
      summary: "Lire les signaux manager du jour"
      description: "Contrat mobile manager tenant-scope pour les presences, retards, sessions ouvertes et actions RH en attente."
      responses:
        "200":
          description: "Digest manager du jour"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required:
                      - date
                      - team_scope
                      - team_size
                      - present
                      - late
                      - open_sessions
                      - pending_actions
                    properties:
                      date:
                        type: string
                        format: date
                      team_scope:
                        type: string
                        enum: ["company", "managed_team"]
                      team_size:
                        type: integer
                        minimum: 0
                      present:
                        type: integer
                        minimum: 0
                      late:
                        type: integer
                        minimum: 0
                      open_sessions:
                        type: integer
                        minimum: 0
                      pending_actions:
                        type: integer
                        minimum: 0
                      pending_absences:
                        type: integer
                        minimum: 0
                      pending_salary_advances:
                        type: integer
                        minimum: 0
                      pending_corrections:
                        type: integer
                        minimum: 0
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            kind:
                              type: string
                            label:
                              type: string
                            count:
                              type: integer
                            severity:
                              type: string
                            route:
                              type: string
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"

  /schedules:
    get:
      tags: ["Schedules"]
      summary: "Lister les horaires de l'entreprise"
      responses:
        "200":
          description: "Horaires tenant-scope"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Schedule"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
    post:
      tags: ["Schedules"]
      summary: "Creer un horaire de travail"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleRequest"
      responses:
        "201":
          description: "Horaire cree"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Schedule"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "422":
          $ref: "#/components/responses/Validation422"

  /schedules/{schedule}:
    parameters:
      - name: schedule
        in: path
        required: true
        schema:
          type: integer
    put:
      tags: ["Schedules"]
      summary: "Modifier un horaire"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleRequest"
      responses:
        "200":
          description: "Horaire modifie"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Schedule"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "422":
          $ref: "#/components/responses/Validation422"
    delete:
      tags: ["Schedules"]
      summary: "Supprimer un horaire non defaut"
      responses:
        "200":
          description: "Horaire supprime"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "422":
          $ref: "#/components/responses/Validation422"

  /schedules/{schedule}/assign-employees:
    parameters:
      - name: schedule
        in: path
        required: true
        schema:
          type: integer
    post:
      tags: ["Schedules"]
      summary: "Affecter un horaire/regle entreprise a des employes"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ["employee_ids"]
              properties:
                employee_ids:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: integer
      responses:
        "200":
          description: "Horaire affecte aux employes du tenant courant"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      schedule:
                        $ref: "#/components/schemas/Schedule"
                      assigned_count:
                        type: integer
                      employee_ids:
                        type: array
                        items:
                          type: integer
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "422":
          $ref: "#/components/responses/Validation422"

  /auth/profile:
    patch:
      tags: ["Auth"]
      summary: "Mettre a jour le profil courant"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: "Profil mis a jour"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CurrentEmployee"
        "401":
          $ref: "#/components/responses/Error401"
        "422":
          $ref: "#/components/responses/Validation422"

  /auth/change-password:
    post:
      tags: ["Auth"]
      summary: "Changer le mot de passe"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: "Mot de passe change"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
        "401":
          $ref: "#/components/responses/Error401"
        "422":
          description: "Mot de passe courant incorrect ou validation"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/ValidationErrorResponse"

  /auth/logout:
    post:
      tags: ["Auth"]
      summary: "Deconnexion employee"
      responses:
        "200":
          description: "Token courant supprime"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"

  /auth/biometric-enrollment:
    get:
      tags: ["Biometrics"]
      summary: "Derniere demande biometrie de l'utilisateur courant"
      responses:
        "200":
          description: "Derniere demande ou null"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BiometricEnrollmentRequest"
    post:
      tags: ["Biometrics"]
      summary: "Soumettre une demande biometrie"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/BiometricEnrollmentSubmitRequest"
      responses:
        "201":
          description: "Demande enregistree"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BiometricEnrollmentRequest"
        "422":
          $ref: "#/components/responses/Validation422"

  /me/career:
    get:
      tags: ["Me"]
      summary: "Lire le parcours professionnel durable de l'employe courant"
      description: "Retourne le rattachement courant et la timeline professionnelle visible par l'utilisateur mobile."
      responses:
        "200":
          description: "Parcours professionnel"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/EmployeeCareerResponse"
        "401":
          $ref: "#/components/responses/Error401"

  /privacy/export:
    get:
      tags: ["Privacy"]
      summary: "Exporter les donnees personnelles de l'employe authentifie"
      responses:
        "200":
          description: "Bundle personnel self-service"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyExportResponse"
        "401":
          $ref: "#/components/responses/Error401"

  /privacy/deletion-request:
    post:
      tags: ["Privacy"]
      summary: "Creer une demande de suppression non destructive"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  nullable: true
                  maxLength: 1000
      responses:
        "202":
          description: "Demande recue pour revue RH/juridique"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyRequestResponse"
        "401":
          $ref: "#/components/responses/Error401"
        "422":
          $ref: "#/components/responses/Validation422"

  /privacy/biometric-consent:
    patch:
      tags: ["Privacy"]
      summary: "Enregistrer ou retirer le consentement biometrique"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ["consented"]
              properties:
                consented:
                  type: boolean
      responses:
        "200":
          description: "Etat biometrique courant"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BiometricConsentResponse"
        "401":
          $ref: "#/components/responses/Error401"
        "422":
          $ref: "#/components/responses/Validation422"

  /platform/auth/login:
    post:
      tags: ["Platform"]
      summary: "Connexion super-admin"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformLoginRequest"
      responses:
        "200":
          description: "Connexion super-admin reussie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformLoginResponse"
        "401":
          $ref: "#/components/responses/Error401"
        "422":
          $ref: "#/components/responses/Validation422"

  /platform/auth/me:
    get:
      tags: ["Platform"]
      summary: "Super-admin courant"
      security:
        - SuperAdminBearerAuth: []
      responses:
        "200":
          description: "Profil super-admin"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/SuperAdminUser"

  /platform/auth/logout:
    post:
      tags: ["Platform"]
      summary: "Deconnexion super-admin"
      security:
        - SuperAdminBearerAuth: []
      responses:
        "200":
          description: "Token supprime"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"

  /platform/country-defaults:
    get:
      tags: ["Platform"]
      summary: "Lister les pays supportes et leurs defaults"
      description: "Source de verite pour les formulaires platform admin : pays, libelle, langue, devise et fuseau horaire."
      security:
        - SuperAdminBearerAuth: []
      responses:
        "200":
          description: "Pays supportes"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: ["country", "label", "language", "currency", "timezone"]
                      properties:
                        country:
                          type: string
                          example: "SN"
                        label:
                          type: string
                          example: "Senegal"
                        language:
                          type: string
                          example: "fr"
                        currency:
                          type: string
                          example: "XOF"
                        timezone:
                          type: string
                          example: "Africa/Dakar"

  /platform/companies:
    get:
      tags: ["Platform"]
      summary: "Lister les societes"
      security:
        - SuperAdminBearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: ["active", "trial", "suspended", "expired"]
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: "Liste des societes"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlatformCompany"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
    post:
      tags: ["Platform"]
      summary: "Creer une societe shared"
      security:
        - SuperAdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformCompanyCreateRequest"
      responses:
        "201":
          description: "Societe et manager crees"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformCompanyCreateResponse"
        "422":
          $ref: "#/components/responses/Validation422"

  /platform/plans:
    get:
      tags: ["Platform"]
      summary: "Lister le catalogue des plans SaaS"
      security:
        - SuperAdminBearerAuth: []
      responses:
        "200":
          description: "Catalogue des plans actifs et inactifs"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformPlansResponse"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"

  /platform/companies/health:
    get:
      tags: ["Platform"]
      summary: "Vue portefeuille health des societes"
      security:
        - SuperAdminBearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: "Resume compact adoption, risque et MRR par societe"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformCompanyHealthPortfolioResponse"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"

  /platform/companies/{company}/health:
    get:
      tags: ["Platform"]
      summary: "Health detaille d'une societe"
      security:
        - SuperAdminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyUuid"
      responses:
        "200":
          description: "Adoption, abonnement, anomalies et prochaine action"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformCompanyHealthResponse"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"

  /platform/companies/{company}/subscription:
    get:
      tags: ["Platform"]
      summary: "Lire l'abonnement plateforme d'une societe"
      security:
        - SuperAdminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyUuid"
      responses:
        "200":
          description: "Abonnement courant"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformCompanySubscriptionResponse"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
    patch:
      tags: ["Platform"]
      summary: "Mettre a jour l'abonnement plateforme d'une societe"
      security:
        - SuperAdminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyUuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformCompanySubscriptionUpdateRequest"
      responses:
        "200":
          description: "Abonnement mis a jour"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformCompanySubscriptionResponse"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "422":
          $ref: "#/components/responses/Validation422"

  /platform/companies/{company}/features:
    get:
      tags: ["Platform"]
      summary: "Lire les feature flags d'une societe"
      security:
        - SuperAdminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyUuid"
      responses:
        "200":
          description: "Feature flags actifs et modules connus"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformCompanyFeaturesResponse"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
    patch:
      tags: ["Platform"]
      summary: "Mettre a jour les feature flags d'une societe"
      security:
        - SuperAdminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyUuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformCompanyFeaturesUpdateRequest"
      responses:
        "200":
          description: "Feature flags mis a jour"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformCompanyFeaturesResponse"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "422":
          $ref: "#/components/responses/Validation422"

  /platform/company-requests:
    get:
      tags: ["Platform"]
      summary: "Lister les demandes de creation de societe"
      security:
        - SuperAdminBearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: ["pending", "approved", "rejected"]
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: "Demandes paginees"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformCompanyRequestsResponse"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"

  /platform/company-requests/{id}:
    get:
      tags: ["Platform"]
      summary: "Lire une demande de creation de societe"
      security:
        - SuperAdminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NumericId"
      responses:
        "200":
          description: "Detail de la demande"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformCompanyRequestResponse"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
    patch:
      tags: ["Platform"]
      summary: "Approuver ou rejeter une demande de creation de societe"
      security:
        - SuperAdminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NumericId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformCompanyRequestReviewRequest"
      responses:
        "200":
          description: "Decision enregistree"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformCompanyRequestReviewResponse"
        "401":
