openapi: "3.0.3"
info:
  title: Leopardo RH API
  version: 4.24.0
  license:
    name: MIT
    url: https://github.com/kitokoh/leopardo-hr/blob/main/LICENSE
  description: 'OpenAPI alignee sur la surface API reellement exposee par l''API.


    Cette specification sert de contrat pour les apps employee, manager,

    platform admin, kiosque, vitrine client et futurs integrateurs tiers.


    Regles generales :

    - base API stable sous /api/v1 ;

    - authentification Bearer Sanctum ;

    - listes paginees compatibles Laravel (data, links, meta) ;

    - erreurs JSON standardisees (error, message, errors) ;

    - isolation tenant stricte sur toutes les routes authentifiees.

    '
externalDocs:
  description: Guide integration partenaires et ecosysteme developpeur
  url: https://gestionemployerbackend.onrender.com/api-explorer
servers:
- url: https://gestionemployerbackend.onrender.com/api/v1
  description: Staging/production Render actuel
- url: https://api.leopardo-rh.com/api/v1
  description: Production future domaine dedie
security:
- BearerAuth: []
tags:
- name: Health
  description: Groupe d'opérations Health
- name: Auth
  description: Groupe d'opérations Auth
- name: Payrolls
  description: Groupe d'opérations Payrolls
- name: HR Referentials
  description: Groupe d'opérations HR Referentials
- name: Notifications
  description: Groupe d'opérations Notifications
- name: Readiness
  description: Groupe d'opérations Readiness
- name: Dashboard
  description: Groupe d'opérations Dashboard
- name: Schedules
  description: Groupe d'opérations Schedules
- name: Projects
  description: Groupe d'opérations Projects
- name: Tasks
  description: Groupe d'opérations Tasks
- name: Evaluations
  description: Groupe d'opérations Evaluations
- name: Platform
  description: Groupe d'opérations Platform
- name: Employees
  description: Groupe d'opérations Employees
- name: Attendance
  description: Groupe d'opérations Attendance
- name: Accounting
  description: Groupe d'opérations Accounting
- name: Estimations
  description: Groupe d'opérations Estimations
- name: Me
  description: Groupe d'opérations Me
- name: Invitations
  description: Groupe d'opérations Invitations
- name: Biometrics
  description: Groupe d'opérations Biometrics
- name: Privacy
  description: Groupe d'opérations Privacy
- name: Kiosks
  description: Groupe d'opérations Kiosks
- name: Cameras
  description: Groupe d'opérations Cameras
- name: Vehicle Tracking
  description: Groupe d'opérations Vehicle Tracking
- name: Fleet Management
  description: Groupe d'opérations Fleet Management
- name: Webhooks
  description: Evenements sortants documentes pour integrateurs; livraison effective selon configuration tenant.
- name: Growth
  description: Programme partenaires, commissions et parrainages.
- name: Onboarding
  description: Onboarding entreprise, checklist de configuration initiale et QR codes.
- name: Training
  description: Formations, sessions, inscriptions et parcours de developpement.
- name: Marketing
  description: Connexion du compte social (agregateur Ayrshare) et gestion des publications reseaux sociaux d'un tenant.
- name: Platform Admin
  description: 'Administration super-admin : gestion tenants, plans, metriques globales.'
paths:
  /attendance/config:
    get:
      tags:
      - Attendance
      summary: Lire la configuration de mode active pour l'employe connecte
      description: Resout le mode de pointage effectif (GPS/QR/manuel) et indique si une photo de pointage est obligatoire (punch_photo_mode=photo_required).
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Configuration de mode active
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      mode:
                        type: string
                        enum:
                        - manual
                        - gps_auto
                        - qr
                        - mixed
                      can_override:
                        type: boolean
                      gps_enabled:
                        type: boolean
                      geofence:
                        type: object
                        nullable: true
                        properties:
                          latitude:
                            type: number
                            nullable: true
                          longitude:
                            type: number
                            nullable: true
                          radius_meters:
                            type: integer
                            nullable: true
                      requires_consent:
                        type: boolean
                      requires_punch_photo:
                        type: boolean
                        description: true si l'entreprise impose une photo a chaque pointage mobile (arrivee/depart).
        '401':
          $ref: '#/components/responses/Error401'
  /attendance/preferences:
    put:
      tags:
      - Attendance
      summary: Mettre à jour les préférences de pointage
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - preferred_mode
              properties:
                preferred_mode:
                  type: string
                  enum:
                  - gps_auto
                  - qr
                  - manual
                gps_consent_given:
                  type: boolean
                revoke_consent:
                  type: boolean
      responses:
        '200':
          description: Préférences mises à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/EmployeeAttendancePreference'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Validation422'
  /attendance/geo-events:
    post:
      tags:
      - Attendance
      summary: Envoyer un événement géographique (entrée/sortie de zone)
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeoEventRequest'
      responses:
        '200':
          description: Événement enregistré
        '422':
          $ref: '#/components/responses/Validation422'
  /attendance/my-sessions:
    get:
      tags:
      - Attendance
      summary: Sessions GPS de l'employé courant
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Sessions de l'employé
        '401':
          $ref: '#/components/responses/Error401'
  /attendance/geo-sessions:
    get:
      tags:
      - Attendance
      summary: Lister les sessions GPS
      security:
      - BearerAuth: []
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - detected
          - pending_validation
          - approved
          - rejected
          - cancelled
      - name: per_page
        in: query
        schema:
          type: integer
          default: 20
      responses:
        '200':
          description: Liste paginée des sessions GPS
  /accounting/payments:
    get:
      tags:
      - Accounting
      summary: Lister les paiements
      description: 'Paiements du tenant (filtres document_id/status), du plus recent au plus ancien. RBAC comptable/principal. Issue #5229.'
      parameters:
      - name: document_id
        in: query
        required: false
        description: Filtre par document.
        schema:
          type: integer
      - name: status
        in: query
        required: false
        description: Filtre par statut (pending, recorded, matched).
        schema:
          type: string
          enum:
          - pending
          - recorded
          - matched
      responses:
        '200':
          description: Liste des paiements
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GeoAttendanceSession'
  /attendance/geo-sessions/{id}:
    get:
      tags:
      - Attendance
      summary: Détail d'une session GPS
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Session GPS
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/GeoAttendanceSession'
        '404':
          $ref: '#/components/responses/Error404'
  /attendance/geo-sessions/{id}/approve:
    post:
      tags:
      - Attendance
      summary: Approuver une session GPS (manager/RH)
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Session mise à jour
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
  /attendance/geo-sessions/{id}/reject:
    post:
      tags:
      - Attendance
      summary: Rejeter une session GPS (manager/RH)
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Session mise à jour
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
  /attendance/dashboard:
    get:
      tags:
      - Attendance
      summary: Statistiques du jour — Attendance (manager/RH)
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Statistiques du jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceDashboard'
  /attendance/mode-settings:
    get:
      tags:
      - Attendance
      summary: Parametres du mode de pointage de l'entreprise
      responses:
        '200':
          description: Configuration (forced_mode, punch_photo_mode, gps_enabled, latitude, longitude, radius_meters, allow_employee_override)
        '401':
          $ref: '#/components/responses/Error401'
    put:
      tags:
      - Attendance
      summary: Configurer le mode de pointage (principal)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                forced_mode:
                  type: string
                  enum:
                  - gps_auto
                  - qr
                  - manual
                  - mixed
                punch_photo_mode:
                  type: string
                  enum:
                  - kiosk
                  - photo_required
                gps_enabled:
                  type: boolean
                latitude:
                  type: number
                  minimum: -90
                  maximum: 90
                longitude:
                  type: number
                  minimum: -180
                  maximum: 180
                radius_meters:
                  type: integer
                  minimum: 10
                  maximum: 5000
                allow_employee_override:
                  type: boolean
      responses:
        '200':
          description: Configuration mise a jour
        '401':
          $ref: '#/components/responses/Error401'
  /attendance/employees/{employeeId}/preference:
    get:
      tags:
      - Attendance
      summary: Préférence mode géolocalisation d'un employé (manager/RH)
      security:
      - BearerAuth: []
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Préférence de l'employé
        '401':
          $ref: '#/components/responses/Error401'
  /accounting/payments/{payment}/reconcile:
    post:
      tags:
      - Accounting
      summary: Rapprocher un paiement
      description: 'Rapprochement manuel : pending/recorded -> matched + reconciled_at. Idempotent. Issue #5229.'
      parameters:
      - name: payment
        in: path
        required: true
        description: ID du paiement.
        schema:
          type: integer
      responses:
        '200':
          description: Paiement rapproche
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      status:
                        type: string
                      reconciled_at:
                        type: string
                        format: date-time
                        nullable: true
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
  /accounting/documents/{document}/checkout:
    post:
      tags:
      - Accounting
      summary: Initier le paiement en ligne d'un document (portail client)
      description: 'Cree une session de paiement hebergee par la passerelle routee selon le

        pays de l''entreprise (ADR-0017, option A) : Chargily (DZ, pilote) ou

        Stripe Checkout (FR/UK/US/CI). Le montant encaisse est le solde

        restant du document (total_ttc - paid_amount). Documents eligibles :

        sent / partially_paid / overdue. Echec fail-closed :

        PAYMENT_GATEWAY_NOT_CONFIGURED (pays sans passerelle) ou

        DOCUMENT_NOT_SENDABLE (brouillon, annule, deja solde). Issue #5272.

        '
      security:
      - BearerAuth: []
      parameters:
      - name: document
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountingCheckoutPayload'
      responses:
        '200':
          description: Session de paiement creee
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AccountingCheckout'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Validation422'
  /accounting/payment-webhooks/{gateway}:
    post:
      tags:
      - Accounting
      summary: Webhook passerelle de paiement (Chargily / Stripe)
      description: 'Webhook public (aucune auth Sanctum) : la confiance est portee par la

        signature HMAC (fail-closed — 401 si secret absent ou signature

        invalide). Rapprochement automatique et idempotent : cree un

        AccountingPayment (method online_chargily / online_stripe, reference =

        id passerelle) et met a jour le document (paid / partially_paid, regles

        #5223). Anti-fraude : montant notifie SUPERIEUR au solde restant -> 422

        PAYMENT_AMOUNT_MISMATCH, aucun rapprochement (un montant inferieur est

        un paiement partiel legitime). Rejeu (gateway_payment_id deja connu) ->

        200 sans doublon. Issue #5272.

        '
      parameters:
      - name: gateway
        in: path
        required: true
        schema:
          type: string
          enum:
          - chargily
          - stripe
      responses:
        '200':
          description: Webhook accepte (traite, rejoue ou ignore)
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/Error401'
        '422':
          $ref: '#/components/responses/Validation422'
  /accounting/reminders/run:
    post:
      tags:
      - Accounting
      summary: Declencher les relances de paiement
      description: 'Relances J+7/J+15/J+30 (parametrables via accounting_settings.payment_reminder_days) pour les documents emis non soldes echus. Idempotent : une relance par (document, stage), jamais de doublon. Notification in-app aux managers principal/comptable. Issue #5229.'
      responses:
        '200':
          description: Nombre de relances envoyees
          content:
            application/json:
              schema:
                type: object
                properties:
                  reminders_sent:
                    type: integer
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
  /employees/{employee}/certificate-of-employment:
    get:
      tags:
      - Payroll
      summary: Certificat de travail PDF (fin de contrat, F-08)
      parameters:
      - name: employee
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: 'PDF (Content-Disposition: attachment)'
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          description: Manager role required
        '404':
          description: Employe introuvable (isolation tenant)
  /employees/{employee}/departure/notice:
    get:
      tags:
      - HR
      summary: 'Récapitulatif du préavis légal (issue #5325, G2)'
      description: 'Affiche la durée légale de préavis par pays/ancienneté (règle Payroll consommee, jamais recalculée) et le statut de service (employee_departures, workflow #5324). Reserve aux managers, isole par tenant.'
      parameters:
      - name: employee
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Recapitulatif du preavis legal
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      country_code:
                        type: string
                      years_of_service:
                        type: number
                      notice_days:
                        type: number
                      notice_status:
                        type: string
                        enum:
                        - served
                        - not_served
                        - unknown
                      notice_days_served:
                        type: integer
                        nullable: true
                      rule_reference:
                        type: string
                      confidence_level:
                        type: string
                      compliance_source:
                        type: string
                        nullable: true
                      rules_version:
                        type: string
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          description: Manager role required
        '404':
          description: Employe introuvable (isolation tenant)
  /employees/{employee}/end-of-contract:
    get:
      tags:
      - Payroll
      summary: Solde de tout compte (fin de contrat, F-08)
      description: 'Calcul du solde de tout compte : prorata du dernier mois, indemnite de conges payes non pris, preavis, indemnite d''anciennete (1 mois/an, regime DZ documente). Reserve aux managers, isole par tenant.'
      parameters:
      - name: employee
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Detail du solde de tout compte
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      employee_id:
                        type: integer
                      end_date:
                        type: string
                      years_of_service:
                        type: number
                      monthly_base:
                        type: number
                      breakdown:
                        type: object
                        properties:
                          prorated_pay:
                            type: number
                          leave_indemnity:
                            type: number
                          notice_pay:
                            type: number
                          severance:
                            type: number
                          total:
                            type: number
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          description: Manager role required
        '404':
          description: Employe introuvable (isolation tenant)
  /demo-users:
    get:
      tags:
      - Auth
      summary: Comptes demo publics pour la documentation QA
      description: 'Contrat public de documentation QA (AGENTS.md v4.16.128) : personas demo employee/manager/super-admin. Throttle 10/min.'
      responses:
        '200':
          description: Personas de demonstration
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
  /health:
    get:
      tags:
      - Health
      summary: Healthcheck live + ready
      security: []
      responses:
        '200':
          description: API disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Base de donnees indisponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/live:
    get:
      tags:
      - Health
      summary: Liveness probe — processus API vivant (sans dépendances)
      security: []
      responses:
        '200':
          description: API vivante
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /health/ready:
    get:
      tags:
      - Health
      summary: Readiness probe — base de données disponible
      security: []
      responses:
        '200':
          description: API prête
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  checks:
                    type: object
                    additionalProperties: true
  /edge/health:
    get:
      tags:
      - Health
      summary: Healthcheck edge (public, machine-to-cloud)
      description: Sonde de sante de l'API pour les nœuds edge (throttle 300/min).
      security: []
      responses:
        '200':
          description: API edge disponible
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /edge/readiness:
    get:
      tags:
      - Health
      summary: Readiness probe du nœud edge (schéma SQLite)
      description: 'Vérifie que le schéma SQLite local est provisionné (SELECT 1 sur

        sync_queue). Distinct de /edge/health (liveness sans DB) : ce endpoint

        garantit qu''un nœud frais est prêt à synchroniser avant de le déclarer

        opérationnel. (#4411)

        '
      security: []
      responses:
        '200':
          description: Nœud prêt — schéma SQLite provisionné
          content:
            application/json:
              schema:
                type: object
                properties:
                  edge:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: ok
                  schema:
                    type: string
                    example: provisioned
                  time:
                    type: string
                    format: date-time
        '503':
          description: Schéma SQLite manquant — nœud non prêt
          content:
            application/json:
              schema:
                type: object
                properties:
                  edge:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: not_ready
                  reason:
                    type: string
                    example: edge_schema_missing
                  time:
                    type: string
                    format: date-time
  /edge/install.sh:
    get:
      tags:
      - Health
      summary: Script d'installation du nœud edge (public)
      security: []
      responses:
        '200':
          description: Script shell
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Script introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /edge/download/docker-compose.yml:
    get:
      tags:
      - Health
      summary: docker-compose.yml de reference pour le nœud edge (public)
      security: []
      responses:
        '200':
          description: Fichier docker-compose
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Fichier introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /edge/download/Caddyfile.edge:
    get:
      tags:
      - Health
      summary: Caddyfile.edge de reference pour le nœud edge (public)
      description: 'Fichier de configuration Caddy monté par docker-compose.yml du nœud edge (issue #3741).'
      security: []
      responses:
        '200':
          description: Fichier Caddyfile.edge
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Fichier introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /edge/download/sha256.txt:
    get:
      tags:
      - Health
      summary: Sommes SHA-256 des artefacts edge (public)
      description: 'Manifeste des sommes SHA-256 (format texte) utilise par install.sh pour verifier l''integrite des telechargements (issues #3529/#3770).'
      security: []
      responses:
        '200':
          description: Manifeste SHA-256
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Manifeste introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /edge/download/docker-compose.yml.sha256:
    get:
      tags:
      - Health
      summary: Somme SHA-256 de docker-compose.yml edge (public)
      security: []
      responses:
        '200':
          description: Somme SHA-256 du fichier docker-compose.yml
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Somme introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /edge/download/Caddyfile.edge.sha256:
    get:
      tags:
      - Health
