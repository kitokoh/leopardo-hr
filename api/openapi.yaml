    post:
      tags:
      - Billing
      summary: Demande d'essai guidé / auto-service (onboarding)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - company
              - country
              properties:
                email:
                  type: string
                  format: email
                company:
                  type: string
                  maxLength: 120
                country:
                  type: string
                  minLength: 2
                  maxLength: 2
                  description: Code ISO pays supporté (DZ, MA, TN, SN…)
                first_name:
                  type: string
                last_name:
                  type: string
                role:
                  type: string
                  enum:
                  - founder
                  - manager
                  - hr
                  - operations
                  - other
                employees:
                  type: string
                  enum:
                  - 1-10
                  - 11-50
                  - 51-200
                  - 201-500
                  - 500+
                phone:
                  type: string
                plan:
                  type: string
                source:
                  type: string
                referral_code:
                  type: string
                requestedWorkflow:
                  type: string
                  enum:
                  - guided_trial
                  - self_service
      responses:
        '200':
          description: 'Demande reçue (guided_trial : provisioning lancé)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      email:
                        type: string
                      status:
                        type: string
                        example: provisioning_sandbox
                      provisioning_token:
                        type: string
        '409':
          description: Email déjà enregistré
        '422':
          description: Validation échouée (pays non supporté…)
  /trial/verify:
    post:
      tags:
      - Billing
      summary: Vérifie le code OTP et provisionne l'espace d'essai
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - code
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  minLength: 6
                  maxLength: 6
      responses:
        '201':
          description: Espace d'essai créé (identifiants temporaires)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      company:
                        type: object
                      manager:
                        type: object
                        properties:
                          email:
                            type: string
                          temp_password:
                            type: string
                      trial:
                        type: object
                        properties:
                          days:
                            type: integer
                            example: 14
                          ends_at:
                            type: string
                            format: date-time
        '400':
          description: Code invalide ou expiré
        '422':
          description: Pays invalide
  /trial/status:
    get:
      tags:
      - Billing
      summary: Statut du provisioning d'un essai guidé (polling)
      description: Route publique pollee par la vitrine (throttle dedie 60/min). Verifie le token de provisioning de 64 caracteres.
      security: []
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
          minLength: 64
          maxLength: 64
      responses:
        '200':
          description: Statut du provisioning
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                        - pending
                        - ready
                        - failed
                      provisioned_at:
                        type: string
                        format: date-time
                        nullable: true
        '404':
          description: Token invalide
          content:
            application/json:
              schema:
                type: object
                properties:
