openapi: "3.0.3"

info:
  title: "Leopardo RH API"
  version: "4.1.81-2026-05-22"
  description: |
    OpenAPI alignee sur la surface API reellement exposee par origin/main.

    Cette specification documente uniquement les endpoints observes dans :
    - routes/api.php
    - routes/modules/rh.php
    - routes/modules/cameras.php

    Les modules de conception plus larges presents dans docs/dossierdeConception
    ne sont pas repris ici tant qu'ils ne sont pas effectivement exposes.

    Note:
    le workspace local peut contenir des routes supplementaires en cours de
    developpement non mergees. Cette spec vise la baseline origin/main analysee
    pour l'audit documentaire.

servers:
  - url: "https://api.leopardo-rh.com/api/v1"
    description: "Production"
  - url: "http://localhost:8000/api/v1"
    description: "Local Docker"

security:
  - BearerAuth: []

tags:
  - name: "Health"
  - name: "Auth"
  - name: "Payrolls"
  - name: "HR Referentials"
  - name: "Notifications"
  - name: "Projects"
  - name: "Tasks"
  - name: "Evaluations"
  - name: "Platform"
  - name: "Employees"
  - name: "Attendance"
  - name: "Estimations"
  - name: "Me"
  - name: "Invitations"
  - name: "Biometrics"
  - name: "Kiosks"
  - name: "Cameras"

paths:
  /health:
    get:
      tags: ["Health"]
      summary: "Healthcheck live + ready"
      security: []
      responses:
        "200":
          description: "API disponible"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: "Base de donnees indisponible"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /auth/login:
    post:
      tags: ["Auth"]
      summary: "Connexion employee"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: "Connexion reussie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "422":
          $ref: "#/components/responses/Validation422"

  /auth/me:
    get:
      tags: ["Auth"]
      summary: "Profil authentifie"
      responses:
        "200":
          description: "Profil employee courant"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CurrentEmployee"
        "401":
          $ref: "#/components/responses/Error401"

  /auth/profile:
    patch:
      tags: ["Auth"]
      summary: "Mettre a jour le profil courant"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: "Profil mis a jour"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CurrentEmployee"
        "401":
          $ref: "#/components/responses/Error401"
        "422":
          $ref: "#/components/responses/Validation422"

  /auth/change-password:
    post:
      tags: ["Auth"]
      summary: "Changer le mot de passe"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: "Mot de passe change"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
        "401":
          $ref: "#/components/responses/Error401"
        "422":
          description: "Mot de passe courant incorrect ou validation"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/ValidationErrorResponse"

  /auth/logout:
    post:
      tags: ["Auth"]
      summary: "Deconnexion employee"
      responses:
        "200":
          description: "Token courant supprime"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"

  /auth/biometric-enrollment:
    get:
      tags: ["Biometrics"]
      summary: "Derniere demande biometrie de l'utilisateur courant"
      responses:
        "200":
          description: "Derniere demande ou null"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BiometricEnrollmentRequest"
    post:
      tags: ["Biometrics"]
      summary: "Soumettre une demande biometrie"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/BiometricEnrollmentSubmitRequest"
      responses:
        "201":
          description: "Demande enregistree"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BiometricEnrollmentRequest"
        "422":
          $ref: "#/components/responses/Validation422"

  /platform/auth/login:
    post:
      tags: ["Platform"]
      summary: "Connexion super-admin"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformLoginRequest"
      responses:
        "200":
          description: "Connexion super-admin reussie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformLoginResponse"
        "401":
          $ref: "#/components/responses/Error401"
        "422":
          $ref: "#/components/responses/Validation422"

  /platform/auth/me:
    get:
      tags: ["Platform"]
      summary: "Super-admin courant"
      security:
        - SuperAdminBearerAuth: []
      responses:
        "200":
          description: "Profil super-admin"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/SuperAdminUser"

  /platform/auth/logout:
    post:
      tags: ["Platform"]
      summary: "Deconnexion super-admin"
      security:
        - SuperAdminBearerAuth: []
      responses:
        "200":
          description: "Token supprime"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"

  /platform/companies:
    get:
      tags: ["Platform"]
      summary: "Lister les societes"
      security:
        - SuperAdminBearerAuth: []
      responses:
        "200":
          description: "Liste des societes"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlatformCompany"
    post:
      tags: ["Platform"]
      summary: "Creer une societe shared"
      security:
        - SuperAdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformCompanyCreateRequest"
      responses:
        "201":
          description: "Societe et manager crees"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformCompanyCreateResponse"
        "422":
          $ref: "#/components/responses/Validation422"

  /employees:
    get:
      tags: ["Employees"]
      summary: "Lister les employes"
      parameters:
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: "Liste paginee simple"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeIndexResponse"
        "403":
          $ref: "#/components/responses/Error403"
    post:
      tags: ["Employees"]
      summary: "Creer un employe"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreEmployeeRequest"
      responses:
        "201":
          description: "Employe cree"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/EmployeeDetail"
        "403":
          $ref: "#/components/responses/Error403"
        "422":
          $ref: "#/components/responses/Validation422"

  /employees/{employee}:
    get:
      tags: ["Employees"]
      summary: "Voir un employe"
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      responses:
        "200":
          description: "Detail employe"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/EmployeeDetail"
        "404":
          $ref: "#/components/responses/Error404"
    put:
      tags: ["Employees"]
      summary: "Mettre a jour un employe"
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeRequestFull"
      responses:
        "200":
          description: "Employe mis a jour"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/EmployeeDetail"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "422":
          $ref: "#/components/responses/Validation422"
    patch:
      tags: ["Employees"]
      summary: "Patch employe"
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeRequestFull"
      responses:
        "200":
          description: "Employe mis a jour"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/EmployeeDetail"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "422":
          $ref: "#/components/responses/Validation422"

  /employees/{employee}/archive:
    post:
      tags: ["Employees"]
      summary: "Archiver un employe"
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      responses:
        "200":
          description: "Employe archive"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      status:
                        type: string
                        example: "archived"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"

  /employees/{employee}/daily-summary:
    get:
      tags: ["Estimations"]
      summary: "Resume journalier d'un employe"
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: "Resume journalier"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/DailySummary"

  /employees/{employee}/quick-estimate:
    get:
      tags: ["Estimations"]
      summary: "Estimation sur periode"
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: "Estimation"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/QuickEstimate"
        "422":
          $ref: "#/components/responses/Validation422"

  /employees/{employee}/receipt:
    get:
      tags: ["Estimations"]
      summary: "Telecharger le PDF d'estimation"
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: "PDF"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "422":
          $ref: "#/components/responses/Validation422"

  /me/daily-summary:
    get:
      tags: ["Me"]
      summary: "Resume journalier utilisateur courant"
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: "Resume journalier"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/DailySummary"

  /me/quick-estimate:
    get:
      tags: ["Me"]
      summary: "Estimation utilisateur courant"
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: "Estimation"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/QuickEstimate"

  /me/monthly-summary:
    get:
      tags: ["Me"]
      summary: "Resume mensuel utilisateur courant"
      parameters:
        - name: year
          in: query
          schema:
            type: integer
        - name: month
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: "Resume mensuel"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/QuickEstimate"
                      - type: object
                        properties:
                          year:
                            type: integer
                          month:
                            type: integer

  /attendance/check-in:
    post:
      tags: ["Attendance"]
      summary: "Check-in"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GpsPayload"
      responses:
        "201":
          description: "Pointage cree"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AttendanceLog"
        "422":
          description: "Erreur metier ou validation"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/ValidationErrorResponse"

  /attendance/check-out:
    post:
      tags: ["Attendance"]
      summary: "Check-out"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GpsPayload"
      responses:
        "200":
          description: "Pointage mis a jour"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AttendanceLog"
        "422":
          description: "Erreur metier ou validation"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/ValidationErrorResponse"

  /attendance/today:
    get:
      tags: ["Attendance"]
      summary: "Etat du jour"
      parameters:
        - name: employee_id
          in: query
          schema:
            type: integer
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: "Vue single ou collection"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceTodayEnvelope"
        "422":
          $ref: "#/components/responses/Validation422"

  /attendance:
    get:
      tags: ["Attendance"]
      summary: "Historique de pointage"
      parameters:
        - name: employee_id
          in: query
          schema:
            type: integer
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: "Historique"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceIndexResponse"
        "422":
          $ref: "#/components/responses/Validation422"

  /invitations:
    get:
      tags: ["Invitations"]
      summary: "Lister les invitations de l'entreprise"
      responses:
        "200":
          description: "Invitations"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Invitation"
        "403":
          $ref: "#/components/responses/Error403"

  /invitations/{invitation}/resend:
    post:
      tags: ["Invitations"]
      summary: "Renvoyer une invitation"
      parameters:
        - $ref: "#/components/parameters/InvitationId"
      responses:
        "200":
          description: "Invitation renvoyee"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                        format: email
                      resent_at:
                        type: string
                        format: date-time
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "410":
          description: "Invitation deja acceptee"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /biometric-enrollment-requests:
    get:
      tags: ["Biometrics"]
      summary: "Lister les demandes biometrie de la company"
      responses:
        "200":
          description: "Demandes"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/BiometricEnrollmentRequest"
        "403":
          $ref: "#/components/responses/Error403"

  /biometric-enrollment-requests/{id}/approve:
    post:
      tags: ["Biometrics"]
      summary: "Approuver une demande biometrie"
      parameters:
        - $ref: "#/components/parameters/GenericIntId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BiometricDecisionRequest"
      responses:
        "200":
          description: "Demande approuvee"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BiometricEnrollmentRequest"
        "403":
          $ref: "#/components/responses/Error403"

  /biometric-enrollment-requests/{id}/reject:
    post:
      tags: ["Biometrics"]
      summary: "Rejeter une demande biometrie"
      parameters:
        - $ref: "#/components/parameters/GenericIntId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BiometricDecisionRequest"
      responses:
        "200":
          description: "Demande rejetee"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BiometricEnrollmentRequest"
        "403":
          $ref: "#/components/responses/Error403"

  /kiosks:
    post:
      tags: ["Kiosks"]
      summary: "Enregistrer un kiosk"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KioskRegisterRequest"
      responses:
        "201":
          description: "Kiosk cree"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Kiosk"
        "403":
          $ref: "#/components/responses/Error403"

  /kiosks/{deviceCode}/roster:
    get:
      tags: ["Kiosks"]
      summary: "Roster biometrie d'un kiosk"
      security: []
      parameters:
        - $ref: "#/components/parameters/DeviceCode"
        - $ref: "#/components/parameters/KioskTokenHeader"
      responses:
        "200":
          description: "Roster"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KioskRosterResponse"
        "401":
          $ref: "#/components/responses/Error401"

  /kiosks/{deviceCode}/punch:
    post:
      tags: ["Kiosks"]
      summary: "Pointage via kiosk"
      security: []
      parameters:
        - $ref: "#/components/parameters/DeviceCode"
        - $ref: "#/components/parameters/KioskTokenHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KioskPunchRequest"
      responses:
        "200":
          description: "Check-out via kiosk"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KioskPunchResponse"
        "201":
          description: "Check-in via kiosk"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KioskPunchResponse"
        "401":
          $ref: "#/components/responses/Error401"
        "422":
          $ref: "#/components/responses/Validation422"

  /kiosks/{deviceCode}/sync:
    post:
      tags: ["Kiosks"]
      summary: "Synchroniser des evenements offline"
      security: []
      parameters:
        - $ref: "#/components/parameters/DeviceCode"
        - $ref: "#/components/parameters/KioskTokenHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KioskSyncRequest"
      responses:
        "200":
          description: "Sync terminee"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KioskSyncResponse"
        "401":
          $ref: "#/components/responses/Error401"
        "422":
          $ref: "#/components/responses/Validation422"

  /cameras:
    get:
      tags: ["Cameras"]
      summary: "Lister les cameras"
      responses:
        "200":
          description: "Liste des cameras"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraIndexResponse"
        "403":
          $ref: "#/components/responses/Error403"
    post:
      tags: ["Cameras"]
      summary: "Creer une camera"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreCameraRequest"
      responses:
        "201":
          description: "Camera creee"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Camera"
        "403":
          description: "Module indisponible ou limite plan"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/Validation422"

  /cameras/test-rtsp:
    post:
      tags: ["Cameras"]
      summary: "Tester une URL RTSP"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestRtspRequest"
      responses:
        "200":
          description: "Connexion valide ou test saute"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestRtspSuccessResponse"
        "408":
          description: "Timeout RTSP"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "Erreur de validation ou connexion"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
