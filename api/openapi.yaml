        description: Fin de periode (YYYY-MM-DD).
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Synthese du tableau de bord
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AccountingDashboard'
        '422':
          $ref: '#/components/responses/Validation422'
        '403':
          $ref: '#/components/responses/Error401'
