          $ref: "#/components/responses/Error404"

  /accounting/bank-statements/import:
    post:
      tags: ["Accounting"]
      summary: "Importer un relevé bancaire CSV"
      description: "Import CSV paramétrable (mapping par entreprise). Idempotent : ré-import refusé (409). Erreurs de ligne signalées dans errors[]. RBAC comptable/principal. Issue #5435."
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, statement_period, import_reference]
              properties:
                file:
                  type: string
                  format: binary
                  description: "Fichier CSV (séparateur configurable, défaut ';')"
                statement_period:
                  type: string
                  pattern: "^\\d{4}-\\d{2}$"
                  description: "Période du relevé, ex. 2026-08"
                import_reference:
                  type: string
                  description: "Référence externe d'import (unicité avec la période)"
      responses:
        "201":
          description: "Relevé importé (imported lignes, skipped, errors par ligne)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      statement:
                        $ref: "#/components/schemas/BankStatement"
                      imported: { type: integer }
                      skipped: { type: integer }
                      errors:
                        type: array
                        items:
                          type: object
                          properties:
                            line: { type: integer }
                            error: { type: string }
        "409":
          description: "Relevé déjà importé pour cette période (BANK_STATEMENT_DUPLICATE_IMPORT)"
          $ref: "#/components/responses/Error409"
        "422":
          description: "En-tête invalide ou validation échouée (BANK_STATEMENT_IMPORT_FORMAT)"
          $ref: "#/components/responses/Error422"

  /accounting/bank-statements:
    get:
      tags: ["Accounting"]
      summary: "Lister les relevés bancaires"
      description: "Relevés du tenant (filtre status). RBAC comptable/principal. Issue #5435."
      parameters:
        - name: status
          in: query
