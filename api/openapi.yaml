  /attendance/day-closures:
    get:
      tags: ["Attendance"]
      summary: "Lister les fermetures de journée (manager/RH/principal)"
      description: "Fermetures de journée du pointage (issue #5265) : verrous quotidiens par employé, filtrables par date et/ou employé. RBAC api.manager:rh,principal."
      security:
        - BearerAuth: []
      parameters:
        - name: date
          in: query
          required: false
          description: "Filtre par date (YYYY-MM-DD)."
          schema: { type: string, format: date }
        - name: employee_id
          in: query
          required: false
          description: "Filtre par employé."
          schema: { type: integer }
      responses:
        "200":
          description: "Liste des fermetures de journée"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AttendanceDayClosure"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
    post:
      tags: ["Attendance"]
      summary: "Verrouiller la journée d'un employé (manager/RH/principal)"
      description: "Crée une fermeture de journée (idempotent) : plus aucun pointage (check-in/check-out, import, approbation géo) n'est accepté pour cet employé ce jour-là → 409 ATTENDANCE_DAY_CLOSED. Issue #5265."
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employee_id, date]
              properties:
                employee_id: { type: integer, description: "Employé de l'entreprise courante (404 si hors tenant)." }
                date: { type: string, format: date, description: "Date locale entreprise (YYYY-MM-DD)." }
                note: { type: string, nullable: true }
      responses:
        "201":
          description: "Fermeture créée (ou déjà existante — idempotent)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AttendanceDayClosure"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "422":
          description: "Validation (employé hors entreprise, date invalide)."

