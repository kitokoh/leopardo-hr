  /accounting/currency/convert:
    post:
      tags:
      - Accounting
      summary: 'Convertir un montant entre deux devises (multi-devises #5270)'
      description: 'Utilitaire de conversion HT/TVA/TTC entre la devise d''un document et la

        devise de reference de l''entreprise. Calcul pur, aucun etat persiste.

        Regles documentees (.specify/features/5270-multi-currency/spec.md) :

        arrondi half-up a 2 decimales ; devises identiques -> taux 1 (identite,

        source ''identity'') ; sinon le taux manuel est OBLIGATOIRE (le

        convertisseur ne fabrique jamais de taux — fail-closed). `rate` = valeur

        de 1 unite de `from_currency` exprimee dans `to_currency` (multiplication).

        Source externe : interface CurrencyRateProviderInterface (v1 : manuel).

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvertCurrencyPayload'
      responses:
        '200':
          description: Montant converti (devise source + cible, taux et source)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ConvertCurrencyResult'
        '422':
          $ref: '#/components/responses/Validation422'
        '403':
          $ref: '#/components/responses/Error401'
  /attendance/check-in:
    post:
      tags:
      - Attendance
      summary: Check-in
      description: 'Pointage d''arrivee. Si l''entreprise impose le mode `photo_required`

        (voir `AttendanceModeSettings.punch_photo_mode`), le champ multipart

        `punch_photo` est obligatoire, sinon la requete est rejetee avec

        l''erreur `PUNCH_PHOTO_REQUIRED`.

        '
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GpsPayload'
          multipart/form-data:
            schema:
              allOf:
              - $ref: '#/components/schemas/GpsPayload'
              - type: object
                properties:
                  punch_photo:
