  /fuel-station/stations/{station}/pumps/{pump}/meters/{meter}/readings:
    post:
      tags:
      - FuelStation
      summary: Enregistrer un releve de compteur (cumulatif, idempotent)
      description: |-
        Releve cumule d'un compteur (valeur en unites mineures entieres).
        Idempotent (idempotency_key). Valeur decroissante sans rollover
        documente → intervalle en anomalie (revue obligatoire). Solution
        FuelStation active requise (403 sinon). Issue #5798.
      parameters:
      - name: station
        in: path
        required: true
        schema: {type: integer}
      - name: pump
        in: path
        required: true
        schema: {type: integer}
      - name: meter
        in: path
        required: true
        schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FuelMeterReadingPayload'
      responses:
        '201':
          description: Releve accepte
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/FuelMeterReadingResult'
        '200':
          description: Rejeu idempotent (aucun doublon)
        '403':
          description: Solution inactive ou permission manquante
        '404':
          description: Station/pompe/compteur introuvable (hors tenant)
        '422':
          $ref: '#/components/responses/Validation422'
    get:
      tags:
      - FuelStation
      summary: Lister les releves d'un compteur
      parameters:
      - name: station
        in: path
        required: true
        schema: {type: integer}
      - name: pump
        in: path
        required: true
        schema: {type: integer}
      - name: meter
        in: path
        required: true
        schema: {type: integer}
      responses:
        '200':
          description: Liste des releves (100 max, plus recents d'abord)
  /fuel-station/stations/{station}/pumps/{pump}/meters/{meter}/intervals:
    get:
      tags:
      - FuelStation
      summary: Lister les intervalles calcules d'un compteur
      parameters:
      - name: station
        in: path
        required: true
        schema: {type: integer}
      - name: pump
        in: path
        required: true
        schema: {type: integer}
      - name: meter
        in: path
        required: true
        schema: {type: integer}
      responses:
        '200':
          description: Liste des intervalles (valid|rollover|anomaly|pending_review)
  /fuel-station/meter-readings/{reading}/corrections:
    post:
      tags:
      - FuelStation
      summary: Corriger un releve (versionne, audite) — manager principal/rh
      parameters:
      - name: reading
        in: path
        required: true
        schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reading_value_minor, reason]
              properties:
                reading_value_minor: {type: integer, minimum: 0}
                reason: {type: string, maxLength: 1000}
      responses:
        '200':
          description: Correction enregistree (nouvelle version, original marque corrected)
        '403':
          description: Permission manager requise
        '409':
          description: Releve deja corrige ou rejete
  /fuel-station/meter-intervals/{interval}/review:
    post:
      tags:
      - FuelStation
      summary: Revoir un intervalle en anomalie (accept/reject) — manager principal/rh
      parameters:
      - name: interval
        in: path
        required: true
        schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: {type: string, enum: [accept, reject]}
                note: {type: string, maxLength: 1000}
      responses:
        '200':
          description: Revue enregistree
        '403':
          description: Permission manager requise
        '409':
          description: Intervalle deja revu

