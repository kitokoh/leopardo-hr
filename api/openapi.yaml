  /accounting/documents/shared/{token}:
    get:
      tags:
      - Accounting
      summary: Portail client — informations du document partagé (token)
      description: 'Endpoint public : le token de partage est la credential. Accès RGPD limité au document partagé (issue #5225).'
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Méta-données du document (numéro, type, statut, total TTC, expiration)
        '404':
          description: Token invalide ou expiré
        '429':
          description: Trop de requêtes (throttle)
  /accounting/documents/shared/{document}/accesses:
    get:
      tags:
      - Accounting
      summary: Audit des accès au portail client pour un document partagé (#5522)
      description: 'Réponse à incident RGPD (loi 18-07) : qui a consulté / téléchargé un document partagé, quand, depuis quelle IP. Liste paginée (date décroissante) des événements accounting.share.info / accounting.share.download tracés par le portail public (#5429/#5520), pour tous les partages du document. RBAC managers principal/comptable ; isolation tenant fail-closed (document inconnu ou cross-tenant → 404). Le share_token n''est jamais exposé.'
      parameters:
      - name: document
        in: path
        required: true
        description: ID du document comptable.
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: Accès paginés (action, ip, user_agent, request_id, date)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        user_id:
                          type: integer
                          nullable: true
                        action:
                          type: string
                          enum:
                          - accounting.share.info
                          - accounting.share.download
                        module:
                          type: string
                        request_id:
                          type: string
                          nullable: true
                        auditable_type:
                          type: string
                          nullable: true
                        auditable_id:
                          type: integer
                          nullable: true
                        old_values:
                          type: object
                          nullable: true
                        new_values:
                          type: object
                          nullable: true
                        ip_address:
                          type: string
                          nullable: true
                        user_agent:
                          type: string
                          nullable: true
                        metadata:
                          type: object
                          nullable: true
                        created_at:
                          type: string
                          format: date-time
                          nullable: true
                  links:
                    type: object
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      last_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          description: Document inconnu ou hors tenant
        '422':
          $ref: '#/components/responses/Error422'
  /accounting/documents/shared/{token}/download:
