components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
    SuperAdminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum

  parameters:
    ProjectId:
      name: project
      in: path
      required: true
      schema:
        type: integer
    NotificationId:
      name: notification
      in: path
      required: true
      schema:
        type: integer
    TaskId:
      name: task
      in: path
      required: true
      schema:
        type: integer
    EvaluationId:
      name: evaluation
      in: path
      required: true
      schema:
        type: integer
    EmployeeId:
      name: employee
      in: path
      required: true
      schema:
        type: integer
    CameraId:
      name: camera
      in: path
      required: true
      schema:
        type: integer
    TokenId:
      name: token
      in: path
      required: true
      schema:
        type: integer
    PermissionId:
      name: permission
      in: path
      required: true
      schema:
        type: integer
    InvitationId:
      name: invitation
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GenericIntId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    NumericId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    CompanyUuid:
      name: company
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceCode:
      name: deviceCode
      in: path
      required: true
      schema:
        type: string
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
    KioskTokenHeader:
      name: X-Kiosk-Token
      in: header
      required: true
      schema:
        type: string

  headers:
    XRequestId:
      description: "Identifiant de correlation a fournir au support en cas d'incident."
      schema:
        type: string
    RetryAfter:
      description: "Delai conseille avant retry lorsqu'une limite de debit est atteinte."
      schema:
        type: integer

  responses:
    Error401:
      description: "Non authentifie"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error403:
      description: "Action interdite"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error404:
      description: "Ressource introuvable"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error429:
      description: "Limite de debit atteinte"
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error422:
      description: "Erreur de validation"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
    Validation422:
      description: "Erreur de validation"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"

  schemas:
    CompanyBranding:
      type: object
      properties:
        display_name:
          type: string
          example: "TechCorp Algerie"
        logo_url:
          type: string
          nullable: true
          example: "https://api.example.com/storage/company-branding/logo.png"
        logo_path:
          type: string
          nullable: true
        logo_disk:
          type: string
          nullable: true
          example: "public"
        primary_color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          example: "#10B981"
        accent_color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          example: "#2563EB"
        brand_mode:
          type: string
          enum: ["default", "light", "dark", "auto"]
    CompanyBrandingResponse:
      type: object
      properties:
        company_id:
          type: string
          format: uuid
        branding:
          $ref: "#/components/schemas/CompanyBranding"
    CompanyBrandingUpdateRequest:
      type: object
      properties:
        display_name:
          type: string
          minLength: 2
          maxLength: 120
        logo_url:
          type: string
          format: uri
          nullable: true
        primary_color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        accent_color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        brand_mode:
          type: string
          enum: ["default", "light", "dark", "auto"]
    Schedule:
      type: object
      properties:
        id:
          type: integer
        company_id:
          type: string
          format: uuid
        name:
          type: string
        start_time:
          type: string
          example: "08:00"
        end_time:
          type: string
          example: "17:00"
        break_minutes:
          type: integer
          minimum: 0
        work_days:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 7
        rest_days:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 7
        break_rules:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              start_time:
                type: string
                nullable: true
              end_time:
                type: string
                nullable: true
              minutes:
                type: integer
              is_paid:
                type: boolean
        leave_rules:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              type:
                type: string
                nullable: true
              days_per_year:
                type: number
                nullable: true
              policy_id:
                type: integer
                nullable: true
        assignment_notes:
          type: string
          nullable: true
        late_tolerance_minutes:
          type: integer
          minimum: 0
        overtime_threshold_daily:
          type: number
        overtime_threshold_weekly:
          type: number
        is_default:
          type: boolean
    ScheduleRequest:
      type: object
      required: ["name", "start_time", "end_time"]
      properties:
        name:
          type: string
          maxLength: 100
        start_time:
          type: string
          pattern: "^\\d{2}:\\d{2}$"
        end_time:
          type: string
          pattern: "^\\d{2}:\\d{2}$"
        break_minutes:
          type: integer
          minimum: 0
          maximum: 480
        work_days:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 7
        rest_days:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 7
        break_rules:
          type: array
          maxItems: 10
          items:
            type: object
            properties:
              label:
                type: string
                maxLength: 80
              start_time:
                type: string
                pattern: "^\\d{2}:\\d{2}$"
              end_time:
                type: string
                pattern: "^\\d{2}:\\d{2}$"
              minutes:
                type: integer
                minimum: 0
                maximum: 480
              is_paid:
                type: boolean
        leave_rules:
          type: array
          maxItems: 20
          items:
            type: object
            properties:
              label:
                type: string
                maxLength: 120
              type:
                type: string
                maxLength: 80
              days_per_year:
                type: number
                minimum: 0
                maximum: 365
              policy_id:
                type: integer
                minimum: 1
        assignment_notes:
          type: string
          maxLength: 1000
        late_tolerance_minutes:
          type: integer
          minimum: 0
          maximum: 120
        overtime_threshold_daily:
          type: number
          minimum: 0
        overtime_threshold_weekly:
          type: number
          minimum: 0
        is_default:
          type: boolean
    ClientEventRequest:
      type: object
      required: ["name"]
      properties:
        name:
          type: string
          enum: ["login_success", "dashboard_loaded", "feature_blocked", "demo_user_selected", "kiosk_status"]
        surface:
          type: string
          enum: ["web", "admin", "mobile", "kiosk"]
          default: "web"
        session_id:
          type: string
          nullable: true
          maxLength: 120
        duration_ms:
          type: integer
          nullable: true
          minimum: 0
          maximum: 600000
        occurred_at:
          type: string
          format: date-time
          nullable: true
        properties:
          type: object
          additionalProperties: true
          nullable: true
    ClientEventResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            stored:
              type: boolean
    LaunchReadinessResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            company_id:
              type: string
              format: uuid
            score:
              type: integer
              minimum: 0
              maximum: 100
            go_live_ready:
              type: boolean
            required_blockers:
              type: array
              items:
                $ref: "#/components/schemas/LaunchReadinessBlocker"
            next_actions:
              type: array
              items:
                $ref: "#/components/schemas/LaunchReadinessAction"
            checks:
              type: array
              items:
                $ref: "#/components/schemas/LaunchReadinessCheck"
    LaunchReadinessCheck:
      type: object
      properties:
        key:
          type: string
          enum:
            - company_profile
            - manager_access
