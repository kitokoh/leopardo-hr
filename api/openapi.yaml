components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
    SuperAdminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum

  parameters:
    ProjectId:
      name: project
      in: path
      required: true
      schema:
        type: integer
    NotificationId:
      name: notification
      in: path
      required: true
      schema:
        type: integer
    TaskId:
      name: task
      in: path
      required: true
      schema:
        type: integer
    EvaluationId:
      name: evaluation
      in: path
      required: true
      schema:
        type: integer
    EmployeeId:
      name: employee
      in: path
      required: true
      schema:
        type: integer
    CameraId:
      name: camera
      in: path
      required: true
      schema:
        type: integer
    TokenId:
      name: token
      in: path
      required: true
      schema:
        type: integer
    PermissionId:
      name: permission
      in: path
      required: true
      schema:
        type: integer
    InvitationId:
      name: invitation
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GenericIntId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    NumericId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    CompanyUuid:
      name: company
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceCode:
      name: deviceCode
      in: path
      required: true
      schema:
        type: string
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
    KioskTokenHeader:
      name: X-Kiosk-Token
      in: header
      required: true
      schema:
        type: string

  responses:
    Error401:
      description: "Non authentifie"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error403:
      description: "Action interdite"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error404:
      description: "Ressource introuvable"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error422:
      description: "Erreur de validation"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
    Validation422:
      description: "Erreur de validation"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"

  schemas:
    Schedule:
      type: object
      properties:
        id:
          type: integer
        company_id:
          type: string
          format: uuid
        name:
          type: string
        start_time:
          type: string
          example: "08:00"
        end_time:
          type: string
          example: "17:00"
        break_minutes:
          type: integer
          minimum: 0
        work_days:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 7
        late_tolerance_minutes:
          type: integer
          minimum: 0
        overtime_threshold_daily:
          type: number
        overtime_threshold_weekly:
          type: number
        is_default:
          type: boolean
    ScheduleRequest:
      type: object
      required: ["name", "start_time", "end_time"]
      properties:
        name:
          type: string
          maxLength: 100
        start_time:
          type: string
          pattern: "^\\d{2}:\\d{2}$"
        end_time:
          type: string
          pattern: "^\\d{2}:\\d{2}$"
        break_minutes:
          type: integer
          minimum: 0
          maximum: 480
        work_days:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 7
        late_tolerance_minutes:
          type: integer
          minimum: 0
          maximum: 120
        overtime_threshold_daily:
          type: number
          minimum: 0
        overtime_threshold_weekly:
          type: number
          minimum: 0
        is_default:
          type: boolean
    ClientEventRequest:
      type: object
      required: ["name"]
      properties:
        name:
          type: string
          enum: ["login_success", "dashboard_loaded", "feature_blocked", "demo_user_selected", "kiosk_status"]
        surface:
          type: string
          enum: ["web", "admin", "mobile", "kiosk"]
          default: "web"
        session_id:
          type: string
          nullable: true
          maxLength: 120
        duration_ms:
          type: integer
          nullable: true
          minimum: 0
          maximum: 600000
        occurred_at:
          type: string
          format: date-time
          nullable: true
        properties:
          type: object
          additionalProperties: true
          nullable: true
    ClientEventResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            stored:
              type: boolean
    LaunchReadinessResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            company_id:
              type: string
              format: uuid
            score:
              type: integer
              minimum: 0
              maximum: 100
            go_live_ready:
              type: boolean
            required_blockers:
              type: array
              items:
                $ref: "#/components/schemas/LaunchReadinessBlocker"
            next_actions:
              type: array
              items:
                $ref: "#/components/schemas/LaunchReadinessAction"
            checks:
              type: array
              items:
                $ref: "#/components/schemas/LaunchReadinessCheck"
    LaunchReadinessCheck:
      type: object
      properties:
        key:
          type: string
          enum:
            - company_profile
            - manager_access
            - employee_base
            - communication_governance
            - payroll_base
            - attendance_entry
            - client_experience_tracking
        label:
          type: string
        required:
          type: boolean
        completed:
          type: boolean
        metrics:
          type: object
          additionalProperties: true
    LaunchReadinessBlocker:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        metrics:
          type: object
          additionalProperties: true
    LaunchReadinessAction:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        required:
          type: boolean
    CommunicationAnalyticsResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            period:
              type: object
              properties:
                days:
                  type: integer
                since:
                  type: string
                  format: date-time
            totals:
              type: object
              properties:
                events:
                  type: integer
                sent_or_queued:
                  type: integer
                failed:
                  type: integer
                skipped:
                  type: integer
                failure_rate:
                  type: number
                  format: float
            by_channel:
              type: array
              items:
                $ref: "#/components/schemas/KeyCount"
            by_status:
              type: array
              items:
                $ref: "#/components/schemas/KeyCount"
            by_template:
              type: array
              items:
                $ref: "#/components/schemas/KeyCount"
            daily:
              type: array
              items:
                type: object
                properties:
                  date:
                    type: string
                    format: date
                  count:
                    type: integer
    KeyCount:
      type: object
      properties:
        key:
          type: string
        count:
          type: integer
    Vehicle:
      type: object
      properties:
        id:
          type: integer
        company_id:
          type: integer
        plate_number:
          type: string
        brand:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        year:
          type: integer
          nullable: true
        type:
          type: string
          enum: [car, van, truck, motorcycle, bus]
          nullable: true
        vin:
          type: string
          nullable: true
        fuel_type:
          type: string
          enum: [diesel, gasoline, electric, hybrid, lpg]
          nullable: true
        status:
          type: string
          enum: [active, maintenance, decommissioned]
        mileage:
          type: integer
          nullable: true
        insurance_expiry:
          type: string
          format: date
          nullable: true
        technical_control_expiry:
          type: string
          format: date
          nullable: true
        traccar_unique_id:
          type: string
          nullable: true
        traccar_device_id:
          type: integer
          nullable: true
        assigned_driver_id:
          type: integer
          nullable: true
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "RESOURCE_NOT_FOUND"
        message:
          type: string
          example: "RESOURCE_NOT_FOUND"

    ValidationErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "VALIDATION_ERROR"
        message:
          type: string
          example: "VALIDATION_ERROR"
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    HealthCheck:
      type: object
      properties:
        ok:
          type: boolean
        latency_ms:
          type: integer
          nullable: true
        status:
          type: string
          nullable: true
        error:
          type: string
          nullable: true

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "ok"
        version:
          type: string
          nullable: true
        checks:
          type: object
          properties:
            database:
              $ref: "#/components/schemas/HealthCheck"
            redis:
              $ref: "#/components/schemas/HealthCheck"
