  /webhooks:
    get:
      tags:
      - Webhooks
      summary: Lister les webhooks de l'entreprise
      description: 'Retourne tous les endpoints webhook du tenant courant (toutes companies confondues cote base,

        mais sans filtre explicite par `company_id` dans le controller actuel — voir

        `WebhookController::index()`). Necessite le role manager `principal`.

        '
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Liste des webhooks
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookEndpoint'
              example:
                data:
                - id: 12
                  url: https://partner.example.com/hooks/leopardo
                  events:
                  - employee.created
                  - absence.approved
                  active: true
                  failure_count: 0
                  last_triggered_at: '2026-07-20T09:15:00+00:00'
                  created_at: '2026-05-01T08:00:00+00:00'
                  updated_at: '2026-07-20T09:15:00+00:00'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          description: Manager sans role principal (abort(403) dans WebhookController::index())
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: FORBIDDEN
                message: Cette action n'est pas autorisee.
    post:
      tags:
      - Webhooks
      summary: Creer un webhook
      description: 'Cree un endpoint webhook pour l''entreprise de l''utilisateur authentifie. Le `secret` (HMAC de

        signature des livraisons) est genere cote serveur (`Str::random(40)`) et n''est jamais fourni en

        entree ; il n''est renvoye qu''une fois au moment de la creation (absent des reponses `GET`

        ulterieures). Voir `App\Rules\NotPrivateUrl` : les URLs privees/loopback/liens locaux sont

        rejetees (SSRF guard).

        '
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEndpointRequest'
            example:
              url: https://partner.example.com/hooks/leopardo
              events:
              - employee.created
              - employee.archived
      responses:
        '201':
          description: Webhook cree
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WebhookEndpoint'
              example:
                data:
                  id: 13
                  url: https://partner.example.com/hooks/leopardo
                  events:
                  - employee.created
                  - employee.archived
                  active: true
                  failure_count: 0
                  last_triggered_at: null
                  created_at: '2026-07-25T10:00:00+00:00'
                  updated_at: '2026-07-25T10:00:00+00:00'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          description: Requete rejetee par StoreWebhookEndpointRequest::authorize() (role manager principal requis)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: URL invalide/privee (App\Rules\NotPrivateUrl), events manquants/inconnus, ou liste vide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                error: VALIDATION_ERROR
                message: Les donnees fournies sont invalides.
                errors:
                  url:
                  - L'URL cible ne peut pas pointer vers une adresse privee ou locale.
                  events:
                  - L'evenement selectionne est invalide.
  /webhooks/events:
    get:
      tags:
