                    - twitter
                    - instagram
                    - youtube
                    - tiktok
                    - pinterest
                    - reddit
                    - telegram
                    - gmb
                    - bluesky
                    - threads
                media_paths:
                  type: array
                  items:
                    type: string
                    maxLength: 2000
                scheduled_at:
                  type: string
                  format: date-time
