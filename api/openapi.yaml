  # =============================================
  # ITERATION 33.2 — PAYROLL + BILLING
  # =============================================

  # --- Payroll Runs ---
  /payroll-runs:
    get:
      tags: ["Payroll"]
      summary: "Lister les sessions de paie"
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [draft, calculating, validated, cancelled] }
        - name: per_page
          in: query
          schema: { type: integer, default: 15 }
      responses:
        "200":
          description: "Liste paginee"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PayrollRun"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          $ref: "#/components/responses/Error401"
    post:
      tags: ["Payroll"]
      summary: "Creer une session de paie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [period_month, period_year]
              properties:
                period_month:
                  type: integer
                  minimum: 1
                  maximum: 12
                period_year:
                  type: integer
                label:
                  type: string
                  nullable: true
      responses:
        "201":
          description: "Session creee"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PayrollRun"
        "401":
          $ref: "#/components/responses/Error401"
        "422":
          $ref: "#/components/responses/Validation422"

  /payroll-runs/{payrollRun}:
    get:
      tags: ["Payroll"]
      summary: "Voir une session de paie"
      parameters:
        - name: payrollRun
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: "Detail session avec bulletins"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PayrollRun"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"

  /payroll-runs/{payrollRun}/calculate:
    post:
      tags: ["Payroll"]
      summary: "Calculer la paie"
      parameters:
        - name: payrollRun
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: "Calcul lance"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PayrollRun"
        "401":
          $ref: "#/components/responses/Error401"
        "422":
          description: "Session must be in draft status"

  /payroll-runs/{payrollRun}/validate:
    post:
      tags: ["Payroll"]
      summary: "Valider la session de paie"
      parameters:
        - name: payrollRun
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: "Session validee"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PayrollRun"
        "401":
          $ref: "#/components/responses/Error401"
        "422":
          description: "Only calculated runs can be validated"

  /payroll-runs/{payrollRun}/cancel:
    post:
      tags: ["Payroll"]
      summary: "Annuler une session de paie"
      parameters:
        - name: payrollRun
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: "Session annulee"
        "401":
          $ref: "#/components/responses/Error401"
        "422":
          description: "Validated runs cannot be cancelled"

