  /accounting/bank-statement-lines/{line}/match:
    post:
      tags: ["Accounting"]
      summary: "Rapprochement manuel d'une ligne"
      description: "Matche une ligne pending avec un paiement recorded explicite (lettrage). 409 si déjà rapproché. RBAC comptable/principal. Issue #5435."
      security:
        - BearerAuth: []
      parameters:
        - name: line
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_id]
              properties:
                payment_id: { type: integer }
      responses:
        "200":
          description: "Ligne rapprochée"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      line_id: { type: string }
                      status: { type: string, enum: [pending, matched] }
                      matched_payment_id: { type: string, nullable: true }
                      confidence: { type: integer, nullable: true }
                      payment_status: { type: string }
                      reconciled_at: { type: string, format: date-time, nullable: true }
        "404":
          description: "Ligne ou paiement introuvable (ou autre tenant)"
          $ref: "#/components/responses/Error404"
        "409":
          description: "Ligne ou paiement déjà rapproché (BANK_STATEMENT_LINE_ALREADY_MATCHED)"
          $ref: "#/components/responses/Error409"

  /accounting/bank-statements/{statement}/status:
    get:
      tags: ["Accounting"]
      summary: "État de rapprochement"
      description: "Soldes attendus/réels, lignes rapprochées/en attente, écart de clôture. RBAC comptable/principal. Issue #5435."
      security:
        - BearerAuth: []
      parameters:
        - name: statement
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "État de rapprochement"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      statement_id: { type: string }
                      statement_period: { type: string }
                      status: { type: string, enum: [imported, reconciling, reconciled] }
                      opening_balance: { type: number, nullable: true }
                      closing_balance_expected: { type: number, nullable: true }
                      closing_balance_reported: { type: number, nullable: true }
                      closing_gap: { type: number, nullable: true }
                      total_lines: { type: integer }
                      matched_lines: { type: integer }
                      pending_lines: { type: integer }
                      matched_amount: { type: number }
                      pending_amount: { type: number }
        "404":
          description: "Relevé introuvable (ou autre tenant)"
          $ref: "#/components/responses/Error404"

  /accounting/bank-statements/{statement}/export:
    get:
      tags:
      - Accounting
      summary: Export CSV de l'état de rapprochement bancaire
      description: "Lignes du relevé (statut, paiement rapproché, confiance) + totaux et écart de clôture. Format expert-comptable (UTF-8 BOM, ';', anti-injection #4169). RBAC principal/comptable."
      parameters:
      - name: statement
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Fichier CSV
          content:
