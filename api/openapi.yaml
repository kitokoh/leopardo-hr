      description: 'Balance de vérification par période : totaux débits/crédits par compte, totaux généraux et indicateur d''équilibre. RBAC comptable/principal. Issue #5422.'
      parameters:
      - name: period
        in: query
        required: true
        description: Période comptable (AAAA-MM).
        schema:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
      responses:
        '200':
          description: Balance de vérification
          content:
            application/json:
              schema:
                type: object
