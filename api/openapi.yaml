      summary: Lister les types d'evenements webhook disponibles
      description: 'Catalogue statique des evenements pouvant etre souscrits via `events[]` sur `POST /webhooks` et

        `PUT /webhooks/{webhook}` (voir `WebhookController::AVAILABLE_EVENTS`). Aucune restriction de

        role au-dela de l''authentification.

