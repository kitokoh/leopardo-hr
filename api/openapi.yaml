      responses:
        '200':
          description: Liste des fournisseurs (saml, oidc)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: string
  /sso/saml/{companyId}/callback:
    post:
      tags:
      - Platform
      summary: Callback SAML 2.0 (IdP -> SP)
      description: Endpoint public recevant l'assertion SAML de l'IdP. Stub — validation complete a implementer.
      security: []
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                SAMLResponse:
                  type: string
      responses:
        '200':
          description: Assertion recue
        '400':
          description: SAMLResponse manquant
        '422':
          description: Erreur de traitement de l'assertion
        '501':
          description: 'Validation des assertions SAML non implementee (audit #1694) — refus explicite'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /sso/oidc/{companyId}/authorize:
    get:
      tags:
      - Platform
      summary: Demarrer le flux OpenID Connect (SP -> IdP)
      description: 'Endpoint public : genere state+nonce et retourne l''URL d''autorisation de l''IdP a ouvrir par le navigateur (issue #2231).'
      security: []
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: URL d'autorisation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      authorize_url:
                        type: string
        '422':
          description: OIDC non configure ou incomplet
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /sso/oidc/{companyId}/callback:
    get:
      tags:
      - Platform
      summary: Callback OpenID Connect (IdP -> SP)
      description: 'Endpoint public recevant le code/id_token OIDC : verifie le state, echange le code contre les tokens, valide l''id_token (signature JWKS + iss/aud/exp/nonce) et emet un token Sanctum pour l''employe identifie (issue #2231).'
      security: []
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: code
        in: query
        schema:
          type: string
      - name: state
        in: query
        schema:
          type: string
      - name: id_token
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Connexion reussie — token Sanctum + employe
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      token_type:
                        type: string
                      token_expires_at:
                        type: string
                        format: date-time
                        nullable: true
                      employee:
                        type: object
                        properties:
                          id:
                            type: integer
                          first_name:
                            type: string
                          last_name:
                            type: string
                          email:
                            type: string
                          role:
                            type: string
                          manager_role:
                            type: string
                            nullable: true
        '400':
          description: Code ou id_token manquant
        '422':
          description: Erreur d'echange de token
        '501':
          description: 'Validation OIDC non implementee (audit #1694) — refus explicite'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /sso/status:
