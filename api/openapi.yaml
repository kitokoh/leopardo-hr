    post:
      tags:
      - Payroll Engine
      summary: Simuler les cotisations sociales employe/employeur et l'impot sur le revenu pour un salaire brut donne, sans persister (manager)
      description: 'Delegue au moteur de paie (CountryRulesInterface via PayrollCalculator, issue #1782). Issue #1869 : la simulation et le bulletin passent par le meme noyau de calcul (computeNetBreakdown) — resultats identiques pour un meme brut ; reponse complete et explicable : cotisations + assiette + impot + taxe de minimum fiscal + net + cout employeur, avec pays, devise, identifiant des regles et politique d''arrondi (docs/payroll/CALCULATION_CONTRACT.md).'
      operationId: simulateCotisations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - country_code
              - gross_salary
              properties:
                country_code:
                  type: string
                  enum:
                  - DZ
                  - MA
                  - FR
                  - TN
                  - TR
                  - SN
                  - CM
                  - CF
                  - TD
                  - CG
                  - GA
                  - GQ
                  - CI
                  - ML
                  - BF
                  - BJ
                  - TG
                  - NE
                  - CA
                gross_salary:
                  type: number
                  minimum: 0
                acknowledge_placeholder:
                  type: boolean
                  description: 'Confirmation explicite requise pour les pays en règle placeholder (issue #1872)'
      responses:
        '200':
          description: 'Simulation des cotisations et net estime (contrat complet issue #1869)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      correlation_id:
