              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
  /accounting/bank-statements/{statement}/reconcile:
    post:
      tags: ["Accounting"]
      summary: "Lancer le rapprochement automatique"
      description: "Matching heuristique lignes relevé ↔ paiements recorded (montant ± tolérance, date ± N jours, référence). Score 100 → auto ; sinon proposition en file manuelle. RBAC comptable/principal. Issue #5435."
      security:
        - BearerAuth: []
      parameters:
        - name: statement
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "Résultat du matching (auto_matched, proposed, pending + état)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      auto_matched: { type: integer }
                      proposed: { type: integer }
                      pending: { type: integer }
                      matched_lines: { type: integer }
                      pending_lines: { type: integer }
                      closing_gap: { type: number, nullable: true }
