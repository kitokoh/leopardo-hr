                  data:
                    type: array
                    items:
                      type: string
              example:
                data:
                - employee.created
                - employee.updated
                - employee.archived
                - attendance.checked_in
                - attendance.checked_out
                - absence.requested
                - absence.approved
                - absence.rejected
                - contract.created
                - contract.activated
                - contract.terminated
                - payroll.validated
                - loan.approved
                - loan.disbursed
                - expense.submitted
                - expense.approved
        '401':
          $ref: '#/components/responses/Error401'
  /webhooks/{webhookEndpoint}:
    get:
      tags:
      - Webhooks
      summary: Voir un webhook et ses dernieres livraisons
      description: 'Retourne le webhook (incluant ses 20 dernieres livraisons, triees par `delivered_at` descendant).

        Necessite le role manager `principal`. Renvoie 404 (pas 403) si le webhook appartient a une autre

        entreprise, pour ne pas confirmer l''existence de l''id a un tenant non autorise.

        '
      security:
      - BearerAuth: []
      parameters:
      - name: webhookEndpoint
        in: path
        required: true
        description: Identifiant numerique du webhook (route model binding sur `webhookEndpoint`)
        schema:
          type: integer
      responses:
        '200':
          description: Detail du webhook avec ses livraisons recentes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                    - $ref: '#/components/schemas/WebhookEndpoint'
                    - type: object
                      properties:
                        deliveries:
                          type: array
                          items:
                            $ref: '#/components/schemas/WebhookDelivery'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          description: Manager sans role principal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Webhook inexistant ou appartenant a une autre entreprise (isolation tenant)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: RESOURCE_NOT_FOUND
                message: Ressource introuvable.
    put:
      tags:
      - Webhooks
      summary: Modifier un webhook
      description: 'Met a jour l''URL, les evenements souscrits et/ou l''etat actif du webhook. Passer `active: true`

        remet `failure_count` a zero (relance manuelle apres desactivation automatique par depassement de

        seuil d''echecs). Le champ `secret` n''est jamais modifiable via cet endpoint. Renvoie 404 si le

        webhook appartient a une autre entreprise.

        '
      security:
      - BearerAuth: []
      parameters:
      - name: webhookEndpoint
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEndpointUpdateRequest'
            example:
              active: false
      responses:
        '200':
          description: Webhook modifie
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WebhookEndpoint'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Validation422'
    delete:
      tags:
      - Webhooks
      summary: Supprimer un webhook
      description: Suppression definitive. Necessite le role manager `principal`. Renvoie 404 si le webhook appartient a une autre entreprise.
      security:
      - BearerAuth: []
      parameters:
      - name: webhookEndpoint
        in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Webhook supprime (reponse sans contenu)
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          description: Manager sans role principal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/Error404'
  /webhooks/{webhookEndpoint}/dead-letters:
    get:
      tags:
      - Webhooks
      summary: Lister les livraisons webhook dead-letter (retries epuises)
      description: 'Livraisons ayant epuise toutes les tentatives de retry (voir `DispatchWebhook::failed()` /

        `DispatchWebhook::$tries = 3`). Permet a un manager principal d''inspecter et de rejouer une

        livraison sans acces shell/DB. Necessite le role manager `principal`. PA2-API-006.

        '
      security:
