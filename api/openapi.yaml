        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          default: 20
      responses:
        '200':
          description: Liste paginee des livraisons dead-letter
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookDelivery'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          description: Manager sans role principal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Webhook inexistant ou appartenant a une autre entreprise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /webhooks/{webhookEndpoint}/dead-letters/{delivery}/replay:
    post:
      tags:
      - Webhooks
      summary: Rejouer une livraison webhook dead-letter
      description: 'Redispatch le meme evenement/payload sans re-executer l''action metier d''origine (pas de doublon

        fonctionnel cote plateforme). Reactive le webhook et remet `failure_count` a zero, pour eviter un

        redeclenchement immediat du seuil d''auto-desactivation. Necessite le role manager `principal`.

        Renvoie 404 si `delivery` n''appartient pas a `webhook` ou n''est pas dead-lettered

        (`dead_lettered_at` null).

        '
      security:
      - BearerAuth: []
      parameters:
      - name: webhookEndpoint
        in: path
        required: true
        schema:
          type: integer
      - name: delivery
        in: path
        required: true
        schema:
          type: integer
      responses:
        '202':
          description: Livraison re-mise en file
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: Webhook delivery re-queued.
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          description: Manager sans role principal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Webhook/livraison introuvable, appartenant a une autre entreprise, ou livraison non dead-letter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
