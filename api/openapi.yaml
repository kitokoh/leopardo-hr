                  type: string
                  nullable: true
                issuer:
                  type: string
                  format: uri
                  nullable: true
                authorize_url:
                  type: string
                  format: uri
                  nullable: true
                token_url:
                  type: string
                  format: uri
                  nullable: true
                jwks_uri:
                  type: string
                  format: uri
                  nullable: true
                redirect_uri:
                  type: string
                  format: uri
