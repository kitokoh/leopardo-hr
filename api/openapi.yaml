  headers:
    XRequestId:
      description: Identifiant de correlation a fournir au support en cas d'incident.
      schema:
        type: string
    RetryAfter:
      description: Delai conseille avant retry lorsqu'une limite de debit est atteinte.
      schema:
        type: integer
  responses:
    Error401:
      description: Non authentifie
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error403:
      description: Action interdite
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error404:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error429:
      description: Limite de debit atteinte
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error422:
      description: Erreur de validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'

    Error409:
      description: Conflit — état déjà traité (idempotence)
      content:
        application/json:
          schema:
            type: object
            required: [error, message]
            properties:
              error: { type: string }
              message: { type: string }
    Validation422:
      description: Erreur de validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
