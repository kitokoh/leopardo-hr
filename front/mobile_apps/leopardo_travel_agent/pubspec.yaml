name: leopardo_travel_agent
description: "Leopardo RH — app mobile agent/vendeur TravelAgency : vente guichet, encaissement cash, check-in QR, manifeste et PDV (TRAVEL-701/#6088 + TRAVEL-810/#6100)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.9
  flutter_riverpod: ^3.4.2
  go_router: ^18.0.0
  dio: ^5.11.0
  flutter_secure_storage: ^11.0.0
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  leopardo_core:
    path: ../leopardo_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
