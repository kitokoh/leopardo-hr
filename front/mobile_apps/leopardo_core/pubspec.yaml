name: leopardo_core
description: Shared mobile foundation for Leopardo employee and manager apps.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.1
  google_sign_in: ^7.2.0
  flutter_animate: ^4.5.2
  dio: ^5.4.3+1
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.2
  local_auth: ^3.0.2
  shimmer: ^4.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^7.3.0
  image_picker: ^1.2.4
  path_provider: ^2.1.3
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^23.0.0
  geolocator: ^14.1.2
  json_annotation: ^4.11.0
  qr_flutter: ^4.1.0
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path: ^1.9.0
  sentry_flutter: ^10.3.0
  uuid: ^4.5.1
  url_launcher: ^6.3.3
  # Epingle a 7.4.4 (dernier stable) : 7.5.0 casse le build Kotlin Android
  # (MobileScanner.kt:167 et :243, "Bitmap? but Bitmap was expected") et fait
  # echouer le check "Smoke build leopardo_employee (debug APK)". Voir
  # docs/ci/SMOKE_MOBILE_SCANNER_750.md. A depinner des que le plugin corrige.
  # Pin volontaire : 7.5.0 casse le build Kotlin Android (Smoke build
  # leopardo_employee) — voir 4882250ff et docs/ci/SMOKE_MOBILE_SCANNER_750.md.
  # Le bump automatique 05869af2e l'avait ecrase, ce qui a aussi cree un
  # conflit avec le pin exact "7.4.4" de leopardo_pos_retail (#9430).
  mobile_scanner: 7.4.4
  # Pin volontaire en 1.x (#9432) : la 2.0.0 a change de LICENCE (BSD-3 ->
  # licence proprietaire FlutterBluePlus, licence commerciale payante pour
  # toute organisation a but lucratif) et exige desormais une declaration
  # `license:` sur chaque `connect()`. Le code de ce package a ete ecrit
  # contre l API 1.x (`device.connect(timeout: ...)` sans `license`) : la
  # 2.3.15 hissee par le bump automatique ne COMPILAIT pas (missing argument
  # `license`). Repasser en 2.x suppose une decision proprietaire sur la
  # licence, pas un simple bump de dependance. 1.36.8 = derniere version
  # BSD-3.
  flutter_blue_plus: ^1.36.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.17.1
  json_serializable: ^6.14.1

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/mock/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
        - asset: assets/fonts/Inter-Italic-Variable.ttf
          style: italic
