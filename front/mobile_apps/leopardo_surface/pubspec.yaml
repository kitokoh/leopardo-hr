name: leopardo_surface
description: "Leopardo Surface — moteur commun des applications mobiles grand public (une app par verticale)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

# ## Pourquoi ce package existe
#
# Avant, `leopardo_public` portait à la fois le MOTEUR (découverte, fiches,
# parcours transactionnels, identités de verticale, catalogue de chaînes) et
# l'ASSEMBLAGE (coque à 4 onglets, routeur, `main.dart`). Une seule app servait
# les huit verticales : le restaurant, la pharmacie et l'emploi partageaient la
# même icône, le même nom et la même expérience.
#
# La mission « une app par verticale » ne peut pas se faire en copiant
# `leopardo_public` huit fois : huit copies d'un moteur de 6 800 lignes
# divergent au premier correctif, et le dépôt a déjà payé ce prix
# (`check-mobile-duplicated-drift.sh`, #7091). Le moteur est donc extrait ICI,
# une seule fois, et chaque app de verticale n'est qu'un ASSEMBLAGE mince :
# son identité, son routeur, son `main.dart`.
#
# ## Ce que ce package ne contient PAS
#
# Aucun `main.dart`, aucune coque d'onglets, aucun routeur : ce sont
# précisément les trois choses qui doivent différer d'une verticale à l'autre.
# Un `main.dart` ici obligerait chaque app à en hériter, et l'expérience
# « dédiée » redeviendrait une expérience partagée.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # #9433 : Flutter 3.50 déprécie package:flutter/material.dart au profit
  # du package standalone material_ui (versioning indépendant, pub.dev).
  material_ui: ^1.0.0
  # #9433 : GlobalCupertinoLocalizations de flutter_localizations est
  # deprecie depuis v3.47.0-0.0.pre ; le delegate vient de cupertino_ui.
  cupertino_ui: ^1.0.2

  cupertino_icons: ^1.0.9
  flutter_riverpod: ^3.4.2
  go_router: ^18.0.1
  dio: ^5.11.0
  # Cible web grand public : `setPathUrlStrategy` remplace les `#/` de
  # Flutter web par de vraies URL (`/restaurants/{slug}`), seules indexables
  # et partageables. Paquet officiel Flutter, no-op hors web.
  url_strategy: ^0.3.0
  # Le jeton de session public ne vit QUE dans le Keystore/Keychain
  # (flutter_secure_storage) — jamais dans une préférence en clair.
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.2
  shimmer: ^4.0.0
  connectivity_plus: ^7.3.1
  geolocator: ^14.1.2
  url_launcher: ^6.3.3
  leopardo_core:
    path: ../leopardo_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  xml: ^7.0.1
  uuid: ^4.6.0
