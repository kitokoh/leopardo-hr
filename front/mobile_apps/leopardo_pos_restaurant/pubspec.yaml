name: leopardo_pos_restaurant
description: "Leopardo POS Restaurant — application tablette de caisse (offline-first) pour le restaurateur et le serveur."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^2.0.0
  flutter_riverpod: ^3.4.2
  go_router: ^18.1.2
  dio: ^5.11.0
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^7.3.1
  path_provider: ^2.1.3
  uuid: ^4.5.1
  leopardo_core:
    path: ../leopardo_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
