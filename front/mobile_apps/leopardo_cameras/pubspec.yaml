name: leopardo_cameras
description: "Leopardo RH — app mobile « Leopardo Caméras » (BC-19 DEVICE, #7426) : mur des caméras du tenant, visionnage direct via stream-token, événements et alertes (#7427)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.9
  flutter_riverpod: ^3.4.2
  go_router: ^18.0.1
  dio: ^5.11.0
  flutter_secure_storage: ^11.0.0
  intl: ^0.20.2
  leopardo_core:
    path: ../leopardo_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
