name: leopardo_manager
description: "Leopardo RH manager and HR mobile app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.9
  flutter_riverpod: ^3.4.2
  go_router: ^17.2.3
  dio: ^5.11.0
  flutter_secure_storage: ^10.1.0
  intl: ^0.20.2
  shimmer: ^3.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^7.3.1
  path_provider: ^2.1.3
  image_picker: ^1.2.3
  local_auth: ^3.0.2
  json_annotation: ^4.11.0
  url_launcher: ^6.3.1
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^18.0.0
  sentry_flutter: ^8.9.0
  graphview: ^1.2.1
  leopardo_core:
    path: ../leopardo_core

  flutter_animate: ^4.5.2
  google_sign_in: ^7.2.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  build_runner: ^2.15.1
  json_serializable: ^6.14.1

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/mock/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
        - asset: assets/fonts/Inter-Italic-Variable.ttf
          style: italic
