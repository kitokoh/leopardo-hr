name: leopardo_public
description: "Leopardo Public — application grand public (couloir 16) : trouver près de toi, parler au commerçant, retrouver tout."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

# Application VOLONTAIREMENT minimale : c'est un CANAL public, pas une
# verticale. Aucune dépendance métier (pas de geofencing, pas de paie, pas de
# caméras) n'entre ici — le couloir 16 n'a aucune règle métier propre.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # #9433 : Flutter 3.50 déprécie package:flutter/material.dart au profit
  # du package standalone material_ui (versioning indépendant, pub.dev).
  material_ui: ^1.0.0
  # #9433 : GlobalCupertinoLocalizations de flutter_localizations est
  # deprecie depuis v3.47.0-0.0.pre ; le delegate vient de cupertino_ui.
  cupertino_ui: ^1.0.2

  cupertino_icons: ^1.0.9
  flutter_riverpod: ^3.4.2
  go_router: ^18.0.1
  dio: ^5.11.0
  # Cible web grand public : `usePathUrlStrategy` remplace les `#/` de
  # Flutter web par de vraies URL (`/restaurants/{slug}`), seules indexables
  # et partageables. Paquet officiel Flutter, no-op hors web.
  url_strategy: ^0.3.0
  # Le jeton de session public ne vit QUE dans le Keystore/Keychain
  # (flutter_secure_storage) — jamais dans une préférence en clair.
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.2
  shimmer: ^4.0.0
  connectivity_plus: ^7.3.1
  geolocator: ^14.1.2
  url_launcher: ^6.3.3
  leopardo_core:
    path: ../leopardo_core
  # Le MOTEUR commun des apps grand public (découverte, fiches, parcours des
  # huit verticales, identités de vitrine). Extrait de cette app pour que les
  # huit applications dédiées le partagent au lieu d'en copier 6 800 lignes.
  leopardo_surface:
    path: ../leopardo_surface

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  xml: ^7.0.1
  uuid: ^4.6.0
