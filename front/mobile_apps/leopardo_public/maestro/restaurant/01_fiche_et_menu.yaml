# Parcours 1/3 — fiche restaurant, menu, recherche, filtre catégorie.
#
# ## Pourquoi ce flow ouvre par un LIEN PROFOND et pas par l'accueil
#
# Le client arrive sur cette fiche par un QR code collé sur la table ou par un
# lien partagé sur WhatsApp — jamais en tapant « Accueil → catégorie →
# restaurant ». Ouvrir par `openLink` reproduit donc le vrai point d'entrée, et
# vérifie du même coup que le deep link déclaré dans AndroidManifest.xml
# (`leopardo://public/<route>`) mène réellement à la fiche.
#
# Les variables viennent de l'ENVIRONNEMENT, jamais du flow : Makefile et CI
# passent RESTO_SLUG. Une valeur codée en dur casse dès que la base de
# démonstration change.
appId: com.leopardo.publicapp
name: Restaurant — fiche et menu
tags:
  - restaurant
  - smoke
---
- launchApp:
    clearState: true

# Deep link : `leopardo://public/restaurants/<slug>` → GoRouter `/restaurants/:slug`.
- openLink: leopardo://public/restaurants/${RESTO_SLUG}

# ── La fiche est chargée ────────────────────────────────────────────────
# Le champ de recherche n'existe que dans la vue « menu », donc sa présence
# prouve que le profil a été chargé ET que le menu est publié. Un
# `assertVisible` sur le nom de l'établissement serait plus fragile : le nom
# vient du serveur.
- extendedWaitUntil:
    visible:
      id: restaurant-menu-search
    timeout: 30000

# ── Recherche dans la carte ─────────────────────────────────────────────
- tapOn:
    id: restaurant-menu-search
# `inputText` tape la chaîne littérale : Maestro ne résout pas `${}` ici.
- inputText: poulet
- assertVisible:
    id: restaurant-menu-search

# Effacer la recherche : `eraseText` est déterministe et ne dépend d'aucun
# libellé (le bouton « croix » n'a pas de clé, c'est une icône standard).
- eraseText: 20

# ── Filtre par catégorie ────────────────────────────────────────────────
# « Tout » est toujours présent : c'est la seule puce dont l'existence ne
# dépend pas du contenu serveur.
- assertVisible:
    id: restaurant-category-all
- tapOn:
    id: restaurant-category-all

# ── Le menu est revenu complet ──────────────────────────────────────────
- assertVisible:
    id: restaurant-menu-search
