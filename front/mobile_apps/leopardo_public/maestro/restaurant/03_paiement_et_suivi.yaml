# Parcours 3/3 — paiement de la commande et suivi du statut.
#
# ## Pourquoi le paiement est testé séparément de la commande
#
# Ce sont deux contrats serveur distincts (`POST …/orders` puis
# `POST …/orders/{ref}/pay`) et deux clés d'idempotence distinctes. Un flow qui
# les enchaîne sans frontière ne dit pas lequel des deux a échoué quand il
# casse. Ici un échec de ce fichier désigne le paiement ou le suivi, jamais la
# création.
appId: com.leopardo.publicapp
name: Restaurant — paiement et suivi
tags:
  - restaurant
---
- launchApp:
    clearState: true

- openLink: leopardo://public/restaurants/${RESTO_SLUG}

- extendedWaitUntil:
    visible:
      id: restaurant-menu-search
    timeout: 30000

# ── Commande minimale pour atteindre l'écran de confirmation ────────────
- tapOn:
    id: restaurant-product-add-${RESTO_PRODUCT_CODE}
- extendedWaitUntil:
    visible:
      id: restaurant-go-to-cart
    timeout: 15000
- tapOn:
    id: restaurant-go-to-cart

- extendedWaitUntil:
    visible:
      id: restaurant-customer-name
    timeout: 15000
- tapOn:
    id: restaurant-customer-name
- inputText: Client Test
- tapOn:
    id: restaurant-customer-phone
- inputText: "0612345678"
- hideKeyboard

- scrollUntilVisible:
    element:
      id: restaurant-submit-order
    direction: DOWN
    timeout: 15000
- tapOn:
    id: restaurant-submit-order

- extendedWaitUntil:
    visible:
      id: restaurant-confirmation
    timeout: 45000

# ── Paiement ────────────────────────────────────────────────────────────
# Le mode par défaut est « espèces à la livraison » : il ne demande aucune
# coordonnée supplémentaire, donc il est le seul testable sans dépendre d'un
# opérateur mobile money réel.
- scrollUntilVisible:
    element:
      id: restaurant-pay-action
    direction: DOWN
    timeout: 20000

- tapOn:
    id: restaurant-pay-action

# ── Suivi ───────────────────────────────────────────────────────────────
# Le suivi automatique démarre après paiement ; le bouton manuel reste
# disponible. On vérifie le bloc de statut, pas son contenu : le statut
# dépend de l'état réel de la commande côté serveur.
- scrollUntilVisible:
    element:
      id: restaurant-track
    direction: DOWN
    timeout: 20000

- tapOn:
    id: restaurant-track

- extendedWaitUntil:
    visible:
      id: restaurant-tracking-status
    timeout: 30000
