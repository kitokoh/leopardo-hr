# Leopardo Edge UI — nginx statique (PWA exportée, offline-first).
# Écoute sur 3000 (proxy Caddy edge-proxy → edge-ui:3000).
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Cache immuable pour les assets hachés
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
