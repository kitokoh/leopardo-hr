# #6595 : le service edge-ui du compose Edge expose le port 3000
# (7879:3000). Serveur statique pour l'export Next.js (out/).
server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Export statique avec trailingSlash — tout chemin retombe sur index.html.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Cache immuable pour les assets fingerprintés (Next).
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
