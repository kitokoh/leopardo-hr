<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="badCardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(239, 68, 68, 0.08)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.8)"/>
    </linearGradient>
    <linearGradient id="goodCardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.12)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70" result="blur" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad2)"/>
  <circle cx="250" cy="300" r="160" fill="#ef4444" opacity="0.1" filter="url(#glow2)"/>
  <circle cx="950" cy="300" r="200" fill="#10b981" opacity="0.16" filter="url(#glow2)"/>

  <!-- Titre Header -->
  <g transform="translate(80, 60)">
    <rect x="0" y="0" width="180" height="28" rx="14" fill="rgba(251, 191, 36, 0.15)" stroke="#fbbf24" stroke-width="1"/>
    <text x="90" y="19" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="1.5">ÉTUDE COMPARATIVE</text>
    <text x="0" y="65" font-family="Inter, sans-serif" font-size="28" font-weight="800" fill="#f8fafc">Tableur Manuel vs Moteur de Paie Automatisé</text>
    <text x="0" y="92" font-family="Inter, sans-serif" font-size="15" font-weight="500" fill="#94a3b8">Analyse des coûts, risques de redressement fiscal et temps opérationnel par collaborateur</text>
  </g>

  <!-- Colonne Gauche : Tableur Excel -->
  <g transform="translate(80, 190)">
    <rect width="490" height="340" rx="20" fill="url(#badCardGrad)" stroke="rgba(239, 68, 68, 0.25)" stroke-width="1.5"/>
    <rect x="30" y="25" width="130" height="26" rx="8" fill="rgba(239, 68, 68, 0.15)"/>
    <text x="95" y="42" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#f87171" text-anchor="middle">TABLEUR MANUEL</text>
    
    <text x="30" y="85" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Gestion Traditionnelle (Excel / Sheets)</text>
    
    <g transform="translate(30, 115)">
      <circle cx="12" cy="12" r="10" fill="rgba(239, 68, 68, 0.2)"/>
      <text x="12" y="17" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#ef4444" text-anchor="middle">✕</text>
      <text x="35" y="17" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">Temps moyen : <tspan font-weight="700" fill="#f87171">4 à 6 heures</tspan> par clôture de paie</text>
    </g>

    <g transform="translate(30, 160)">
      <circle cx="12" cy="12" r="10" fill="rgba(239, 68, 68, 0.2)"/>
      <text x="12" y="17" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#ef4444" text-anchor="middle">✕</text>
      <text x="35" y="17" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">Risque d'erreur de formule : <tspan font-weight="700" fill="#f87171">18% des bulletins</tspan></text>
    </g>

    <g transform="translate(30, 205)">
      <circle cx="12" cy="12" r="10" fill="rgba(239, 68, 68, 0.2)"/>
      <text x="12" y="17" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#ef4444" text-anchor="middle">✕</text>
      <text x="35" y="17" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">Mise à jour des barèmes fiscaux : <tspan font-weight="700" fill="#f87171">100% Manuelle</tspan></text>
    </g>

    <g transform="translate(30, 250)">
      <circle cx="12" cy="12" r="10" fill="rgba(239, 68, 68, 0.2)"/>
      <text x="12" y="17" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#ef4444" text-anchor="middle">✕</text>
      <text x="35" y="17" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">Traçabilité &amp; Audit RGPD : <tspan font-weight="700" fill="#f87171">Inexistante</tspan></text>
    </g>
  </g>

  <!-- Colonne Droite : Moteur Leopardo -->
  <g transform="translate(630, 190)">
    <rect width="490" height="340" rx="20" fill="url(#goodCardGrad)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1.5"/>
    <rect x="30" y="25" width="160" height="26" rx="8" fill="rgba(16, 185, 129, 0.2)"/>
    <text x="110" y="42" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">LEOPARDO PAYROLL</text>
    
    <text x="30" y="85" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Moteur de Paie Cloud Certifié</text>
    
    <g transform="translate(30, 115)">
      <circle cx="12" cy="12" r="10" fill="rgba(16, 185, 129, 0.25)"/>
      <text x="12" y="17" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#10b981" text-anchor="middle">✓</text>
      <text x="35" y="17" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">Temps de calcul : <tspan font-weight="700" fill="#34d399">&lt; 3 minutes</tspan> pour toute l'équipe</text>
    </g>

    <g transform="translate(30, 160)">
      <circle cx="12" cy="12" r="10" fill="rgba(16, 185, 129, 0.25)"/>
      <text x="12" y="17" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#10b981" text-anchor="middle">✓</text>
      <text x="35" y="17" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">Fiabilité mathématique : <tspan font-weight="700" fill="#34d399">100% certifiée</tspan> sans régression</text>
    </g>

    <g transform="translate(30, 205)">
      <circle cx="12" cy="12" r="10" fill="rgba(16, 185, 129, 0.25)"/>
      <text x="12" y="17" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#10b981" text-anchor="middle">✓</text>
      <text x="35" y="17" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">Barèmes multi-pays : <tspan font-weight="700" fill="#34d399">Synchronisation légale automatique</tspan></text>
    </g>

    <g transform="translate(30, 250)">
      <circle cx="12" cy="12" r="10" fill="rgba(16, 185, 129, 0.25)"/>
      <text x="12" y="17" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#10b981" text-anchor="middle">✓</text>
      <text x="35" y="17" font-family="Inter, sans-serif" font-size="14" fill="#cbd5e1">Sécurité bancaire : <tspan font-weight="700" fill="#34d399">Chiffrement AES-256 + Journal d'audit</tspan></text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(80, 570)">
    <text x="0" y="15" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#64748b">ÉCONOMIE MOYENNE CONSTATÉE : 18 HEURES / MOIS / 50 SALARIÉS</text>
    <text x="1040" y="15" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#10b981" text-anchor="end">CONFORMITÉ LÉGALE GARANTIE</text>
  </g>
</svg>
