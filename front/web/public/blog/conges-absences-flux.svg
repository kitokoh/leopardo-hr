<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="bgGrad4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="stepGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)"/>
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70" result="blur" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad4)"/>
  <circle cx="200" cy="200" r="190" fill="#10b981" opacity="0.12" filter="url(#glow4)"/>
  <circle cx="1000" cy="400" r="210" fill="#38bdf8" opacity="0.14" filter="url(#glow4)"/>

  <!-- Header -->
  <g transform="translate(80, 60)">
    <rect x="0" y="0" width="170" height="28" rx="14" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
    <text x="85" y="19" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">CIRCUIT DE VALIDATION</text>
    <text x="0" y="65" font-family="Inter, sans-serif" font-size="28" font-weight="800" fill="#f8fafc">Workflow Intelligent des Congés &amp; Justificatifs d'Absences</text>
    <text x="0" y="92" font-family="Inter, sans-serif" font-size="15" font-weight="500" fill="#94a3b8">De la soumission mobile du collaborateur jusqu'à l'ajustement automatique du compteur de paie</text>
  </g>

  <!-- Étapes du circuit -->
  <g transform="translate(80, 195)">
    <!-- Étape 1 -->
    <g transform="translate(0, 0)">
      <rect width="235" height="270" rx="18" fill="url(#stepGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
      <rect x="25" y="25" width="40" height="40" rx="12" fill="rgba(56, 189, 248, 0.2)"/>
      <text x="45" y="50" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#38bdf8" text-anchor="middle">1</text>
      <text x="25" y="100" font-family="Inter, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Demande Collaborateur</text>
      <text x="25" y="125" font-family="Inter, sans-serif" font-size="13" fill="#94a3b8">Espace mobile ou web</text>
      <path d="M 25 145 L 210 145" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="25" y="175" font-family="Inter, sans-serif" font-size="12" fill="#cbd5e1">• Solde en temps réel</text>
      <text x="25" y="200" font-family="Inter, sans-serif" font-size="12" fill="#cbd5e1">• Dépôt de justificatif PDF</text>
      <text x="25" y="225" font-family="Inter, sans-serif" font-size="12" fill="#cbd5e1">• Notification instantanée</text>
    </g>

    <!-- Étape 2 -->
    <g transform="translate(268, 0)">
      <rect width="235" height="270" rx="18" fill="url(#stepGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
      <rect x="25" y="25" width="40" height="40" rx="12" fill="rgba(16, 185, 129, 0.2)"/>
      <text x="45" y="50" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#34d399" text-anchor="middle">2</text>
      <text x="25" y="100" font-family="Inter, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Avis du Manager</text>
      <text x="25" y="125" font-family="Inter, sans-serif" font-size="13" fill="#94a3b8">Vue d'équipe partagée</text>
      <path d="M 25 145 L 210 145" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="25" y="175" font-family="Inter, sans-serif" font-size="12" fill="#cbd5e1">• Planning d'équipe direct</text>
      <text x="25" y="200" font-family="Inter, sans-serif" font-size="12" fill="#cbd5e1">• Alertes sous-effectif</text>
      <text x="25" y="225" font-family="Inter, sans-serif" font-size="12" fill="#cbd5e1">• Approbation en 1-clic</text>
    </g>

    <!-- Étape 3 -->
    <g transform="translate(536, 0)">
      <rect width="235" height="270" rx="18" fill="url(#stepGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
      <rect x="25" y="25" width="40" height="40" rx="12" fill="rgba(251, 191, 36, 0.2)"/>
      <text x="45" y="50" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#fbbf24" text-anchor="middle">3</text>
      <text x="25" y="100" font-family="Inter, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Contrôle RH</text>
      <text x="25" y="125" font-family="Inter, sans-serif" font-size="13" fill="#94a3b8">Conformité légale</text>
      <path d="M 25 145 L 210 145" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="25" y="175" font-family="Inter, sans-serif" font-size="12" fill="#cbd5e1">• Validation conventionnelle</text>
      <text x="25" y="200" font-family="Inter, sans-serif" font-size="12" fill="#cbd5e1">• Gestion arrêts maladie</text>
      <text x="25" y="225" font-family="Inter, sans-serif" font-size="12" fill="#cbd5e1">• Maintien ou retenue salaire</text>
    </g>

    <!-- Étape 4 -->
    <g transform="translate(804, 0)">
      <rect width="235" height="270" rx="18" fill="url(#stepGrad)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1.5"/>
      <rect x="25" y="25" width="40" height="40" rx="12" fill="rgba(16, 185, 129, 0.25)"/>
      <text x="45" y="50" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#10b981" text-anchor="middle">4</text>
      <text x="25" y="100" font-family="Inter, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Calcul Clôture Paie</text>
      <text x="25" y="125" font-family="Inter, sans-serif" font-size="13" fill="#34d399">Impact automatique</text>
      <path d="M 25 145 L 210 145" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="25" y="175" font-family="Inter, sans-serif" font-size="12" fill="#cbd5e1">• Décompte des congés acquis</text>
      <text x="25" y="200" font-family="Inter, sans-serif" font-size="12" fill="#cbd5e1">• Lignes d'indemnité sur bulletin</text>
      <text x="25" y="225" font-family="Inter, sans-serif" font-size="12" fill="#cbd5e1">• Zéro ressaisie comptable</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(80, 565)">
    <text x="0" y="15" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#64748b">SYNCHRONISATION RH &amp; PAIE 100% TRANSPARENTE</text>
    <text x="1040" y="15" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="end">RÉPONSE MOYENNE : &lt; 4 HEURES</text>
  </g>
</svg>
