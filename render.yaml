  # dé-commenter tel quel dès qu'un moyen de paiement est ajouté au workspace,
  # puis passer WEB_QUEUE_DRAIN=false et WEB_SCHEDULER_LOOP=false sur le web.
  # NB : ce worker fusionné (queue:work + schedule:work) est LA topologie cible
  # commune dev/prod — l'ancien service séparé « leopardo-scheduler » a été
  # retiré (doublon du schedule:work déjà porté ici, drift dev/prod #7845).
