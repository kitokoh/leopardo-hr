# render.yaml — Leopardo RH infrastructure on Render
# https://render.com/docs/infrastructure-as-code
#
# ⚠️ RÔLE DE CE BLUEPRINT (chantier CI/CD dev/prod) :
# Tier CONTINU dev/test. Ce fichier décrit l'**état provisionné** du
# workspace Render dev (« africanovatech ») — services actifs uniquement.
# L'état CIBLE non provisionné (workers, bloqué billing) est conservé en
# blocs COMMENTÉS plus bas : ce blueprint n'est PAS une « source de vérité
# déclarative » d'un état qui n'existe pas (audit #7845, IaC non fiable).
#
# ⚠️ #7845 — Services DÉCLARÉS (actifs) vs RÉELS (API Render, 2026-09-20) :
#   | Service                | Blueprint        | Réel (workspace dev)     |
#   |------------------------|------------------|--------------------------|
#   | gestionemployerbackend | web, free        | ✅ gestionemployerBackend |
#   |                        |                  |    (web, free, frankfurt) |
#   | leopardo-queue-worker  | commenté (cible) | ❌ absent — 402 billing   |
#   | leopardo-scheduler     | supprimé #7845   | ❌ absent (redondant)     |
#   | Key Value « leopardoai » | hors blueprint | ✅ redis free, frankfurt  |
# Bloquant unique pour la cible : moyen de paiement absent du workspace
# (Background Workers inéligibles au tier gratuit, #7649). En intérim, la
# queue ET le scheduler tournent dans le conteneur web (docker-entrypoint.sh,
# gates WEB_QUEUE_DRAIN / WEB_SCHEDULER_LOOP, défaut on) — perdus à chaque
# spin-down free-tier. Détail : docs/infra/RENDER_TOPOLOGIE_REELLE.md.
#
# Les déploiements réels sont pilotés par les workflows
# GitHub Actions (deploy-main.yml via RENDER_DEPLOY_HOOK_URL, gate tests +
# filtre api/**) — il n'y a PAS de sync automatique du blueprint à chaque
# push. Toute sync manuelle (dashboard Render → « New + » / Blueprint) doit
# être faite avec prudence : Render mappe les services par `name:` ; un
# renommage recrée un service au lieu de le renommer (doublon/orphelin).
# Les noms de service physiques ci-dessous sont donc laissés inchangés
# intentionnellement (dette de nommage historique — le « vrai »
# environnement de production, promu uniquement sur tag git validé vX.Y.Z,
# vit dans render.prod.yaml + deploy-prod.yml ; voir
# docs/ops/RENDER_DEV_PROD_TOPOLOGY.md).
# ⚠️ Issue #7648 (audit 2026-09-19) : la dette APP_ENV=production sur le
# tier dev est SOLDÉE — le tier dev tourne désormais en APP_ENV=staging +
# DEPLOY_TIER=dev (identité de tier #7647). Plan de migration, deltas de
# comportement et risques : docs/ops/RENDER_DEV_PROD_TOPOLOGY.md,
# section « #7648 ». Les verrous démo (DISABLE_DEMO_SEEDING,
# DEMO_MODE_ENABLED=false, DEMO_PASSWORD non posée — #7696) restent les
# gardes effectives du seeding sous staging : ne pas les retirer sans
# relire cette section.
#
# ⚠️ ALIGNEMENT SUR LA RÉALITÉ (vérifié dashboard 2026-09-04, re-vérifié
# healthchecks publics 2026-09-05 — PR #6831) :
#   - La base de données réelle du dev est **Neon Postgres** (projet
#     « leopardorh », host *.eu-west-2.aws.neon.tech), branchée via la
#     variable `DB_URL` (sync: false, saisie dans le dashboard Render).
#     L'entrée Postgres Render `leopardo-db` ci-dessous a été SUPPRIMÉE :
#     elle n'a jamais existé dans le workspace (le Postgres Render gratuit
#     expire après 30 jours et a été abandonné après test).
#   - CACHE_STORE / SESSION_DRIVER : valeur déclarée `file`. Au boot, le
#     conteneur exécute `php artisan infra:probe-availability` (décision
#     2026-08-21) qui bascule sur Redis si une instance est joignable
#     (REDIS_URL sync: false), sinon reste sur file — AVANT config:cache.
#   - REDIS_URL / REDIS_PASSWORD : sync: false — l'instance Key Value du
#     workspace s'appelle « leopardoai » (constat 2026-09-04) ; ne pas la
#     laisser recréer par le blueprint (une seule instance gratuite par
#     workspace).
#   - QUEUE_CONNECTION=database partout (#5578) : drain mono-conteneur dans
#     le web service (docker-entrypoint.sh). Le drain de secours GitHub
#     Actions a été supprimé (#7694 — credentials prod en CI) ; supervision
#     par sonde HTTP sans credentials (queue-supervision.yml).
#
# Modèle de confiance proxy (issue #4494) :
# Render est l'unique proxy de bord devant l'API (web service
# gestionemployerbackend). Le middleware trustProxies de l'app ne fait
# confiance qu'aux réseaux privés (loopback + RFC1918 10/8, 172.16/12,
# 192.168/16 + ULA IPv6 fc00::/7) : Render atteint l'app depuis son réseau
# interne, donc X-Forwarded-For y est honoré ; toute connexion directe
# (peer IP publique) voit XFF ignoré → `$request->ip()` = IP réelle du
# client, rate-limits par IP non contournables.
# ⚠️ Si Render migre son réseau interne hors RFC1918, mettre à jour la liste
# dans api/bootstrap/app.php AVANT tout déploiement.

services:
  # ──────────────────────────────────────────────────────────────────────────
  # Web Service — Laravel API (déploiement hook-piloté, jamais autoDeploy)
  # ──────────────────────────────────────────────────────────────────────────
  - type: web
    name: gestionemployerbackend
    runtime: docker
    dockerfilePath: api/Dockerfile.prod
    dockerContext: .
    region: frankfurt
    # #7648 : plan aligné sur la RÉALITÉ (API Render, vérifié 2026-09-19 :
    # le service tourne en free, pas starter — le blueprint mentait).
    # Upgrade = décision billing propriétaire, voir #7649.
    plan: free
    healthCheckPath: /api/v1/health
    # #6700 : autoDeploy:false — le déploiement de l'API est piloté
    # par le workflow deploy-main.yml via RENDER_DEPLOY_HOOK_URL (gate tests +
    # filtre api/**). autoDeploy:true redéployait à CHAQUE push main (même
    # web/mobile/docs only) → gaspillage des build hours gratuits (~500 h/mois).
    autoDeploy: false
    envVars:
      # #7648 : fin de la dette APP_ENV=production sur le tier dev. staging
      # est pris en compte au prochain deploy (config:cache tourne au boot
      # depuis l'env — docker-entrypoint.sh). Deltas de comportement dev
      # recensés dans docs/ops/RENDER_DEV_PROD_TOPOLOGY.md §#7648 (Sentry
      # environment=staging, sweep multi-tenant auth réactivé, fallbacks
      # dev/test Edge/Cameras, driver IA par défaut = fake sans
      # AI_LLM_DRIVER explicite). La sémantique prod (render.prod.yaml,
      # APP_ENV=production) est inchangée.
      - key: APP_ENV
        value: staging
      - key: APP_DEBUG
        value: false
      # Issue #7647 : tier de déploiement explicite, découplé d'APP_ENV.
      # docker-entrypoint.sh est fail-closed dessus :
      # RESET_TEST_DB_ONCE exige DEPLOY_TIER=dev explicite, et
      # FORCE_SUPER_ADMIN_PASSWORD_RESET n'est propagée aux seeders que sur
      # ce tier. Sans sync blueprint, poser aussi la variable dans le
      # dashboard Render du service dev.
      - key: DEPLOY_TIER
        value: dev
      # Issue #7213 : doc API Blade publique sur le tier dev (QA/démos).
      # Verrouillée en prod (render.prod.yaml, Gate viewApiDocs).
      - key: API_DOCS_PUBLIC
        value: "true"
      # Audit #1697 : ne jamais créer les sociétés démo / reset le mot de
      # passe super-admin sur ce service. #7648 : flag CONSERVÉ sous
      # APP_ENV=staging — c'est lui (avec DEMO_MODE_ENABLED=false et
      # DEMO_PASSWORD non posée, #7696) qui verrouille le seeding démo
      # maintenant qu'APP_ENV ne dit plus « production ». Le retirer =
      # décision explicite d'activer la démo sur le tier dev (hors #7648).
      - key: DISABLE_DEMO_SEEDING
        value: "true"
      - key: APP_URL
        fromService:
          name: gestionemployerbackend
          type: web
          property: host
      - key: LOG_CHANNEL
        value: stderr
      # Issue #5586 : LOG_LEVEL=info pour que StructuredLogging (canal
      # `structured`, info) et les breadcrumbs Sentry soient effectifs en prod
      # (error filtrait tout le logging structuré).
      - key: LOG_LEVEL
        value: info
      # Database — Neon Postgres externe (PAS un Postgres Render).
      # Valeur réelle saisie dans le dashboard Render (sync: false) sous forme
      # d'URL unique DB_URL (config/database.php pgsql → env('DB_URL')) ;
      # si la config live du service utilise encore des DB_HOST/PORT/DATABASE/
      # USERNAME/PASSWORD individuels, les remplacer par DB_URL (même schéma
      # que render.prod.yaml). DB_SEARCH_PATH reste requis (multi-tenant).
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: DB_SEARCH_PATH
        value: shared_tenants,public
      # Redis — instance Key Value du workspace (« leopardoai », constat
      # 2026-09-04) branchée dans le dashboard (sync: false). REDIS_CLIENT=
      # predis reste le défaut ; le probe d'entrypoint (infra:probe-
      # availability) choisit redis ou file au boot selon la joignabilité.
      - key: REDIS_CLIENT
        value: predis
      - key: REDIS_URL
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      # App secrets
      # #7967 : generateValue régénérait la clé à chaque re-sync du blueprint
      # (sessions + valeurs chiffrées invalidées). Valeur ÉPINGLÉE dans le
      # dashboard Render le 2026-09-20 (identique à la valeur générée — aucune
      # rotation, aucun impact runtime) ; sync: false la préserve désormais.
      - key: APP_KEY
        sync: false
      # Issue #5578 : la queue est sur database (probe + drain GH #5204/#5205),
      # pas sur Redis (quota Upstash, incident 2026-08-19).
      - key: QUEUE_CONNECTION
        value: database
      # CACHE_STORE/SESSION_DRIVER : `file` par défaut — le probe d'entrypoint
      # bascule sur redis à chaud si REDIS_URL est joignable (cf. en-tête).
      - key: CACHE_STORE
        value: file
      - key: SESSION_DRIVER
        value: file
      # #7980 : cookies de session HTTPS-only — Render sert TOUJOURS l'app en
      # TLS, y compris sur le service dev ; sans ce flag un cookie de session
      # peut transiter en clair au premier hop d'une redirection. Parité avec
      # render.prod.yaml (même finding, même correctif).
      - key: SESSION_SECURE_COOKIE
        value: "true"
      # #7980 : fin du `sslmode => 'prefer'` en dur — TLS OBLIGATOIRE vers la
      # base managée (le défaut applicatif est désormais 'require' hors
      # local/test, cf. config/database.php). Un self-host sans TLS pose
      # explicitement DB_SSLMODE=prefer ou disable.
      - key: DB_SSLMODE
        value: require
      # Issue #5586 : Sentry était inerte en prod (DSN absent → aucun
      # événement). DSN optionnel : renseigner SENTRY_LARAVEL_DSN dans le
      # dashboard Render (secret sync: false) pour activer le report d'erreurs
      # + breadcrumbs (config/sentry.php valide l'URL ; vide = désactivé).
      - key: SENTRY_LARAVEL_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
      # Stripe
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_BUSINESS
        sync: false
      - key: STRIPE_PRICE_ENTERPRISE
        sync: false
      # Chargily
      - key: CHARGILY_API_KEY
        sync: false
      - key: CHARGILY_WEBHOOK_SECRET
        sync: false
      # Google OAuth
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # QA #2277 : doit pointer vers le callback VITRINE (proxy Next) —
      # https://leopardo-rh.com/api/v1/auth/google/callback (à aligner dans la
      # console Google Cloud). Le cookie de session est posé sur la vitrine.
      - key: GOOGLE_REDIRECT_URL
        sync: false
      # Firebase
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      # Mail
      - key: MAIL_MAILER
        value: resend
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      # Transport HTTP Resend (#5139 : le SMTP sortant est bloqué par Render).
      - key: RESEND_KEY
        sync: false
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        value: noreply@hurkonsan.com
      - key: MAIL_FROM_NAME
        value: "Leopardo RH"
      # Demo / ops (issue #2336) : le super-admin et le cockpit admin ne
      # sont utilisables que si ces variables sont renseignées sur Render.
      # SUPER_ADMIN_PASSWORD : mot de passe du compte admin@leopardo-rh.com
      # seedé par SuperAdminSeeder (sinon généré aléatoirement → login
      # impossible). sync: false → à saisir dans le dashboard Render.
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: FORCE_SUPER_ADMIN_PASSWORD_RESET
        value: "true"
      - key: ADMIN_DASHBOARD_URL
        sync: false
      # Opt-in demo (GET /api/v1/demo-users) — staging/demo uniquement.
      - key: DEMO_MODE_ENABLED
        value: "false"
      # Issue #7864 (D2) : FRONTEND_URL n'était déclaré dans aucun blueprint
      # alors que les emails d'activation/reset construisent leurs liens
      # dessus (config/app.php `frontend_url`, fallback codé en dur). Tier
      # dev : le web client live est le déploiement Vercel historique
      # (docs/ops/DEPLOYMENT_URLS.md, DOMAINS.md statut `live`).
      - key: FRONTEND_URL
        value: https://gestionemployer-backend.vercel.app

