# render.yaml — Leopardo RH infrastructure on Render
# https://render.com/docs/infrastructure-as-code
#
# Modèle de confiance proxy (issue #4494) :
# Render est l'unique proxy de bord devant l'API (web service
# gestionemployerbackend). Le middleware trustProxies de l'app ne fait
# confiance qu'aux réseaux privés (loopback + RFC1918 10/8, 172.16/12,
# 192.168/16 + ULA IPv6 fc00::/7) : Render atteint l'app depuis son réseau
# interne, donc X-Forwarded-For y est honoré ; toute connexion directe
# (peer IP publique) voit XFF ignoré → `$request->ip()` = IP réelle du
# client, rate-limits par IP non contournables.
# ⚠️ Si Render migre son réseau interne hors RFC1918, mettre à jour la liste
# dans api/bootstrap/app.php AVANT tout déploiement.

services:
  # ──────────────────────────────────────────────────────────────────────────
  # Web Service — Laravel API
  # ──────────────────────────────────────────────────────────────────────────
  - type: web
    name: gestionemployerbackend
    runtime: docker
    dockerfilePath: api/Dockerfile.prod
    dockerContext: .
    region: frankfurt
    plan: starter
    healthCheckPath: /api/v1/health
    # #5xxx : autoDeploy:true redéploie à CHAQUE push main (même web/mobile/docs
    # only) → gaspillage des build hours gratuits (quota ~500 h/mois). Recommandé :
    # passer à `false` (push blueprint) et piloter uniquement via
    # RENDER_DEPLOY_HOOK_URL (workflow deploy-main.yml, gate tests + filtre api/**).
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      # Audit #1697 : ne jamais créer les sociétés démo / reset le mot de
      # passe super-admin « password123 » en production.
      - key: DISABLE_DEMO_SEEDING
        value: "true"
      - key: APP_URL
        fromService:
          name: gestionemployerbackend
          type: web
          property: host
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      # Database
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: leopardo-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: leopardo-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: leopardo-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: leopardo-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: leopardo-db
          property: password
      - key: DB_SEARCH_PATH
        value: shared_tenants,public
      # Redis (instance interne Render leopardo-redis — issue #3774).
      # REDIS_CLIENT=predis reste le défaut compatible Upstash ; un override
      # externe (Upstash) reste possible via le dashboard Render en remplaçant
      # REDIS_URL / REDIS_PASSWORD (les garder sync: false sur l'instance).
      - key: REDIS_CLIENT
        value: predis
      - key: REDIS_URL
        fromDatabase:
          name: leopardo-redis
          property: connectionString
      - key: REDIS_PASSWORD
        fromDatabase:
          name: leopardo-redis
          property: password
      # App secrets
      - key: APP_KEY
        generateValue: true
      # Issue #5578 : la queue est sur database (probe + drain GH #5204/#5205),
      # pas sur Redis (quota Upstash, incident 2026-08-19).
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: redis
      - key: SESSION_DRIVER
        value: redis
      # Stripe
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_BUSINESS
        sync: false
      - key: STRIPE_PRICE_ENTERPRISE
        sync: false
      # Chargily
      - key: CHARGILY_API_KEY
        sync: false
      - key: CHARGILY_WEBHOOK_SECRET
        sync: false
      # Google OAuth
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # QA #2277 : doit pointer vers le callback VITRINE (proxy Next) —
      # https://leopardo-rh.com/api/v1/auth/google/callback (à aligner dans la
      # console Google Cloud). Le cookie de session est posé sur la vitrine.
      - key: GOOGLE_REDIRECT_URL
        sync: false
      # Firebase
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      # Mail
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        value: noreply@leopardo-rh.com
      - key: MAIL_FROM_NAME
        value: "Leopardo RH"
      # Demo / ops (issue #2336) : le super-admin et le cockpit admin ne
      # sont utilisables que si ces variables sont renseignées sur Render.
      # SUPER_ADMIN_PASSWORD : mot de passe du compte admin@leopardo-rh.com
      # seedé par SuperAdminSeeder (sinon généré aléatoirement → login
      # impossible). sync: false → à saisir dans le dashboard Render.
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: FORCE_SUPER_ADMIN_PASSWORD_RESET
        value: "true"
      - key: ADMIN_DASHBOARD_URL
        sync: false
      # Opt-in demo (GET /api/v1/demo-users) — staging/demo uniquement.
      - key: DEMO_MODE_ENABLED
        value: "false"

  # ──────────────────────────────────────────────────────────────────────────
  # Background Worker — Laravel Queue Worker
  # Processes: push notifications, emails, PDF generation, payroll runs
  # ──────────────────────────────────────────────────────────────────────────
  - type: worker
    name: leopardo-queue-worker
    runtime: docker
    dockerfilePath: api/Dockerfile.prod
    dockerContext: .
    region: frankfurt
    plan: starter
    autoDeploy: true
    # Issue #5578 : la queue est sur database — le worker consomme la
    # connexion par défaut (aligné sur le probe et le drain GH Actions).
    dockerCommand: >-
      php artisan queue:work
      --queue=webhooks,audit,notifications,emails,pdf,payroll,documents,default
      --tries=3
      --timeout=300
      --sleep=3
      --max-jobs=500
      --max-time=3600
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      # Audit #1697 : ne jamais créer les sociétés démo / reset le mot de
      # passe super-admin « password123 » en production.
      - key: DISABLE_DEMO_SEEDING
        value: "true"
      # Audit #4412 : les workers génèrent des URLs absolues (reset password,
      # notifications, liens bulletins) — APP_URL requis sur tous les services.
      - key: APP_URL
        fromService:
          name: gestionemployerbackend
          type: web
          property: host
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: leopardo-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: leopardo-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: leopardo-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: leopardo-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: leopardo-db
          property: password
      - key: DB_SEARCH_PATH
        value: shared_tenants,public
      - key: REDIS_CLIENT
        value: predis
      - key: REDIS_URL
        fromDatabase:
          name: leopardo-redis
          property: connectionString
      - key: REDIS_PASSWORD
        fromDatabase:
          name: leopardo-redis
          property: password
      # #3907 : APP_KEY référencé depuis le web service (envVarKey) — un
      # generateValue indépendant donnerait une clé différente → sessions/
      # files chiffrées indéchiffrables entre services au provisionnement frais.
      - key: APP_KEY
        fromService:
          name: gestionemployerbackend
          type: web
          envVarKey: APP_KEY
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: redis
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        value: noreply@leopardo-rh.com
      - key: MAIL_FROM_NAME
        value: "Leopardo RH"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: CHARGILY_API_KEY
        sync: false
      # ADMIN_DASHBOARD_URL : utilisé dans les emails envoyés aux managers
      # depuis les jobs (liens vers le cockpit admin). sync: false → dashboard.
      - key: ADMIN_DASHBOARD_URL
        sync: false

  # ──────────────────────────────────────────────────────────────────────────
  # Background Worker — Scheduled tasks (scheduler)
  # Runs php artisan schedule:run every minute
  # ──────────────────────────────────────────────────────────────────────────
  - type: worker
    name: leopardo-scheduler
    runtime: docker
    dockerfilePath: api/Dockerfile.prod
    dockerContext: .
    region: frankfurt
    plan: starter
    autoDeploy: true
    dockerCommand: >-
      sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      # Audit #1697 : ne jamais créer les sociétés démo / reset le mot de
      # passe super-admin « password123 » en production.
      - key: DISABLE_DEMO_SEEDING
        value: "true"
      # Audit #4412 : les workers génèrent des URLs absolues (reset password,
      # notifications, liens bulletins) — APP_URL requis sur tous les services.
      - key: APP_URL
        fromService:
          name: gestionemployerbackend
          type: web
          property: host
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: leopardo-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: leopardo-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: leopardo-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: leopardo-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: leopardo-db
          property: password
      - key: DB_SEARCH_PATH
        value: shared_tenants,public
      - key: REDIS_URL
        fromDatabase:
          name: leopardo-redis
          property: connectionString
      - key: REDIS_PASSWORD
        fromDatabase:
          name: leopardo-redis
          property: password
      # #3907 : APP_KEY partagé avec le web service (envVarKey) — clé unique
      # requise pour déchiffrer sessions/files (cf. worker).
      - key: APP_KEY
        fromService:
          name: gestionemployerbackend
          type: web
          envVarKey: APP_KEY
      - key: QUEUE_CONNECTION
        value: database
      # Mail (issue #3594) : le scheduler envoie des emails synchrones (rappels,
      # alertes, notifications planifiées). Sans MAIL_* il retombe sur
      # config/mail.php 'host' => 127.0.0.1:25 et tout envoi échoue en silence.
      # Bloc aligné sur le web service (mêmes valeurs/sync: false).
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        value: noreply@leopardo-rh.com
      - key: MAIL_FROM_NAME
        value: "Leopardo RH"

databases:
  - name: leopardo-db
    databaseName: leopardo_db
    user: leopardo_user
    region: frankfurt
    plan: starter
    ipAllowList: []  # restricted to Render internal network
  # Issue #3774 : Redis interne Render (plan gratuit) pour QUEUE/CACHE/SESSION.
  # Les trois services (web, leopardo-queue-worker, leopardo-scheduler) y sont
  # branchés via fromDatabase ; un override Upstash externe reste possible en
  # remplaçant REDIS_URL/REDIS_PASSWORD dans le dashboard Render.
  - name: leopardo-redis
    plan: free
    type: redis
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []  # restricted to Render internal network
