name: "🚀 Feature Request"
description: Suggest an idea for this project
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions or features you've considered.
  - type: input
    id: surface
    attributes:
      label: "Surface (ex: api, front/web)"
      description: Which part of the codebase does this feature touch? (e.g. api, front/web, front/admin-dashboard, front/mobile_apps/leopardo_employee, front/zkteco-kiosk, .github/workflows, docs)
      placeholder: "api"
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: "Criteres d'acceptation"
      description: List the concrete, verifiable conditions that must be true for this feature to be considered done.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context or screenshots about the feature request here.
