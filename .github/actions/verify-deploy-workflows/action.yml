name: Verify required workflow conclusions for deployment SHA
description: >-
  Gate a Render deploy on the conclusions of the required CI workflows for the
  deployment SHA, with bounded polling for push-triggered deploys (issues
  #1705, #3545). Single implementation shared by deploy-main.yml and
  deploy-staging.yml (issue #4723).

inputs:
  sha:
    description: Deployment SHA to verify.
    required: true
  required_workflows:
    description: JSON array of required workflow names, e.g. ["Tests - Leopardo RH","Web CI - Leopardo Admin"].
    required: true
  web_changed:
    description: Whether the web app changed on this SHA ("true"/"false").
    required: false
    default: 'false'
  # Issue #7511 — un push sur `main` qui ne touche NI `api/**` NI
  # `front/admin-dashboard/**` ne déclenche AUCUN des workflows requis
  # (`tests.yml` et `web-ci.yml` sont filtrés par `.github/paths-filters.yml`) :
  # le gate ne trouvait alors aucun run pour le SHA et concluait « indécision »
  # (`no-runs`) → le job « Deploy gate verdict » échouait et `main` était rouge
  # après chaque merge hors API. Ce n'est pourtant pas une indécision : c'est
  # la décision « rien à déployer ». L'appelant passe donc ce qu'il a mesuré
  # (`true`/`false`) ; `''` (défaut) = non renseigné → comportement historique
  # strict (indécision) conservé pour les appelants qui ne le fournissent pas.
  api_changed:
    description: Whether the API changed on this SHA ("true"/"false"/"" = inconnu).
    required: false
    default: ''

outputs:
  tests_conclusion:
    description: Conclusion of the tests workflow (or missing/no-runs/timeout/manual-dispatch).
    value: ${{ steps.gate.outputs.tests_conclusion }}
  web_conclusion:
    description: Conclusion of the web workflow (or not-required when web did not change).
    value: ${{ steps.gate.outputs.web_conclusion }}
  should_deploy:
    description: "true/false — whether the deploy may proceed."
    value: ${{ steps.gate.outputs.should_deploy }}
  # Issue #7457 — motif du verdict, consommé par le job « Deploy gate verdict »
  # de deploy-main.yml. Un `should_deploy=false` n'est pas un résultat : il
  # recouvre aussi bien une décision légitime (rien à faire, SHA dépassé, tests
  # rouges — le rouge est déjà porté par le run Tests) qu'une INDÉCISION (aucun
  # run trouvé, timeout, conclusion illisible). Sans ce motif, les deux se
  # ressemblaient dans l'UI : « success » avec un job sauté.
  #
  # Valeurs : deploy | manual-dispatch | not-required | stale | no-runs |
  #           timeout | tests-missing | web-missing | missing |
  #           tests-<conclusion> | web-<conclusion>
  gate_outcome:
    description: >-
      Motif du verdict du gate de déploiement (issue #7457).
    value: ${{ steps.gate.outputs.gate_outcome }}

runs:
  using: composite
  steps:
    - name: Verify required workflow conclusions for deployment SHA
      id: gate
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      # Audit CodeQL #30 (2026-08-17) : les valeurs transitent par les inputs
      # de l'action et sont lues au runtime (core.getInput) — plus AUCUNE
      # interpolation ${{ }} dans le source du script (le vecteur « cache
      # poisoning / code injection » signalé par CodeQL disparaît).
      #
      # Fix 2026-09-05 (constat runs deploy-main) : ces trois valeurs étaient
      # passées via `with:` à github-script, qui ne les déclare pas → warning
      # runner « Unexpected input(s) » à CHAQUE run et livraison non garantie
      # (dépendante du comportement du runner). Passées en variables
      # d'environnement INPUT_* (convention lue par core.getInput), la
      # livraison est explicite et le warning disparaît.
      env:
        INPUT_SHA: ${{ inputs.sha }}
        INPUT_REQUIRED_WORKFLOWS: ${{ inputs.required_workflows }}
        INPUT_WEB_CHANGED: ${{ inputs.web_changed }}
        INPUT_API_CHANGED: ${{ inputs.api_changed }}
      with:
        script: |
          const EVENT = process.env.GITHUB_EVENT_NAME;
          const shaRaw = core.getInput('sha');
          if (!/^[0-9a-f]{40}$/.test(shaRaw)) {
            core.setFailed(`Invalid deployment SHA format: "${shaRaw}" (audit CodeQL #30).`);
            return;
          }
          const sha = shaRaw;
          const webChanged = core.getInput('web_changed') === 'true';
          // Issue #7511 — `''` = l'appelant n'a pas mesuré api_changed : on
          // garde alors le verdict strict (indécision si aucun run).
          const apiChangedRaw = core.getInput('api_changed');
          const apiChanged = apiChangedRaw === '' ? null : apiChangedRaw === 'true';
          const noRunExpected = apiChanged === false && !webChanged;
          const REQUIRED_WORKFLOWS = JSON.parse(core.getInput('required_workflows'));
          const { owner, repo } = context.repo;

          const TESTS_WORKFLOW = 'Tests - Leopardo RH';
          const WEB_WORKFLOW = 'Web CI - Leopardo Admin';

          if (EVENT === 'workflow_dispatch') {
            core.info('Manual deployment on main: bypassing workflow_run lookup.');
            core.setOutput('tests_conclusion', 'manual-dispatch');
            core.setOutput('web_conclusion', 'manual-dispatch');
            core.setOutput('should_deploy', 'true');
            core.setOutput('gate_outcome', 'manual-dispatch');
            return;
          }

          const conclusionIsGreen = (c) => c === 'success' || c === 'skipped';

          // #3545 : mode push = polling borné des runs du SHA (intervalle
          // 60 s). Le workflow_run n'existe pas encore ou a pu être annulé en
          // pending ; on attend que les runs du SHA terminent vraiment, au lieu
          // de lire la conclusion d'un parent.
          //
          // #7559 — le budget (30 min) est PLUS COURT que le timeout du job
          // backend de `tests.yml` (300 min) : tout merge `api/**` épuise donc le
          // budget alors que la suite progresse encore, et le gate rendait
          // « timeout » — rangé dans les indécisions (#7457) donc ROUGE. Un
          // budget épuisé alors qu'un run requis est encore `queued`/
          // `in_progress` n'est pas une indécision : c'est une information qui
          // arrive. Ce cas rend désormais `pending` (non fatal, `::notice::`) ;
          // le budget épuisé SANS run requis en cours reste `timeout` (vraie
          // indécision). Contrôle de fond : `deploy-drift-guard.yml` (30 min) ;
          // rattrapage : `deploy-main-catchup.yml` / dispatch `force_deploy`.
          //
          // `DEPLOY_GATE_BUDGET_MINUTES` permet au test comportemental
          // (`dev-hub/tools/check-deploy-gate-outcome-test.mjs`) d'épuiser le
          // budget sans attendre ; la CI ne pose pas cette variable (défaut 30).
          if (EVENT === 'push') {
            core.info(`Push-triggered deploy: polling runs for ${sha} (web_changed=${webChanged}).`);
            const budgetMinutes = Number(process.env.DEPLOY_GATE_BUDGET_MINUTES ?? '30');
            const deadline = Date.now() + budgetMinutes * 60 * 1000;
            const intervalMs = 60 * 1000;
            let consecutiveEmpty = 0;
            // Dernier état observé (utilisé si le budget s'épuise) : #7559.
            let lastPending = [];
            let lastRelevant = [];

            // `do/while` : on observe TOUJOURS au moins une fois, sinon un budget
            // nul (test) sortirait sans aucune information et retomberait dans
            // « timeout » faute de savoir ce qui tournait.
            do {
              let runsForSha = [];
              try {
                runsForSha = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                  owner,
                  repo,
                  branch: 'main',
                  event: 'push',
                  per_page: 100,
                });
                runsForSha = runsForSha.filter((run) => run.head_sha === sha);
              } catch (err) {
                core.warning(`listWorkflowRunsForRepo failed: ${err.message}`);
              }

              const relevant = runsForSha.filter((run) => REQUIRED_WORKFLOWS.includes(run.name));
              // #7559 (suite, mesurée en production) — « en vol » = tout ce qui
              // n'est pas `completed`. Le prédicat précédent
              // (`queued`/`in_progress`) laissait passer les états
              // `requested` / `waiting` / `pending` : le gate concluait alors
              // sur un run sans `conclusion` et produisait le motif
              // `tests-null`, que le job de verdict ne connaît pas (donc rouge).
              // Constat : run 35085884633, `gate_outcome=tests-null`, sur un
              // merge `api/**` dont la suite était simplement encore en file.
              const pending = relevant.filter((run) => run.status !== 'completed');
              lastRelevant = relevant;
              lastPending = pending;

              if (relevant.length === 0) {
                consecutiveEmpty += 1;
                if (consecutiveEmpty >= 5) {
                  // Issue #7511 — rien n'a changé côté `api/**` ni
                  // `front/admin-dashboard/**` (filtres de chemins) : l'absence
                  // de run requis n'est pas une indécision mais la décision
                  // « aucun déploiement attendu ». Sans ce cas, `main` devenait
                  // rouge après chaque merge hors API (constat : merge #7498).
                  if (noRunExpected) {
                    core.notice(`Aucun workflow requis pour le SHA ${sha} : ni api/ ni web n'ont changé — rien à déployer (#7511).`);
                    core.setOutput('tests_conclusion', 'not-required');
                    core.setOutput('web_conclusion', 'not-required');
                    core.setOutput('should_deploy', 'false');
                    core.setOutput('gate_outcome', 'not-required');
                    return;
                  }
                  core.warning(`Deploy skipped — aucun run "${REQUIRED_WORKFLOWS.join('" / ')}" pour le SHA ${sha} (chemin non couvert ou runs non créés).`);
                  core.setOutput('tests_conclusion', 'no-runs');
                  core.setOutput('web_conclusion', webChanged ? 'no-runs' : 'not-required');
                  core.setOutput('should_deploy', 'false');
                  core.setOutput('gate_outcome', 'no-runs');
                  return;
                }
                core.info(`No relevant runs yet for ${sha} (${consecutiveEmpty}/5 empty polls) — waiting ${intervalMs / 1000}s...`);
                await new Promise((r) => setTimeout(r, intervalMs));
                continue;
              }
              consecutiveEmpty = 0;

              const testsRun = relevant.find((run) => run.name === TESTS_WORKFLOW);
              const webRun = relevant.find((run) => run.name === WEB_WORKFLOW);
              const testsConclusion = testsRun ? testsRun.conclusion : null;
              const webConclusion = webRun ? webRun.conclusion : null;

              if (pending.length > 0) {
                core.info(`Runs still in flight for ${sha} (${pending.length} : ${pending.map((run) => `${run.name}=${run.status}`).join(', ')}) — waiting ${intervalMs / 1000}s...`);
                await new Promise((r) => setTimeout(r, intervalMs));
                continue;
              }

              // Plus aucun run en attente : l'état est stabilisé.
              let shouldDeploy = true;
              let reason = '';
              // Issue #7457 — motif exploitable par le job de verdict.
              let gateOutcome = 'deploy';
              if (!testsRun) {
                shouldDeploy = false;
                gateOutcome = 'tests-missing';
                reason = `aucun run "${TESTS_WORKFLOW}" pour le SHA ${sha}`;
              } else if (!conclusionIsGreen(testsConclusion)) {
                shouldDeploy = false;
                gateOutcome = `tests-${testsConclusion ?? 'missing'}`;
                reason = `conclusion "${TESTS_WORKFLOW}" = ${testsConclusion} pour le SHA ${sha}`;
              }
              if (shouldDeploy && webChanged) {
                if (!webRun) {
                  shouldDeploy = false;
                  gateOutcome = 'web-missing';
                  reason = `web_changed=true mais aucun run "${WEB_WORKFLOW}" pour le SHA ${sha}`;
                } else if (!conclusionIsGreen(webConclusion)) {
                  shouldDeploy = false;
                  gateOutcome = `web-${webConclusion ?? 'missing'}`;
                  reason = `conclusion "${WEB_WORKFLOW}" = ${webConclusion} pour le SHA ${sha}`;
                }
              }

              core.info(`Tests workflow conclusion: ${testsConclusion}`);
              core.info(`Web workflow conclusion: ${webConclusion}`);
              core.info(`Web changed: ${webChanged}`);

              if (shouldDeploy) {
                // Audit #1705 + #3545 : ne jamais déployer un SHA devenu
                // obsolète pendant l'attente — un push plus récent a pu
                // arriver pendant le polling.
                const { data: mainBranch } = await github.rest.repos.getBranch({
                  owner,
                  repo,
                  branch: 'main',
                });
                const mainHead = mainBranch.commit.sha;
                if (mainHead !== sha) {
                  core.warning(`Deploy skipped — SHA stale pendant l'attente (${sha} ≠ main ${mainHead}).`);
                  core.setOutput('tests_conclusion', testsConclusion ?? 'missing');
                  core.setOutput('web_conclusion', webChanged ? (webConclusion ?? 'missing') : 'not-required');
                  core.setOutput('should_deploy', 'false');
                  core.setOutput('gate_outcome', 'stale');
                  return;
                }
                core.setOutput('tests_conclusion', testsConclusion ?? 'missing');
                core.setOutput('web_conclusion', webChanged ? (webConclusion ?? 'missing') : 'not-required');
                core.setOutput('should_deploy', 'true');
                core.setOutput('gate_outcome', 'deploy');
                return;
              }

              core.warning(`Deploy skipped — ${reason}.`);
              core.setOutput('tests_conclusion', testsConclusion ?? 'missing');
              core.setOutput('web_conclusion', webConclusion ?? 'not-required');
              core.setOutput('should_deploy', 'false');
              core.setOutput('gate_outcome', gateOutcome);
              return;
            } while (Date.now() < deadline);

            // #7559 — budget épuisé. Deux cas très différents :
            if (lastPending.length > 0) {
              const names = lastPending.map((run) => run.name).join(' / ');
              core.notice(
                `Deploy différé (#7559) — budget de ${budgetMinutes} min épuisé alors que ${lastPending.length} workflow(s) requis du SHA ${sha} étaient encore en cours (${names}). `
                + 'Ce n\'est pas une indécision : la conclusion arrive plus tard que le budget. '
                + 'Contrôle de fond : « Deploy Drift Guard » (toutes les 30 min) ; rattrapage : « Deploy Main Catch-up » ou dispatch `force_deploy`.',
              );
              core.setOutput('tests_conclusion', 'pending');
              core.setOutput('web_conclusion', webChanged ? 'pending' : 'not-required');
              core.setOutput('should_deploy', 'false');
              core.setOutput('gate_outcome', 'pending');
              return;
            }

            // Aucun run requis n'était en cours : là, le gate n'a pas pu décider.
            core.warning(`Deploy skipped — timeout ${budgetMinutes} min en attente des runs du SHA ${sha} (aucun run requis en cours : indécision).`);
            core.setOutput('tests_conclusion', 'timeout');
            core.setOutput('web_conclusion', webChanged ? 'timeout' : 'not-required');
            core.setOutput('should_deploy', 'false');
            core.setOutput('gate_outcome', 'timeout');
            return;
          }

          // ---- Mode workflow_run (déclenchement historique) ----
          const allRuns = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
            owner,
            repo,
            branch: 'main',
            event: 'push',
            per_page: 100,
          });

          const runsForSha = allRuns.filter((run) => run.head_sha === sha);

          const getConclusion = (workflowName) => {
            const match = runsForSha.find((run) => run.name === workflowName);
            return match ? match.conclusion : null;
          };

          const testsConclusion = getConclusion(TESTS_WORKFLOW);
          const webConclusion = getConclusion(WEB_WORKFLOW);

          core.info(`Deployment SHA: ${sha}`);
          core.info(`Tests workflow conclusion: ${testsConclusion}`);
          core.info(`Web workflow conclusion: ${webConclusion}`);
          core.info(`Web changed: ${webChanged}`);

          let shouldDeploy = conclusionIsGreen(testsConclusion);
          if (webChanged) {
            shouldDeploy = shouldDeploy && conclusionIsGreen(webConclusion);
          }

          // Audit #1705 : race « stale SHA » — si ce SHA n'est plus la tête
          // de main (un push plus récent est arrivé pendant que nos tests
          // tournaient), ne PAS déployer : un CI lent ne doit jamais
          // écraser un déploiement plus récent. Re-vérification de la tête
          // de main au moment du gate, pas au moment du trigger.
          const { data: mainBranch } = await github.rest.repos.getBranch({
            owner,
            repo,
            branch: 'main',
          });
          const mainHead = mainBranch.commit.sha;
          let legacyOutcome = testsConclusion === null
            ? 'tests-missing'
            : (conclusionIsGreen(testsConclusion) ? 'deploy' : `tests-${testsConclusion}`);
          if (webChanged && legacyOutcome === 'deploy' && !conclusionIsGreen(webConclusion)) {
            legacyOutcome = webConclusion === null ? 'web-missing' : `web-${webConclusion}`;
          }
          if (mainHead !== sha) {
            core.info(`Stale SHA: ${sha} is not main's tip (${mainHead}) — skipping deploy.`);
            shouldDeploy = false;
            legacyOutcome = 'stale';
          }

          core.setOutput('tests_conclusion', testsConclusion ?? 'missing');
          core.setOutput('web_conclusion', webConclusion ?? 'not-required');
          core.setOutput('should_deploy', shouldDeploy ? 'true' : 'false');
          core.setOutput('gate_outcome', legacyOutcome);
