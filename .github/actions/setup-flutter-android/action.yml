name: "Setup Flutter + Java for Android builds"
description: >
  Composite action wrapping the repeated Java 17 + Flutter setup used by
  mobile-apps-ci.yml, mobile-distribute.yml, deploy-main.yml (distribute-mobile)
  and previously release.yml. See docs/audits/AUDIT_CICD_2026-07-19.md section 3.2.

inputs:
  java-version:
    description: "Temurin JDK version"
    required: false
    default: "17"
  flutter-channel:
    description: "Flutter channel (stable | beta)"
    required: false
    default: "stable"
  flutter-version:
    description: "Pinned Flutter version; 'any' uses the channel's latest (subosito/flutter-action default)"
    required: false
    default: "any"

runs:
  using: "composite"
  steps:
    - name: Setup Java ${{ inputs.java-version }}
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: Setup Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        channel: ${{ inputs.flutter-channel }}
        flutter-version: ${{ inputs.flutter-version }}
        cache: true

    # Les apps mobiles déclarent compileSdk = 37 (AGP récent) — le runner
    # ubuntu-latest ne préinstalle pas platforms;android-37 : sans cette étape
    # Gradle échoue avec "Failed to find Platform SDK with path:
    # platforms;android-37" (mobile-apps-ci + mobile-distribute, cf. #1560).
    # android-actions/setup-android installe cmdline-tools + plateforme 37 de
    # façon fiable (accepte les licences, pose ANDROID_HOME/ANDROID_SDK_ROOT
    # dans GITHUB_ENV pour les étapes suivantes).
    - name: Setup Android SDK (platform 37)
      uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      with:
        packages: 'tools platform-tools platforms;android-37 build-tools;37.0.0'

    - name: Verify Android SDK platform 37
      shell: bash
      run: |
        echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
        if [[ -d "${ANDROID_HOME}/platforms/android-37" ]]; then
          echo "platforms;android-37 OK (${ANDROID_HOME}/platforms/android-37)."
        else
          echo "::warning::platforms;android-37 absent (ANDROID_HOME=${ANDROID_HOME}) — builds Android peuvent échouer."
        fi
