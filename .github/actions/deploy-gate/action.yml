name: 'Deploy gate — conclusion deploy-api du run parent'
description: >
  #4723 — détermine si un job smoke/scan (E2E, ZAP…) doit tourner selon la
  conclusion du job `deploy-api` du workflow_run parent, via la Checks API.
  Extrait de e2e-staging.yml et owasp-zap.yml (copies à l'identique).
inputs:
  output_name:
    description: "Nom de l'output GitHub Actions à poser (true/false)"
    required: true
outputs:
  result:
    description: 'true si le smoke/scan doit tourner'
    value: ${{ steps.check.outputs[inputs.output_name] }}
runs:
  using: composite
  steps:
    - name: Determine if run should happen
      id: check
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      with:
        script: |
          const outputName = '${{ inputs.output_name }}';
          if (context.eventName === 'workflow_dispatch') {
            core.setOutput(outputName, 'true');
            return;
          }

          if (context.payload.workflow_run?.conclusion !== 'success' &&
              context.payload.workflow_run?.conclusion !== 'failure') {
            // cancelled/skipped/timed_out parent run: nothing useful to check.
            core.setOutput(outputName, 'false');
            return;
          }

          const { owner, repo } = context.repo;
          const runId = context.payload.workflow_run.id;

          const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
            owner,
            repo,
            run_id: runId,
            per_page: 100,
          });

          const deployApiJob = jobs.find((job) => job.name === 'Deploy API + Web to Render');

          // Issue #1833 — faux verts : quand `deploy-api` était skippé (gate
          // should_deploy=false, SHA stale), tous les jobs E2E étaient skippés
          // et le run concluait en « success » à 0 test — plus aucune
          // protection E2E visible depuis le 13/08. Trois cas désormais :
          //   1. deploy-api SUCCESS  → on exécute les E2E (comportement nominal) ;
          //   2. deploy-api FAILURE  → un déploiement a été tenté et a échoué :
          //      l'E2E conclut en échec explicite (jamais de faux vert) ;
          //   3. deploy-api absent/skippé → rien n'a été déployé, rien à
          //      tester : warning explicite + skip (vert assumé et annoté).
          if (deployApiJob && deployApiJob.conclusion === 'failure') {
            // Issue #1833 : un déploiement tenté et échoué ne doit JAMAIS
            // produire un E2E « vert » à 0 test — on fait échouer le run.
            core.setFailed(`deploy-api a échoué (conclusion=${deployApiJob.conclusion}) — E2E marqué en échec explicite, aucun faux vert.`);
            return;
          }

          const deployApiConclusion = deployApiJob ? deployApiJob.conclusion : null;
          core.info(`deploy-api job conclusion: ${deployApiConclusion}`);
          if (deployApiConclusion !== 'success') {
            core.warning('E2E non exécuté : aucune étape de déploiement n\'a abouti (deploy-api absent ou skippé). Rien à tester — run volontairement vide, voir issue #1833.');
          }
          core.setOutput(outputName, deployApiConclusion === 'success' ? 'true' : 'false');
