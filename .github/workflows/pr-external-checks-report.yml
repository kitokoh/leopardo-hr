name: PR External Checks Report

# Issue #7480 — « les checks de déploiement tiers rougissent les PR en
# permanence ». Un rouge permanent n'informe plus : il faut distinguer
# explicitement
#   - un échec de check **requis** (bloque le merge),
#   - un échec **externe** connu (quota Vercel `api-deployments-free-per-day`,
#     `Workers Builds: gestionemploye` hors périmètre, revue Strix expirée),
#   - un échec d'un **autre check du dépôt** (à lire dans le log — son résumé
#     peut être vide, cf. #7466 : `Governance Gates` rouge sans explication
#     visible dans le résumé du check).
#
# Le rapport est publié (ou actualisé) en **un seul commentaire** par PR, marqué
# `<!-- external-checks-report -->`. Il est rafraîchi quand une PR bouge ET
# quand les grands workflows terminent, pour que l'état affiché soit celui
# d'après les checks — pas celui du moment de l'ouverture.
#
# Conduite à tenir : `docs/ops/EXTERNAL_CHECKS_TRIAGE.md`.

# Issue #9035 — saturation des runners. Ce workflow ne produit qu'un
# commentaire de synthese : le relancer a chaque `synchronize` coutait 61 runs
# pour 43 annulations (70 %) sur une fenetre de 2,5 h, sans jamais changer le
# resultat affiche. Il ne se declenche donc plus sur `synchronize` : le
# rafraichissement apres un nouveau commit est deja assure par le declencheur
# `workflow_run` ci-dessous, qui se produit quand les checks du depot
# terminent — c'est-a-dire au bon moment, une fois, et sans annuler le run
# precedent.
#
# Issue #9189 — le declencheur `workflow_run` ne regardait PAS d'ou venait le
# run source : sur `main`, il partait donc pour des runs de `push`, ou il n'y a
# aucune PR a rapporter. Mesure du 2026-11-08 (`runs?branch=main`) : **22 a 23
# runs par commit de main** (41e4b030 : 22, 60201181 : 23, 86c2743e : 23) pour
# un seul commentaire de synthese — soit ~20 spin-ups de runner par push. Pire :
# le SHA d'un commit de `main` EST associe a sa PR **fusionnee**
# (`/commits/<sha>/pulls` -> #9187 `state=closed`), donc le rapport rafraichissait
# le commentaire d'une PR fermee que personne ne relit.
#
# Regle : un rapport de PR ne se produit que pour un run issu d'une
# `pull_request`. Le filtre vit dans le `if` du job (une seule condition, plutot
# qu'un `paths`/branche qui laisserait passer les reruns), et le script refuse
# en plus toute PR qui n'est pas ouverte (filet pour les appels manuels).
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_run:
    # Rafraîchit le rapport quand les checks du dépôt terminent (un run
    # `pull_request` seul afficherait « N checks en cours »).
    workflows:
      - "Architecture Quality"
      - "Tests - Leopardo"
      - "Web CI - Leopardo Admin"
      - "Web CI - Leopardo Vitrine"
    types: [completed]

permissions:
  contents: read
  checks: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pr-external-checks-${{ github.event.pull_request.number || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  report:
    name: Rapport d'état des checks (#7480)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `github.event.workflow_run.event` est vide hors `workflow_run` : la
    # premiere branche couvre le declencheur `pull_request`, la seconde les runs
    # de PR termines. Un run de `push` (donc sur `main`) n'a aucune PR a
    # rapporter — il ne doit plus demarrer du tout (#9189).
    if: >-
      github.repository == 'kitokoh/leopardo-hr'
      && (github.event_name == 'pull_request' || github.event.workflow_run.event == 'pull_request')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          lfs: false

      - name: Tests de la garde (#9189)
        # Zéro réseau : faux `curl`, fixtures en dur. Rouge sur le script d'avant
        # le correctif (commentaire publié sur une PR fusionnée), vert après.
        run: bash dev-hub/tools/tests/report-external-checks.test.sh

      - name: Publier / actualiser le rapport
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          # PR (événement pull_request) ou SHA (événement workflow_run) — le
          # script résout le SHA en PR.
          target="${{ github.event.pull_request.number || github.event.workflow_run.head_sha }}"
          if [[ -z "${target}" ]]; then
            echo "::notice::aucune cible (ni PR ni SHA) — rien à rapporter."
            exit 0
          fi
          bash dev-hub/tools/report-external-checks.sh "${target}" --comment
