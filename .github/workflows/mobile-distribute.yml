name: Mobile - Build and Firebase Distribution

on:
  push:
    branches:
      - main
    tags:
      - "v*-staging"
      - "v*-prod"
    paths:
      - "front/mobile_apps/**"
      - "dev-hub/tools/install-mobile-firebase-configs.ps1"
      - ".github/workflows/mobile-distribute.yml"
      - "docs/validation/MOBILE_FIREBASE_DISTRIBUTION.md"
  workflow_dispatch:
    inputs:
      environment:
        description: "Cible de deploiement"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - prod
      release_notes:
        description: "Notes de version (optionnel)"
        required: false
        type: string
        default: "Build manuel Leopardo RH"
      app:
        description: "Application mobile a distribuer"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - employee
          - manager
          - platform_admin

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: mobile-distribute-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-distribute:
    name: Mobile Android Build + Distribution (${{ matrix.app.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: employee
            project_path: front/mobile_apps/leopardo_employee
            artifact_name: leopardo-employee
            firebase_secret: FIREBASE_EMPLOYEE_ANDROID_APP_ID
            android_package: com.leopardo.employee
          - name: manager
            project_path: front/mobile_apps/leopardo_manager
            artifact_name: leopardo-manager
            firebase_secret: FIREBASE_MANAGER_ANDROID_APP_ID
            android_package: com.leopardo.manager
          - name: platform_admin
            project_path: front/mobile_apps/leopardo_platform_admin
            artifact_name: leopardo-platform-admin
            firebase_secret: FIREBASE_PLATFORM_ADMIN_ANDROID_APP_ID
            android_package: com.leopardo.platformadmin

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Resolve selected app
        shell: bash
        run: |
          set -euo pipefail
          SELECTED="${{ github.event.inputs.app || 'both' }}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${SELECTED}" != "both" && "${SELECTED}" != "${{ matrix.app.name }}" ]]; then
            echo "SHOULD_BUILD=false" >> "$GITHUB_ENV"
            echo "Skipping ${{ matrix.app.name }} because input app=${SELECTED}"
          else
            echo "SHOULD_BUILD=true" >> "$GITHUB_ENV"
          fi

      - name: Setup Java 17
        if: env.SHOULD_BUILD == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        if: env.SHOULD_BUILD == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve target environment
        if: env.SHOULD_BUILD == 'true'
        id: env_detect
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME:-}"
          INPUT_ENV="${{ github.event.inputs.environment }}"

          if [[ "$TAG" == *"-prod" ]]; then
            TARGET="prod"
            BUILD_NAME="${TAG%-prod}"
          elif [[ "$TAG" == *"-staging" ]]; then
            TARGET="staging"
            BUILD_NAME="${TAG%-staging}"
          elif [[ "$INPUT_ENV" == "prod" ]]; then
            TARGET="prod"
            BUILD_NAME="manual-$(date +%Y%m%d)"
          else
            TARGET="staging"
            BUILD_NAME="manual-$(date +%Y%m%d)"
          fi

          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "BUILD_NAME=$BUILD_NAME" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Validate required secrets for staging distribution
        if: env.SHOULD_BUILD == 'true' && env.TARGET == 'staging'
        shell: bash
        env:
          FIREBASE_APP_ID: ${{ secrets[matrix.app.firebase_secret] }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_APP_ID_SECRET_NAME: ${{ matrix.app.firebase_secret }}
        run: |
          set -euo pipefail
          if [[ -z "${FIREBASE_APP_ID}" ]]; then
            echo "Missing GitHub secret: ${FIREBASE_APP_ID_SECRET_NAME}"
            exit 1
          fi
          if [[ -z "${FIREBASE_TOKEN}" ]]; then
            echo "Missing GitHub secret: FIREBASE_TOKEN"
            exit 1
          fi

      - name: Validate app Firebase config presence
        if: env.SHOULD_BUILD == 'true'
        shell: bash
        env:
          PROJECT_PATH: ${{ matrix.app.project_path }}
          APP_NAME: ${{ matrix.app.name }}
          ANDROID_PACKAGE: ${{ matrix.app.android_package }}
          FIREBASE_APP_ID: ${{ secrets[matrix.app.firebase_secret] }}
          FIREBASE_APP_ID_SECRET_NAME: ${{ matrix.app.firebase_secret }}
        run: |
          set -euo pipefail
          CONFIG_FILE="${PROJECT_PATH}/android/app/google-services.json"
          if [[ ! -f "${CONFIG_FILE}" ]]; then
            echo "Missing Firebase config: ${CONFIG_FILE}"
            echo "Run dev-hub/tools/install-mobile-firebase-configs.ps1 with matching Firebase app IDs."
            exit 1
          fi
          node <<'NODE'
          const fs = require('fs');
          const configFile = `${process.env.PROJECT_PATH}/android/app/google-services.json`;
          const expectedPackage = process.env.ANDROID_PACKAGE;
          const expectedAppId = process.env.FIREBASE_APP_ID;
          const secretName = process.env.FIREBASE_APP_ID_SECRET_NAME;
          const payload = JSON.parse(fs.readFileSync(configFile, 'utf8'));
          const clients = Array.isArray(payload.client) ? payload.client : [];
          const match = clients.find((client) => client?.client_info?.android_client_info?.package_name === expectedPackage);
          if (!match) {
            console.error(`No Firebase Android client found for ${expectedPackage} in ${configFile}.`);
            process.exit(1);
          }
          const nativeAppId = match?.client_info?.mobilesdk_app_id;
          if (!nativeAppId) {
            console.error(`Firebase Android client for ${expectedPackage} does not expose mobilesdk_app_id.`);
            process.exit(1);
          }
          if (nativeAppId !== expectedAppId) {
            console.error(`${secretName} does not match ${configFile} for ${expectedPackage}.`);
            console.error(`Expected the secret to equal the google-services.json mobilesdk_app_id for this app.`);
            process.exit(1);
          }
          console.log(`Firebase target verified for ${process.env.APP_NAME}: ${expectedPackage}.`);
          NODE
          {
            echo "### Firebase target - ${APP_NAME}"
            echo "- Android package: \`${ANDROID_PACKAGE}\`"
            echo "- Native config: \`${CONFIG_FILE}\`"
            echo "- Console: https://console.firebase.google.com/project/leopardo-rh/appdistribution/app/android:${ANDROID_PACKAGE}/releases"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Flutter pub get
        if: env.SHOULD_BUILD == 'true'
        working-directory: ${{ matrix.app.project_path }}
        run: flutter pub get

      - name: Flutter analyze
        if: env.SHOULD_BUILD == 'true'
        working-directory: ${{ matrix.app.project_path }}
        run: flutter analyze --no-fatal-infos

      - name: Build release binary
        if: env.SHOULD_BUILD == 'true'
        working-directory: ${{ matrix.app.project_path }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${TARGET}" == "prod" ]]; then
            echo "API_BASE_URL=https://api.leopardo-rh.com/api/v1" > .env.build
            flutter build appbundle --release \
              --dart-define-from-file=.env.build \
              --build-name="${BUILD_NAME}" \
              --build-number="${BUILD_NUMBER}"
            echo "BUILD_FILE=${{ matrix.app.project_path }}/build/app/outputs/bundle/release/app-release.aab" >> "$GITHUB_ENV"
          else
            echo "API_BASE_URL=https://gestionemployerbackend.onrender.com/api/v1" > .env.build
            flutter build apk --release \
              --dart-define-from-file=.env.build \
              --build-name="${BUILD_NAME}" \
              --build-number="${BUILD_NUMBER}"
            echo "BUILD_FILE=${{ matrix.app.project_path }}/build/app/outputs/flutter-apk/app-release.apk" >> "$GITHUB_ENV"
          fi

      - name: Verify build output exists
        if: env.SHOULD_BUILD == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f "${BUILD_FILE}"

      - name: Upload mobile artifact
        if: env.SHOULD_BUILD == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.app.artifact_name }}-${{ env.TARGET }}-${{ env.BUILD_NAME }}
          path: ${{ env.BUILD_FILE }}
          if-no-files-found: error
          retention-days: 30

      - name: Firebase App Distribution (staging)
        if: env.SHOULD_BUILD == 'true' && env.TARGET == 'staging'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets[matrix.app.firebase_secret] }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: testeurs-internes
          file: ${{ env.BUILD_FILE }}
          releaseNotes: |
            Leopardo ${{ matrix.app.name }} ${{ env.BUILD_NAME }}
            Ref: ${{ github.ref_name }}
            Notes: ${{ github.event.inputs.release_notes || 'Tag build' }}
            Backend: https://gestionemployerbackend.onrender.com

      - name: Verify Firebase App Distribution release is visible
        if: env.SHOULD_BUILD == 'true' && env.TARGET == 'staging'
        shell: bash
        env:
          FIREBASE_APP_ID: ${{ secrets[matrix.app.firebase_secret] }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_READBACK_REQUIRED: ${{ secrets.FIREBASE_READBACK_REQUIRED }}
          APP_NAME: ${{ matrix.app.name }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
        run: |
          set -euo pipefail
          FIREBASE_READBACK_STRICT="${FIREBASE_READBACK_REQUIRED:-false}"
          USED_SERVICE_ACCOUNT=false
          FIREBASE_AUTH_ARGS=(--token "${FIREBASE_TOKEN}")
          if [[ -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]]; then
            printf '%s' "${FIREBASE_SERVICE_ACCOUNT_JSON}" > "${RUNNER_TEMP}/firebase-service-account.json"
            export GOOGLE_APPLICATION_CREDENTIALS="${RUNNER_TEMP}/firebase-service-account.json"
            FIREBASE_AUTH_ARGS=()
            USED_SERVICE_ACCOUNT=true
            echo "Using Firebase service account readback for ${APP_NAME}."
            echo "Firebase readback strict mode: ${FIREBASE_READBACK_STRICT}."
          fi
          echo "Verifying Firebase App Distribution read-after-write for ${APP_NAME} build ${BUILD_NUMBER}."
          for attempt in 1 2 3 4 5 6; do
            echo "Firebase visibility attempt ${attempt}/6..."
            set +e
            npx --yes firebase-tools appdistribution:releases:list \
              --app "${FIREBASE_APP_ID}" \
              "${FIREBASE_AUTH_ARGS[@]}" \
              --limit 10 \
              --json > firebase-releases.json 2> firebase-releases.err
            firebase_status=$?
            set -e

            if [[ ${firebase_status} -ne 0 ]]; then
              if [[ "${USED_SERVICE_ACCOUNT}" == "true" && "${FIREBASE_READBACK_STRICT}" != "true" ]]; then
                echo "::warning::Firebase service-account readback failed for ${APP_NAME}; retrying readback with FIREBASE_TOKEN."
                cat firebase-releases.err || true
                set +e
                npx --yes firebase-tools appdistribution:releases:list \
                  --app "${FIREBASE_APP_ID}" \
                  --token "${FIREBASE_TOKEN}" \
                  --limit 10 \
                  --json > firebase-releases.json 2> firebase-releases.err
                firebase_status=$?
                set -e
              fi
            fi

            if [[ ${firebase_status} -ne 0 ]]; then
              if [[ "${FIREBASE_READBACK_STRICT}" == "true" ]]; then
                echo "::error::Firebase service-account readback failed for ${APP_NAME}."
                cat firebase-releases.err || true
                exit ${firebase_status}
              fi
              echo "::warning::Firebase upload succeeded, but firebase-tools could not list App Distribution releases for ${APP_NAME}."
              echo "::warning::Keeping deploy green because the upload action is the distribution source of truth; set FIREBASE_READBACK_REQUIRED=true after the service account is rotated and granted App Distribution access."
              cat firebase-releases.err || true
              exit 0
            fi

            set +e
            node -e 'const fs = require("fs"); const payload = JSON.parse(fs.readFileSync("firebase-releases.json", "utf8")); const expectedBuild = process.env.BUILD_NUMBER; const appName = process.env.APP_NAME; const releases = Array.isArray(payload.result) ? payload.result : (Array.isArray(payload.result?.releases) ? payload.result.releases : []); const match = releases.find((release) => String(release.buildVersion) === String(expectedBuild)); if (!match) { console.error(`Firebase App Distribution release not visible yet for ${appName} build ${expectedBuild}.`); console.error(`Visible build versions: ${releases.map((release) => release.buildVersion).join(", ") || "none"}`); process.exit(2); } console.log(`Firebase App Distribution release visible for ${appName}: ${match.name || match.displayVersion || match.buildVersion}`);'
            node_status=$?
            set -e

            if [[ ${node_status} -eq 0 ]]; then
              exit 0
            fi
            if [[ ${node_status} -ne 2 ]]; then
              echo "::error::Firebase release list returned an unexpected payload."
              head -c 2000 firebase-releases.json || true
              exit ${node_status}
            fi
            sleep 20
          done

          echo "::error::Firebase upload succeeded, but build ${BUILD_NUMBER} was not visible in the last 10 releases after retries."
          exit 1
