name: Mobile - Build and Firebase Distribution

on:
  push:
    tags:
      - "v*-staging"
      - "v*-prod"
  workflow_dispatch:
    inputs:
      environment:
        description: "Cible de deploiement"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - prod
      release_notes:
        description: "Notes de version (optionnel)"
        required: false
        default: "Build manuel Leopardo RH"
      app:
        description: "Application mobile a distribuer"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - employee
          - manager

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: mobile-distribute-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-distribute:
    name: Mobile Android Build + Distribution (${{ matrix.app.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: employee
            project_path: front/mobile_apps/leopardo_employee
            artifact_name: leopardo-employee
            firebase_secret: FIREBASE_EMPLOYEE_ANDROID_APP_ID
          - name: manager
            project_path: front/mobile_apps/leopardo_manager
            artifact_name: leopardo-manager
            firebase_secret: FIREBASE_MANAGER_ANDROID_APP_ID

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Resolve selected app
        shell: bash
        run: |
          set -euo pipefail
          SELECTED="${{ github.event.inputs.app || 'both' }}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${SELECTED}" != "both" && "${SELECTED}" != "${{ matrix.app.name }}" ]]; then
            echo "SHOULD_BUILD=false" >> "$GITHUB_ENV"
            echo "Skipping ${{ matrix.app.name }} because input app=${SELECTED}"
          else
            echo "SHOULD_BUILD=true" >> "$GITHUB_ENV"
          fi

      - name: Setup Java 17
        if: env.SHOULD_BUILD == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        if: env.SHOULD_BUILD == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve target environment
        if: env.SHOULD_BUILD == 'true'
        id: env_detect
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME:-}"
          INPUT_ENV="${{ github.event.inputs.environment }}"

          if [[ "$TAG" == *"-prod" ]]; then
            TARGET="prod"
            BUILD_NAME="${TAG%-prod}"
          elif [[ "$TAG" == *"-staging" ]]; then
            TARGET="staging"
            BUILD_NAME="${TAG%-staging}"
          elif [[ "$INPUT_ENV" == "prod" ]]; then
            TARGET="prod"
            BUILD_NAME="manual-$(date +%Y%m%d)"
          else
            TARGET="staging"
            BUILD_NAME="manual-$(date +%Y%m%d)"
          fi

          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "BUILD_NAME=$BUILD_NAME" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Validate required secrets for staging distribution
        if: env.SHOULD_BUILD == 'true' && env.TARGET == 'staging'
        shell: bash
        env:
          FIREBASE_APP_ID: ${{ secrets[matrix.app.firebase_secret] }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_APP_ID_SECRET_NAME: ${{ matrix.app.firebase_secret }}
        run: |
          set -euo pipefail
          if [[ -z "${FIREBASE_APP_ID}" ]]; then
            echo "Missing GitHub secret: ${FIREBASE_APP_ID_SECRET_NAME}"
            exit 1
          fi
          if [[ -z "${FIREBASE_TOKEN}" ]]; then
            echo "Missing GitHub secret: FIREBASE_TOKEN"
            exit 1
          fi

      - name: Validate app Firebase config presence
        if: env.SHOULD_BUILD == 'true'
        shell: bash
        env:
          PROJECT_PATH: ${{ matrix.app.project_path }}
        run: |
          set -euo pipefail
          CONFIG_FILE="${PROJECT_PATH}/android/app/google-services.json"
          if [[ ! -f "${CONFIG_FILE}" ]]; then
            echo "Missing Firebase config: ${CONFIG_FILE}"
            echo "Run dev-hub/tools/install-mobile-firebase-configs.ps1 with matching Firebase app IDs."
            exit 1
          fi

      - name: Flutter pub get
        if: env.SHOULD_BUILD == 'true'
        working-directory: ${{ matrix.app.project_path }}
        run: flutter pub get

      - name: Flutter analyze
        if: env.SHOULD_BUILD == 'true'
        working-directory: ${{ matrix.app.project_path }}
        run: flutter analyze --no-fatal-infos

      - name: Build release binary
        if: env.SHOULD_BUILD == 'true'
        working-directory: ${{ matrix.app.project_path }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${TARGET}" == "prod" ]]; then
            echo "API_BASE_URL=https://api.leopardo-rh.com/api/v1" > .env.build
            flutter build appbundle --release \
              --dart-define-from-file=.env.build \
              --build-name="${BUILD_NAME}" \
              --build-number="${BUILD_NUMBER}"
            echo "BUILD_FILE=${{ matrix.app.project_path }}/build/app/outputs/bundle/release/app-release.aab" >> "$GITHUB_ENV"
          else
            echo "API_BASE_URL=https://gestionemployerbackend.onrender.com/api/v1" > .env.build
            flutter build apk --release \
              --dart-define-from-file=.env.build \
              --build-name="${BUILD_NAME}" \
              --build-number="${BUILD_NUMBER}"
            echo "BUILD_FILE=${{ matrix.app.project_path }}/build/app/outputs/flutter-apk/app-release.apk" >> "$GITHUB_ENV"
          fi

      - name: Verify build output exists
        if: env.SHOULD_BUILD == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f "${BUILD_FILE}"

      - name: Upload mobile artifact
        if: env.SHOULD_BUILD == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.app.artifact_name }}-${{ env.TARGET }}-${{ env.BUILD_NAME }}
          path: ${{ env.BUILD_FILE }}
          if-no-files-found: error
          retention-days: 30

      - name: Firebase App Distribution (staging)
        if: env.SHOULD_BUILD == 'true' && env.TARGET == 'staging'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets[matrix.app.firebase_secret] }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: testeurs-internes
          file: ${{ env.BUILD_FILE }}
          releaseNotes: |
            Leopardo ${{ matrix.app.name }} ${{ env.BUILD_NAME }}
            Ref: ${{ github.ref_name }}
            Notes: ${{ github.event.inputs.release_notes || 'Tag build' }}
            Backend: https://gestionemployerbackend.onrender.com

      - name: Verify Firebase App Distribution release is visible
        if: env.SHOULD_BUILD == 'true' && env.TARGET == 'staging'
        shell: bash
        env:
          FIREBASE_APP_ID: ${{ secrets[matrix.app.firebase_secret] }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          APP_NAME: ${{ matrix.app.name }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
        run: |
          set -euo pipefail
          echo "Verifying Firebase App Distribution read-after-write for ${APP_NAME} build ${BUILD_NUMBER}."
          npx --yes firebase-tools appdistribution:releases:list \
            --app "${FIREBASE_APP_ID}" \
            --token "${FIREBASE_TOKEN}" \
            --limit 10 \
            --json > firebase-releases.json

          node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('firebase-releases.json', 'utf8'));
          const expectedBuild = process.env.BUILD_NUMBER;
          const appName = process.env.APP_NAME;
          const releases = Array.isArray(payload.result)
            ? payload.result
            : Array.isArray(payload.result?.releases)
              ? payload.result.releases
              : [];
          const match = releases.find((release) => String(release.buildVersion) === String(expectedBuild));
          if (!match) {
            console.error(`Firebase App Distribution release not visible for ${appName} build ${expectedBuild}.`);
            console.error(`Visible build versions: ${releases.map((release) => release.buildVersion).join(', ') || 'none'}`);
            process.exit(1);
          }
          console.log(`Firebase App Distribution release visible for ${appName}: ${match.name || match.displayVersion || match.buildVersion}`);
          NODE
