name: CI Secrets Doc Guard

# Issue #7271 — la documentation des secrets CI/CD dérivait en silence : un
# re-audit (2026-09-13) a trouvé 16 secrets et 17 variables référencés par les
# workflows mais absents de `docs/CI_CD_SECRETS.md`, dont *tous* les secrets de
# déploiement production. Une rotation ou une reprise sur incident s'appuie sur
# ce document : il ne peut pas être faux.
#
# La garde est volontairement limitée aux chemins concernés (workflows, doc,
# script) pour ne pas ajouter de charge aux PR qui n'y touchent pas.

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'docs/CI_CD_SECRETS.md'
      - 'dev-hub/tools/check-ci-secrets-doc.sh'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'docs/CI_CD_SECRETS.md'
      - 'dev-hub/tools/check-ci-secrets-doc.sh'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-secrets-doc-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    timeout-minutes: 10
    name: CI secrets documentation parity (issue #7271)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false

      - name: Verify docs/CI_CD_SECRETS.md covers every workflow secret/variable
        run: bash dev-hub/tools/check-ci-secrets-doc.sh
