name: Architecture Quality

on:
  pull_request:
    # #4719 (audit 360° 2026-08-16) : branches feat/* supprimées du trigger
    # (elles n'existent nulle part — workflow porteur de 3 checks requis).
    branches: [main]
  push:
    branches: [main]
  # Issue #2032 : checks requis (PHPStan Strict, Module Structure, Frontend
  # ESLint+TS) — doivent tourner sur le ref de merge de la merge queue.
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: architecture-check-${{ github.workflow }}-${{ github.ref }}
  # Issue #2131 : porte 3 checks REQUIS (PHPStan Strict, Module Structure,
  # Frontend ESLint+TS) — sur main, un push ne doit jamais annuler le run du
  # commit précédent (sinon le dernier commit de main reste pending 20+ min).
  # Les runs PR gardent l'annulation (feedback rapide sur une même branche).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # #5629 : annuler les runs PR obsolètes pour libérer les runners

jobs:
  # Issue #3708 : les gardes dev-hub (bash pur) n'étaient appelées par aucun
  # workflow — la dérive APP_VERSION (#3528, régression b0630dd5) et la
  # parité .env.example (#1487) sont passées inaperçues sur main. Ce job
  # exécute les gardes non-PHP existantes sur PR et sur push main.
  hygiene-guards:
    timeout-minutes: 45
    name: Hygiene Guards (env, migrations, pays)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
          # check-app-version-sync.sh / check-duplicate-routes.sh comparent
          # GITHUB_BASE_SHA..HEAD — il faut l'historique complet (#5698).
          fetch-depth: 0

      # check-duplicate-routes.sh (issue #5577) exécute `php artisan route:list`
      # — sans vendor/ le pipeline échoue en 255 (constat #5698, audit 2026-08-27).
      - name: Setup PHP + Composer (duplicate routes guard)
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install API dependencies (duplicate routes guard)
        working-directory: api
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: APP_VERSION drift guard (issue #3528)
        run: bash dev-hub/tools/check-app-version-sync.sh api

      - name: .env.example parity guard (issue #1487)
        run: bash dev-hub/tools/check-env-example-parity.sh api

      - name: Migration basename collision guard (issue #1962)
        run: bash dev-hub/tools/check-migration-basename-collisions.sh

      - name: Migration prefix inter-PR guard (issue #5437)
        run: node dev-hub/tools/check-migration-prefixes.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}

      - name: Country catalog guard (issue #2600)
        run: bash dev-hub/tools/check-country-catalog.sh

      - name: Canonical domains guard (issue #3706)
        run: bash dev-hub/tools/check-canonical-domains.sh

      - name: Mobile Firebase stubs guard (issue #3152)
        run: bash dev-hub/tools/check-mobile-firebase-configs.sh

      - name: Migrations tenant — convention #1613 (search_path, audit PM 2026-08-17)
        run: bash dev-hub/tools/check-migrations-tenant-schema.sh
      - name: Geofence single usage path guard (ADR-0016 Phase 2, issue #5353)
        run: bash dev-hub/tools/check-geofence-single-usage.sh

      - name: SmartAttendance purge guard (ADR-0016 Phase 5, issue #5356)
        run: bash dev-hub/tools/check-smartattendance-purged.sh

      - name: MVP schema parity guard — CreatesMvpSchema ↔ migrations tenant (issue #5443)
        run: bash dev-hub/tools/check-mvp-schema-parity.sh api

      - name: Duplicate routes guard (issue #5577)
        run: bash dev-hub/tools/check-duplicate-routes.sh api

      - name: Module isolation guard — no new cross-module imports (issue #5584)
        run: bash dev-hub/tools/check-module-isolation.sh api

      - name: .claim-marker forbidden in working tree (issue #5447)
        run: bash dev-hub/tools/check-no-claim-marker.sh

      - name: Queue strategy coherence guard — database partout (issue #5578)
        run: bash dev-hub/tools/check-queue-strategy-coherence.sh

      - name: Deterministic tests guard — no multi-status assertions (issue #5585)
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash dev-hub/tools/check-tests-deterministic.sh


  phpstan-modules:
    timeout-minutes: 45
    name: PHPStan — Modules Architecture
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          tools: composer

      - name: Install dependencies
        working-directory: api
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run PHPStan on modules
        working-directory: api
        run: vendor/bin/phpstan analyse --configuration=phpstan-modules.neon --memory-limit=1G --no-progress

  # Audit §2.3 / Plan P1: phpstan-strict.neon existed in the repo (level 8 on
  # app/Core, app/Modules, app/Shared) but was never invoked by any workflow
  # — the audit flagged this as a dead config that quietly gave a false sense
  # of stricter coverage. Wired in below, alongside the existing
  # phpstan-modules job it was designed to complement.
  #
  # Issue #1413: level 8 had never run against this codebase in CI, so a
  # baseline (`phpstan-strict-baseline.neon`, ~2950 pre-existing findings,
  # generated via `phpstan analyse --generate-baseline`) now freezes that
  # existing debt. continue-on-error is removed: this job is now blocking on
  # the delta only — any *new* level-8 finding on app/Core/app/Modules/
  # app/Shared fails the PR, while the pre-existing baseline is silenced.
  # See api/ARCHITECTURE.md "Trajectoire PHPStan" for the per-module
  # breakdown and the plan to shrink the baseline over time.
  phpstan-strict:
    timeout-minutes: 45
    name: PHPStan — Strict (Core/Modules/Shared, level 8)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          tools: composer

      - name: Install dependencies
        working-directory: api
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run PHPStan (strict, blocking on delta vs baseline)
        working-directory: api
        run: vendor/bin/phpstan analyse --configuration=phpstan-strict.neon --memory-limit=1G --no-progress

  module-structure-check:
    timeout-minutes: 45
    name: Module Structure Validator
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
          # Issue #5629 : le checkout par défaut (depth 1) ne contient pas le
          # base_sha des PRs à base ancienne → les gardes de diff (cross-module
          # imports, strict_types, accented messages, baseline PHPStan)
          # échouent en exit 128 sur `git rev-parse` → check requis rouge
          # systématique. Historique complet requis.
          fetch-depth: 0

      - name: Check module structure
        run: |
          echo "Checking Clean Architecture module structure..."
          ERRORS=0

          # Discover modules dynamically instead of a hard-coded list, so new
          # modules (or renamed ones) are covered automatically (PA2-ARCH-006).
          MODULES=$(find api/app/Modules -maxdepth 1 -mindepth 1 -type d -printf '%f\n' | sort)

          if [ -z "$MODULES" ]; then
            echo "❌ No modules discovered under api/app/Modules — check the path."
            exit 1
          fi

          # PA2-ARCH-002 : Modules/Absence n'a plus que Interfaces/ + Providers/.
          # Domain/Application/Infrastructure ont ete supprimes car ils dupliquaient
          # integralement les modeles/services reels du module Planning (Absence,
          # AbsenceType, LeaveBalance, LeaveBalanceLog, AbsenceService). Derogation
          # documentee dans api/ARCHITECTURE.md.
          #
          # PA2-ARCH-011 (issue #1414) : meme derogation pour Modules/Expense.
          # Domain/Application/Infrastructure ont ete supprimes car ils dupliquaient
          # integralement le modele/service reel du module Planning (ExpenseClaim,
          # ExpenseItem) — le controller reellement route consommait deja
          # Planning\...\ExpenseClaim, pas Expense\...\ExpenseClaim. Derogation
          # documentee dans api/ARCHITECTURE.md.
          FACADE_ONLY_EXEMPT_LAYERS="Application Domain Infrastructure"
          FACADE_ONLY_MODULES="Absence Expense"

          for MODULE in $MODULES; do
            BASE="api/app/Modules/$MODULE"
            for LAYER in Application Domain Infrastructure Interfaces Providers; do
              if echo "$FACADE_ONLY_MODULES" | grep -qw "$MODULE" && echo "$FACADE_ONLY_EXEMPT_LAYERS" | grep -qw "$LAYER"; then
                continue
              fi
              if [ ! -d "$BASE/$LAYER" ]; then
                echo "❌ Missing: $BASE/$LAYER"
                ERRORS=$((ERRORS + 1))
              fi
            done
          done

          # Core structure
          for LAYER in Auth Tenant; do
            if [ ! -d "api/app/Core/$LAYER" ]; then
              echo "❌ Missing: api/app/Core/$LAYER"
              ERRORS=$((ERRORS + 1))
            fi
          done

          if [ $ERRORS -gt 0 ]; then
            echo ""
            echo "Found $ERRORS structure violations."
            exit 1
          fi
          echo "✅ All module structures valid ($(echo "$MODULES" | wc -l) modules checked)."

      - name: Check module isolation (issue #5584)
        # Garde archunit-style : bloque TOUT nouvel import croisé
        # (`use App\Modules\<X>\` dans un autre module ou dans Core/) — la
        # dette existante (16/18 modules, 57 paires) est actée dans
        # dev-hub/tools/module-isolation-allowlist.txt.
        run: dev-hub/tools/check-module-isolation.sh

      - name: Check CRM client module boundary imports (issue #5745)
        # Garde orientée CRM client : HARD BLOCK des imports vers le CRM
        # commercial (Platform/Marketing), Payroll et Accounting ; tout autre
        # import inter-module exige une exemption justifiée dans
        # crm-boundary-allowlist.txt. En veille tant que Modules/CRM
        # n'existe pas sur main (ADR 0018, ADR-CRM-DUAL-CONTEXTS).
        run: bash dev-hub/tools/check-crm-boundary-imports.sh api

      - name: Check for orphan (unrouted) controllers
        run: dev-hub/tools/check-unrouted-controllers.sh api

      - name: Architecture docs parity guard — modules réels ↔ docs (issue #5589)
        run: bash dev-hub/tools/check-architecture-docs-parity.sh

      - name: Cross-module import guard — no new inter-module imports (issue #5584)
        env:
          DIFF_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base_sha="${DIFF_BASE_SHA:-}"
          head_sha="${DIFF_HEAD_SHA:-}"
          if [[ -z "${base_sha}" || "${base_sha}" == "0000000000000000000000000000000000000000" ]]; then
            base_sha="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          if [[ -z "${head_sha}" ]]; then
            head_sha="$(git rev-parse HEAD)"
          fi
          bash dev-hub/tools/check-cross-module-imports.sh "${base_sha}" "${head_sha}" api

      - name: Check migration basename collisions (issue #1962)
        run: dev-hub/tools/check-migration-basename-collisions.sh

      - name: Report test-schema drift vs migrations (issue #1489, non blocking)
        continue-on-error: true
        run: dev-hub/tools/check-test-schema-drift.sh api

      - name: Check newly added files declare strict_types (PA2-ARCH-009)
        env:
          DIFF_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base_sha="${DIFF_BASE_SHA:-}"
          head_sha="${DIFF_HEAD_SHA:-}"

          if [[ -z "${base_sha}" || "${base_sha}" == "0000000000000000000000000000000000000000" ]]; then
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              base_sha="$(git rev-parse HEAD~1)"
            else
              base_sha="$(git rev-parse HEAD)"
            fi
          fi

          if [[ -z "${head_sha}" ]]; then
            head_sha="$(git rev-parse HEAD)"
          fi

          dev-hub/tools/check-strict-types-new-files.sh "${base_sha}" "${head_sha}" api

      - name: Check no new hardcoded accented messages in controllers (PA2-I18N-007)
        env:
          DIFF_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base_sha="${DIFF_BASE_SHA:-}"
          head_sha="${DIFF_HEAD_SHA:-}"

          if [[ -z "${base_sha}" || "${base_sha}" == "0000000000000000000000000000000000000000" ]]; then
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              base_sha="$(git rev-parse HEAD~1)"
            else
              base_sha="$(git rev-parse HEAD)"
            fi
          fi

          if [[ -z "${head_sha}" ]]; then
            head_sha="$(git rev-parse HEAD)"
          fi

          dev-hub/tools/check-hardcoded-accented-messages.sh "${base_sha}" "${head_sha}" api

      - name: Check no touched module regresses its PHPStan baseline count (PA2-ARCH-005)
        env:
          DIFF_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base_sha="${DIFF_BASE_SHA:-}"
          head_sha="${DIFF_HEAD_SHA:-}"

          if [[ -z "${base_sha}" || "${base_sha}" == "0000000000000000000000000000000000000000" ]]; then
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              base_sha="$(git rev-parse HEAD~1)"
            else
              base_sha="$(git rev-parse HEAD)"
            fi
          fi

          if [[ -z "${head_sha}" ]]; then
            head_sha="$(git rev-parse HEAD)"
          fi

          dev-hub/tools/check-phpstan-baseline-delta.sh "${base_sha}" "${head_sha}" api

      - name: Check no PR adds PHPStan baseline debt (#5448 - garde 0 nouvelle entree)
        env:
          DIFF_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base_sha="${DIFF_BASE_SHA:-}"
          head_sha="${DIFF_HEAD_SHA:-}"

          if [[ -z "${base_sha}" || "${base_sha}" == "0000000000000000000000000000000000000000" ]]; then
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              base_sha="$(git rev-parse HEAD~1)"
            else
              base_sha="$(git rev-parse HEAD)"
            fi
          fi

          if [[ -z "${head_sha}" ]]; then
            head_sha="$(git rev-parse HEAD)"
          fi

          dev-hub/tools/check-phpstan-baseline-debt.sh guard "${base_sha}" "${head_sha}" api

  frontend-lint:
    timeout-minutes: 15
    name: Frontend — ESLint + TypeScript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/web/package-lock.json

      - name: Install dependencies
        working-directory: front/web
        run: npm ci

      - name: TypeScript check
        working-directory: front/web
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: front/web
        run: npx eslint src --ext .ts,.tsx --max-warnings 0
