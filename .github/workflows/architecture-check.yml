name: Architecture Quality

on:
  pull_request:
    branches: [main, feat/clean-architecture, feat/modules-migration]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: architecture-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpstan-modules:
    name: PHPStan — Modules Architecture
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          tools: composer

      - name: Install dependencies
        working-directory: api
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run PHPStan on modules
        working-directory: api
        run: vendor/bin/phpstan analyse --configuration=phpstan-modules.neon --memory-limit=1G --no-progress

  # Audit §2.3 / Plan P1: phpstan-strict.neon existed in the repo (level 8 on
  # app/Core, app/Modules, app/Shared) but was never invoked by any workflow
  # — the audit flagged this as a dead config that quietly gave a false sense
  # of stricter coverage. Wired in below, alongside the existing
  # phpstan-modules job it was designed to complement.
  #
  # Issue #1413: level 8 had never run against this codebase in CI, so a
  # baseline (`phpstan-strict-baseline.neon`, ~2950 pre-existing findings,
  # generated via `phpstan analyse --generate-baseline`) now freezes that
  # existing debt. continue-on-error is removed: this job is now blocking on
  # the delta only — any *new* level-8 finding on app/Core/app/Modules/
  # app/Shared fails the PR, while the pre-existing baseline is silenced.
  # See api/ARCHITECTURE.md "Trajectoire PHPStan" for the per-module
  # breakdown and the plan to shrink the baseline over time.
  phpstan-strict:
    name: PHPStan — Strict (Core/Modules/Shared, level 8)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          tools: composer

      - name: Install dependencies
        working-directory: api
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run PHPStan (strict, blocking on delta vs baseline)
        working-directory: api
        run: vendor/bin/phpstan analyse --configuration=phpstan-strict.neon --memory-limit=1G --no-progress

  module-structure-check:
    name: Module Structure Validator
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check module structure
        run: |
          echo "Checking Clean Architecture module structure..."
          ERRORS=0

          # Discover modules dynamically instead of a hard-coded list, so new
          # modules (or renamed ones) are covered automatically (PA2-ARCH-006).
          MODULES=$(find api/app/Modules -maxdepth 1 -mindepth 1 -type d -printf '%f\n' | sort)

          if [ -z "$MODULES" ]; then
            echo "❌ No modules discovered under api/app/Modules — check the path."
            exit 1
          fi

          # PA2-ARCH-002 : Modules/Absence n'a plus que Interfaces/ + Providers/.
          # Domain/Application/Infrastructure ont ete supprimes car ils dupliquaient
          # integralement les modeles/services reels du module Planning (Absence,
          # AbsenceType, LeaveBalance, LeaveBalanceLog, AbsenceService). Derogation
          # documentee dans api/ARCHITECTURE.md.
          #
          # PA2-ARCH-011 (issue #1414) : meme derogation pour Modules/Expense.
          # Domain/Application/Infrastructure ont ete supprimes car ils dupliquaient
          # integralement le modele/service reel du module Planning (ExpenseClaim,
          # ExpenseItem) — le controller reellement route consommait deja
          # Planning\...\ExpenseClaim, pas Expense\...\ExpenseClaim. Derogation
          # documentee dans api/ARCHITECTURE.md.
          FACADE_ONLY_EXEMPT_LAYERS="Application Domain Infrastructure"
          FACADE_ONLY_MODULES="Absence Expense"

          for MODULE in $MODULES; do
            BASE="api/app/Modules/$MODULE"
            for LAYER in Application Domain Infrastructure Interfaces Providers; do
              if echo "$FACADE_ONLY_MODULES" | grep -qw "$MODULE" && echo "$FACADE_ONLY_EXEMPT_LAYERS" | grep -qw "$LAYER"; then
                continue
              fi
              if [ ! -d "$BASE/$LAYER" ]; then
                echo "❌ Missing: $BASE/$LAYER"
                ERRORS=$((ERRORS + 1))
              fi
            done
          done

          # Core structure
          for LAYER in Auth Tenant; do
            if [ ! -d "api/app/Core/$LAYER" ]; then
              echo "❌ Missing: api/app/Core/$LAYER"
              ERRORS=$((ERRORS + 1))
            fi
          done

          if [ $ERRORS -gt 0 ]; then
            echo ""
            echo "Found $ERRORS structure violations."
            exit 1
          fi
          echo "✅ All module structures valid ($(echo "$MODULES" | wc -l) modules checked)."

      - name: Check for orphan (unrouted) controllers
        run: dev-hub/tools/check-unrouted-controllers.sh api

      - name: Report test-schema drift vs migrations (issue #1489, non blocking)
        continue-on-error: true
        run: dev-hub/tools/check-test-schema-drift.sh api

      - name: Check newly added files declare strict_types (PA2-ARCH-009)
        env:
          DIFF_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base_sha="${DIFF_BASE_SHA:-}"
          head_sha="${DIFF_HEAD_SHA:-}"

          if [[ -z "${base_sha}" || "${base_sha}" == "0000000000000000000000000000000000000000" ]]; then
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              base_sha="$(git rev-parse HEAD~1)"
            else
              base_sha="$(git rev-parse HEAD)"
            fi
          fi

          if [[ -z "${head_sha}" ]]; then
            head_sha="$(git rev-parse HEAD)"
          fi

          dev-hub/tools/check-strict-types-new-files.sh "${base_sha}" "${head_sha}" api

      - name: Check no new hardcoded accented messages in controllers (PA2-I18N-007)
        env:
          DIFF_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base_sha="${DIFF_BASE_SHA:-}"
          head_sha="${DIFF_HEAD_SHA:-}"

          if [[ -z "${base_sha}" || "${base_sha}" == "0000000000000000000000000000000000000000" ]]; then
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              base_sha="$(git rev-parse HEAD~1)"
            else
              base_sha="$(git rev-parse HEAD)"
            fi
          fi

          if [[ -z "${head_sha}" ]]; then
            head_sha="$(git rev-parse HEAD)"
          fi

          dev-hub/tools/check-hardcoded-accented-messages.sh "${base_sha}" "${head_sha}" api

      - name: Check no touched module regresses its PHPStan baseline count (PA2-ARCH-005)
        env:
          DIFF_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base_sha="${DIFF_BASE_SHA:-}"
          head_sha="${DIFF_HEAD_SHA:-}"

          if [[ -z "${base_sha}" || "${base_sha}" == "0000000000000000000000000000000000000000" ]]; then
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              base_sha="$(git rev-parse HEAD~1)"
            else
              base_sha="$(git rev-parse HEAD)"
            fi
          fi

          if [[ -z "${head_sha}" ]]; then
            head_sha="$(git rev-parse HEAD)"
          fi

          dev-hub/tools/check-phpstan-baseline-delta.sh "${base_sha}" "${head_sha}" api

  frontend-lint:
    name: Frontend — ESLint + TypeScript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/web/package-lock.json

      - name: Install dependencies
        working-directory: front/web
        run: npm ci

      - name: TypeScript check
        working-directory: front/web
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: front/web
        run: npx eslint src --ext .ts,.tsx --max-warnings 0
