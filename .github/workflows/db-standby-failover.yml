name: DB Standby & Auto-Failover

# ─────────────────────────────────────────────────────────────────────────────
# But : garder l'API prod EN LIGNE quand la base Neon active épuise son quota
# mensuel (plan gratuit — reset le 1er du mois) ou tombe.
#
# Principe (aucune modification applicative, aucune carte bancaire) :
#   - deux bases Neon : PRIMAIRE (secrets.DATABASE_URL) et SECOURS
#     (secrets.STANDBY_DATABASE_URL) ;
#   - la source de vérité de la base RÉELLEMENT utilisée par Render est la
#     variable d'environnement `DB_URL` du service prod, lue via l'API Render
#     (pas de fichier d'état à maintenir) ;
#   - job `watchdog` (toutes les 20 min) : sonde la base LIVE. Si elle ne
#     répond plus, bascule `DB_URL` sur le secours puis redéploie le service ;
#   - job `sync` (horaire) : recharge la base d'appoint (celle qui n'est PAS
#     utilisée par la prod) depuis la base LIVE — la copie reste fraîche
#     (RPO ≤ 1 h) dans les deux sens de rotation, ce qui rend une bascule
#     possible même après un premier incident (avant, le renversement de rôle
#     laissait la base d'appoint sans marqueur => bascule refusée) ;
#   - sauvegardes : le même job publie une fois par jour (créneau 03:23 UTC, ou
#     mode=backup) un dump **chiffré age** de la base vivante en artefact 90 j,
#     auto-vérifié (`age --decrypt` + `pg_restore --list`). Dépôt PUBLIC : aucun
#     dump n'est jamais publié en clair — sans BACKUP_AGE_RECIPIENT le job
#     refuse d'écraser une copie étrangère et ne publie rien ;
#   - battement de cœur : le watchdog est aussi déclenché par un push sur main
#     (cadence limitée à un vrai contrôle / 15 min), car l'ordonnanceur GitHub a
#     cessé de déclencher les crons sur ce dépôt le 2026-09-21 (arrêt à 01:37) ;
#   - job `switch-back` (manuel, confirm=YES) : retour vers la PRIMAIRE, avec
#     dump de sécurité de la base courante avant bascule.
#
# Garde-fous (à ne pas retirer) :
#   1. aucun mode n'écrit JAMAIS dans la base LIVE ;
#   2. la bascule exige que le secours réponde ET porte un marqueur de
#      synchro récent (`_standby_sync`, ≤ 48 h) — jamais de bascule vers une
#      copie vide ou à demi restau-rée (le job `sync` DROP les schémas cible
#      avant de restaurer : un sync interrompu rend le marqueur absent) ;
#   3. un dump de sécurité est pris AVANT tout retour arrière ;
#   4. les URLs de connexion sont masquées dans les logs (`::add-mask::`).
#
# Secrets requis : DATABASE_URL (primaire, existant), STANDBY_DATABASE_URL
# (secours), RENDER_PROD_API_KEY + RENDER_PROD_SERVICE_ID (environnement
# `production`) et PROD_RENDER_API_BASE_URL (URL PUBLIQUE du service prod, pour
# le healthcheck post-bascule — l'API de management Render est api.render.com/v1).
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "status = diagnostic | watchdog = sonde + bascule | sync = recharge la copie | backup = dump chiffré immédiat | switch-back = retour vers la base d'origine"
        required: true
        default: "status"
        type: choice
        options:
          - status
          - watchdog
          - sync
          - backup
          - switch-back
      confirm:
        description: "YES obligatoire pour switch-back (destructif pour la base courante)"
        required: false
        default: ""
        type: string
  schedule:
    # Watchdog : toutes les 20 min (détection de quota épuisé / base HS).
    - cron: "9,29,49 * * * *"
    # Recharge du secours : toutes les heures.
    - cron: "23 * * * *"
  # Battement de cœur : l'ordonnanceur GitHub peut cesser de déclencher les
  # crons (constaté le 2026-09-21 : plus aucun run planifié sur le dépôt à
  # partir de 01:37 UTC). Un push sur main relance le watchdog, avec un
  # garde-fou de cadence (au plus un vrai contrôle toutes les 15 min).
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: db-standby-failover
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. Watchdog — sonde la base LIVE et bascule si elle est HS.
  # ───────────────────────────────────────────────────────────────────────────
  watchdog:
    timeout-minutes: 25
    name: Watchdog base LIVE + bascule
    runs-on: ubuntu-latest
    environment: production
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '9,29,49 * * * *')
      || github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'watchdog' || github.event.inputs.mode == 'status'))
    steps:
      - name: Cadence (un push ne déclenche un vrai contrôle que toutes les 15 min)
        id: cadence
        if: github.event_name == 'push'
        shell: bash
        env:
          GH: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          last="$(curl -fsS -H "Authorization: Bearer ${GH}" \
            "https://api.github.com/repos/${REPO}/actions/workflows/db-standby-failover.yml/runs?per_page=30" \
            | jq -r --arg cur "${GITHUB_RUN_ID}" '[.workflow_runs[] | select((.id|tostring) != $cur) | .created_at] | max // empty')"
          if [[ -z "${last}" ]]; then echo "recent=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          age=$(( $(date -u +%s) - $(date -u -d "${last}" +%s) ))
          echo "Dernier run : ${last} (il y a ${age}s)"
          if [[ ${age} -lt 900 ]]; then echo "recent=true" >> "$GITHUB_OUTPUT"; else echo "recent=false" >> "$GITHUB_OUTPUT"; fi

      - name: Outils
        if: steps.cadence.outputs.recent != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; fi
          psql --version

      - name: Sonder la base LIVE et basculer si besoin
        if: steps.cadence.outputs.recent != 'true'
        shell: bash
        env:
          PRIMARY_URL: ${{ secrets.DATABASE_URL }}
          STANDBY_URL: ${{ secrets.STANDBY_DATABASE_URL }}
          # PROD_RENDER_API_BASE_URL = URL PUBLIQUE du service
          # (https://leopardo-prod.onrender.com), pas l'API de management Render
          # (constat run 35557975929 : 404). L'API de management est explicite.
          HEALTH_URL: ${{ secrets.PROD_RENDER_API_BASE_URL }}/api/v1/health
          RENDER_API_KEY: ${{ secrets.RENDER_PROD_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_PROD_SERVICE_ID }}
          RENDER_API_BASE: https://api.render.com/v1
          # mode=status : diagnostic seul, aucune mutation.
          DRY_RUN: ${{ github.event.inputs.mode == 'status' && '1' || '0' }}
        run: |
          set -euo pipefail
          : "${PRIMARY_URL:?secrets.DATABASE_URL manquant}"
          : "${STANDBY_URL:?secrets.STANDBY_DATABASE_URL manquant (base de secours non configurée)}"
          : "${RENDER_API_KEY:?secrets.RENDER_PROD_API_KEY manquant}"
          : "${RENDER_SERVICE_ID:?secrets.RENDER_PROD_SERVICE_ID manquant}"
          api="${RENDER_API_BASE:-https://api.render.com/v1}"

          # Jamais de mot de passe en clair dans les logs (les valeurs Render ne
          # sont pas des « secrets » GitHub : masquage explicite).
          echo "::add-mask::${PRIMARY_URL}"
          echo "::add-mask::${STANDBY_URL}"

          host_of() { sed -E 's#^[a-zA-Z+]+://([^@]*@)?([^/:]+).*#\2#' <<<"$1"; }
          probe() { PGCONNECT_TIMEOUT=8 PGSSLMODE=require psql "$1" -AtXc 'select 1' >/dev/null 2>&1; }

          render_db_url() {
            curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" \
              "${api}/services/${RENDER_SERVICE_ID}/env-vars?limit=100" \
              | jq -r '.[].envVar | select(.key=="DB_URL") | .value'
          }

          PRIMARY_HOST="$(host_of "${PRIMARY_URL}")"
          STANDBY_HOST="$(host_of "${STANDBY_URL}")"
          if [[ "${PRIMARY_HOST}" == "${STANDBY_HOST}" ]]; then
            echo "::error::DATABASE_URL et STANDBY_DATABASE_URL pointent la MÊME base (${PRIMARY_HOST}) — secours inutile, configuration à corriger."
            exit 1
          fi

          LIVE_URL="$(render_db_url)"
          echo "::add-mask::${LIVE_URL}"
          LIVE_HOST="$(host_of "${LIVE_URL}")"

          if [[ "${LIVE_HOST}" == "${STANDBY_HOST}" ]]; then LIVE_KIND=secours; SPARE_URL="${PRIMARY_URL}"; SPARE_KIND=primaire
          elif [[ "${LIVE_HOST}" == "${PRIMARY_HOST}" ]]; then LIVE_KIND=primaire; SPARE_URL="${STANDBY_URL}"; SPARE_KIND=secours
          else
            echo "::error::DB_URL de Render (${LIVE_HOST}) n'est ni la primaire ni le secours connus — bascule refusée (config inconnue)."
            exit 1
          fi

          SPARE_HOST="$(host_of "${SPARE_URL}")"
          echo "Base LIVE (Render DB_URL) : ${LIVE_KIND} (${LIVE_HOST})"
          echo "Base de secours          : ${SPARE_KIND} (${SPARE_HOST})"

          # Sonde LIVE : 3 tentatives espacées (évite une bascule sur un incident réseau transitoire).
          live_ok=0
          for attempt in 1 2 3; do
            if probe "${LIVE_URL}"; then live_ok=1; break; fi
            echo "LIVE injoignable (tentative ${attempt}/3)"
            sleep 20
          done

          if [[ ${live_ok} -eq 1 ]]; then
            {
              echo "### Watchdog base — OK"
              echo ""
              echo "- Base LIVE : **${LIVE_KIND}** (\`${LIVE_HOST}\`) — répond."
              echo "- Aucune action (la bascule est volontairement « collante » : on ne revient pas automatiquement sur la primaire, le job \`switch-back\` est manuel)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::warning::Base LIVE ${LIVE_KIND} (${LIVE_HOST}) injoignable — évaluation du secours."

          if ! probe "${SPARE_URL}"; then
            echo "::error::LES DEUX BASES SONT INJOIGNABLES (${LIVE_HOST}, ${SPARE_HOST}) — aucune bascule possible, intervention humaine requise."
            exit 1
          fi

          # Marqueur de synchro : refuse de basculer vers une copie à demi
          # restaurée. Deux cas acceptés :
          #   (a) marqueur récent (<= 48 h)      -> copie vérifiée par le job sync ;
          #   (b) secours VIERGE (aucune table de migrations) -> reprise à zéro,
          #       schéma créé par les migrations au boot (aucune donnée à copier :
          #       utilisé quand la source est morte et qu'aucune sauvegarde n'existe).
          # Refusé : des tables existent mais pas de marqueur (restauration
          # interrompue) -> la bascule conduirait à une base incohérente.
          synced_at="$(PGCONNECT_TIMEOUT=8 PGSSLMODE=require psql "${SPARE_URL}" -AtXc \
            "select to_char(synced_at,'YYYY-MM-DD HH24:MI:SS') from public._standby_sync order by id desc limit 1;" 2>/dev/null || true)"
          age_h=""
          if [[ -n "${synced_at}" ]]; then
            marker_epoch="$(date -u -d "${synced_at} UTC" +%s 2>/dev/null || echo 0)"
            age_h=$(( ( $(date -u +%s) - marker_epoch ) / 3600 ))
            echo "Secours synchronisé il y a ${age_h} h (${synced_at} UTC)"
            if [[ "${marker_epoch}" -eq 0 || "${age_h}" -gt 48 ]]; then
              echo "::error::Bascule REFUSÉE : dernière synchro du secours trop ancienne (${synced_at} UTC, ${age_h} h). Lancer le job 'sync' d'abord."
              exit 1
            fi
          else
            spare_migrations="$(PGCONNECT_TIMEOUT=8 PGSSLMODE=require psql "${SPARE_URL}" -AtXc \
              "select count(*) from public.migrations;" 2>/dev/null || echo "")"
            if [[ -z "${spare_migrations}" || "${spare_migrations}" == "0" ]]; then
              echo "::warning::Secours VIERGE (aucune donnée restaurée) — bascule autorisée : le schéma sera créé par les migrations au boot du conteneur. Source injoignable et aucune sauvegarde disponible : reprise à zéro assumée."
            else
              echo "::error::Bascule REFUSÉE : le secours contient ${spare_migrations} migrations mais aucun marqueur _standby_sync — copie incohérente (restauration interrompue). Lancer 'sync', puis relancer le watchdog."
              exit 1
            fi
          fi

          if [[ "${DRY_RUN}" == "1" ]]; then
            echo "::notice::DRY-RUN (mode=status) : bascule nécessaire mais NON appliquée. Relancer en mode 'watchdog'."
            exit 0
          fi

          if [[ -n "${age_h}" ]]; then echo "Bascule : DB_URL <- ${SPARE_KIND} (${SPARE_HOST}), synchro ${age_h} h — perte de données attendue ≤ ${age_h} h."
          else echo "Bascule : DB_URL <- ${SPARE_KIND} (${SPARE_HOST}), secours vierge — reprise à zéro (aucune donnée copiable)."; fi
          curl -fsS -X PUT -H "Authorization: Bearer ${RENDER_API_KEY}" -H "Content-Type: application/json" \
            "${api}/services/${RENDER_SERVICE_ID}/env-vars/DB_URL" \
            -d "$(jq -nc --arg v "${SPARE_URL}" '{value:$v}')" >/dev/null
          echo "DB_URL mis à jour sur Render."

          curl -fsS -X POST -H "Authorization: Bearer ${RENDER_API_KEY}" -H "Content-Type: application/json" \
            "${api}/services/${RENDER_SERVICE_ID}/deploys" -d '{"clearCache":"do_not_clear"}' >/dev/null
          echo "Redéploiement déclenché (la nouvelle DB_URL est appliquée au boot du conteneur)."

          # Attente de santé (best effort : le spin-up Render gratuit peut être lent).
          if [[ -n "${HEALTH_URL:-}" ]]; then
            for attempt in $(seq 1 15); do
              if curl -fsS --max-time 15 "${HEALTH_URL}" | grep -q '"status":"ok"'; then
                echo "API prod saine après bascule (tentative ${attempt})."
                healthy=1; break
              fi
              sleep 20
            done
          fi

          {
            echo "### Bascule DB automatique ✅"
            echo ""
            echo "- Base LIVE précédente : **${LIVE_KIND}** (\`${LIVE_HOST}\`) — injoignable (quota épuisé ou panne)."
            if [[ -n "${age_h}" ]]; then
              echo "- Nouvelle base LIVE : **${SPARE_KIND}** (\`${SPARE_HOST}\`), copie datant de ${age_h} h (\`${synced_at}\` UTC)."
              echo "- Perte de données attendue : ≤ ${age_h} h (dernière synchro)."
            else
              echo "- Nouvelle base LIVE : **${SPARE_KIND}** (\`${SPARE_HOST}\`) — **vierge** : le schéma est recréé par les migrations au boot, aucune donnée reprise (source morte, aucune sauvegarde disponible)."
            fi
            echo "- Retour vers la primaire : **manuel** — job \`switch-back\` (confirm=YES), précédé d'un dump de sécurité."
            echo ""
            echo "Seuils/quota : la base écartée repart au prochain reset mensuel Neon (1er du mois) ; la faire re-synchroniser par le job \`sync\` avant tout retour arrière."
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${healthy:-0}" != "1" ]]; then
            echo "::warning::Bascule appliquée mais l'API n'a pas répondu 'ok' dans le délai imparti — vérifier /api/v1/health (migrations au boot possibles)."
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # 2. Sync — entretient la COPIE : dump de la base LIVE -> restauration sur la
  #    base d'appoint (celle que la prod n'utilise PAS).
  #
  #    Politique de rotation : la base d'appoint est rechargée dès qu'elle est
  #    joignable, quel que soit le sens de la rotation. C'est indispensable :
  #    après une première bascule, la base d'origine redevient « appoint » ; si
  #    on ne la rechargeait pas, elle resterait sans marqueur `_standby_sync` et
  #    le watchdog refuserait la bascule suivante (blocage définitif).
  #
  #    Garde-fou données : si la base d'appoint contient des tables SANS
  #    marqueur (copie « étrangère » — typiquement la base d'origine qui revient
  #    après un reset de quota), un dump de sécurité est publié en artefact AVANT
  #    l'écrasement : rien n'est perdu silencieusement.
  # ───────────────────────────────────────────────────────────────────────────
  sync:
    timeout-minutes: 45
    name: Entretient la copie de secours
    runs-on: ubuntu-latest
    environment: production
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '23 * * * *')
      || (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'sync' || github.event.inputs.mode == 'backup'))
    steps:
      - name: Outils (client PostgreSQL 18 — le serveur Neon est en 18)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common age
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Copie LIVE -> base d'appoint (+ sauvegarde chiffrée)
        shell: bash
        env:
          PRIMARY_URL: ${{ secrets.DATABASE_URL }}
          STANDBY_URL: ${{ secrets.STANDBY_DATABASE_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_PROD_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_PROD_SERVICE_ID }}
          RENDER_API_BASE: https://api.render.com/v1
          # Chiffrement age OBLIGATOIRE avant toute publication de dump :
          # le dépôt est PUBLIC, un artefact contenant une base prod en clair
          # serait téléchargeable par n'importe qui.
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
          FORCE_BACKUP: ${{ github.event.inputs.mode == 'backup' && '1' || '0' }}
        run: |
          set -euo pipefail
          api="${RENDER_API_BASE:-https://api.render.com/v1}"
          api="${api%/}"
          case "${api}" in */v1) ;; *) api="${api}/v1" ;; esac
          echo "::add-mask::${PRIMARY_URL}"
          echo "::add-mask::${STANDBY_URL}"

          host_of() { sed -E 's#^[a-zA-Z+]+://([^@]*@)?([^/:]+).*#\2#' <<<"$1"; }
          probe() { PGCONNECT_TIMEOUT=8 PGSSLMODE=require psql "$1" -AtXc 'select 1' >/dev/null 2>&1; }
          q() { PGCONNECT_TIMEOUT=8 PGSSLMODE=require psql "$1" -AtXc "$2" 2>/dev/null || true; }

          age_available=0
          if [[ -n "${BACKUP_AGE_RECIPIENT:-}" ]] && command -v age >/dev/null 2>&1; then age_available=1; fi
          if [[ ${age_available} -eq 0 ]]; then
            echo "::warning::BACKUP_AGE_RECIPIENT absent ou age indisponible : les dumps resteront LOCAUX (aucune publication d'artefact, dépôt public oblige)."
          fi

          LIVE_URL="$(curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "${api}/services/${RENDER_SERVICE_ID}/env-vars?limit=100" \
            | jq -r '.[].envVar | select(.key=="DB_URL") | .value')"
          echo "::add-mask::${LIVE_URL}"

          PRIMARY_HOST="$(host_of "${PRIMARY_URL}")"
          STANDBY_HOST="$(host_of "${STANDBY_URL}")"
          LIVE_HOST="$(host_of "${LIVE_URL}")"

          if [[ "${LIVE_HOST}" == "${PRIMARY_HOST}" ]]; then
            LIVE_KIND=primaire; SPARE_URL="${STANDBY_URL}"; SPARE_KIND=secours
          elif [[ "${LIVE_HOST}" == "${STANDBY_HOST}" ]]; then
            LIVE_KIND=secours; SPARE_URL="${PRIMARY_URL}"; SPARE_KIND=primaire
          else
            echo "::error::DB_URL de Render (${LIVE_HOST}) n'est ni la primaire ni le secours connus — recharge refusée."
            exit 1
          fi
          SPARE_HOST="$(host_of "${SPARE_URL}")"

          if ! probe "${LIVE_URL}"; then
            echo "::warning::Base LIVE (${LIVE_KIND}, ${LIVE_HOST}) injoignable — rien à copier, recharge ignorée."
            exit 0
          fi
          # 1) SAUVEGARDE d'abord : elle ne dépend d'aucune autre base (le mode
          #    backup doit produire un dump même si l'appoint est injoignable).
          dump="$(mktemp -t standby-XXXXXX.dump)"
          pg_dump --format=custom --no-owner --no-privileges --file="${dump}" "${LIVE_URL}"
          echo "Dump ${LIVE_KIND} (${LIVE_HOST}) : $(stat -c %s "${dump}") octets"

          # Sauvegarde chiffrée : le dump de la base VIVANTE, publié une fois par
          # jour (créneau 03:23 UTC) ou sur demande (mode=backup). Auto-vérifiée
          # par un `pg_restore --list` après déchiffrement : un dump illisible ne
          # sert à rien.
          daily=0
          if [[ "${FORCE_BACKUP}" == "1" || "$(date -u +%H)" == "03" ]]; then daily=1; fi
          if [[ ${age_available} -eq 1 && ${daily} -eq 1 ]]; then
            age --recipient "${BACKUP_AGE_RECIPIENT}" --output "${dump}.age" "${dump}"
            if [[ -n "${BACKUP_AGE_IDENTITY:-}" ]]; then
              ident="$(mktemp)"; umask 077; printf '%s\n' "${BACKUP_AGE_IDENTITY}" > "${ident}"
              verify="$(mktemp)"
              age --decrypt --identity "${ident}" --output "${verify}" "${dump}.age"
              if pg_restore --list "${verify}" > /dev/null; then
                echo "Sauvegarde chiffrée auto-vérifiée : déchiffrement + pg_restore --list OK."
              else
                echo "::error::Sauvegarde chiffrée illisible (pg_restore --list a échoué) — artefact NON publié."
                rm -f "${ident}" "${verify}" "${dump}.age"
              fi
              rm -f "${ident}" "${verify}"
            else
              echo "::warning::BACKUP_AGE_IDENTITY absent : la sauvegarde chiffrée n'a pas pu être auto-vérifiée (elle reste restaurable avec la clé privée age)."
            fi
            if [[ -f "${dump}.age" ]]; then
              echo "backup_artifact=${dump}.age" >> "$GITHUB_ENV"
            fi
          fi

          if ! probe "${SPARE_URL}"; then
            echo "::warning::Base d'appoint (${SPARE_KIND}, ${SPARE_HOST}) injoignable (quota épuisé ?) — copie non effectuée ; la sauvegarde chiffrée ci-dessus reste valable. Réessai au prochain créneau horaire."
            exit 0
          fi

          # Copie « étrangère » : des tables, mais aucun marqueur de synchro.
          # On refuse d'écraser sans dump de sécurité CHIFFRÉ disponible.
          existing_migrations="$(q "${SPARE_URL}" 'select count(*) from public.migrations;')"
          has_marker="$(q "${SPARE_URL}" 'select count(*) from public._standby_sync;')"
          if [[ -n "${existing_migrations}" && "${existing_migrations}" != "0" && -z "${has_marker}" ]]; then
            if [[ ${age_available} -eq 0 ]]; then
              echo "::error::La base d'appoint (${SPARE_HOST}) contient ${existing_migrations} migrations sans marqueur (copie étrangère) et aucun chiffrement age n'est disponible : écrasement REFUSÉ pour ne pas perdre ces données (dépôt public = pas de dump en clair)."
              exit 1
            fi
            mkdir -p /tmp/spare-safety-dumps
            raw="/tmp/spare-safety-dumps/spare-${SPARE_KIND}-before-overwrite-$(date -u +%Y%m%d-%H%M%S).dump"
            pg_dump --format=custom --no-owner --no-privileges --file="${raw}" "${SPARE_URL}"
            age --recipient "${BACKUP_AGE_RECIPIENT}" --output "${raw}.age" "${raw}"
            rm -f "${raw}"
            echo "safety_dump=${raw}.age" >> "$GITHUB_ENV"
            echo "::warning::Base d'appoint (${SPARE_HOST}) = copie étrangère (${existing_migrations} migrations, aucun marqueur) : dump de sécurité CHIFFRÉ publié en artefact AVANT écrasement."
          fi

          # Remise à zéro de la base d'appoint (jamais la base LIVE).
          psql "${SPARE_URL}" -v ON_ERROR_STOP=1 -q \
            -c "DROP SCHEMA IF EXISTS shared_tenants CASCADE; DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;" >/dev/null

          rc=0
          pg_restore --no-owner --no-privileges --dbname="${SPARE_URL}" "${dump}" || rc=$?
          if [[ ${rc} -ne 0 ]]; then
            echo "::warning::pg_restore a retourné ${rc} (avertissements non bloquants possibles) — la vérification par comptage fait foi."
          fi

          migrated="$(q "${SPARE_URL}" 'select count(*) from public.migrations;')"
          users="$(q "${SPARE_URL}" 'select count(*) from public.users;')"
          if [[ -z "${migrated}" || "${migrated}" == "NA" || "${migrated}" -lt 1 ]]; then
            echo "::error::Base d'appoint incohérente après restauration (table migrations absente/vide) — marqueur non posé, bascule bloquée jusqu'à une recharge valide."
            exit 1
          fi

          psql "${SPARE_URL}" -v ON_ERROR_STOP=1 -q -c \
            "CREATE TABLE IF NOT EXISTS public._standby_sync (id bigserial primary key, synced_at timestamptz not null default now(), source_host text, migrations int, users int);
             INSERT INTO public._standby_sync (source_host, migrations, users) VALUES ('${LIVE_HOST}', ${migrated}, ${users});" >/dev/null

          rm -f "${dump}"
          {
            echo "### Copie de secours rechargée ✅"
            echo ""
            echo "- Source (LIVE) : \`${LIVE_HOST}\` (${LIVE_KIND}) — ${migrated} migrations, ${users} utilisateurs."
            echo "- Cible (appoint) : \`${SPARE_HOST}\` (${SPARE_KIND}) — marqueur \`_standby_sync\` posé."
            echo "- RPO en cas de bascule automatique : ≤ 1 h."
            if [[ ${age_available} -eq 0 ]]; then
              echo "- ⚠️ Sauvegardes chiffrées indisponibles : \`BACKUP_AGE_RECIPIENT\` absent (les dumps restent locaux au runner, jamais publiés)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier la sauvegarde chiffrée du jour
        if: env.backup_artifact != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: db-encrypted-backup
          path: ${{ env.backup_artifact }}
          retention-days: 90

      - name: Publier le dump de sécurité chiffré (copie étrangère écrasée)
        if: env.safety_dump != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: db-spare-safety-dump
          path: ${{ env.safety_dump }}
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────
  # 3. Switch-back — retour manuel vers la primaire (dump de sécurité d'abord).
  # ───────────────────────────────────────────────────────────────────────────
  switch-back:
    timeout-minutes: 45
    name: Retour vers la primaire (manuel)
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'switch-back'
    steps:
      - name: Garde de confirmation
        shell: bash
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          set -euo pipefail
          if [[ "${CONFIRM}" != "YES" ]]; then
            echo "::error::Retour arrière refusé : saisir confirm=YES (la base courante sera remplacée par la primaire)."
            exit 1
          fi

      - name: Outils (client PostgreSQL 18)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common age
          sudo /usr/share/postgresql-common age/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Dump de sécurité de la base courante puis retour sur la primaire
        shell: bash
        env:
          PRIMARY_URL: ${{ secrets.DATABASE_URL }}
          STANDBY_URL: ${{ secrets.STANDBY_DATABASE_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_PROD_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_PROD_SERVICE_ID }}
          RENDER_API_BASE: https://api.render.com/v1
          # Le dépôt est PUBLIC : le dump de sécurité doit être chiffré avant
          # publication (sinon n'importe qui peut le télécharger).
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          api="${RENDER_API_BASE:-https://api.render.com/v1}"
          echo "::add-mask::${PRIMARY_URL}"
          echo "::add-mask::${STANDBY_URL}"
          host_of() { sed -E 's#^[a-zA-Z+]+://([^@]*@)?([^/:]+).*#\2#' <<<"$1"; }
          probe() { PGCONNECT_TIMEOUT=8 PGSSLMODE=require psql "$1" -AtXc 'select 1' >/dev/null 2>&1; }

          if [[ -z "${BACKUP_AGE_RECIPIENT:-}" ]] || ! command -v age >/dev/null 2>&1; then
            echo "::error::Retour arrière refusé : la base courante doit être sauvegardée AVANT bascule et le dépôt est public — un dump en clair ne peut pas y être publié. Renseigner BACKUP_AGE_RECIPIENT."
            exit 1
          fi

          LIVE_URL="$(curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "${api}/services/${RENDER_SERVICE_ID}/env-vars?limit=100" \
            | jq -r '.[].envVar | select(.key=="DB_URL") | .value')"
          echo "::add-mask::${LIVE_URL}"
          LIVE_HOST="$(host_of "${LIVE_URL}")"
          PRIMARY_HOST="$(host_of "${PRIMARY_URL}")"

          if [[ "${LIVE_HOST}" == "${PRIMARY_HOST}" ]]; then
            echo "::notice::La prod tourne déjà sur la primaire — rien à faire."
            exit 0
          fi
          if ! probe "${PRIMARY_URL}"; then
            echo "::error::Primaire injoignable — retour arrière refusé (l'API perdrait sa base)."
            exit 1
          fi

          # Dump de sécurité de la base courante (celle qui contient les écritures
          # récentes) : publié en artefact, 30 jours, pour ne rien perdre du tout.
          mkdir -p /tmp/safety-dumps
          raw="/tmp/safety-dumps/backup-before-switchback-$(date -u +%Y%m%d-%H%M%S).dump"
          pg_dump --format=custom --no-owner --no-privileges --file="${raw}" "${LIVE_URL}"
          age --recipient "${BACKUP_AGE_RECIPIENT}" --output "${raw}.age" "${raw}"
          rm -f "${raw}"
          echo "safe_dump=${raw}.age" >> "$GITHUB_ENV"

          curl -fsS -X PUT -H "Authorization: Bearer ${RENDER_API_KEY}" -H "Content-Type: application/json" \
            "${api}/services/${RENDER_SERVICE_ID}/env-vars/DB_URL" \
            -d "$(jq -nc --arg v "${PRIMARY_URL}" '{value:$v}')" >/dev/null
          curl -fsS -X POST -H "Authorization: Bearer ${RENDER_API_KEY}" -H "Content-Type: application/json" \
            "${api}/services/${RENDER_SERVICE_ID}/deploys" -d '{"clearCache":"do_not_clear"}' >/dev/null
          {
            echo "### Retour sur la primaire"
            echo ""
            echo "- Nouvelle base LIVE : \`${PRIMARY_HOST}\` (primaire)."
            echo "- Dump de sécurité de la base précédente (\`${LIVE_HOST}\`) : artefact \`db-safety-dump\` (30 jours) — y restaurer les écritures post-bascule si nécessaire."
            echo "- ⚠️ La base écartée n'est PAS rechargée automatiquement : le job \`sync\` la reprendra quand elle sera la cible."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier le dump de sécurité
        if: env.safe_dump != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: db-safety-dump
          path: /tmp/safety-dumps/*.dump.age
          retention-days: 30
