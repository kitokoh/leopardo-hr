name: Queue Supervision — prod

# Issue #5282 — DoD : une panne queue est détectée en < 15 min.
# Issue #7694 — [AUDIT][MAJEUR] : plus AUCUN credential de prod dans ce
# workflow. L'ancienne version injectait DB_HOST/DB_USERNAME/DB_PASSWORD et
# APP_KEY de production dans des runners `ubuntu-latest` toutes les 5 min :
# surface d'exfiltration permanente (toute modification du workflow ou d'une
# action consommée exécutait du code arbitraire avec les secrets DB prod,
# 288 fois/jour) et APP_KEY hors du périmètre de prod. La supervision est
# rétrogradée en sonde HTTP : `GET $APP_URL/api/v1/health` expose
# `checks.queue` (pending_total, failed_jobs, oldest_reserved_seconds —
# ajouté par #7694) et les seuils du DoD #5282 sont appliqués ICI, côté
# sonde. Détection au pire : intervalle 5 min + seuil stale 10 min = 15 min.
#
# Le drain `queue-worker-fallback.yml` est SUPPRIMÉ (même audit #7694) : un
# CI n'est pas le worker de secours d'une prod (#7649). Le drain vit dans le
# conteneur web Render (`api/docker-entrypoint.sh`) en attendant le worker
# dédié (#7649, bloqué billing). La garde
# `dev-hub/tools/check-queue-strategy-coherence.sh` interdit le retour d'un
# drain CI ou de secrets DB/APP_KEY dans `.github/workflows/`.

on:
  schedule:
    # Toutes les 5 min (plus d'offset : le drain CI n'existe plus).
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Un seul run de supervision à la fois ; un run en retard REMPLACE le
# précédent (comme launch-observability-smoke, leçon #3968).
concurrency:
  group: queue-supervision
  cancel-in-progress: true

jobs:
  supervise:
    name: Supervise queue (sonde HTTP, sans credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.repository == 'kitokoh/leopardo-hr'
    # Aucun checkout, aucun secret sensible : le job ne lit que l'endpoint
    # public /api/v1/health (throttle 60/1) — permissions vides.
    permissions: {}
    env:
      APP_URL: ${{ secrets.APP_URL }}
      # Alerte Slack opt-in (vide = silencieux, comportement conservé).
      SLACK_MONITORING_WEBHOOK_URL: ${{ secrets.SLACK_MONITORING_WEBHOOK_URL }}
      QUEUE_MAX_PENDING: ${{ vars.QUEUE_MAX_PENDING || '50' }}
      QUEUE_MAX_FAILED: ${{ vars.QUEUE_MAX_FAILED || '10' }}
      QUEUE_MAX_STALE_MINUTES: ${{ vars.QUEUE_MAX_STALE_MINUTES || '10' }}
    steps:
      - name: Superviser la queue via /api/v1/health (seuils DoD #5282)
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${APP_URL:-}" ]]; then
            printf '::notice title=Queue supervision non configurée::Sonde ignorée ; secret APP_URL manquant (repo Settings → Secrets → Actions).\n'
            exit 0
          fi

          alert() {
            local message="$1"
            printf '::error title=Queue supervision::%s\n' "$message"
            if [[ -n "${SLACK_MONITORING_WEBHOOK_URL:-}" ]]; then
              curl -fsS --max-time 10 -H 'Content-Type: application/json' \
                -d "$(jq -cn --arg text "🚨 [queue-supervision] $message" '{text: $text}')" \
                "$SLACK_MONITORING_WEBHOOK_URL" >/dev/null || true
            fi
          }

          # Cold start Render (plan free, veille 15 min) : jusqu'à ~60 s —
          # retries espacés avant de conclure à une panne.
          if ! body="$(curl -fsS --max-time 60 --retry 3 --retry-delay 10 --retry-all-errors "${APP_URL%/}/api/v1/health")"; then
            alert "GET ${APP_URL%/}/api/v1/health injoignable — API down ou réseau : la santé de la queue est INCONNUE."
            exit 1
          fi

          if ! jq -e . >/dev/null 2>&1 <<<"$body"; then
            alert "Réponse /api/v1/health non-JSON — la santé de la queue est INCONNUE."
            exit 1
          fi

          # Trace lisible dans le log du run (mêmes signaux que l'ancien
          # queue:health-check, lus via HTTP au lieu d'un accès SQL direct).
          jq '.checks.queue' <<<"$body"

          queue_ok="$(jq -r '.checks.queue.ok // false' <<<"$body")"
          driver="$(jq -r '.checks.queue.driver // "unknown"' <<<"$body")"
          pending="$(jq -r '.checks.queue.pending_total // 0' <<<"$body")"
          failed="$(jq -r '.checks.queue.failed_jobs // 0' <<<"$body")"
          # -1 = aucune réservation en cours (null côté API) : pas de stale.
          oldest="$(jq -r '.checks.queue.oldest_reserved_seconds // -1' <<<"$body")"

          max_stale_seconds=$(( QUEUE_MAX_STALE_MINUTES * 60 ))
          violations=()

          if [[ "$queue_ok" != "true" ]]; then
            violations+=("checks.queue.ok=false (driver: $driver) — la queue ne répond plus")
          fi
          if (( pending > QUEUE_MAX_PENDING )); then
            violations+=("pending_total=$pending > $QUEUE_MAX_PENDING — backlog en croissance (drain KO ?)")
          fi
          if (( failed > QUEUE_MAX_FAILED )); then
            violations+=("failed_jobs=$failed > $QUEUE_MAX_FAILED")
          fi
          if (( oldest > max_stale_seconds )); then
            violations+=("oldest_reserved_seconds=$oldest > $max_stale_seconds — job réservé trop longtemps (worker mort probable)")
          fi

          if (( ${#violations[@]} > 0 )); then
            message="$(printf '%s | ' "${violations[@]}")"
            alert "${message% | }"
            exit 1
          fi

          echo "Queue saine (driver: $driver, pending: $pending, failed: $failed)."
