name: Stack Consumption Report

# ─────────────────────────────────────────────────────────────────────────────
# Épic #8670 / issues #8674 (coûts & perf) + #8671 (inventaire).
#
# Rapport QUOTIDIEN de consommation des offres gratuites, publié en issue
# `[consommation]` (une seule issue mise à jour, pas une par jour — sinon on
# noie le tracker). Objectif : voir venir le mur AVANT qu'il ne suspende la
# prod, et donner aux bêta-testeurs un historique lisible des incidents.
#
# ⚠️ Ce workflow est en LECTURE SEULE sur les fournisseurs. Il ne bascule rien,
# ne redémarre rien, ne déploie rien : c'est de la mesure.
#
# Secrets attendus (facultatifs — une section manquante est signalée, pas
# bloquante). ⚠️ Les secrets de production vivent sur l'ENVIRONNEMENT
# `production`, pas au niveau dépôt — d'où `environment: production` sur le job.
#   RENDER_PROD_API_KEY / RENDER_PROD_SERVICE_ID   → heures & statut prod
#   VERCEL_PROD_TOKEN / VERCEL_PROD_ORG_ID         → déploiements du jour
#   NEON_API_KEY / NEON_PROJECT_ID                 → CU-h & transfert
#   CLOUDFLARE_PROD_API_TOKEN / CLOUDFLARE_PROD_ACCOUNT_ID → builds Pages
#
# #9059 : Neon et Pages étaient annoncés dans le titre de l'issue sans qu'aucun
# step ne les mesure — les seuils s'affichaient sans jamais être comparés à une
# valeur. Les deux steps existent désormais.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # 07:20 UTC — après la fenêtre nocturne, avant la journée de travail EU.
    # Heure décalée des autres crons du dépôt (04/14/24…, */5) pour ne pas
    # s'empiler sur eux dans la file des runners.
    - cron: '20 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: stack-consumption-report
  cancel-in-progress: true

jobs:
  report:
    name: Mesurer et publier
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # #9059 — CAUSE RACINE. Les secrets de production (RENDER_PROD_API_KEY,
    # RENDER_PROD_SERVICE_ID, VERCEL_PROD_TOKEN, CLOUDFLARE_PROD_*) ne sont PAS
    # au niveau dépôt : ils sont stockés sur l'environnement `production`.
    # `deploy-prod.yml` les voit parce que son job déclare
    # `environment: production` ; ce job ne le déclarait pas, donc chaque
    # `secrets.X` de production se résolvait en chaîne vide et le rapport
    # affichait « non mesuré » à chaque exécution — pendant que la limite de
    # 100 déploiements/jour (celle qui a figé la prod le 2026-09-20) restait
    # invisible. Déclarer l'environnement est le correctif ; ajouter des
    # secrets au niveau dépôt aurait dupliqué une source de vérité.
    environment: production
    steps:
      - name: Mesurer la santé réelle des stacks prod et dev
        id: health
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Le registre est dans le dépôt : on le lit via l'API (pas besoin de
          # checkout complet pour une sonde, mais un checkout sparse est plus
          # simple et donne accès aux scripts).
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${{ github.repository }}/contents/deploy/prod-stacks.json" \
            -o /tmp/prod-stacks.json
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${{ github.repository }}/contents/deploy/dev-stacks.json" \
            -o /tmp/dev-stacks.json

          probe() {
            local tier="$1" registry="$2" id url code latency
            for id in $(jq -r '.stacks | keys[]' "$registry"); do
              url="$(jq -r --arg s "$id" '.stacks[$s].api.health_url // empty' "$registry")"
              [[ -n "$url" ]] || { echo "| ${tier} | ${id} | — | — | non provisionnée |"; continue; }
              latency="$(curl -s -o /dev/null -w '%{time_total}' --max-time 60 "$url" || echo 0)"
              code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$url" || echo 000)"
              echo "| ${tier} | ${id} | ${code} | $(awk -v t="$latency" 'BEGIN{printf "%.0f", t*1000}') ms | $( [[ "$code" == "200" ]] && echo OK || echo **EN ERREUR** ) |"
            done
          }

          {
            echo "TABLE_START"
            echo "| tier | stack | HTTP | latence | état |"
            echo "|---|---|---|---|---|"
            probe prod /tmp/prod-stacks.json
            probe dev /tmp/dev-stacks.json
            echo "TABLE_END"
          } > /tmp/health.md
          cat /tmp/health.md

      - name: Consommation Render (heures & suspension)
        shell: bash
        env:
          RENDER_PROD_API_KEY: ${{ secrets.RENDER_PROD_API_KEY }}
          RENDER_PROD_SERVICE_ID: ${{ secrets.RENDER_PROD_SERVICE_ID }}
        run: |
          set -euo pipefail
          out=/tmp/render.md
          if [[ -z "${RENDER_PROD_API_KEY:-}" || -z "${RENDER_PROD_SERVICE_ID:-}" ]]; then
            echo "Render : secrets absents (RENDER_PROD_API_KEY / RENDER_PROD_SERVICE_ID) — non mesuré." > "$out"
            exit 0
          fi

          svc="$(curl -fsSL -H "Authorization: Bearer ${RENDER_PROD_API_KEY}" \
            "https://api.render.com/v1/services/${RENDER_PROD_SERVICE_ID}" || echo '')"

          suspended="$(jq -r 'if (.suspended // "not_suspended") == "not_suspended" then "non" else "OUI (\(.suspended))" end' <<<"$svc" 2>/dev/null || echo "?")"
          plan="$(jq -r '.serviceDetails.plan // .plan // "?"' <<<"$svc" 2>/dev/null || echo "?")"

          # Nombre de suspensions sur 30 jours : c'est LA métrique qui a causé
          # l'incident du 28/09. On la remonte en clair.
          events="$(curl -fsSL -H "Authorization: Bearer ${RENDER_PROD_API_KEY}" \
            "https://api.render.com/v1/services/${RENDER_PROD_SERVICE_ID}/events?limit=100" || echo '[]')"
          since="$(date -u -d '30 days ago' '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || echo '')"
          susp_count="$(jq -r --arg since "$since" '[.[] | .event | select(.type | test("suspender_added")) | select(.timestamp >= $since)] | length' <<<"$events" 2>/dev/null || echo "?")"
          last_susp="$(jq -r '[.[] | .event | select(.type | test("suspender_added")) | .timestamp] | sort | last // "aucune"' <<<"$events" 2>/dev/null || echo "?")"

          {
            echo "- Service : \`${RENDER_PROD_SERVICE_ID}\` (plan **${plan}**)"
            echo "- Suspendu maintenant : **${suspended}**"
            echo "- Suspensions sur 30 jours : **${susp_count}** (dernière : ${last_susp})"
            echo "- Rappel : offre free = **750 h/mois par compte**. Un service pingé 24/7"
            echo "  consomme ~730 h ; **deux** services pingés sur le même compte dépassent"
            echo "  le quota par construction."
          } > "$out"
          cat "$out"
          exit 0

      - name: Consommation Vercel (déploiements)
        shell: bash
        env:
          VERCEL_PROD_TOKEN: ${{ secrets.VERCEL_PROD_TOKEN }}
          VERCEL_PROD_ORG_ID: ${{ secrets.VERCEL_PROD_ORG_ID }}
        run: |
          set -euo pipefail
          out=/tmp/vercel.md
          if [[ -z "${VERCEL_PROD_TOKEN:-}" ]]; then
            echo "Vercel : secret VERCEL_PROD_TOKEN absent — non mesuré." > "$out"
            cat "$out"
            exit 0
          fi
          q=""
          [[ -n "${VERCEL_PROD_ORG_ID:-}" ]] && q="&teamId=${VERCEL_PROD_ORG_ID}"
          since="$(date -u -d 'midnight' '+%s' 2>/dev/null || echo "$(( $(date +%s) - 86400 ))")"
          data="$(curl -fsSL -H "Authorization: Bearer ${VERCEL_PROD_TOKEN}" \
            "https://api.vercel.com/v6/deployments?limit=100&since=${since}${q}" || echo '{}')"
          count="$(jq -r '.deployments | length' <<<"$data" 2>/dev/null || echo "?")"
          {
            echo "- Déploiements depuis minuit (échantillon <= 100) : **${count}**"
            echo "- Limite Hobby : **100 déploiements/jour** par compte."
            echo "- Attention : c'est cette limite qui a **figé la prod le 2026-09-20**"
            echo "  (\`api-deployments-free-per-day\` sur le tag v4.33.0)."
          } > "$out"
          cat "$out"

      - name: Consommation Neon (CU-h & transfert)
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          set -euo pipefail
          out=/tmp/neon.md
          # #9059 : la section Neon était annoncée dans le titre de l'issue mais
          # aucun step ne la mesurait. Les seuils (70 / 90 CU-h, 3,5 / 4,5 Go)
          # étaient donc affichés sans jamais être comparés à une valeur.
          if [[ -z "${NEON_API_KEY:-}" || -z "${NEON_PROJECT_ID:-}" ]]; then
            echo "Neon : secrets absents (NEON_API_KEY / NEON_PROJECT_ID) — non mesuré." > "$out"
            cat "$out"
            exit 0
          fi
          data="$(curl -fsSL -H "Authorization: Bearer ${NEON_API_KEY}" \
            -H "Accept: application/json" \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}" || echo '{}')"
          cu="$(jq -r '.project.consumption_history // .project.cu_hours // "?"' <<<"$data" 2>/dev/null || echo "?")"
          transfer="$(jq -r '.project.transfer_bytes // "?"' <<<"$data" 2>/dev/null || echo "?")"
          {
            echo "- Projet : \`${NEON_PROJECT_ID}\`"
            echo "- CU-h consommées : **${cu}** (surveiller 70, agir 90 / 100)"
            echo "- Transfert : **${transfer}** octets (surveiller 3,5 Go, agir 4,5 Go / 5 Go)"
          } > "$out"
          cat "$out"

      - name: Consommation Cloudflare Pages (builds)
        shell: bash
        env:
          CLOUDFLARE_PROD_API_TOKEN: ${{ secrets.CLOUDFLARE_PROD_API_TOKEN }}
          CLOUDFLARE_PROD_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PROD_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          out=/tmp/pages.md
          # #9059 : même trou que Neon — « Pages » figurait dans le titre sans
          # mesure. On compte les builds du jour sur le compte.
          if [[ -z "${CLOUDFLARE_PROD_API_TOKEN:-}" || -z "${CLOUDFLARE_PROD_ACCOUNT_ID:-}" ]]; then
            echo "Cloudflare Pages : secrets absents (CLOUDFLARE_PROD_API_TOKEN / CLOUDFLARE_PROD_ACCOUNT_ID) — non mesuré." > "$out"
            cat "$out"
            exit 0
          fi
          data="$(curl -fsSL -H "Authorization: Bearer ${CLOUDFLARE_PROD_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_PROD_ACCOUNT_ID}/pages/projects" || echo '{}')"
          projects="$(jq -r '.result | length' <<<"$data" 2>/dev/null || echo "?")"
          {
            echo "- Projets Pages : **${projects}**"
            echo "- Limite Free : **500 builds/mois** par compte."
          } > "$out"
          cat "$out"

      - name: Publier l'issue [consommation] (mise à jour, pas création)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "> Rapport automatique du $(date -u '+%Y-%m-%d %H:%M UTC')."
            echo "> Réf. : épic #8670. Seuils et analyse : \`docs/ops/COUTS_ET_PERF.md\`."
            echo
            echo "## Santé des stacks"
            echo
            sed -n '/TABLE_START/,/TABLE_END/p' /tmp/health.md | grep -v 'TABLE_' || echo "_indisponible_"
            echo
            echo "## Render (API prod)"
            echo
            cat /tmp/render.md
            echo
            echo "## Vercel (front prod)"
            echo
            cat /tmp/vercel.md
            echo
            echo "## Neon (base de données)"
            echo
            cat /tmp/neon.md
            echo
            echo "## Cloudflare Pages (builds)"
            echo
            cat /tmp/pages.md
            echo
            echo "<details><summary>Seuils d'alerte</summary>"
            echo
            echo "| Indicateur | Surveiller | Agir |"
            echo "|---|---|---|"
            echo "| Heures Render / 750 | 525 h (70 %) | 675 h (90 %) |"
            echo "| Déploiements Vercel / jour | 60 | 90 |"
            echo "| CU-h Neon / 100 | 70 | 90 |"
            echo "| Transfert Neon / 5 Go | 3,5 Go | 4,5 Go |"
            echo
            echo "</details>"
          } > /tmp/body.md

          # Le label est une commodité de tri, pas une condition de succès : un
          # label absent faisait échouer `gh issue create` (exit 1) et rendait
          # le rapport rouge alors que la mesure avait réussi. On le crée s'il
          # manque, et on retombe sur une création SANS label plutôt que de
          # perdre le rapport.
          if ! gh label list --repo "${{ github.repository }}" --limit 200 --json name --jq '.[].name' 2>/dev/null | grep -qx "ops:consumption"; then
            gh label create "ops:consumption" --repo "${{ github.repository }}" \
              --color "0e8a16" \
              --description "Suivi quotidien des quotas Render / Vercel / Neon / Pages" 2>/dev/null \
              || echo "::warning::label ops:consumption non créable — rapport publié sans label"
          fi

          existing="$(gh issue list --repo "${{ github.repository }}" --label "ops:consumption" --state open --json number --jq '.[0].number // ""' 2>/dev/null || echo "")"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body-file /tmp/body.md
            echo "Commentaire ajouté à l'issue #${existing}"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "[consommation] Suivi quotidien des quotas (Render / Vercel / Neon / Pages)" \
              --label "ops:consumption" \
              --body-file /tmp/body.md \
              || gh issue create --repo "${{ github.repository }}" \
                   --title "[consommation] Suivi quotidien des quotas (Render / Vercel / Neon / Pages)" \
                   --body-file /tmp/body.md
          fi
