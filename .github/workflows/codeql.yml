name: CodeQL - Leopardo RH

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"

permissions:
  actions: read
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-actions:
    name: CodeQL (Actions)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || vars.ENABLE_CODEQL_PR == 'true'

    strategy:
      fail-fast: false
      matrix:
        language: [actions]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  analyze-backend:
    name: CodeQL (Backend)
    runs-on: ubuntu-latest

    steps:
      - name: Backend CodeQL compatibility note
        shell: bash
        run: |
          set -euo pipefail
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## CodeQL (Backend)

          This repository's backend is PHP, but GitHub CodeQL does not recognize `php`
          as a supported language in this workflow environment.

          Backend security coverage remains enforced through:
          - Backend Security (Composer Audit)
          - Dependency Review (PR Security)

          This compatibility job exists to publish the required `CodeQL (Backend)` status
          expected by branch protection without failing the PR on unsupported language setup.
          EOF

          echo "CodeQL PHP backend analysis is not supported in this workflow environment."
