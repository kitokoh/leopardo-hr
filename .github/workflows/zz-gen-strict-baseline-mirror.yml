name: zz-gen-strict-baseline-mirror (temporary)

# OUTIL TEMPORAIRE — round 27 PM 2026-09-05 (issue #6818). Régénère
# UNIQUEMENT api/phpstan-strict-baseline.neon en MIROIR EXACT du job
# « PHPStan — Strict » (architecture-check.yml) : config
# api/phpstan-strict-gen2.neon = includes phpstan.neon (donc
# phpstan-baseline.neon) + level 8 + paths app/Core+Modules+Shared, SANS
# l'inclusion de la baseline strict elle-même.
#
# Pourquoi : une précédente régénération « pleine portée » (app+routes+
# tests, sans phpstan-baseline.neon) avait gonflé artificiellement les
# comptes par-module du fichier → garde PA2-ARCH-005 (check-phpstan-
# baseline-delta.sh) rouge sur les modules EduManager/RestaurantManager/
# TravelAgency/FuelStation. Le miroir redonne des comptes = dette réelle
# (équivalente à main là où le code est identique).
#
# Usage unique (workflow_dispatch) : analyse, --generate-baseline=<path>,
# commit, suppression de CE workflow + de la config gen, push (GITHUB_TOKEN
# → n'enclenche PAS d'autres workflows ; relancer la CI ensuite).

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  gen:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false
          fetch-depth: 0
          ref: fix/ci-main-green-2026-09-04

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none

      - name: Install dependencies
        working-directory: api
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Regenerate strict baseline (job mirror)
        working-directory: api
        run: vendor/bin/phpstan analyse --configuration=phpstan-strict-gen2.neon --generate-baseline=phpstan-strict-baseline.neon --memory-limit=1G --no-progress

      - name: Commit baseline and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kitokoh (pm-agent)"
          git config user.email "pm-agent@leopardo-hr.local"
          rm -f .github/workflows/zz-gen-strict-baseline-mirror.yml api/phpstan-strict-gen2.neon
          if git status --porcelain -- api/phpstan-strict-baseline.neon | grep -q .; then
            git add api/phpstan-strict-baseline.neon
            git commit -m "chore(phpstan): baseline strict miroir du job (scope reel Core/Modules/Shared, incl. phpstan-baseline) - round 27, issue #6818"
            git push origin HEAD:fix/ci-main-green-2026-09-04
          else
            echo "RIEN_A_COMMITTER"
          fi
