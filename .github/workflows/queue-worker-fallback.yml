name: Queue Worker — Fallback GH Actions

on:
  schedule:
    # Drain toutes les 5 minutes : couvre les périodes où l'instance Render
    # dort (>15 min d'inactivité, free tier) ou a épuisé ses 750 h/mois.
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Un seul drain à la fois : la queue database n'est pas un fan-out.
concurrency:
  group: queue-worker-fallback
  cancel-in-progress: false

jobs:
  drain:
    name: Drain queue (database)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository == 'kitokoh/leopardo-hr'
    permissions:
      contents: read
    env:
      APP_ENV: production
      APP_KEY: ${{ secrets.APP_KEY }}
      APP_URL: ${{ secrets.APP_URL }}
      DB_CONNECTION: pgsql
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_DATABASE: ${{ secrets.DB_DATABASE }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_SEARCH_PATH: shared_tenants,public
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stderr
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.4"
          extensions: pdo, pdo_pgsql, bcmath, mbstring, xml, zip, gd
          tools: composer:v2
          coverage: none

      - name: Resolve Composer cache directory
        id: composer-cache
        working-directory: ./api
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php84-${{ hashFiles('api/composer.lock') }}

      - name: Install Composer dependencies
        working-directory: ./api
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Drain queue (database driver)
        working-directory: ./api
        run: |
          php artisan queue:work database \
            --queue=webhooks,audit,notifications,emails,pdf,payroll,documents,default \
            --tries=3 --timeout=280 --sleep=2 --stop-when-empty --max-time=280
