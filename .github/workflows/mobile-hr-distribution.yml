name: Mobile HR - Build and Firebase Distribution

on:
  push:
    branches: [main, develop]
    paths:
      - 'front/mobile_apps/leopardo_hr/**'
      - 'front/mobile_apps/leopardo_core/**'

jobs:
  build:
    name: Build and Distribute HR App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd front/mobile_apps/leopardo_core && flutter pub get
          cd ../leopardo_hr && flutter pub get

      - name: Build APK
        run: |
          cd front/mobile_apps/leopardo_hr
          flutter build apk --release --dart-define=API_BASE_URL=https://gestionemployerbackend.onrender.com/api/v1

      - name: Upload to Firebase Distribution
        uses: w9jds/firebase-action@master
        with:
          args: appdistribution:distribute front/mobile_apps/leopardo_hr/build/app/outputs/flutter-apk/app-release.apk --app ${{ secrets.FIREBASE_APP_ID_HR }} --groups "testers"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
