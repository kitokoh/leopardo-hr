name: Mobile Distribute - Main

# Security fix (CodeQL actions/untrusted-checkout/critical - Issue #1396, Alert #29):
# The previous `distribute-mobile` job inside deploy-main.yml was triggered via
# `workflow_run` (a privileged context that receives org/repo secrets) and then
# checked out `needs.prepare.outputs.sha` — a SHA derived from an external
# workflow_run event. CodeQL's static dataflow analysis correctly flagged this as
# an untrusted checkout in a secrets-bearing context, because it could not
# statically verify the cross-job `prepare` validation.
#
# Fix (Option A from Issue #1396): moved mobile distribution into this dedicated
# workflow triggered by `push: [main]` scoped to mobile paths. There is no
# external SHA to validate: `github.sha` is always the verified push commit
# on the protected `main` branch — the exact guarantee that CodeQL requires.
# The `workflow_run` dependency is replaced by a `workflow_call` from
# `mobile-distribute.yml` (manual) or this direct push trigger.

on:
  push:
    branches: [main]
    paths:
      - 'front/mobile_apps/**'
      - '.github/workflows/mobile-distribute-main.yml'
  workflow_dispatch:
    inputs:
      app:
        description: 'App to distribute (employee|manager|platform_admin|hr|accounting|marketing|travel_agent|cameras|public|pos_retail|pos_restaurant|all)'
        required: false
        default: 'all'
        type: string

permissions:
  contents: read
  actions: read

# #7986 — le groupe keyé sur github.sha ne sérialisait RIEN (chaque push a
# un sha distinct) : deux distributions Firebase pouvaient courir en
# concurrence. Keyé sur le ref, les distributions main se sérialisent ;
# cancel-in-progress: false reste requis (jamais d'annulation en vol).
concurrency:
  group: mobile-distribute-main-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEFAULT_API_BASE_URL: ${{ vars.DEV_API_BASE_URL }}

jobs:
  distribute-mobile:
    timeout-minutes: 120
    name: Distribute ${{ matrix.app.name }} to Firebase
    runs-on: ubuntu-latest
    # #4622 : filtre workflow_dispatch réellement bloquant (l'ancien step
    # « exit 0 » ne sautait rien : les 4 apps étaient buildées ET distribuées
    # Firebase même avec app=employee).
    env:
      SHOULD_BUILD: ${{ github.event_name != 'workflow_dispatch' || inputs.app == 'all' || inputs.app == matrix.app.name }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: employee
            project_path: front/mobile_apps/leopardo_employee
            artifact_name: leopardo-employee-staging
            version_prefix: employee
            firebase_secret: FIREBASE_EMPLOYEE_ANDROID_APP_ID
            android_package: com.leopardo.employee
          - name: manager
            project_path: front/mobile_apps/leopardo_manager
            artifact_name: leopardo-manager-staging
            version_prefix: manager
            firebase_secret: FIREBASE_MANAGER_ANDROID_APP_ID
            android_package: com.leopardo.manager
          - name: platform_admin
            project_path: front/mobile_apps/leopardo_platform_admin
            artifact_name: leopardo-platform-admin-staging
            version_prefix: platform-admin
            firebase_secret: FIREBASE_PLATFORM_ADMIN_ANDROID_APP_ID
            android_package: com.leopardo.platformadmin
          # QA 2026-08-15 (#2661) : leopardo_hr manquait dans la matrice de
          # distribution staging (parité avec mobile-distribute.yml).
          - name: hr
            project_path: front/mobile_apps/leopardo_hr
            artifact_name: leopardo-hr-staging
            version_prefix: hr
            # #4343 : secret dédié documenté (docs/CI_CD_SECRETS.md) ; le
            # fallback générique reste actif tant que FIREBASE_APP_ID_HR n'est
            # pas créé dans les secrets du repo.
            firebase_secret: FIREBASE_APP_ID_HR
            android_package: com.leopardo.rh
          # #9381 — parité avec mobile-distribute.yml : l'app comptable doit
          # aussi être distribuée en staging, sinon elle reste invisible aux
          # testeurs et aucune régression tablette n'est détectée.
          - name: accounting
            project_path: front/mobile_apps/leopardo_accounting
            artifact_name: leopardo-accounting-staging
            version_prefix: accounting
            firebase_secret: FIREBASE_ACCOUNTING_ANDROID_APP_ID
            android_package: com.leopardo.accounting
          # #9883 — six apps existaient sur disque, etaient analysees et testees
          # par `mobile-apps-ci.yml`, mais n'etaient dans AUCUNE matrice de
          # distribution : aucun APK n'etait donc jamais construit pour elles.
          # Le defaut etait invisible parce que chaque app est analysee
          # ISOLEMENT : rien ne comparait la liste des apps du disque a celle
          # des matrices. `check-mobile-app-identities.sh` le compare desormais.
          - name: marketing
            project_path: front/mobile_apps/leopardo_marketing
            artifact_name: leopardo-marketing-staging
            version_prefix: marketing
            firebase_secret: FIREBASE_MARKETING_ANDROID_APP_ID
            android_package: com.leopardo.marketing
          - name: travel_agent
            project_path: front/mobile_apps/leopardo_travel_agent
            artifact_name: leopardo-travel-agent-staging
            version_prefix: travel-agent
            firebase_secret: FIREBASE_TRAVEL_AGENT_ANDROID_APP_ID
            android_package: com.leopardo.travel_agent
          - name: cameras
            project_path: front/mobile_apps/leopardo_cameras
            artifact_name: leopardo-cameras-staging
            version_prefix: cameras
            firebase_secret: FIREBASE_CAMERAS_ANDROID_APP_ID
            android_package: com.leopardo.cameras
          - name: public
            project_path: front/mobile_apps/leopardo_public
            artifact_name: leopardo-public-staging
            version_prefix: public
            firebase_secret: FIREBASE_PUBLIC_ANDROID_APP_ID
            android_package: com.leopardo.publicapp
          - name: pos_retail
            project_path: front/mobile_apps/leopardo_pos_retail
            artifact_name: leopardo-pos-retail-staging
            version_prefix: pos-retail
            firebase_secret: FIREBASE_POS_RETAIL_ANDROID_APP_ID
            android_package: com.leopardo.posretail
          - name: pos_restaurant
            project_path: front/mobile_apps/leopardo_pos_restaurant
            artifact_name: leopardo-pos-restaurant-staging
            version_prefix: pos-restaurant
            firebase_secret: FIREBASE_POS_RESTAURANT_ANDROID_APP_ID
            android_package: com.leopardo.posrestaurant
          - name: restaurant
            project_path: front/mobile_apps/leopardo_restaurant_app
            artifact_name: leopardo-restaurant-staging
            version_prefix: restaurant
            firebase_secret: FIREBASE_RESTAURANT_ANDROID_APP_ID
            android_package: com.leopardo.restaurant
          - name: retail
            project_path: front/mobile_apps/leopardo_retail_app
            artifact_name: leopardo-retail-staging
            version_prefix: retail
            firebase_secret: FIREBASE_RETAIL_ANDROID_APP_ID
            android_package: com.leopardo.retail
          - name: hospitality
            project_path: front/mobile_apps/leopardo_hospitality_app
            artifact_name: leopardo-hospitality-staging
            version_prefix: hospitality
            firebase_secret: FIREBASE_HOSPITALITY_ANDROID_APP_ID
            android_package: com.leopardo.hospitality
          - name: trade
            project_path: front/mobile_apps/leopardo_trade_app
            artifact_name: leopardo-trade-staging
            version_prefix: trade
            firebase_secret: FIREBASE_TRADE_ANDROID_APP_ID
            android_package: com.leopardo.trade
          - name: travel
            project_path: front/mobile_apps/leopardo_travel_app
            artifact_name: leopardo-travel-staging
            version_prefix: travel
            firebase_secret: FIREBASE_TRAVEL_ANDROID_APP_ID
            android_package: com.leopardo.travel
          - name: pharmacy
            project_path: front/mobile_apps/leopardo_pharmacy_app
            artifact_name: leopardo-pharmacy-staging
            version_prefix: pharmacy
            firebase_secret: FIREBASE_PHARMACY_ANDROID_APP_ID
            android_package: com.leopardo.pharmacy
          - name: mobility
            project_path: front/mobile_apps/leopardo_mobility_app
            artifact_name: leopardo-mobility-staging
            version_prefix: mobility
            firebase_secret: FIREBASE_MOBILITY_ANDROID_APP_ID
            android_package: com.leopardo.mobility
          - name: careers
            project_path: front/mobile_apps/leopardo_careers_app
            artifact_name: leopardo-careers-staging
            version_prefix: careers
            firebase_secret: FIREBASE_CAREERS_ANDROID_APP_ID
            android_package: com.leopardo.careers
            # #9492 — l'app Android `com.leopardo.accounting` n'est PAS encore
            # enregistrée dans le projet Firebase qui sert les quatre autres
            # apps : le `google-services.json` restauré depuis le secret
            # `GOOGLE_SERVICES_JSON` ne contient aucun client pour ce package.
            # Ce n'est pas un défaut de code (l'`applicationId` et le package
            # attendu concordent) mais une action propriétaire côté console
            # Firebase + rotation du secret. Tant qu'elle n'est pas faite, le
            # canal est déclaré ABSENT : le job sort en skip explicite et
            # visible (step summary + ::warning::), au lieu d'échouer à chaque
            # push sur `main` et de masquer une vraie régression des quatre
            # autres canaux. Le catalogue « Mon Logiciel » requalifie déjà
            # l'app en `not_distributed` (mobile-distribution-status.ts), donc
            # aucune fiche n'annonce un build inexistant (#6697).
            firebase_channel: false

    steps:
      - name: Guard DEV_API_BASE_URL (#4524)
        shell: bash
        run: |
          if [[ -z "${{ vars.DEV_API_BASE_URL }}" ]]; then
            echo "::error::DEV_API_BASE_URL must be set (fail-open fallback removed, issue #4524)."
            exit 1
          fi
          echo "DEV_API_BASE_URL=${{ vars.DEV_API_BASE_URL }}"

      # Security note (CodeQL actions/untrusted-checkout fix):
      # `github.sha` here is always the verified commit on the protected `main` branch —
      # no cross-job SHA propagation from a `workflow_run` event. This eliminates the
      # untrusted-checkout class entirely (no external SHA to validate).
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve Firebase distribution readiness
        id: firebase_ready
        shell: bash
        # actions/excessive-secrets-exposure: static ternary — only one literal
        # `secrets.NAME` reference is evaluated per matrix entry. No dynamic indexing.
        env:
          # #9883 — plus de repli generique : chaque app a sa branche, et une chaine
          # vide fait SAUTER la distribution (avertissement) au lieu d'emprunter
          # l'identifiant Firebase d'une AUTRE app. Seule exception, mesuree le
          # 2026-11-24 : `hr` n'a PAS de secret dedie (`FIREBASE_APP_ID_HR` est
          # absent de `gh secret list`) et son identite Firebase EST le secret
          # historique `FIREBASE_APP_ID` (com.leopardo.rh) — son repli est donc
          # explicite et borne, sinon le supprimer arreterait un canal vivant.
          FIREBASE_APP_ID: ${{ matrix.app.name == 'employee' && secrets.FIREBASE_EMPLOYEE_ANDROID_APP_ID || matrix.app.name == 'manager' && secrets.FIREBASE_MANAGER_ANDROID_APP_ID || matrix.app.name == 'platform_admin' && secrets.FIREBASE_PLATFORM_ADMIN_ANDROID_APP_ID || matrix.app.name == 'hr' && (secrets.FIREBASE_APP_ID_HR || secrets.FIREBASE_APP_ID) || matrix.app.name == 'accounting' && secrets.FIREBASE_ACCOUNTING_ANDROID_APP_ID || matrix.app.name == 'marketing' && secrets.FIREBASE_MARKETING_ANDROID_APP_ID || matrix.app.name == 'travel_agent' && secrets.FIREBASE_TRAVEL_AGENT_ANDROID_APP_ID || matrix.app.name == 'cameras' && secrets.FIREBASE_CAMERAS_ANDROID_APP_ID || matrix.app.name == 'public' && secrets.FIREBASE_PUBLIC_ANDROID_APP_ID || matrix.app.name == 'pos_retail' && secrets.FIREBASE_POS_RETAIL_ANDROID_APP_ID || matrix.app.name == 'pos_restaurant' && secrets.FIREBASE_POS_RESTAURANT_ANDROID_APP_ID || matrix.app.name == 'restaurant' && secrets.FIREBASE_RESTAURANT_ANDROID_APP_ID || matrix.app.name == 'retail' && secrets.FIREBASE_RETAIL_ANDROID_APP_ID || matrix.app.name == 'hospitality' && secrets.FIREBASE_HOSPITALITY_ANDROID_APP_ID || matrix.app.name == 'trade' && secrets.FIREBASE_TRADE_ANDROID_APP_ID || matrix.app.name == 'travel' && secrets.FIREBASE_TRAVEL_ANDROID_APP_ID || matrix.app.name == 'pharmacy' && secrets.FIREBASE_PHARMACY_ANDROID_APP_ID || matrix.app.name == 'mobility' && secrets.FIREBASE_MOBILITY_ANDROID_APP_ID || matrix.app.name == 'careers' && secrets.FIREBASE_CAREERS_ANDROID_APP_ID || '' }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_APP_ID_SECRET_NAME: ${{ matrix.app.firebase_secret }}
          PROJECT_PATH: ${{ matrix.app.project_path }}
          APP_NAME: ${{ matrix.app.name }}
          ANDROID_PACKAGE: ${{ matrix.app.android_package }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          # #9492 — `false` quand la vitrine n'a pas (encore) de client Firebase
          # enregistré : le canal est alors ABSENT, pas en échec. Les entrées de
          # matrice qui ne déclarent pas la clé rendent une chaîne vide (et non
          # `null`) : on ne compare donc JAMAIS à un booléen dans l'expression
          # GitHub (`null == false` y vaut `true`), seulement en bash.
          FIREBASE_CHANNEL: ${{ matrix.app.firebase_channel }}
        run: |
          set -euo pipefail
          READY=true
          if [[ "${FIREBASE_CHANNEL}" == "false" ]]; then
            echo "::warning::Canal Firebase ABSENT pour ${APP_NAME} (${ANDROID_PACKAGE}) — app non enregistrée dans le projet Firebase (#9492). Distribution sautée, ce n'est pas un échec."
            {
              echo "### Firebase — ${APP_NAME} : canal ABSENT (#9492)"
              echo ""
              echo "L'app Android \`${ANDROID_PACKAGE}\` n'est pas enregistrée dans le projet Firebase"
              echo "qui sert les autres apps : le \`google-services.json\` restauré ne contient"
              echo "aucun client pour ce package. Action propriétaire requise (console Firebase"
              echo "+ rotation du secret \`GOOGLE_SERVICES_JSON\`), voir #9492."
              echo ""
              echo "Le catalogue « Mon Logiciel » requalifie déjà l'app en \`not_distributed\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "MOBILE_DISTRIBUTE_READY=false" >> "$GITHUB_ENV"
            exit 0
          fi
          if [[ -z "${FIREBASE_APP_ID}" ]]; then
            echo "Missing GitHub secret: ${FIREBASE_APP_ID_SECRET_NAME}. Skipping ${{ matrix.app.name }} Firebase distribution."
            READY=false
          fi
          if [[ -z "${FIREBASE_TOKEN}" ]]; then
            echo "Missing GitHub secret: FIREBASE_TOKEN. Skipping ${{ matrix.app.name }} Firebase distribution."
            READY=false
          fi
          CONFIG_FILE="${PROJECT_PATH}/android/app/google-services.json"
          if [[ -n "${GOOGLE_SERVICES_JSON}" ]]; then
            mkdir -p "$(dirname "${CONFIG_FILE}")"
            printf '%s' "${GOOGLE_SERVICES_JSON}" > "${CONFIG_FILE}"
            echo "Firebase config restaurée depuis le secret (issue #1467)."
          fi
          if [[ ! -f "${CONFIG_FILE}" ]]; then
            echo "Missing Firebase config: ${CONFIG_FILE}. Skipping ${{ matrix.app.name }} Firebase distribution."
            READY=false
          fi
          if [[ "${READY}" == "true" ]]; then
            # shellcheck disable=SC2016
            node -e 'const fs=require("fs");const configFile=`${process.env.PROJECT_PATH}/android/app/google-services.json`;const expectedPackage=process.env.ANDROID_PACKAGE;const expectedAppId=process.env.FIREBASE_APP_ID;const secretName=process.env.FIREBASE_APP_ID_SECRET_NAME;const payload=JSON.parse(fs.readFileSync(configFile,"utf8"));const clients=Array.isArray(payload.client)?payload.client:[];const match=clients.find((c)=>c?.client_info?.android_client_info?.package_name===expectedPackage);if(!match){console.error(`No Firebase Android client found for ${expectedPackage} in ${configFile}.`);process.exit(1);}const nativeAppId=match?.client_info?.mobilesdk_app_id;if(!nativeAppId){console.error(`Firebase Android client for ${expectedPackage} does not expose mobilesdk_app_id.`);process.exit(1);}if(nativeAppId!==expectedAppId){console.error(`${secretName} does not match ${configFile} for ${expectedPackage}.`);console.error("Expected the secret to equal the google-services.json mobilesdk_app_id for this app.");process.exit(1);}console.log(`Firebase target verified for ${process.env.APP_NAME}: ${expectedPackage}.`);'
            {
              echo "### Firebase target - ${APP_NAME}"
              echo "- Android package: \`${ANDROID_PACKAGE}\`"
              echo "- Native config: \`${CONFIG_FILE}\`"
              echo "- Console: https://console.firebase.google.com/project/leopardo-rh/appdistribution/app/android:${ANDROID_PACKAGE}/releases"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "MOBILE_DISTRIBUTE_READY=${READY}" >> "$GITHUB_ENV"

      - name: Setup Flutter + Java
        if: env.MOBILE_DISTRIBUTE_READY == 'true' && env.SHOULD_BUILD == 'true'
        uses: ./.github/actions/setup-flutter-android

      - name: Flutter pub get
        if: env.MOBILE_DISTRIBUTE_READY == 'true' && env.SHOULD_BUILD == 'true'
        working-directory: ${{ matrix.app.project_path }}
        run: flutter pub get

      - name: Regenerate core generated files (l10n + codegen)
        # #6590 : fichiers générés non commités — régénérés avant le build
        # release (le package core est compilé par chaque app).
        if: env.MOBILE_DISTRIBUTE_READY == 'true' && env.SHOULD_BUILD == 'true'
        working-directory: front/mobile_apps/leopardo_core
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build

      - name: Build release APK for staging
        if: env.MOBILE_DISTRIBUTE_READY == 'true' && env.SHOULD_BUILD == 'true'
        working-directory: ${{ matrix.app.project_path }}
        shell: bash
        run: |
          set -euo pipefail
          echo "API_BASE_URL=${DEFAULT_API_BASE_URL}" > .env.build
          flutter build apk --release \
            --dart-define-from-file=.env.build \
            --build-name="${{ matrix.app.version_prefix }}-main-${GITHUB_RUN_NUMBER}" \
            --build-number="${GITHUB_RUN_NUMBER}"

      - name: Upload mobile artifact
        if: env.MOBILE_DISTRIBUTE_READY == 'true' && env.SHOULD_BUILD == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.app.artifact_name }}-${{ github.run_number }}
          path: ${{ matrix.app.project_path }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Firebase App Distribution (staging)
        if: env.MOBILE_DISTRIBUTE_READY == 'true' && env.SHOULD_BUILD == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@bd494989dd4bec0343f78adee87fe66e48279ad6 # v1.7.1
        with:
          # #9883 — meme ternaire que l'etape de validation : l'app id VERIFIE
          # et l'app id utilise pour l'upload ne peuvent pas diverger.
          appId: ${{ matrix.app.name == 'employee' && secrets.FIREBASE_EMPLOYEE_ANDROID_APP_ID || matrix.app.name == 'manager' && secrets.FIREBASE_MANAGER_ANDROID_APP_ID || matrix.app.name == 'platform_admin' && secrets.FIREBASE_PLATFORM_ADMIN_ANDROID_APP_ID || matrix.app.name == 'hr' && (secrets.FIREBASE_APP_ID_HR || secrets.FIREBASE_APP_ID) || matrix.app.name == 'accounting' && secrets.FIREBASE_ACCOUNTING_ANDROID_APP_ID || matrix.app.name == 'marketing' && secrets.FIREBASE_MARKETING_ANDROID_APP_ID || matrix.app.name == 'travel_agent' && secrets.FIREBASE_TRAVEL_AGENT_ANDROID_APP_ID || matrix.app.name == 'cameras' && secrets.FIREBASE_CAMERAS_ANDROID_APP_ID || matrix.app.name == 'public' && secrets.FIREBASE_PUBLIC_ANDROID_APP_ID || matrix.app.name == 'pos_retail' && secrets.FIREBASE_POS_RETAIL_ANDROID_APP_ID || matrix.app.name == 'pos_restaurant' && secrets.FIREBASE_POS_RESTAURANT_ANDROID_APP_ID || matrix.app.name == 'restaurant' && secrets.FIREBASE_RESTAURANT_ANDROID_APP_ID || matrix.app.name == 'retail' && secrets.FIREBASE_RETAIL_ANDROID_APP_ID || matrix.app.name == 'hospitality' && secrets.FIREBASE_HOSPITALITY_ANDROID_APP_ID || matrix.app.name == 'trade' && secrets.FIREBASE_TRADE_ANDROID_APP_ID || matrix.app.name == 'travel' && secrets.FIREBASE_TRAVEL_ANDROID_APP_ID || matrix.app.name == 'pharmacy' && secrets.FIREBASE_PHARMACY_ANDROID_APP_ID || matrix.app.name == 'mobility' && secrets.FIREBASE_MOBILITY_ANDROID_APP_ID || matrix.app.name == 'careers' && secrets.FIREBASE_CAREERS_ANDROID_APP_ID || '' }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: testeurs-internes
          file: ${{ matrix.app.project_path }}/build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: |
            Auto deploy from main - Leopardo ${{ matrix.app.name }}
            Build: ${{ matrix.app.version_prefix }}-main-${{ github.run_number }}
            Commit: ${{ github.sha }}
            Workflow: ${{ github.workflow }}
            Backend: ${{ vars.DEV_API_BASE_URL }}

      - name: Verify Firebase App Distribution release is visible
        if: env.MOBILE_DISTRIBUTE_READY == 'true' && env.SHOULD_BUILD == 'true'
        shell: bash
        env:
          FIREBASE_APP_ID: ${{ matrix.app.name == 'employee' && secrets.FIREBASE_EMPLOYEE_ANDROID_APP_ID || matrix.app.name == 'manager' && secrets.FIREBASE_MANAGER_ANDROID_APP_ID || matrix.app.name == 'platform_admin' && secrets.FIREBASE_PLATFORM_ADMIN_ANDROID_APP_ID || matrix.app.name == 'hr' && (secrets.FIREBASE_APP_ID_HR || secrets.FIREBASE_APP_ID) || matrix.app.name == 'accounting' && secrets.FIREBASE_ACCOUNTING_ANDROID_APP_ID || matrix.app.name == 'marketing' && secrets.FIREBASE_MARKETING_ANDROID_APP_ID || matrix.app.name == 'travel_agent' && secrets.FIREBASE_TRAVEL_AGENT_ANDROID_APP_ID || matrix.app.name == 'cameras' && secrets.FIREBASE_CAMERAS_ANDROID_APP_ID || matrix.app.name == 'public' && secrets.FIREBASE_PUBLIC_ANDROID_APP_ID || matrix.app.name == 'pos_retail' && secrets.FIREBASE_POS_RETAIL_ANDROID_APP_ID || matrix.app.name == 'pos_restaurant' && secrets.FIREBASE_POS_RESTAURANT_ANDROID_APP_ID || matrix.app.name == 'restaurant' && secrets.FIREBASE_RESTAURANT_ANDROID_APP_ID || matrix.app.name == 'retail' && secrets.FIREBASE_RETAIL_ANDROID_APP_ID || matrix.app.name == 'hospitality' && secrets.FIREBASE_HOSPITALITY_ANDROID_APP_ID || matrix.app.name == 'trade' && secrets.FIREBASE_TRADE_ANDROID_APP_ID || matrix.app.name == 'travel' && secrets.FIREBASE_TRAVEL_ANDROID_APP_ID || matrix.app.name == 'pharmacy' && secrets.FIREBASE_PHARMACY_ANDROID_APP_ID || matrix.app.name == 'mobility' && secrets.FIREBASE_MOBILITY_ANDROID_APP_ID || matrix.app.name == 'careers' && secrets.FIREBASE_CAREERS_ANDROID_APP_ID || '' }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_READBACK_REQUIRED: ${{ secrets.FIREBASE_READBACK_REQUIRED }}
          APP_NAME: ${{ matrix.app.name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash dev-hub/tools/verify-firebase-readback.sh
