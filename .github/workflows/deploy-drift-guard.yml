name: Deploy Drift Guard

# Issue #7304 — l'environnement dev Render servait un commit ~50 PR en retard
# sur `main` : toute campagne QA validait du code périmé (faux bugs, vrais
# correctifs invérifiables). Aucun comparateur « version déployée ↔ SHA de
# référence » n'existait dans le dépôt. Cette garde le fournit et échoue
# VISIBLEMENT quand l'environnement cible ne sert pas le contenu déployable.
#
# Référence : l'API n'est redéployée que sur changement `api/**`
# (`deploy-main.yml`). La garde compare donc la version servie au **dernier
# commit touchant `api/`** — et non au HEAD de `main`, sinon chaque merge
# docs/web-only produirait une fausse dérive. Si la version servie est
# **postérieure** à ce commit (elle le contient), l'environnement est à jour.
#
# Portée : signal fort, planifié (hors PR) — elle n'est donc pas un check
# requis au merge et n'allonge aucun cycle de PR. Elle tourne aussi à la
# demande (`workflow_dispatch`) pour servir de pré-vol avant une recette.
#
# Le script `dev-hub/tools/check-deploy-drift.sh` porte la sémantique et les
# codes de sortie (utilisable en local).

on:
  schedule:
    # Toutes les 30 minutes, décalé des autres gardes (05:37, */5 queue…).
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "URL de l'API à vérifier (base ou .../health)"
        type: string
        default: ""
      label:
        description: "Étiquette du rapport"
        type: string
        default: "dev"
      expect:
        description: "SHA ou ref attendue (vide = dernier commit api/, sinon SHA du run)"
        type: string
        default: ""
      allow_release:
        description: "Ne pas échouer si l'environnement publie une version de release (ex. 4.31.0)"
        type: boolean
        default: false
      strict_failed:
        description: "Échouer si failed_jobs dépasse le seuil (aucun worker de queue)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: deploy-drift-guard
  cancel-in-progress: false

jobs:
  drift:
    name: Déploiement aligné sur main (#7304)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'kitokoh/leopardo-hr'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          lfs: false

      - name: Résoudre la cible et le SHA déployable
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_URL: ${{ inputs.url }}
          VAR_URL: ${{ vars.DEV_API_BASE_URL }}
          INPUT_EXPECT: ${{ inputs.expect }}
        run: |
          set -Eeuo pipefail

          url="${INPUT_URL:-${VAR_URL:-}}"
          if [[ -z "${url}" ]]; then
            echo "::error::aucune URL : renseigner l'input « url » ou la variable de dépôt DEV_API_BASE_URL (#7304)."
            exit 1
          fi
          url="${url%/}"
          health_url="${url}"
          [[ "${health_url}" == */api/v1/health || "${health_url}" == */health ]] || health_url="${health_url}/api/v1/health"

          # Dernier commit qui a réellement modifié le contenu déployable.
          api_sha="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits?path=api&per_page=1" \
            | jq -r '.[0].sha // empty')"
          if [[ -z "${api_sha}" ]]; then
            echo "::warning::dernier commit api/ introuvable — repli sur le SHA du run (#7304)."
            api_sha="${GITHUB_SHA}"
          fi

          expect_ref="${INPUT_EXPECT:-${api_sha}}"
          # Si la version servie est POSTÉRIEURE au dernier commit api/, elle le
          # contient : l'environnement est à jour (compare API : base...head).
          deployed="$(curl -fsS --max-time 30 "${health_url}" | jq -r '.version // empty' || true)"
          if [[ -n "${INPUT_EXPECT}" ]]; then
            echo "Attendu (input explicite) : ${expect_ref}"
          elif [[ -n "${deployed}" && "${deployed}" != "${api_sha}" && "${deployed}" != "${api_sha:0:7}" ]]; then
            status="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/compare/${api_sha}...${deployed}" \
              | jq -r '.status // empty' || true)"
            if [[ "${status}" == "ahead" || "${status}" == "identical" ]]; then
              echo "::notice::version servie (${deployed:0:7}) postérieure au dernier commit api/ (${api_sha:0:7}) — à jour."
              expect_ref="${deployed}"
            fi
          fi

          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "expect_ref=${expect_ref}" >> "$GITHUB_OUTPUT"
          echo "Cible : ${url}"
          echo "Référence : ${expect_ref}"

      - name: Vérifier la dérive (version servie ↔ contenu déployable)
        shell: bash
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
          EXPECT_REF: ${{ steps.target.outputs.expect_ref }}
          LABEL: ${{ inputs.label || 'dev' }}
          ALLOW_RELEASE: ${{ inputs.allow_release }}
          STRICT_FAILED: ${{ inputs.strict_failed }}
        run: |
          set -Eeuo pipefail
          args=(--url "${TARGET_URL}" --label "${LABEL}" --expect "${EXPECT_REF}")
          if [[ "${ALLOW_RELEASE:-false}" == "true" ]]; then
            args+=(--allow-release)
          fi
          if [[ "${STRICT_FAILED:-false}" == "true" ]]; then
            args+=(--strict-failed)
          fi
          bash dev-hub/tools/check-deploy-drift.sh "${args[@]}"

      - name: Rappel du runbook
        if: failure()
        shell: bash
        run: |
          echo "::notice::Dérive détectée — runbook : docs/ops/RENDER_DEV_ALIGNMENT.md (aligner l'environnement sur main AVANT toute recette)."
