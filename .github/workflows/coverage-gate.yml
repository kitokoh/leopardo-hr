name: Backend Coverage Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
    paths:
      - 'api/**'
      - '.github/workflows/coverage-gate.yml'

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEFAULT_BACKEND_COVERAGE_MIN: "65"
  BACKEND_COVERAGE_TARGET: "65"

concurrency:
  group: coverage-gate-${{ github.ref }}
  cancel-in-progress: true

# Pour activer comme required check :
# Settings > Branches > Protection > Required status checks
# > ajouter "Backend Coverage (PHP 8.4 + PostgreSQL 16)"
jobs:
  backend-coverage:
    name: Backend Coverage (PHP 8.4 + PostgreSQL 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: leopardo_test
          POSTGRES_USER: leopardo_user
          POSTGRES_PASSWORD: leopardo_pass_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup backend (PHP + Composer + multi-tenant DB)
        uses: ./.github/actions/setup-backend-db
        with:
          coverage: pcov

      - name: Run tests with coverage
        working-directory: ./api
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_DATABASE: leopardo_test
          DB_SEARCH_PATH: public,shared_tenants
        run: |
          mkdir -p storage/coverage
          php artisan test --coverage-clover=storage/coverage/clover.xml --coverage-text 2>&1 | tee storage/coverage/summary.txt

      - name: Parse coverage percentage
        id: coverage
        working-directory: ./api
        shell: bash
        run: |
          set -euo pipefail
          CLOVER_FILE="storage/coverage/clover.xml"
          if [[ ! -f "${CLOVER_FILE}" ]]; then
            echo "percentage=0" >> "$GITHUB_OUTPUT"
            echo "Coverage clover file not found, defaulting to 0%."
            exit 0
          fi
          PERCENT=$(php <<'PHP'
          <?php
          $xml = simplexml_load_file('storage/coverage/clover.xml');
          if ($xml === false) {
              echo '0';
              exit;
          }
          $total = 0;
          $covered = 0;
          foreach ($xml->xpath('//file/metrics') ?: [] as $metrics) {
              $total += (int) $metrics['statements'];
              $covered += (int) $metrics['coveredstatements'];
          }
          echo $total > 0 ? number_format(($covered / $total) * 100, 2, '.', '') : '0';
          PHP
          )
          echo "percentage=${PERCENT}" >> "$GITHUB_OUTPUT"
          echo "Backend coverage: ${PERCENT}%"

      - name: Evaluate coverage gate
        id: gate
        shell: bash
        env:
          COVERAGE_MIN: ${{ vars.BACKEND_COVERAGE_MIN || '60' }}
        run: |
          set -euo pipefail
          ACTUAL="${{ steps.coverage.outputs.percentage }}"
          THRESHOLD="${COVERAGE_MIN}"

          echo "Actual coverage: ${ACTUAL}%"
          echo "Threshold: ${THRESHOLD}%"

          PASS=$(echo "${ACTUAL} >= ${THRESHOLD}" | bc -l)
          if [[ "${PASS}" -eq 1 ]]; then
            echo "Coverage gate PASSED (${ACTUAL}% >= ${THRESHOLD}%)"
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Coverage gate FAILED (${ACTUAL}% < ${THRESHOLD}%)"
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-report
          path: |
            api/storage/coverage/clover.xml
            api/storage/coverage/summary.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v9
        with:
          script: |
            const percentage = `${{ steps.coverage.outputs.percentage }}`;
            const threshold = `${{ vars.BACKEND_COVERAGE_MIN || '60' }}`;
            const passed = `${{ steps.gate.outputs.passed }}` === 'true';
            const icon = passed ? ':white_check_mark:' : ':x:';
            const body = [
              `## ${icon} Backend Coverage Report`,
              '',
              `| Metric | Value |`,
              `|--------|-------|`,
              `| **Lines covered** | ${percentage}% |`,
              `| **Threshold** | ${threshold}% |`,
              `| **Status** | ${passed ? 'PASSED' : 'FAILED'} |`,
              '',
              `> Configure threshold via GitHub variable \`BACKEND_COVERAGE_MIN\` (default: 65).`,
              `> Target: ratchet to 65% after the next backend coverage uplift lot is stable.`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Backend Coverage Report')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if coverage below threshold
        if: steps.gate.outputs.passed == 'false'
        run: |
          echo "Coverage gate failed (threshold: ${COVERAGE_MIN:-65}%). Increase test coverage or adjust BACKEND_COVERAGE_MIN variable."
          exit 1
