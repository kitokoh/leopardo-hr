name: Backend Coverage Gate

# PA2-OPS-003 (historique) : `pull_request.paths` avait été retiré parce que
# ce job était alors un check REQUIS — un check requis derrière un filtre
# `paths:` ne poste jamais de statut sur les PR hors périmètre, et GitHub le
# traite comme « pending » à vie (PR #1125 / #1126 bloquées).
#
# ⚠️ Ce n'est PLUS un check requis au merge. Vérifié via l'API le 2026-10-30 :
# les 4 contexts requis de `main` sont PHPStan Strict, Module Structure
# Validator, Frontend ESLint+TS et actionlint (+ shellcheck). `Backend
# Coverage` en est absent depuis #7096, et `.github/BRANCH_PROTECTION_REQUIRED.md`
# le documente : « PAS requis au merge, exigé à la release » (release.yml).
# Le commentaire d'en-tête qui affirmait le contraire était périmé.
#
# Le filtre `paths` est donc rétabli : ce job coûte ~54 min de runner par PR
# (mesure sur 20 runs `pull_request`), soit le 2e poste le plus lourd du dépôt,
# pour un verdict informatif. Il ne tourne plus que sur les PR qui peuvent
# réellement changer la couverture backend. `push` sur main et `merge_group`
# restent NON filtrés : la release exige ce check sur le commit taggé, et un
# push main doit toujours produire le verdict.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/coverage-gate.yml'
      - '.github/actions/setup-backend-db/**'
  # Issue #2032 : doit tourner sur le ref de merge de la merge queue.
  # Push main : la release exige « Backend Coverage » sur le commit taggé
  # (release.yml) — sans ce trigger, un push direct sur main ne produirait
  # jamais le verdict et la release resterait bloquée. Non filtré à dessein.
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEFAULT_BACKEND_COVERAGE_MIN: "65"
  BACKEND_COVERAGE_TARGET: "65"

concurrency:
  # #6928 / saturation CI (2026-09-08) : groupe GLOBAL (plus par-ref) — le
  # pcov 1-5 h (timeout transitoire 300 min) est un verdict informatif, PAS
  # un check requis au merge (contexts requis main = PHPStan Strict, Module
  # Validator, ESLint+TS, actionlint — vérifié API 2026-09-08). 5 runs
  # Coverage parallèles (5 PRs api) monopolisaient 5 slots longs et
  # affamaient les checks requis (~10-20 min) → famine de plusieurs heures
  # pour des merges « évidents ». Sérialisé : UN slot au total (PR comme
  # main), cancel-in-progress false — le dernier run demandé s'exécute
  # quand le slot se libère, aucun calcul parti n'est annulé par un autre
  # coverage. Durée de feedback coverage allongée : acceptable (informatif).
  # #2131 (main) reste respecté : pas d'annulation d'un run main en cours.
  #
  # Issue #8718 (ecart T-1) — CORRECTION 2026-10-22. Le groupe GLOBAL
  # (`coverage-gate-serialized`), même avec `cancel-in-progress: false`,
  # produisait exactement le defaut que l'audit reproche : sur `main`, chaque
  # push remplacait le run « pending » du slot unique. GitHub ne fait que
  # remplacer un run *pending* (il n'annule pas un run *in_progress*) : les
  # push rapproches (pattern admin merge, rafales de merges d'agents)
  # laissaient donc une file de runs `cancelled` avec **0 job execute** —
  # constate sur les runs 39719291538, 39718728513, 39711349299 (0 job chacun,
  # workflow `push`/`main`). Le check requis « Backend Coverage » ne concluait
  # alors jamais, et la couverture n'etait jamais attestee.
  #
  # La serialisation est conservee, mais **par ref et par evenement** : un run
  # n'est plus remplace que par un push sur la MEME ref, ce qui garde
  # l'objectif #6928 (un seul slot pcov a la fois par branche, pas de famine
  # des runners) tout en laissant le run de `main` atteindre un verdict.
  #
  # Issue #8396 (constat 2026-10-28) — le correctif #8718 ci-dessus etait
  # INCOMPLET : sur `main`, `github.ref` vaut `refs/heads/main` pour TOUS les
  # pushes, donc le groupe restait constant et le defaut persistait a
  # l'identique. Mesure API : run `40591442714` (`push`/`main`, sha 1bdf90fa)
  # `pending` avec **0 job**, et une file de runs `cancelled`/0 job
  # (40590522918, 40565850891, 40563882558, 40560993002, 40559602982,
  # 40559039943, 40550757594, 40548488374, 40548263364). Aucun verdict de
  # couverture n'a donc jamais ete rendu sur `main`.
  #
  # Correctif : sur `push`, le SHA est ajoute au groupe. Un push ne peut plus
  # remplacer le run pending d'un AUTRE commit — chaque commit de `main`
  # obtient son verdict. La serialisation par ref reste en place pour les
  # `pull_request` (une PR = un slot, pas de famine #6928), et la famine sur
  # `main` est evitee autrement : le fast-path `detect-changes` diff desormais
  # les pushes contre `github.event.before`, donc un push docs/mobile ne
  # lance plus 5 h de pcov (voir le job `detect-changes`).
  group: coverage-gate-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: false

# Pour activer comme required check :
# Settings > Branches > Protection > Required status checks
# > ajouter "Backend Coverage (PHP 8.4 + PostgreSQL 16)"
jobs:
  # Fast-path CI (#5629/#2131) : ce workflow porte le check REQUIS « Backend
  # Coverage », il doit donc tourner sur CHAQUE PR (leçon #1125/#2032 : un
  # workflow filtré par `paths:` ne poste jamais de statut → pending à vie).
  # Mais quand le PR ne touche PAS api/ (docs, gouvernance, workflows), la
  # suite complète pcov (~62-75 min) est inutile : le job lourd est alors
  # SKIPPÉ (un job skip dans un workflow qui tourne = succès pour le check
  # requis) et le statut est posté en ~1 min au lieu de 75. Push main et
  # merge_group re-toujours tout vérifier (pas de base PR).
  detect-changes:
    name: Detect changed paths (fast-path CI)
    runs-on: ubuntu-latest
    outputs:
      api_changed: ${{ steps.diff.outputs.api_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Compute changed paths
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          # Issue #8396 : le fast-path ne couvrait que les PR. Sur `push`, la
          # base etait vide -> `api_changed=true` systematiquement, donc
          # CHAQUE push de `main` (docs, mobile, gouvernance) relancait la
          # suite pcov complete (~5 h). Combine au groupe de concurrence
          # desormais unique par SHA, cela aurait sature les runners (#6928).
          # On diff donc les pushes contre `github.event.before`.
          BASE="${{ github.event.pull_request.base.sha }}"
          if [[ -z "${BASE}" || "${BASE}" == "null" ]]; then
            BASE="${{ github.event.before }}"
          fi
          # Force-push / nouveau ref / merge_group : `before` est nul ou
          # inexploitable -> on ne peut rien prouver, on verifie tout.
          if [[ -z "${BASE}" || "${BASE}" == "null" || "${BASE}" =~ ^0+$ ]]; then
            echo "api_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "api_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "${BASE}...HEAD" > /tmp/changed.txt
          if grep -qE '^api/' /tmp/changed.txt; then
            echo "api_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "api_changed=false" >> "$GITHUB_OUTPUT"
          fi

  backend-coverage:
    needs: detect-changes
    # #6928 / saturation CI (2026-09-08) : le job 1-5 h ne tourne QUE si
    # api/** a changé (fast-path déjà calculé par detect-changes, inutilisé).
    # Une PR docs/front/mobile ne re-sature pas la file avec un pcov de 3 h+
    # — les 4 checks requis au merge (PHPStan Strict, Module Validator,
    # ESLint+TS, actionlint) récupèrent les runners. Sur push main et
    # merge_group, base.sha est vide → api_changed=true → coverage tourne
    # toujours (verdict main préservé).
    if: needs.detect-changes.outputs.api_changed == 'true'
    name: Backend Coverage (PHP 8.4 + PostgreSQL 16)
    runs-on: ubuntu-latest
    # Issue #4111 : timeout déterministe — un job bloqué (infra, saturation CI,
    # test bloquant) doit échouer explicitement au lieu de rester pending
    # indéfiniment et de masquer le verdict de couverture.
    # Train #6817 (2026-09-05) : suite complète pcov mesurée > 100 min (run
    # annulé à ~101 min, toujours dans les tests) — check REQUIS sur main.
    # Timeout porté à 180 min (marge sur la durée réelle).
    # Issue #6928 (2026-09-06) : fixture CreatesMvpSchema rebuildée par test
    # → pcov > 3 h, job annulé à 180 min (run cd46d2b 2026-09-06). Timeout
    # porté à 300 min en MESURE TRANSITOIRE (produire le verdict de
    # couverture) — à réduire dès le fix fixture (#6928).
    timeout-minutes: 300


    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: leopardo_test
          POSTGRES_USER: leopardo_user
          POSTGRES_PASSWORD: leopardo_pass_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leopardo_user -d leopardo_test -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        if: needs.detect-changes.outputs.api_changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Quota Git LFS épuisé (2026-08-29, budget mensuel) : les jobs
          # backend/architecture n'ont pas besoin des assets LFS (design,
          # icônes mobiles) — checkout sans LFS pour débloquer les checks
          # requis. Les workflows mobiles/web gardent lfs:true.
          lfs: false

      - name: Setup backend (PHP + Composer + multi-tenant DB)
        if: needs.detect-changes.outputs.api_changed == 'true'
        uses: ./.github/actions/setup-backend-db
        with:
          coverage: pcov

      - name: Run tests with coverage
        id: tests
        if: needs.detect-changes.outputs.api_changed == 'true'
        working-directory: ./api
        shell: bash
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_DATABASE: leopardo_test
          DB_SEARCH_PATH: public,shared_tenants
        run: |
          # Issue #4978 : `set -o pipefail` OBLIGATOIRE — sans lui, le pipe vers
          # `tee` avale le code de sortie de PHPUnit (tee sort en 0) et la gate
          # requise « Backend Coverage » reste verte même avec des centaines de
          # tests en échec (constat #4980 : 178 échecs masqués sur main).
          set -o pipefail
          mkdir -p storage/coverage storage/test-results
          # Issue #4976 : la suite parallèle crée des bases PostgreSQL `_test_N`
          # en concurrence et provoque des collisions `already exists`, ce qui
          # empêche PHPUnit de produire Clover. Le timeout de 75 minutes garde
          # la suite séquentielle déterministe et conserve la gate de couverture.
          #
          # Issue #8923 (décision D-8718-1) : UN SEUL passage de la suite.
          #   1. Le clover n'est écrit par PHPUnit qu'en fin de run RÉUSSI : un
          #      `exit` sur le premier test rouge supprimait la mesure, donc la
          #      couverture n'était JAMAIS disponible quand on en avait besoin.
          #      → on ne sort plus ici ; le rouge est exporté en `tests_failed`
          #      et traité par l'étape « Evaluate coverage gate ».
          #   2. `--log-junit` est produit par ce même passage : le second run
          #      complet (2 × ~4 h 47 = ~9 h 30 de runner par PR touchant api/)
          #      disparaît, la mesure JUnit est préservée.
          set +e
          php artisan test \
            --coverage-clover=storage/coverage/clover.xml \
            --coverage-text \
            --log-junit=storage/test-results/coverage.xml \
            2>&1 | tee storage/coverage/summary.txt
          test_exit=${PIPESTATUS[0]}
          set -e
          echo "tests_failed=$([[ "${test_exit}" -ne 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "tests_exit_code=${test_exit}" >> "$GITHUB_OUTPUT"
          if [[ "${test_exit}" -ne 0 ]]; then
            {
              echo "Backend coverage test suite failed with exit code ${test_exit}."
              grep -E -m 1 'SQLSTATE\[[0-9A-Z]+\]|FAILURES!|ERRORS!|There were [0-9]+ errors' storage/coverage/summary.txt || true
            } | tee storage/coverage/causal-error.txt
            echo "::warning::Suite backend rouge (exit ${test_exit}) — la couverture est mesurée quand même (décision D-8718-1)."
          fi
          if [[ ! -f storage/coverage/clover.xml ]]; then
            echo "::error::clover.xml absent après la suite — aucune mesure de couverture possible."
          fi

      - name: Extract first test failures (causal errors)
        if: needs.detect-changes.outputs.api_changed == 'true' && always()
        working-directory: ./api
        shell: bash
        run: |
          # Issue #4978 : extraire la PREMIÈRE erreur de chaque testsuite JUnit
          # pour rendre la cause racine visible sans ouvrir les artefacts.
          set -uo pipefail
          JUNIT="storage/test-results/coverage.xml"
          if [[ ! -f "${JUNIT}" ]]; then
            echo "No JUnit file — skipping causal error extraction."
            exit 0
          fi
          python3 - "${JUNIT}" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          try:
              tree = ET.parse(sys.argv[1])
          except ET.ParseError as exc:
              print(f'Rapport JUnit vide ou invalide — extraction ignorée: {exc}')
              sys.exit(0)
          failures = []
          for suite in tree.iter('testsuite'):
              n = int(suite.get('failures', '0')) + int(suite.get('errors', '0'))
              if n == 0:
                  continue
              for case in suite.iter('testcase'):
                  for kind in ('failure', 'error'):
                      node = case.find(kind)
                      if node is None:
                          continue
                      name = case.get('classname', '') + '::' + case.get('name', '')
                      msg = (node.get('message') or node.text or '')[:600]
                      failures.append(f"- `{name}` ({kind})\n  {msg}")
                      break
              if len(failures) >= 8:
                  break

          if failures:
              print('### Premières erreurs causales (extraction JUnit)')
              print('\n'.join(failures[:8]))
          else:
              print('Aucun échec détecté dans le JUnit.')
          PY

      - name: Parse coverage percentage
        if: needs.detect-changes.outputs.api_changed == 'true'
        id: coverage
        working-directory: ./api
        shell: bash
        run: |
          set -euo pipefail
          CLOVER_FILE="storage/coverage/clover.xml"
          if [[ ! -f "${CLOVER_FILE}" ]]; then
            # Issue #8923 : ne JAMAIS inventer un chiffre. L'ancien fallback
            # (`percentage=100`) faisait passer une PR sans mesure comme une PR
            # parfaitement couverte ; 0 l'aurait fait échouer à tort. On déclare
            # la mesure absente (`measured=false`) et la gate reste neutre.
            echo "measured=false" >> "$GITHUB_OUTPUT"
            echo "percentage=" >> "$GITHUB_OUTPUT"
            echo "::warning::clover.xml absent — aucune couverture mesurée (mesure absente, pas 100 %)."
            exit 0
          fi
          PERCENT=$(php <<'PHP'
          <?php
          $xml = simplexml_load_file('storage/coverage/clover.xml');
          if ($xml === false) {
              echo '';
              exit;
          }
          $total = 0;
          $covered = 0;
          foreach ($xml->xpath('//file/metrics') ?: [] as $metrics) {
              $total += (int) $metrics['statements'];
              $covered += (int) $metrics['coveredstatements'];
          }
          echo $total > 0 ? number_format(($covered / $total) * 100, 2, '.', '') : '';
          PHP
          )
          if [[ -z "${PERCENT}" ]]; then
            echo "measured=false" >> "$GITHUB_OUTPUT"
            echo "percentage=" >> "$GITHUB_OUTPUT"
            echo "::warning::clover.xml illisible ou sans statement — aucune couverture mesurée."
            exit 0
          fi
          echo "measured=true" >> "$GITHUB_OUTPUT"
          echo "percentage=${PERCENT}" >> "$GITHUB_OUTPUT"
          echo "Backend coverage: ${PERCENT}%"

      - name: Compute per-module coverage
        if: needs.detect-changes.outputs.api_changed == 'true'
        id: modules
        working-directory: ./api
        shell: bash
        run: |
          set -euo pipefail
          CLOVER_FILE="storage/coverage/clover.xml"
          if [[ ! -f "${CLOVER_FILE}" ]]; then
            echo "No clover file — skipping per-module coverage (issue #1726)."
            exit 0
          fi
          php <<'PHP' > storage/coverage/modules.md
          <?php
          // Issue #1726 : couverture par module DDD (Payroll cible >= 80 %, S-4 #1602).
          $xml = simplexml_load_file('storage/coverage/clover.xml');
          if ($xml === false) { echo "_Aucune donnee de couverture par module._\n"; exit; }
          $modules = [];
          // NB : clover.xml a une structure <coverage><project><file> — il faut
          // xpath('//file') (comme le step global) et non $xml->file (vide).
          foreach ($xml->xpath('//file') as $file) {
              $metrics = $file->metrics;
              if ($metrics === null) continue;
              $name = (string) $file['name'];
              if (preg_match('#app/Modules/([^/]+)/#', $name, $m)) {
                  $mod = $m[1];
              } elseif (preg_match('#app/Core/([^/]+)/#', $name, $m)) {
                  $mod = 'Core/'.$m[1];
              } else {
                  $mod = '(hors module)';
              }
              if (!isset($modules[$mod])) { $modules[$mod] = ['t' => 0, 'c' => 0]; }
              $modules[$mod]['t'] += (int) $metrics['statements'];
              $modules[$mod]['c'] += (int) $metrics['coveredstatements'];
          }
          uasort($modules, fn($a, $b) => $b['t'] <=> $a['t']);
          echo "| Module | Couverture | Cible |\n";
          echo "|---|---|---|\n";
          foreach ($modules as $mod => $m) {
              $pct = $m['t'] > 0 ? number_format(($m['c'] / $m['t']) * 100, 1) : 'n/a';
              $target = (strpos($mod, 'Payroll') !== false) ? '**>= 80 %** (S-4)' : '—';
              echo "| {$mod} | {$pct}% | {$target} |\n";
          }
          PHP
          echo "modules_file=storage/coverage/modules.md" >> "$GITHUB_OUTPUT"
          echo "### Couverture par module (issue #1726)" >> "$GITHUB_STEP_SUMMARY"
          cat storage/coverage/modules.md >> "$GITHUB_STEP_SUMMARY"

          # Warning non bloquant si Payroll < 80 % (cible S-4 #1602 / audit #1726).
          PAYROLL_PCT=$(grep '^| Payroll ' storage/coverage/modules.md | head -1 | awk -F'|' '{print $3}' | tr -d ' %' || true)
          if [[ -n "${PAYROLL_PCT}" ]]; then
            if (( $(echo "${PAYROLL_PCT} < 80" | bc -l) )); then
              echo "::warning::Couverture du module Payroll = ${PAYROLL_PCT}% (< 80% cible S-4 #1602) — non bloquant (issue #1726)."
            else
              echo "Payroll coverage OK: ${PAYROLL_PCT}% (>= 80%)"
            fi
          fi

      - name: Evaluate coverage gate
        if: needs.detect-changes.outputs.api_changed == 'true'
        id: gate
        shell: bash
        env:
          COVERAGE_MIN: ${{ vars.BACKEND_COVERAGE_MIN || env.DEFAULT_BACKEND_COVERAGE_MIN }}
        run: |
          # Issue #8923 : la gate doit rendre un VERDICT, pas tomber sur une
          # erreur de script. Trois issues possibles, distinguées explicitement :
          #   passed=true        -> couverture mesurée >= seuil
          #   passed=false       -> couverture mesurée <  seuil  (échec réel)
          #   inconclusive=true  -> mesure absente (jamais reprochée à une PR)
          set -euo pipefail
          ACTUAL="${{ steps.coverage.outputs.percentage }}"
          MEASURED="${{ steps.coverage.outputs.measured }}"
          THRESHOLD="${COVERAGE_MIN}"
          TESTS_FAILED="${{ steps.tests.outputs.tests_failed }}"

          echo "Actual coverage: '${ACTUAL}' (measured=${MEASURED})"
          echo "Threshold: ${THRESHOLD}%"
          echo "Tests failed: ${TESTS_FAILED}"

          if [[ "${MEASURED}" != "true" || -z "${ACTUAL}" ]]; then
            echo "passed=false" >> "$GITHUB_OUTPUT"
            echo "inconclusive=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Aucune couverture mesurée — gate INCONCLUSIVE (pas un échec de seuil)."
            exit 0
          fi

          echo "inconclusive=false" >> "$GITHUB_OUTPUT"
          if awk -v a="${ACTUAL}" -v t="${THRESHOLD}" 'BEGIN { exit !(a + 0 >= t + 0) }'; then
            echo "Coverage gate PASSED (${ACTUAL}% >= ${THRESHOLD}%)"
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Coverage gate FAILED (${ACTUAL}% < ${THRESHOLD}%)"
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload coverage artifacts
        if: needs.detect-changes.outputs.api_changed == 'true' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-coverage-report
          path: |
            api/storage/coverage/clover.xml
            api/storage/coverage/summary.txt
            api/storage/coverage/modules.md
            api/storage/coverage/causal-error.txt
            api/storage/test-results/coverage.xml
          if-no-files-found: ignore
          retention-days: 30

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request' && needs.detect-changes.outputs.api_changed == 'true' && always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const percentage = `${{ steps.coverage.outputs.percentage }}`;
            const measured = `${{ steps.coverage.outputs.measured }}` === 'true';
            const threshold = `${{ vars.BACKEND_COVERAGE_MIN || '65' }}`; // keep in sync with env.DEFAULT_BACKEND_COVERAGE_MIN
            const inconclusive = `${{ steps.gate.outputs.inconclusive }}` === 'true';
            const passed = `${{ steps.gate.outputs.passed }}` === 'true';
            const testsFailed = `${{ steps.tests.outputs.tests_failed }}` === 'true';
            const icon = inconclusive ? ':warning:' : passed ? ':white_check_mark:' : ':x:';
            const status = inconclusive
              ? 'INCONCLUSIVE (aucune mesure)'
              : `${passed ? 'PASSED' : 'FAILED'}${testsFailed ? ' — suite backend rouge' : ''}`;
            let modulesTable = ''
            try {
              modulesTable = fs.readFileSync('api/storage/coverage/modules.md', 'utf8')
            } catch (e) {
              modulesTable = '_Couverture par module indisponible._'
            }

            const body = [
              `## ${icon} Backend Coverage Report`,
              '',
              `| Metric | Value |`,
              `|--------|-------|`,
              `| **Lines covered** | ${measured ? `${percentage}%` : '— (non mesuré)'} |`,
              `| **Threshold** | ${threshold}% |`,
              `| **Status** | ${status} |`,
              '',
              `### Par module (issue #1726)`,
              '',
              modulesTable.trim(),
              '',
              `> Configure threshold via GitHub variable \`BACKEND_COVERAGE_MIN\` (default: 65; ratchet atteint — A-4, #1682).`,
              `> Ratchet: 60 -> 65 % (2026-08-10, coverage mesure >= 68 % — A-4, #1682).`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Backend Coverage Report')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if coverage below threshold
        if: needs.detect-changes.outputs.api_changed == 'true' && steps.gate.outputs.passed == 'false' && steps.gate.outputs.inconclusive != 'true'
        run: |
          echo "Coverage gate failed (threshold: ${COVERAGE_MIN:-65}%). Increase test coverage or adjust BACKEND_COVERAGE_MIN variable."
          exit 1

      - name: Fail if backend test suite is red
        # Issue #8923 : la suite rouge ne supprime plus la mesure — elle fait
        # échouer le job ICI, après le verdict de couverture, pour que le
        # pourcentage reste publié et lisible sur la PR.
        if: needs.detect-changes.outputs.api_changed == 'true' && steps.tests.outputs.tests_failed == 'true'
        run: |
          echo "Suite backend rouge (exit ${{ steps.tests.outputs.tests_exit_code }}) — voir storage/coverage/summary.txt (artefact backend-coverage-report)."
          exit 1
