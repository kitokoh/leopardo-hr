name: Deploy Landing - GitHub Pages

# Migration du site produit statique (kitokoh.github.io/leopardo-hr) :
# branche `gh-pages` (legacy build) → Actions, contenu versionné sur `main`
# sous `site/gh-pages/`. Objectif fondateur : « ne garder que main » (#6815).
# Contenu identique à l'ancienne branche (mêmes chemins relatifs).
#
# Ajout : le portail de recette `docs/recette/` (multi-pages : accueil, une page
# par profil utilisateur, une page par module, une fiche de résultats par cas
# d'usage, récapitulatif) est publié sous `/recette/` du même site Pages, afin
# que les testeurs IA et humains disposent d'un portail organisé et navigable.
# Le portail est généré par `docs/recette/build_portal.py` (source de vérité :
# la taxonomie profils × modules × cas d'usage). Le Markdown et le prompt de
# l'agent testeur sont également publiés sous `/recette/`.

on:
  push:
    branches: [main]
    paths:
      - 'site/gh-pages/**'
      - 'docs/recette/**'
      - 'docs/marketing/**'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Assemble site (landing + portail de recette)
        run: |
          set -euo pipefail
          rm -rf _site
          cp -r site/gh-pages _site
          # Régénère le portail depuis la taxonomie (source de vérité) puis le publie.
          # `build_portal.py` lit `docs/recette/notes-humaines.json` (notes humaines
          # versionnées) et les intègre au rendu statique ; il ne l'écrase jamais.
          python3 docs/recette/build_portal.py --out docs/recette
          mkdir -p _site/recette
          cp -r docs/recette/. _site/recette/
          # Le fichier de notes humaines doit être publié : le portail le lit en
          # `fetch()` pour rafraîchir les colonnes « Note humaine » côté navigateur.
          test -f _site/recette/notes-humaines.json || {
            echo "::error::notes-humaines.json manquant dans l'artefact Pages"; exit 1; }
          python3 -c "import json,sys; d=json.load(open('_site/recette/notes-humaines.json')); sys.exit(0 if isinstance(d.get('notes'), dict) else 1)" \
            || { echo "::error::notes-humaines.json invalide (clé 'notes' absente)"; exit 1; }
          # Validation du schéma v2 : chaque cas doit exposer une liste
          # `historique` (migration douce : une liste absente est tolérée mais
          # signalée, car le portail l'initialise au prochain enregistrement).
          python3 - <<'PY'
          import json, sys
          d = json.load(open('_site/recette/notes-humaines.json'))
          notes = d.get('notes') or {}
          bad = [k for k, v in notes.items()
                 if not isinstance(v, dict) or not isinstance(v.get('historique', []), list)]
          if bad:
              print(f"::error::notes-humaines.json : 'historique' invalide pour {', '.join(bad)}")
              sys.exit(1)
          missing = [k for k, v in notes.items() if 'historique' not in v]
          if missing:
              print(f"::warning::notes-humaines.json : 'historique' absent (schéma v1) pour {len(missing)} cas — sera initialisé au prochain enregistrement")
          total = sum(len(v.get('historique') or []) for v in notes.values())
          print(f"notes-humaines.json valide : {len(notes)} cas, {total} entrée(s) d'historique.")
          PY
          # L'onglet « Recette » est déjà présent dans le menu principal de
          # site/gh-pages/index.html (lien relatif vers recette/), donc aucune
          # injection de lien n'est nécessaire ici.
          #
          # Espace « Scripts marketing » (docs/marketing/) : même modèle que le
          # portail de recette — régénéré depuis sa source de vérité
          # (scripts-video.json) puis publié sous /marketing/.
          python3 docs/marketing/build_marketing.py --out docs/marketing
          mkdir -p _site/marketing
          cp -r docs/marketing/. _site/marketing/
          test -f _site/marketing/index.html || {
            echo "::error::index.html manquant dans l'artefact /marketing/"; exit 1; }
          test -f _site/marketing/scripts-video.json || {
            echo "::error::scripts-video.json manquant dans l'artefact /marketing/"; exit 1; }
          test -f _site/marketing/statuts-tournage.json || {
            echo "::error::statuts-tournage.json manquant dans l'artefact /marketing/"; exit 1; }
          test -f _site/marketing/calendrier.html || {
            echo "::error::calendrier.html manquant dans l'artefact /marketing/"; exit 1; }
          python3 - <<'PY'
          import json, sys, pathlib
          d = json.load(open('_site/marketing/scripts-video.json'))
          cats = d.get('categories') or []
          scripts = d.get('scripts') or []
          if not cats or not scripts:
              print("::error::scripts-video.json : 'categories' ou 'scripts' vide"); sys.exit(1)
          slugs = {c.get('slug') for c in cats}
          ids = [s.get('id') for s in scripts]
          if len(ids) != len(set(ids)):
              print("::error::scripts-video.json : identifiants VID en doublon"); sys.exit(1)
          orphan = [s.get('id') for s in scripts if s.get('category') not in slugs]
          if orphan:
              print(f"::error::scripts-video.json : categorie inconnue pour {', '.join(orphan)}")
              sys.exit(1)
          missing = [s.get('id') for s in scripts
                     if not s.get('beats') or not s.get('hook') or not s.get('cta')]
          if missing:
              print(f"::error::scripts-video.json : script incomplet (hook/beats/cta) {', '.join(missing)}")
              sys.exit(1)
          # Chaque script doit avoir sa fiche HTML publiée.
          absent = [s['id'] for s in scripts
                    if not pathlib.Path(f"_site/marketing/scripts/{s['id'].lower()}.html").exists()]
          if absent:
              print(f"::error::fiche HTML manquante pour {', '.join(absent)}"); sys.exit(1)
          # Suivi de production : une entree par script, statut connu, historique liste.
          st = json.load(open('_site/marketing/statuts-tournage.json'))
          entries = st.get('statuts') or {}
          codes = {x.get('code') for x in (st.get('_meta', {}).get('statuts') or [])}
          if not codes:
              print("::error::statuts-tournage.json : _meta.statuts vide"); sys.exit(1)
          missing_st = [s['id'] for s in scripts if s['id'] not in entries]
          if missing_st:
              print(f"::error::statuts-tournage.json : entree manquante pour {', '.join(missing_st)}")
              sys.exit(1)
          bad_st = [k for k, v in entries.items()
                    if v.get('statut') not in codes or not isinstance(v.get('historique'), list)]
          if bad_st:
              print(f"::error::statuts-tournage.json : statut inconnu ou historique invalide pour {', '.join(bad_st)}")
              sys.exit(1)
          # Calendrier : chaque vague reference des scripts existants, et tous sont planifies.
          cal = d.get('calendrier') or {}
          vagues = cal.get('vagues') or []
          if not vagues:
              print("::error::scripts-video.json : 'calendrier.vagues' absent ou vide"); sys.exit(1)
          planned = [x for v in vagues for x in (v.get('scripts') or [])]
          unknown = [x for x in planned if x not in set(ids)]
          if unknown:
              print(f"::error::calendrier : script inconnu {', '.join(unknown)}"); sys.exit(1)
          unplanned = [i for i in ids if i not in set(planned)]
          if unplanned:
              print(f"::error::calendrier : script non planifie {', '.join(unplanned)}"); sys.exit(1)
          print(f"scripts-video.json valide : {len(scripts)} scripts, {len(cats)} categories, "
                f"{len(scripts)} fiches HTML publiees, {len(vagues)} vagues de tournage, "
                f"{len(entries)} statuts de production.")
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
