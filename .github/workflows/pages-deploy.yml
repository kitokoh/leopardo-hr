name: Deploy Landing - GitHub Pages

# Migration du site produit statique (kitokoh.github.io/leopardo-hr) :
# branche `gh-pages` (legacy build) → Actions, contenu versionné sur `main`
# sous `site/gh-pages/`. Objectif fondateur : « ne garder que main » (#6815).
# Contenu identique à l'ancienne branche (mêmes chemins relatifs).
#
# Ajout : le portail de recette `docs/recette/` (multi-pages : accueil, une page
# par profil utilisateur, une page par module, une fiche de résultats par cas
# d'usage, récapitulatif) est publié sous `/recette/` du même site Pages, afin
# que les testeurs IA et humains disposent d'un portail organisé et navigable.
# Le portail est généré par `docs/recette/build_portal.py` (source de vérité :
# la taxonomie profils × modules × cas d'usage). Le Markdown et le prompt de
# l'agent testeur sont également publiés sous `/recette/`.

on:
  push:
    branches: [main]
    paths:
      - 'site/gh-pages/**'
      - 'docs/recette/**'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Assemble site (landing + portail de recette)
        run: |
          set -euo pipefail
          rm -rf _site
          cp -r site/gh-pages _site
          # Régénère le portail depuis la taxonomie (source de vérité) puis le publie.
          # `build_portal.py` lit `docs/recette/notes-humaines.json` (notes humaines
          # versionnées) et les intègre au rendu statique ; il ne l'écrase jamais.
          python3 docs/recette/build_portal.py --out docs/recette
          mkdir -p _site/recette
          cp -r docs/recette/. _site/recette/
          # Le fichier de notes humaines doit être publié : le portail le lit en
          # `fetch()` pour rafraîchir les colonnes « Note humaine » côté navigateur.
          test -f _site/recette/notes-humaines.json || {
            echo "::error::notes-humaines.json manquant dans l'artefact Pages"; exit 1; }
          python3 -c "import json,sys; d=json.load(open('_site/recette/notes-humaines.json')); sys.exit(0 if isinstance(d.get('notes'), dict) else 1)" \
            || { echo "::error::notes-humaines.json invalide (clé 'notes' absente)"; exit 1; }
          # L'onglet « Recette » est déjà présent dans le menu principal de
          # site/gh-pages/index.html (lien relatif vers recette/), donc aucune
          # injection de lien n'est nécessaire ici.

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
