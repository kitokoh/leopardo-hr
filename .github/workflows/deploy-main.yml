name: Deploy - Leopardo RH

on:
  workflow_run:
    workflows: ["Tests - Leopardo RH", "Web CI - Leopardo Admin"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEFAULT_API_BASE_URL: https://gestionemployerbackend.onrender.com/api/v1
  DEFAULT_API_HEALTHCHECK_URL: https://gestionemployerbackend.onrender.com/api/v1/health

concurrency:
  group: deploy-main-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare deployment context
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.final.outputs.should_deploy }}
      ref: ${{ steps.context.outputs.ref }}
      sha: ${{ steps.context.outputs.sha }}
      web_changed: ${{ steps.final.outputs.web_changed }}
      app_version: ${{ steps.final.outputs.app_version }}
    steps:
      - name: Resolve deployment source
        id: context
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
              echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "should_deploy=pending-validation" >> "$GITHUB_OUTPUT"
            echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event.workflow_run.conclusion }}" == "success" && "${{ github.event.workflow_run.event }}" == "push" && "${{ github.event.workflow_run.head_branch }}" == "main" ]]; then
            echo "should_deploy=pending-validation" >> "$GITHUB_OUTPUT"
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "ref=" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout deployment SHA
        if: steps.context.outputs.should_deploy == 'pending-validation'
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.context.outputs.sha }}
          fetch-depth: 2

      - name: Detect changed areas for deployment gating
        if: steps.context.outputs.should_deploy == 'pending-validation'
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          sha="${{ steps.context.outputs.sha }}"
          parent="$(git rev-list --parents -n 1 "${sha}" | awk '{print $2}')"
          changed_files=""

          if [[ -n "${parent}" ]]; then
            changed_files="$(git diff --name-only "${parent}" "${sha}")"
          else
            changed_files="$(git show --name-only --pretty='' "${sha}")"
          fi

          web_changed=false
          if printf '%s\n' "${changed_files}" | grep -Eq '^(front/admin-dashboard/|\.github/workflows/web-ci\.yml|\.github/workflows/deploy-main\.yml|docs/GESTION_PROJET/SCENARIOS_TEST_WEB_ADMIN_GITHUB_ACTIONS\.md|docs/GESTION_PROJET/REGISTRE_SCENARIOS_TESTS\.md)'; then
            web_changed=true
          fi

          echo "web_changed=${web_changed}" >> "$GITHUB_OUTPUT"

      - name: Resolve program version for deploy metadata
        if: steps.context.outputs.should_deploy == 'pending-validation'
        id: version
        shell: bash
        run: |
          set -euo pipefail
          program_version="$(sed -n 's/^# PROGRAM_VERSION = \([^ |]*\).*$/\1/p' PILOTAGE.md | head -n 1)"
          if [[ -z "${program_version}" ]]; then
            echo "Unable to resolve PROGRAM_VERSION from PILOTAGE.md"
            exit 1
          fi
          echo "app_version=${program_version}" >> "$GITHUB_OUTPUT"
          echo "Deploy APP_VERSION=${program_version}"

      - name: Verify required workflow conclusions for deployment SHA
        if: steps.context.outputs.should_deploy == 'pending-validation'
        id: workflow_gate
        uses: actions/github-script@v7
        with:
          script: |
            if (`${{ github.event_name }}` === 'workflow_dispatch') {
              core.info('Manual deployment on main: bypassing workflow_run lookup.');
              core.setOutput('tests_conclusion', 'manual-dispatch');
              core.setOutput('web_conclusion', 'manual-dispatch');
              core.setOutput('should_deploy', 'true');
              return;
            }

            const sha = `${{ steps.context.outputs.sha }}`;
            const webChanged = `${{ steps.changes.outputs.web_changed }}` === 'true';
            const { owner, repo } = context.repo;

            const allRuns = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner,
              repo,
              branch: 'main',
              event: 'push',
              per_page: 100,
            });

            const runsForSha = allRuns.filter((run) => run.head_sha === sha);

            const getConclusion = (workflowName) => {
              const match = runsForSha.find((run) => run.name === workflowName);
              return match ? match.conclusion : null;
            };

            const testsConclusion = getConclusion('Tests - Leopardo RH');
            const webConclusion = getConclusion('Web CI - Leopardo Admin');

            core.info(`Deployment SHA: ${sha}`);
            core.info(`Tests workflow conclusion: ${testsConclusion}`);
            core.info(`Web workflow conclusion: ${webConclusion}`);
            core.info(`Web changed: ${webChanged}`);

            let shouldDeploy = testsConclusion === 'success';
            if (webChanged) {
              shouldDeploy = shouldDeploy && webConclusion === 'success';
            }

            core.setOutput('tests_conclusion', testsConclusion ?? 'missing');
            core.setOutput('web_conclusion', webConclusion ?? 'not-required');
            core.setOutput('should_deploy', shouldDeploy ? 'true' : 'false');

      - name: Finalize deployment decision
        if: steps.context.outputs.should_deploy == 'pending-validation'
        id: decision
        shell: bash
        run: |
          echo "should_deploy=${{ steps.workflow_gate.outputs.should_deploy }}" >> "$GITHUB_OUTPUT"

      - name: Expose validated deployment decision
        if: steps.context.outputs.should_deploy == 'pending-validation'
        shell: bash
        run: |
          echo "Deployment gate resolved for ${{ steps.context.outputs.sha }}."
          echo "APP_VERSION=${{ steps.version.outputs.app_version }}"

      - name: Export final prepare outputs
        id: final
        shell: bash
        run: |
          if [[ "${{ steps.context.outputs.should_deploy }}" == "pending-validation" ]]; then
            echo "should_deploy=${{ steps.decision.outputs.should_deploy }}" >> "$GITHUB_OUTPUT"
            echo "web_changed=${{ steps.changes.outputs.web_changed }}" >> "$GITHUB_OUTPUT"
            echo "app_version=${{ steps.version.outputs.app_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=${{ steps.context.outputs.should_deploy }}" >> "$GITHUB_OUTPUT"
            echo "web_changed=false" >> "$GITHUB_OUTPUT"
            echo "app_version=" >> "$GITHUB_OUTPUT"
          fi

  deploy-api:
    name: Deploy API + Web to Render
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.should_deploy == 'true'

    steps:
      - name: Validate Render secret
        shell: bash
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${RENDER_DEPLOY_HOOK_URL}" ]]; then
            echo "Missing GitHub secret: RENDER_DEPLOY_HOOK_URL"
            exit 1
          fi

      - name: Trigger Render deploy hook
        shell: bash
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
        run: |
          set -euo pipefail
          echo "Triggering Render deploy for APP_VERSION=${APP_VERSION}"
          curl --fail --silent --show-error --request POST "${RENDER_DEPLOY_HOOK_URL}"

      - name: Wait for API/Web healthcheck
        shell: bash
        env:
          API_HEALTHCHECK_URL: ${{ secrets.API_HEALTHCHECK_URL }}
        run: |
          set -euo pipefail
          URL="${API_HEALTHCHECK_URL:-${DEFAULT_API_HEALTHCHECK_URL}}"

          for attempt in {1..30}; do
            echo "Healthcheck attempt ${attempt}/30 on ${URL}"
            if curl --fail --silent --show-error "${URL}" | grep -q '"status":"ok"'; then
              echo "Render deployment healthy."
              exit 0
            fi
            sleep 20
          done

          echo "API healthcheck did not become healthy in time."
          exit 1

      - name: Rollback on failure
        if: failure()
        shell: bash
        env:
          RENDER_ROLLBACK_HOOK_URL: ${{ secrets.RENDER_ROLLBACK_HOOK_URL }}
        run: |
          if [[ -n "${RENDER_ROLLBACK_HOOK_URL}" ]]; then
            echo "Deployment failed. Triggering Render rollback..."
            curl --fail --silent --show-error --request POST "${RENDER_ROLLBACK_HOOK_URL}"
          else
            echo "Deployment failed but RENDER_ROLLBACK_HOOK_URL secret is missing. Cannot auto-rollback."
          fi

  distribute-mobile:
    name: Distribute mobile staging build
    runs-on: ubuntu-latest
    needs: [prepare, deploy-api]
    if: needs.prepare.outputs.should_deploy == 'true'
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: employee
            project_path: front/mobile_apps/leopardo_employee
            artifact_name: leopardo-employee-main
            firebase_secret: FIREBASE_EMPLOYEE_ANDROID_APP_ID
            android_package: com.leopardo.employee
          - name: manager
            project_path: front/mobile_apps/leopardo_manager
            artifact_name: leopardo-manager-main
            firebase_secret: FIREBASE_MANAGER_ANDROID_APP_ID
            android_package: com.leopardo.manager
          - name: platform_admin
            project_path: front/mobile_apps/leopardo_platform_admin
            artifact_name: leopardo-platform-admin-main
            firebase_secret: FIREBASE_PLATFORM_ADMIN_ANDROID_APP_ID
            android_package: com.leopardo.platformadmin

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Resolve Firebase distribution readiness
        id: firebase_ready
        shell: bash
        env:
          FIREBASE_APP_ID: ${{ secrets[matrix.app.firebase_secret] }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_APP_ID_SECRET_NAME: ${{ matrix.app.firebase_secret }}
          PROJECT_PATH: ${{ matrix.app.project_path }}
          APP_NAME: ${{ matrix.app.name }}
          ANDROID_PACKAGE: ${{ matrix.app.android_package }}
        run: |
          set -euo pipefail
          READY=true
          if [[ -z "${FIREBASE_APP_ID}" ]]; then
            echo "Missing GitHub secret: ${FIREBASE_APP_ID_SECRET_NAME}. Skipping ${{ matrix.app.name }} Firebase distribution."
            READY=false
          fi
          if [[ -z "${FIREBASE_TOKEN}" ]]; then
            echo "Missing GitHub secret: FIREBASE_TOKEN. Skipping ${{ matrix.app.name }} Firebase distribution."
            READY=false
          fi
          CONFIG_FILE="${PROJECT_PATH}/android/app/google-services.json"
          if [[ ! -f "${CONFIG_FILE}" ]]; then
            echo "Missing Firebase config: ${CONFIG_FILE}. Skipping ${{ matrix.app.name }} Firebase distribution."
            READY=false
          fi
          if [[ "${READY}" == "true" ]]; then
            node <<'NODE'
            const fs = require('fs');
            const configFile = `${process.env.PROJECT_PATH}/android/app/google-services.json`;
            const expectedPackage = process.env.ANDROID_PACKAGE;
            const expectedAppId = process.env.FIREBASE_APP_ID;
            const secretName = process.env.FIREBASE_APP_ID_SECRET_NAME;
            const payload = JSON.parse(fs.readFileSync(configFile, 'utf8'));
            const clients = Array.isArray(payload.client) ? payload.client : [];
            const match = clients.find((client) => client?.client_info?.android_client_info?.package_name === expectedPackage);
            if (!match) {
              console.error(`No Firebase Android client found for ${expectedPackage} in ${configFile}.`);
              process.exit(1);
            }
            const nativeAppId = match?.client_info?.mobilesdk_app_id;
            if (!nativeAppId) {
              console.error(`Firebase Android client for ${expectedPackage} does not expose mobilesdk_app_id.`);
              process.exit(1);
            }
            if (nativeAppId !== expectedAppId) {
              console.error(`${secretName} does not match ${configFile} for ${expectedPackage}.`);
              console.error(`Expected the secret to equal the google-services.json mobilesdk_app_id for this app.`);
              process.exit(1);
            }
            console.log(`Firebase target verified for ${process.env.APP_NAME}: ${expectedPackage}.`);
            NODE
            {
              echo "### Firebase target - ${APP_NAME}"
              echo "- Android package: \`${ANDROID_PACKAGE}\`"
              echo "- Native config: \`${CONFIG_FILE}\`"
              echo "- Console: https://console.firebase.google.com/project/leopardo-rh/appdistribution/app/android:${ANDROID_PACKAGE}/releases"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "MOBILE_DISTRIBUTE_READY=${READY}" >> "$GITHUB_ENV"

      - name: Setup Java 17
        if: env.MOBILE_DISTRIBUTE_READY == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        if: env.MOBILE_DISTRIBUTE_READY == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        if: env.MOBILE_DISTRIBUTE_READY == 'true'
        working-directory: ${{ matrix.app.project_path }}
        run: flutter pub get

      - name: Build release APK for staging
        if: env.MOBILE_DISTRIBUTE_READY == 'true'
        working-directory: ${{ matrix.app.project_path }}
        shell: bash
        run: |
          set -euo pipefail
          echo "API_BASE_URL=${DEFAULT_API_BASE_URL}" > .env.build
          flutter build apk --release \
            --dart-define-from-file=.env.build \
            --build-name="main-${GITHUB_RUN_NUMBER}" \
            --build-number="${GITHUB_RUN_NUMBER}"

      - name: Upload mobile artifact
        if: env.MOBILE_DISTRIBUTE_READY == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.app.artifact_name }}-${{ github.run_number }}
          path: ${{ matrix.app.project_path }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Firebase App Distribution (staging)
        if: env.MOBILE_DISTRIBUTE_READY == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets[matrix.app.firebase_secret] }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: testeurs-internes
          file: ${{ matrix.app.project_path }}/build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: |
            Auto deploy from main - Leopardo ${{ matrix.app.name }}
            Commit: ${{ needs.prepare.outputs.sha }}
            Workflow: ${{ github.workflow }}
            Backend: https://gestionemployerbackend.onrender.com

      - name: Verify Firebase App Distribution release is visible
        if: env.MOBILE_DISTRIBUTE_READY == 'true'
        shell: bash
        env:
          FIREBASE_APP_ID: ${{ secrets[matrix.app.firebase_secret] }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_READBACK_REQUIRED: ${{ secrets.FIREBASE_READBACK_REQUIRED }}
          APP_NAME: ${{ matrix.app.name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          EXPECTED_BUILD="${BUILD_NUMBER}"
          FIREBASE_READBACK_STRICT="${FIREBASE_READBACK_REQUIRED:-false}"
          USED_SERVICE_ACCOUNT=false
          FIREBASE_AUTH_ARGS=(--token "${FIREBASE_TOKEN}")
          if [[ -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]]; then
            printf '%s' "${FIREBASE_SERVICE_ACCOUNT_JSON}" > "${RUNNER_TEMP}/firebase-service-account.json"
            export GOOGLE_APPLICATION_CREDENTIALS="${RUNNER_TEMP}/firebase-service-account.json"
            FIREBASE_AUTH_ARGS=()
            USED_SERVICE_ACCOUNT=true
            echo "Using Firebase service account readback for ${APP_NAME}."
            echo "Firebase readback strict mode: ${FIREBASE_READBACK_STRICT}."
          fi
          echo "Verifying Firebase App Distribution read-after-write for ${APP_NAME} build ${EXPECTED_BUILD}."
          for attempt in 1 2 3 4 5 6; do
            echo "Firebase visibility attempt ${attempt}/6..."
            set +e
            npx --yes firebase-tools appdistribution:releases:list \
              --app "${FIREBASE_APP_ID}" \
              "${FIREBASE_AUTH_ARGS[@]}" \
              --limit 10 \
              --json > firebase-releases.json 2> firebase-releases.err
            firebase_status=$?
            set -e

            if [[ ${firebase_status} -ne 0 ]]; then
              if [[ "${USED_SERVICE_ACCOUNT}" == "true" && "${FIREBASE_READBACK_STRICT}" != "true" ]]; then
                echo "::warning::Firebase service-account readback failed for ${APP_NAME}; retrying readback with FIREBASE_TOKEN."
                cat firebase-releases.err || true
                set +e
                npx --yes firebase-tools appdistribution:releases:list \
                  --app "${FIREBASE_APP_ID}" \
                  --token "${FIREBASE_TOKEN}" \
                  --limit 10 \
                  --json > firebase-releases.json 2> firebase-releases.err
                firebase_status=$?
                set -e
              fi
            fi

            if [[ ${firebase_status} -ne 0 ]]; then
              if [[ "${FIREBASE_READBACK_STRICT}" == "true" ]]; then
                echo "::error::Firebase service-account readback failed for ${APP_NAME}."
                cat firebase-releases.err || true
                exit ${firebase_status}
              fi
              echo "::warning::Firebase upload succeeded, but firebase-tools could not list App Distribution releases for ${APP_NAME}."
              echo "::warning::Keeping deploy green because the upload action is the distribution source of truth; set FIREBASE_READBACK_REQUIRED=true after the service account is rotated and granted App Distribution access."
              cat firebase-releases.err || true
              exit 0
            fi

            set +e
            node -e 'const fs = require("fs"); const payload = JSON.parse(fs.readFileSync("firebase-releases.json", "utf8")); const expectedBuild = process.env.EXPECTED_BUILD || process.env.BUILD_NUMBER; const appName = process.env.APP_NAME; const releases = Array.isArray(payload.result) ? payload.result : (Array.isArray(payload.result?.releases) ? payload.result.releases : []); const match = releases.find((release) => String(release.buildVersion) === String(expectedBuild)); if (!match) { console.error(`Firebase App Distribution release not visible yet for ${appName} build ${expectedBuild}.`); console.error(`Visible build versions: ${releases.map((release) => release.buildVersion).join(", ") || "none"}`); process.exit(2); } console.log(`Firebase App Distribution release visible for ${appName}: ${match.name || match.displayVersion || match.buildVersion}`);'
            node_status=$?
            set -e

            if [[ ${node_status} -eq 0 ]]; then
              exit 0
            fi
            if [[ ${node_status} -ne 2 ]]; then
              echo "::error::Firebase release list returned an unexpected payload."
              head -c 2000 firebase-releases.json || true
              exit ${node_status}
            fi
            sleep 20
          done

          echo "::error::Firebase upload succeeded, but build ${EXPECTED_BUILD} was not visible in the last 10 releases after retries."
          exit 1
