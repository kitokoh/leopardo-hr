name: Deploy - Leopardo RH

on:
  workflow_run:
    workflows: ["Tests - Leopardo RH", "Web CI - Leopardo Admin"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEFAULT_API_BASE_URL: https://gestionemployerbackend.onrender.com/api/v1
  DEFAULT_API_HEALTHCHECK_URL: https://gestionemployerbackend.onrender.com/api/v1/health

concurrency:
  group: deploy-main-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare deployment context
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      should_deploy: ${{ steps.final.outputs.should_deploy }}
      ref: ${{ steps.context.outputs.ref }}
      sha: ${{ steps.context.outputs.sha }}
      web_changed: ${{ steps.final.outputs.web_changed }}
      app_version: ${{ steps.final.outputs.app_version }}
    steps:
      - name: Resolve deployment source
        id: context
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WR_EVENT: ${{ github.event.workflow_run.event }}
          WR_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WR_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
              {
                echo "should_deploy=false"
                echo "ref=${GITHUB_REF_NAME}"
                echo "sha=${GITHUB_SHA}"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            {
              echo "should_deploy=pending-validation"
              echo "ref=${GITHUB_REF_NAME}"
              echo "sha=${GITHUB_SHA}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Defense in depth: only ever treat this as a deployable run when the
          # upstream workflow_run (a) succeeded, (b) was itself triggered by a
          # push (never pull_request/pull_request_target from a fork), (c) targeted
          # main, and (d) ran in this same base repository (not a fork). This keeps
          # the subsequent privileged checkout scoped to code that was already
          # pushed to main by a trusted collaborator.
          if [[ "${WR_CONCLUSION}" == "success" && "${WR_EVENT}" == "push" && "${WR_HEAD_BRANCH}" == "main" && "${WR_HEAD_REPO}" == "${BASE_REPO}" ]]; then
            {
              echo "should_deploy=pending-validation"
              echo "ref=main"
              echo "sha=${WR_HEAD_SHA}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "should_deploy=false"
              echo "ref="
              echo "sha="
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout deployment SHA
        if: steps.context.outputs.should_deploy == 'pending-validation'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.context.outputs.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve parent commit for change detection
        if: steps.context.outputs.should_deploy == 'pending-validation'
        id: parent
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ steps.context.outputs.sha }}"
          parent="$(git rev-list --parents -n 1 "${sha}" | awk '{print $2}')"
          echo "sha=${parent:-${sha}}" >> "$GITHUB_OUTPUT"

      - name: Detect changed areas for deployment gating
        if: steps.context.outputs.should_deploy == 'pending-validation'
        id: changes
        # Audit §3.3 / Plan P2: now shares .github/paths-filters.yml with
        # tests.yml's detect-changes job instead of a second hand-rolled
        # `git diff` + `grep -E` regex that could (and did) drift out of sync.
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: .github/paths-filters.yml
          base: ${{ steps.parent.outputs.sha }}

      - name: Export web_changed output
        if: steps.context.outputs.should_deploy == 'pending-validation'
        shell: bash
        run: |
          echo "web_changed=${{ steps.changes.outputs.web }}" >> "$GITHUB_OUTPUT"

      - name: Resolve program version for deploy metadata
        if: steps.context.outputs.should_deploy == 'pending-validation'
        id: version
        shell: bash
        run: |
          set -euo pipefail
          program_version="$(sed -n 's/^# PROGRAM_VERSION = \([^ |]*\).*$/\1/p' PILOTAGE.md | head -n 1)"
          if [[ -z "${program_version}" ]]; then
            echo "Unable to resolve PROGRAM_VERSION from PILOTAGE.md"
            exit 1
          fi
          echo "app_version=${program_version}" >> "$GITHUB_OUTPUT"
          echo "Deploy APP_VERSION=${program_version}"

      - name: Verify required workflow conclusions for deployment SHA
        if: steps.context.outputs.should_deploy == 'pending-validation'
        id: workflow_gate
        uses: actions/github-script@v9
        with:
          script: |
            if (`${{ github.event_name }}` === 'workflow_dispatch') {
              core.info('Manual deployment on main: bypassing workflow_run lookup.');
              core.setOutput('tests_conclusion', 'manual-dispatch');
              core.setOutput('web_conclusion', 'manual-dispatch');
              core.setOutput('should_deploy', 'true');
              return;
            }

            const sha = `${{ steps.context.outputs.sha }}`;
            const webChanged = `${{ steps.changes.outputs.web }}` === 'true';
            const { owner, repo } = context.repo;

            const allRuns = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner,
              repo,
              branch: 'main',
              event: 'push',
              per_page: 100,
            });

            const runsForSha = allRuns.filter((run) => run.head_sha === sha);

            const getConclusion = (workflowName) => {
              const match = runsForSha.find((run) => run.name === workflowName);
              return match ? match.conclusion : null;
            };

            const testsConclusion = getConclusion('Tests - Leopardo RH');
            const webConclusion = getConclusion('Web CI - Leopardo Admin');

            core.info(`Deployment SHA: ${sha}`);
            core.info(`Tests workflow conclusion: ${testsConclusion}`);
            core.info(`Web workflow conclusion: ${webConclusion}`);
            core.info(`Web changed: ${webChanged}`);

            let shouldDeploy = testsConclusion === 'success';
            if (webChanged) {
              shouldDeploy = shouldDeploy && webConclusion === 'success';
            }

            core.setOutput('tests_conclusion', testsConclusion ?? 'missing');
            core.setOutput('web_conclusion', webConclusion ?? 'not-required');
            core.setOutput('should_deploy', shouldDeploy ? 'true' : 'false');

      - name: Finalize deployment decision
        if: steps.context.outputs.should_deploy == 'pending-validation'
        id: decision
        shell: bash
        run: |
          echo "should_deploy=${{ steps.workflow_gate.outputs.should_deploy }}" >> "$GITHUB_OUTPUT"

      - name: Expose validated deployment decision
        if: steps.context.outputs.should_deploy == 'pending-validation'
        shell: bash
        run: |
          echo "Deployment gate resolved for ${{ steps.context.outputs.sha }}."
          echo "APP_VERSION=${{ steps.version.outputs.app_version }}"

      - name: Export final prepare outputs
        id: final
        shell: bash
        run: |
          if [[ "${{ steps.context.outputs.should_deploy }}" == "pending-validation" ]]; then
            {
              echo "should_deploy=${{ steps.decision.outputs.should_deploy }}"
              echo "web_changed=${{ steps.changes.outputs.web }}"
              echo "app_version=${{ steps.version.outputs.app_version }}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "should_deploy=${{ steps.context.outputs.should_deploy }}"
              echo "web_changed=false"
              echo "app_version="
            } >> "$GITHUB_OUTPUT"
          fi

  deploy-api:
    name: Deploy API + Web to Render
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.should_deploy == 'true'
    permissions:
      contents: read

    steps:
      - name: Validate Render secret
        shell: bash
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${RENDER_DEPLOY_HOOK_URL}" ]]; then
            echo "Missing GitHub secret: RENDER_DEPLOY_HOOK_URL"
            exit 1
          fi

      - name: Trigger Render deploy hook
        shell: bash
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
        run: |
          set -euo pipefail
          echo "Triggering Render deploy for APP_VERSION=${APP_VERSION}"
          curl --fail --silent --show-error --request POST "${RENDER_DEPLOY_HOOK_URL}"

      - name: Wait for API/Web healthcheck
        shell: bash
        env:
          API_HEALTHCHECK_URL: ${{ secrets.API_HEALTHCHECK_URL }}
        run: |
          set -euo pipefail
          URL="${API_HEALTHCHECK_URL:-${DEFAULT_API_HEALTHCHECK_URL}}"

          for attempt in {1..30}; do
            echo "Healthcheck attempt ${attempt}/30 on ${URL}"
            if curl --fail --silent --show-error "${URL}" | grep -q '"status":"ok"'; then
              echo "Render deployment healthy."
              exit 0
            fi
            sleep 20
          done

          echo "API healthcheck did not become healthy in time."
          exit 1

      - name: Rollback on failure
        if: failure()
        shell: bash
        env:
          RENDER_ROLLBACK_HOOK_URL: ${{ secrets.RENDER_ROLLBACK_HOOK_URL }}
        run: |
          if [[ -n "${RENDER_ROLLBACK_HOOK_URL}" ]]; then
            echo "Deployment failed. Triggering Render rollback..."
            curl --fail --silent --show-error --request POST "${RENDER_ROLLBACK_HOOK_URL}"
          else
            echo "Deployment failed but RENDER_ROLLBACK_HOOK_URL secret is missing. Cannot auto-rollback."
          fi

