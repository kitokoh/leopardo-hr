name: Deploy - Leopardo RH

on:
  # #3545 / #4359 : le déclencheur `push` direct est l’unique source de vérité
  # du déploiement; les déclencheurs workflow_run redondants provoquaient
  # plusieurs runs du même SHA et une famine de file GitHub Actions.
  #
  # concurrence : sous rafale de merges (~1/2 min), les runs Tests de main
  # étaient annulés en pending (48/50 cancelled), conclusion 'cancelled' →
  # should_deploy=false à 100 %, prod figée depuis le 2026-08-15.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEFAULT_API_BASE_URL: ${{ vars.PROD_API_BASE_URL }}
  DEFAULT_API_HEALTHCHECK_URL: ${{ vars.PROD_API_BASE_URL }}/health

# #1835 / #3904 / #4359 : un seul run de déploiement par SHA; le push main
# est désormais l’unique déclencheur automatique. Le groupe par SHA protège
# encore les déclenchements manuels et annule les doublons explicites.
concurrency:
  group: deploy-main-${{ github.sha }}
  cancel-in-progress: true

jobs:
  prepare:
    timeout-minutes: 45
    name: Prepare deployment context
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      should_deploy: ${{ steps.final.outputs.should_deploy }}
      ref: ${{ steps.context.outputs.ref }}
      sha: ${{ steps.context.outputs.sha }}
      web_changed: ${{ steps.final.outputs.web_changed }}
      api_changed: ${{ steps.final.outputs.api_changed }}
      app_version: ${{ steps.final.outputs.app_version }}
    steps:
      # The gate runs before the full deployment checkout. This sparse,
      # credential-free checkout contains only the trusted local action so
      # GitHub can resolve it without exposing the deployment tree first.
      - name: Checkout trusted deploy gate action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/actions/verify-deploy-workflows
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      - name: Guard PROD_API_BASE_URL (#4524)
        shell: bash
        run: |
          if [[ -z "${{ vars.PROD_API_BASE_URL }}" ]]; then
            echo "::error::PROD_API_BASE_URL must be set (fail-open fallback removed, issue #4524)."
            exit 1
          fi
          echo "PROD_API_BASE_URL=${{ vars.PROD_API_BASE_URL }}"

      - name: Resolve deployment source
        id: context
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WR_EVENT: ${{ github.event.workflow_run.event }}
          WR_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WR_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
              {
                echo "should_deploy=false"
                echo "ref=${GITHUB_REF_NAME}"
                echo "sha=${GITHUB_SHA}"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            {
              echo "should_deploy=pending-validation"
              echo "ref=${GITHUB_REF_NAME}"
              echo "sha=${GITHUB_SHA}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # #3545 : déclenchement direct sur push main. Le gate (étape
          # `workflow_gate`) poll les runs du SHA au lieu de lire la
          # conclusion d'un parent — le run du DERNIER SHA aboutit toujours
          # (rien de plus récent pour l'annuler en pending).
          if [[ "${EVENT_NAME}" == "push" ]]; then
            {
              echo "should_deploy=pending-validation"
              echo "ref=${GITHUB_REF_NAME}"
              echo "sha=${GITHUB_SHA}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Defense in depth: only ever treat this as a deployable run when the
          # upstream workflow_run (a) succeeded, (b) was itself triggered by a
          # push (never pull_request/pull_request_target from a fork), (c) targeted
          # main, and (d) ran in this same base repository (not a fork). This keeps
          # the subsequent privileged checkout scoped to code that was already
          # pushed to main by a trusted collaborator.
          # Audit CodeQL #30 (2026-08-17) : validation stricte du format du SHA
          # issu de l'événement workflow_run avant tout usage (injection
          # impossible : seuls des hexadécimaux sont acceptés).
          if [[ "${WR_HEAD_SHA}" =~ ^[0-9a-f]{40}$ && "${WR_CONCLUSION}" == "success" && "${WR_EVENT}" == "push" && "${WR_HEAD_BRANCH}" == "main" && "${WR_HEAD_REPO}" == "${BASE_REPO}" ]]; then
            {
              echo "should_deploy=pending-validation"
              echo "ref=main"
              echo "sha=${WR_HEAD_SHA}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "should_deploy=false"
              echo "ref="
              echo "sha="
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve changed areas via API (before privileged checkout)
        if: steps.context.outputs.should_deploy == 'pending-validation'
        id: changes_api
        # CodeQL actions/cache-poisoning/poisonable-step (alerte #30) : le
        # checkout privilégié ne doit JAMAIS utiliser un SHA non vérifié.
        # On calcule ici web_changed via l'API (compare des fichiers entre le
        # parent et le SHA) pour permettre au gate de tourner AVANT le
        # checkout — même logique que le filtre `web` de .github/paths-filters.yml.
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = `${{ steps.context.outputs.sha }}`;
            const isWebPath = (p) =>
              p.startsWith('front/admin-dashboard/') ||
              p === '.github/workflows/web-ci.yml' ||
              p === '.github/workflows/deploy-main.yml' ||
              p === 'docs/GESTION_PROJET/SCENARIOS_TEST_WEB_ADMIN_GITHUB_ACTIONS.md' ||
              p === 'docs/GESTION_PROJET/REGISTRE_SCENARIOS_TESTS.md';
            try {
              const { data: commit } = await github.rest.repos.getCommit({ owner, repo, ref: sha });
              const parent = commit.parents[0]?.sha;
              let webChanged = true; // conservateur : parent inconnu => web requise
              if (parent) {
                const { data: cmp } = await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: `${parent}...${sha}`,
                });
                webChanged = (cmp.files ?? []).some((f) => isWebPath(f.filename));
              }
              core.setOutput('web_changed', webChanged ? 'true' : 'false');
              core.setOutput('parent_sha', parent ?? '');
            } catch (err) {
              core.warning(`resolve changes via API failed: ${err.message} — web_changed conservateur (true).`);
              core.setOutput('web_changed', 'true');
              core.setOutput('parent_sha', '');
            }

      - name: Verify required workflow conclusions for deployment SHA
        if: steps.context.outputs.should_deploy == 'pending-validation'
        id: workflow_gate
        # Issue #4723 : logique de gate partagée avec l'autre workflow de
        # déploiement via l'action composite verify-deploy-workflows.
        # CodeQL cache-poisoning (alerte #30) : ce gate 100 % API tourne AVANT
        # le checkout privilégié ; web_changed provient de changes_api (API),
        # pas d'un diff local post-checkout.
        uses: ./.github/actions/verify-deploy-workflows
        with:
          sha: ${{ steps.context.outputs.sha }}
          required_workflows: '["Tests - Leopardo RH","Web CI - Leopardo Admin"]'
          web_changed: ${{ steps.changes_api.outputs.web_changed == 'true' }}
      - name: Finalize deployment decision
        if: steps.context.outputs.should_deploy == 'pending-validation'
        id: decision
        shell: bash
        run: |
          echo "should_deploy=${{ steps.workflow_gate.outputs.should_deploy }}" >> "$GITHUB_OUTPUT"

      - name: Checkout deployment SHA
        if: steps.context.outputs.should_deploy == 'pending-validation' && steps.decision.outputs.should_deploy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false
          ref: ${{ steps.context.outputs.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve parent commit for change detection
        if: steps.context.outputs.should_deploy == 'pending-validation' && steps.decision.outputs.should_deploy == 'true'
        id: parent
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ steps.context.outputs.sha }}"
          parent="$(git rev-list --parents -n 1 "${sha}" | awk '{print $2}')"
          echo "sha=${parent:-${sha}}" >> "$GITHUB_OUTPUT"

      - name: Detect changed areas for deployment gating
        if: steps.context.outputs.should_deploy == 'pending-validation' && steps.decision.outputs.should_deploy == 'true'
        id: changes
        # Audit §3.3 / Plan P2: now shares .github/paths-filters.yml with
        # tests.yml's detect-changes job instead of a second hand-rolled
        # `git diff` + `grep -E` regex that could (and did) drift out of sync.
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/paths-filters.yml
          base: ${{ steps.parent.outputs.sha }}

      - name: Export web_changed + api_changed outputs
        id: export
        if: steps.context.outputs.should_deploy == 'pending-validation' && steps.decision.outputs.should_deploy == 'true'
        shell: bash
        run: |
          echo "web_changed=${{ steps.changes.outputs.web }}" >> "$GITHUB_OUTPUT"
          # api_changed : true si des fichiers api/** (ou CI backend) ont changé.
          # Conservateur : si le parent est introuvable (base=sha => diff vide,
          # paths-filter renvoie false), on déploie quand même (api_changed=true).
          parent_sha="${{ steps.parent.outputs.sha }}"
          deploy_sha="${{ steps.context.outputs.sha }}"
          if [[ "${parent_sha}" == "${deploy_sha}" ]]; then
            echo "api_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "api_changed=${{ steps.changes.outputs.api }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve program version for deploy metadata
        if: steps.context.outputs.should_deploy == 'pending-validation' && steps.decision.outputs.should_deploy == 'true'
        id: version
        shell: bash
        run: |
          set -euo pipefail
          program_version="$(sed -n 's/^# PROGRAM_VERSION = \([^ |]*\).*$/\1/p' PILOTAGE.md | head -n 1)"
          if [[ -z "${program_version}" ]]; then
            echo "Unable to resolve PROGRAM_VERSION from PILOTAGE.md"
            exit 1
          fi
          echo "app_version=${program_version}" >> "$GITHUB_OUTPUT"
          echo "Deploy APP_VERSION=${program_version}"

      - name: Expose validated deployment decision
        if: steps.context.outputs.should_deploy == 'pending-validation' && steps.decision.outputs.should_deploy == 'true'
        shell: bash
        run: |
          echo "Deployment gate resolved for ${{ steps.context.outputs.sha }}."
          echo "APP_VERSION=${{ steps.version.outputs.app_version }}"

      - name: Export final prepare outputs
        id: final
        shell: bash
        run: |
          if [[ "${{ steps.context.outputs.should_deploy }}" == "pending-validation" ]]; then
            {
              echo "should_deploy=${{ steps.decision.outputs.should_deploy }}"
              echo "web_changed=${{ steps.export.outputs.web_changed }}"
              echo "api_changed=${{ steps.export.outputs.api_changed }}"
              echo "app_version=${{ steps.version.outputs.app_version }}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "should_deploy=${{ steps.context.outputs.should_deploy }}"
              echo "web_changed=false"
              echo "api_changed=false"
              echo "app_version="
            } >> "$GITHUB_OUTPUT"
          fi

      # #3545 US3 : un skip de déploiement ne doit plus jamais être silencieux.
      - name: Report deployment decision (skip visible)
        shell: bash
        env:
          SHOULD_DEPLOY: ${{ steps.final.outputs.should_deploy }}
          DEPLOY_SHA: ${{ steps.context.outputs.sha }}
          APP_VERSION: ${{ steps.final.outputs.app_version }}
          TESTS_CONCLUSION: ${{ steps.workflow_gate.outputs.tests_conclusion }}
          WEB_CONCLUSION: ${{ steps.workflow_gate.outputs.web_conclusion }}
        run: |
          set -euo pipefail
          {
            echo "## Résultat du gate de déploiement"
            echo ""
            echo "- **SHA** : \`${DEPLOY_SHA:-n/a}\`"
            echo "- **APP_VERSION** : \`${APP_VERSION:-n/a}\`"
            echo "- **Conclusion Tests** : \`${TESTS_CONCLUSION:-n/a}\`"
            echo "- **Conclusion Web** : \`${WEB_CONCLUSION:-n/a}\`"
            echo "- **Décision** : \`${SHOULD_DEPLOY}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "${SHOULD_DEPLOY}" != "true" ]]; then
            echo "::warning::Deploy skipped — SHA ${DEPLOY_SHA:-n/a} (Tests=${TESTS_CONCLUSION:-n/a}, Web=${WEB_CONCLUSION:-n/a}). Voir le résumé du run."
          fi


  deploy-api:
    timeout-minutes: 45
    name: Deploy API + Web to Render
    runs-on: ubuntu-latest
    needs: prepare
    # #5xxx : déploiement piloté par les chemins — ne redéployer Render que si
    # des fichiers api/** (ou CI backend) ont changé. Un merge web/mobile/docs
    # ne doit plus déclencher un rebuild de l'API (et autoDeploy Render est à
    # passer à false — voir render.yaml).
    if: needs.prepare.outputs.should_deploy == 'true' && needs.prepare.outputs.api_changed == 'true'
    permissions:
      contents: read

    steps:
      - name: Validate Render secret
        shell: bash
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${RENDER_DEPLOY_HOOK_URL}" ]]; then
            echo "Missing GitHub secret: RENDER_DEPLOY_HOOK_URL"
            exit 1
          fi

      - name: Trigger Render deploy hook
        shell: bash
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          DEPLOY_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          echo "Triggering Render deploy for APP_VERSION=${APP_VERSION} SHA=${DEPLOY_SHA}"
          curl --fail --silent --show-error --request POST "${RENDER_DEPLOY_HOOK_URL}"

      - name: Wait for API/Web healthcheck
        shell: bash
        env:
          API_HEALTHCHECK_URL: ${{ secrets.API_HEALTHCHECK_URL }}
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
        run: |
          set -euo pipefail
          URL="${API_HEALTHCHECK_URL:-${DEFAULT_API_HEALTHCHECK_URL}}"
          expected_version="$(echo "${APP_VERSION}" | tr -d '[:space:]')"

          # Issue #1831 + QA 2026-08-15 : le healthcheck « ok » ne prouve pas
          # que le NOUVEAU conteneur a remplacé l'ancien — un build Docker en
          # échec laisse l'instance précédente répondre (faux succès, prod
          # inchangée, observé : deploy « success » avec prod toujours en
          # 4.23.5). L'ancien mécanisme (baseline uptime AVANT le hook) était
          # inopérant quand l'instance Render était froide : baseline = 0 →
          # fallback healthcheck simple → succès immédiat sur l'ANCIENNE
          # instance. Désormais on exige TOUJOURS :
          #   1. `version` du health == APP_VERSION déployé (champ exposé par
          #      /api/v1/health depuis le config app.version) ;
          #   2. uptime_seconds < 900 (instance fraîche, pas l'ancienne qui
          #      vient de se réveiller d'un cold start).
          for attempt in {1..60}; do
            echo "Healthcheck attempt ${attempt}/60 on ${URL} (attendu: ${expected_version})"
            body="$(curl --fail --silent --show-error "${URL}" || true)"
            if echo "${body}" | grep -q '"status":"ok"'; then
              version="$(echo "${body}" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p' || echo '')"
              uptime="$(echo "${body}" | sed -n 's/.*"uptime_seconds":\([0-9]*\).*/\1/p' || echo 0)"
              echo "  instance version=${version:-inconnue} uptime_seconds=${uptime:-0}"
              if [[ -n "${version}" && "${version}" == "${expected_version}" \
                && -n "${uptime}" && "${uptime}" -lt 900 ]]; then
                echo "Render deployment healthy (nouvelle instance, version attendue)."
                exit 0
              fi
              echo "  instance saine mais ANCIENNE (version/uptime inattendus) — attente du nouveau déploiement..."
            fi
            sleep 20
          done

          echo "API healthcheck did not detect the new instance/version in time (build failure or stale instance)."
          exit 1

      - name: Rollback on failure
        if: failure()
        shell: bash
        env:
          RENDER_ROLLBACK_HOOK_URL: ${{ secrets.RENDER_ROLLBACK_HOOK_URL }}
        run: |
          if [[ -n "${RENDER_ROLLBACK_HOOK_URL}" ]]; then
            echo "Deployment failed. Triggering Render rollback..."
            curl --fail --silent --show-error --request POST "${RENDER_ROLLBACK_HOOK_URL}"
          else
            echo "Deployment failed but RENDER_ROLLBACK_HOOK_URL secret is missing. Cannot auto-rollback."
          fi

