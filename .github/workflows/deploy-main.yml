name: Deploy - Leopardo RH

on:
  workflow_run:
    workflows: ["Tests - Leopardo RH", "Web CI - Leopardo Admin"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEFAULT_API_BASE_URL: https://gestionemployerbackend.onrender.com/api/v1
  DEFAULT_API_HEALTHCHECK_URL: https://gestionemployerbackend.onrender.com/api/v1/health

concurrency:
  group: deploy-main-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare deployment context
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.final.outputs.should_deploy }}
      ref: ${{ steps.context.outputs.ref }}
      sha: ${{ steps.context.outputs.sha }}
      web_changed: ${{ steps.final.outputs.web_changed }}
      app_version: ${{ steps.final.outputs.app_version }}
    steps:
      - name: Resolve deployment source
        id: context
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
              echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "should_deploy=pending-validation" >> "$GITHUB_OUTPUT"
            echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event.workflow_run.conclusion }}" == "success" && "${{ github.event.workflow_run.event }}" == "push" && "${{ github.event.workflow_run.head_branch }}" == "main" ]]; then
            echo "should_deploy=pending-validation" >> "$GITHUB_OUTPUT"
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "ref=" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout deployment SHA
        if: steps.context.outputs.should_deploy == 'pending-validation'
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.context.outputs.sha }}
          fetch-depth: 2

      - name: Detect changed areas for deployment gating
        if: steps.context.outputs.should_deploy == 'pending-validation'
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          sha="${{ steps.context.outputs.sha }}"
          parent="$(git rev-list --parents -n 1 "${sha}" | awk '{print $2}')"
          changed_files=""

          if [[ -n "${parent}" ]]; then
            changed_files="$(git diff --name-only "${parent}" "${sha}")"
          else
            changed_files="$(git show --name-only --pretty='' "${sha}")"
          fi

          web_changed=false
          if printf '%s\n' "${changed_files}" | grep -Eq '^(front/admin-dashboard/|\.github/workflows/web-ci\.yml|\.github/workflows/deploy-main\.yml|docs/GESTION_PROJET/SCENARIOS_TEST_WEB_ADMIN_GITHUB_ACTIONS\.md|docs/GESTION_PROJET/REGISTRE_SCENARIOS_TESTS\.md)'; then
            web_changed=true
          fi

          echo "web_changed=${web_changed}" >> "$GITHUB_OUTPUT"

      - name: Resolve program version for deploy metadata
        if: steps.context.outputs.should_deploy == 'pending-validation'
        id: version
        shell: bash
        run: |
          set -euo pipefail
          program_version="$(sed -n 's/^# PROGRAM_VERSION = \([^ |]*\).*$/\1/p' PILOTAGE.md | head -n 1)"
          if [[ -z "${program_version}" ]]; then
            echo "Unable to resolve PROGRAM_VERSION from PILOTAGE.md"
            exit 1
          fi
          echo "app_version=${program_version}" >> "$GITHUB_OUTPUT"
          echo "Deploy APP_VERSION=${program_version}"

      - name: Verify required workflow conclusions for deployment SHA
        if: steps.context.outputs.should_deploy == 'pending-validation'
        id: workflow_gate
        uses: actions/github-script@v7
        with:
          script: |
            if (`${{ github.event_name }}` === 'workflow_dispatch') {
              core.info('Manual deployment on main: bypassing workflow_run lookup.');
              core.setOutput('tests_conclusion', 'manual-dispatch');
              core.setOutput('web_conclusion', 'manual-dispatch');
              core.setOutput('should_deploy', 'true');
              return;
            }

            const sha = `${{ steps.context.outputs.sha }}`;
            const webChanged = `${{ steps.changes.outputs.web_changed }}` === 'true';
            const { owner, repo } = context.repo;

            const allRuns = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner,
              repo,
              branch: 'main',
              event: 'push',
              per_page: 100,
            });

            const runsForSha = allRuns.filter((run) => run.head_sha === sha);

            const getConclusion = (workflowName) => {
              const match = runsForSha.find((run) => run.name === workflowName);
              return match ? match.conclusion : null;
            };

            const testsConclusion = getConclusion('Tests - Leopardo RH');
            const webConclusion = getConclusion('Web CI - Leopardo Admin');

            core.info(`Deployment SHA: ${sha}`);
            core.info(`Tests workflow conclusion: ${testsConclusion}`);
            core.info(`Web workflow conclusion: ${webConclusion}`);
            core.info(`Web changed: ${webChanged}`);

            let shouldDeploy = testsConclusion === 'success';
            if (webChanged) {
              shouldDeploy = shouldDeploy && webConclusion === 'success';
            }

            core.setOutput('tests_conclusion', testsConclusion ?? 'missing');
            core.setOutput('web_conclusion', webConclusion ?? 'not-required');
            core.setOutput('should_deploy', shouldDeploy ? 'true' : 'false');

      - name: Finalize deployment decision
        if: steps.context.outputs.should_deploy == 'pending-validation'
        id: decision
        shell: bash
        run: |
          echo "should_deploy=${{ steps.workflow_gate.outputs.should_deploy }}" >> "$GITHUB_OUTPUT"

      - name: Expose validated deployment decision
        if: steps.context.outputs.should_deploy == 'pending-validation'
        shell: bash
        run: |
          echo "Deployment gate resolved for ${{ steps.context.outputs.sha }}."
          echo "APP_VERSION=${{ steps.version.outputs.app_version }}"

      - name: Export final prepare outputs
        id: final
        shell: bash
        run: |
          if [[ "${{ steps.context.outputs.should_deploy }}" == "pending-validation" ]]; then
            echo "should_deploy=${{ steps.decision.outputs.should_deploy }}" >> "$GITHUB_OUTPUT"
            echo "web_changed=${{ steps.changes.outputs.web_changed }}" >> "$GITHUB_OUTPUT"
            echo "app_version=${{ steps.version.outputs.app_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=${{ steps.context.outputs.should_deploy }}" >> "$GITHUB_OUTPUT"
            echo "web_changed=false" >> "$GITHUB_OUTPUT"
            echo "app_version=" >> "$GITHUB_OUTPUT"
          fi

  deploy-api:
    name: Deploy API + Web to Render
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.should_deploy == 'true'

    steps:
      - name: Validate Render secret
        shell: bash
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${RENDER_DEPLOY_HOOK_URL}" ]]; then
            echo "Missing GitHub secret: RENDER_DEPLOY_HOOK_URL"
            exit 1
          fi

      - name: Trigger Render deploy hook
        shell: bash
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
        run: |
          set -euo pipefail
          echo "Triggering Render deploy for APP_VERSION=${APP_VERSION}"
          curl --fail --silent --show-error --request POST "${RENDER_DEPLOY_HOOK_URL}"

      - name: Wait for API/Web healthcheck
        shell: bash
        env:
          API_HEALTHCHECK_URL: ${{ secrets.API_HEALTHCHECK_URL }}
        run: |
          set -euo pipefail
          URL="${API_HEALTHCHECK_URL:-${DEFAULT_API_HEALTHCHECK_URL}}"

          for attempt in {1..30}; do
            echo "Healthcheck attempt ${attempt}/30 on ${URL}"
            if curl --fail --silent --show-error "${URL}" | grep -q '"status":"ok"'; then
              echo "Render deployment healthy."
              exit 0
            fi
            sleep 20
          done

          echo "API healthcheck did not become healthy in time."
          exit 1

      - name: Rollback on failure
        if: failure()
        shell: bash
        env:
          RENDER_ROLLBACK_HOOK_URL: ${{ secrets.RENDER_ROLLBACK_HOOK_URL }}
        run: |
          if [[ -n "${RENDER_ROLLBACK_HOOK_URL}" ]]; then
            echo "Deployment failed. Triggering Render rollback..."
            curl --fail --silent --show-error --request POST "${RENDER_ROLLBACK_HOOK_URL}"
          else
            echo "Deployment failed but RENDER_ROLLBACK_HOOK_URL secret is missing. Cannot auto-rollback."
          fi

  distribute-mobile:
    name: Distribute mobile staging build
    runs-on: ubuntu-latest
    needs: [prepare, deploy-api]
    if: needs.prepare.outputs.should_deploy == 'true'
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: employee
            project_path: front/mobile_apps/leopardo_employee
            artifact_name: leopardo-employee-main
            firebase_secret: FIREBASE_EMPLOYEE_ANDROID_APP_ID
          - name: manager
            project_path: front/mobile_apps/leopardo_manager
            artifact_name: leopardo-manager-main
            firebase_secret: FIREBASE_MANAGER_ANDROID_APP_ID

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Resolve Firebase distribution readiness
        id: firebase_ready
        shell: bash
        env:
          FIREBASE_APP_ID: ${{ secrets[matrix.app.firebase_secret] }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_APP_ID_SECRET_NAME: ${{ matrix.app.firebase_secret }}
          PROJECT_PATH: ${{ matrix.app.project_path }}
        run: |
          set -euo pipefail
          READY=true
          if [[ -z "${FIREBASE_APP_ID}" ]]; then
            echo "Missing GitHub secret: ${FIREBASE_APP_ID_SECRET_NAME}. Skipping ${{ matrix.app.name }} Firebase distribution."
            READY=false
          fi
          if [[ -z "${FIREBASE_TOKEN}" ]]; then
            echo "Missing GitHub secret: FIREBASE_TOKEN. Skipping ${{ matrix.app.name }} Firebase distribution."
            READY=false
          fi
          CONFIG_FILE="${PROJECT_PATH}/android/app/google-services.json"
          if [[ ! -f "${CONFIG_FILE}" ]]; then
            echo "Missing Firebase config: ${CONFIG_FILE}. Skipping ${{ matrix.app.name }} Firebase distribution."
            READY=false
          fi
          echo "MOBILE_DISTRIBUTE_READY=${READY}" >> "$GITHUB_ENV"

      - name: Setup Java 17
        if: env.MOBILE_DISTRIBUTE_READY == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        if: env.MOBILE_DISTRIBUTE_READY == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        if: env.MOBILE_DISTRIBUTE_READY == 'true'
        working-directory: ${{ matrix.app.project_path }}
        run: flutter pub get

      - name: Build release APK for staging
        if: env.MOBILE_DISTRIBUTE_READY == 'true'
        working-directory: ${{ matrix.app.project_path }}
        shell: bash
        run: |
          set -euo pipefail
          echo "API_BASE_URL=${DEFAULT_API_BASE_URL}" > .env.build
          flutter build apk --release \
            --dart-define-from-file=.env.build \
            --build-name="main-${GITHUB_RUN_NUMBER}" \
            --build-number="${GITHUB_RUN_NUMBER}"

      - name: Upload mobile artifact
        if: env.MOBILE_DISTRIBUTE_READY == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.app.artifact_name }}-${{ github.run_number }}
          path: ${{ matrix.app.project_path }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Firebase App Distribution (staging)
        if: env.MOBILE_DISTRIBUTE_READY == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets[matrix.app.firebase_secret] }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: testeurs-internes
          file: ${{ matrix.app.project_path }}/build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: |
            Auto deploy from main - Leopardo ${{ matrix.app.name }}
            Commit: ${{ needs.prepare.outputs.sha }}
            Workflow: ${{ github.workflow }}
            Backend: https://gestionemployerbackend.onrender.com
