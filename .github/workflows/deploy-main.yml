name: Deploy - Leopardo RH

on:
  # #3545 / #4359 : le déclencheur `push` direct est l’unique source de vérité
  # du déploiement; les déclencheurs workflow_run redondants provoquaient
  # plusieurs runs du même SHA et une famine de file GitHub Actions.
  #
  # concurrence : sous rafale de merges (~1/2 min), les runs Tests de main
  # étaient annulés en pending (48/50 cancelled), conclusion 'cancelled' →
  # should_deploy=false à 100 %, prod figée depuis le 2026-08-15.
  push:
    branches: [main]
  workflow_dispatch:
    # #6973 (réouverte 2026-09-08) : sous rafale de merges, la gate interne
    # trouve la conclusion du run Tests du SHA = « cancelled » → job deploy
    # skippé ; et un HEAD de main sans diff api/ (ex. commit .github/docs)
    # rend api_changed=false → le re-dispatch de rattrapage (#6984) est lui
    # aussi skippé → boucle horaire sans fin, tier dev figé sur un vieux SHA.
    # force_deploy permet à un déclenchement manuel ou au workflow de
    # rattrapage de déployer le HEAD de main malgré ces deux faux négatifs
    # (le code à déployer a déjà passé les checks requis de la PR AVANT le
    # merge, et Render construit le HEAD de main : rien n'est déployé qui
    # n'ait été testé). Chemin push : inchangé (aucun impact).
    inputs:
      force_deploy:
        description: "Forcer le déploiement du HEAD de main (api_changed bypassé) — usage manuel/catchup uniquement"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEFAULT_API_BASE_URL: ${{ vars.DEV_API_BASE_URL }}
  DEFAULT_API_HEALTHCHECK_URL: ${{ vars.DEV_API_BASE_URL }}/health

# #1835 / #3904 / #4359 : un seul run de déploiement par SHA; le push main
# est désormais l’unique déclencheur automatique. Le groupe par SHA protège
# encore les déclenchements manuels et annule les doublons explicites.
concurrency:
  group: deploy-main-${{ github.sha }}
  cancel-in-progress: true

jobs:
  prepare:
    timeout-minutes: 45
    name: Prepare deployment context
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      should_deploy: ${{ steps.final.outputs.should_deploy }}
      # Issue #7457 — motif du verdict, consommé par le job « Deploy gate verdict ».
      gate_outcome: ${{ steps.final.outputs.gate_outcome }}
      ref: ${{ steps.context.outputs.ref }}
      sha: ${{ steps.context.outputs.sha }}
      web_changed: ${{ steps.final.outputs.web_changed }}
      api_changed: ${{ steps.final.outputs.api_changed }}
      app_version: ${{ steps.final.outputs.app_version }}
    steps:
      # The gate runs before the full deployment checkout. This sparse,
      # credential-free checkout contains only the trusted local action so
      # GitHub can resolve it without exposing the deployment tree first.
      - name: Checkout trusted deploy gate action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/actions/verify-deploy-workflows
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      - name: Guard DEV_API_BASE_URL (#4524)
        shell: bash
        run: |
          if [[ -z "${{ vars.DEV_API_BASE_URL }}" ]]; then
            echo "::error::DEV_API_BASE_URL must be set (fail-open fallback removed, issue #4524)."
            exit 1
          fi
          echo "DEV_API_BASE_URL=${{ vars.DEV_API_BASE_URL }}"

      - name: Resolve deployment source
        id: context
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WR_EVENT: ${{ github.event.workflow_run.event }}
          WR_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WR_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
              {
                echo "should_deploy=false"
                echo "ref=${GITHUB_REF_NAME}"
                echo "sha=${GITHUB_SHA}"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            {
              echo "should_deploy=pending-validation"
              echo "ref=${GITHUB_REF_NAME}"
              echo "sha=${GITHUB_SHA}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # #3545 : déclenchement direct sur push main. Le gate (étape
          # `workflow_gate`) poll les runs du SHA au lieu de lire la
          # conclusion d'un parent — le run du DERNIER SHA aboutit toujours
          # (rien de plus récent pour l'annuler en pending).
          if [[ "${EVENT_NAME}" == "push" ]]; then
            {
              echo "should_deploy=pending-validation"
              echo "ref=${GITHUB_REF_NAME}"
              echo "sha=${GITHUB_SHA}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Defense in depth: only ever treat this as a deployable run when the
          # upstream workflow_run (a) succeeded, (b) was itself triggered by a
          # push (never pull_request/pull_request_target from a fork), (c) targeted
          # main, and (d) ran in this same base repository (not a fork). This keeps
          # the subsequent privileged checkout scoped to code that was already
          # pushed to main by a trusted collaborator.
          # Audit CodeQL #30 (2026-08-17) : validation stricte du format du SHA
          # issu de l'événement workflow_run avant tout usage (injection
          # impossible : seuls des hexadécimaux sont acceptés).
          if [[ "${WR_HEAD_SHA}" =~ ^[0-9a-f]{40}$ && "${WR_CONCLUSION}" == "success" && "${WR_EVENT}" == "push" && "${WR_HEAD_BRANCH}" == "main" && "${WR_HEAD_REPO}" == "${BASE_REPO}" ]]; then
            {
              echo "should_deploy=pending-validation"
              echo "ref=main"
              echo "sha=${WR_HEAD_SHA}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "should_deploy=false"
              echo "ref="
              echo "sha="
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve changed areas via API (before privileged checkout)
        if: steps.context.outputs.should_deploy == 'pending-validation'
        id: changes_api
        # CodeQL actions/cache-poisoning/poisonable-step (alerte #30) : le
        # checkout privilégié ne doit JAMAIS utiliser un SHA non vérifié.
        # On calcule ici web_changed via l'API (compare des fichiers entre le
        # parent et le SHA) pour permettre au gate de tourner AVANT le
        # checkout — même logique que le filtre `web` de .github/paths-filters.yml.
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = `${{ steps.context.outputs.sha }}`;
            // Issue #7528 — `web_changed` doit refléter ce qui DÉCLENCHE
            // réellement « Web CI - Leopardo Admin » (le workflow dont le gate
            // exige la conclusion), donc les `paths:` de web-ci.yml — et non la
            // liste `web` de .github/paths-filters.yml, volontairement plus
            // large (elle ajoute deploy-main.yml et deux docs) pour `tests.yml`.
            // Constat `d7e11294` : un merge qui ne touchait que des fichiers CI
            // donnait web_changed=true, aucun run Web CI ne pouvait exister, et
            // le gate concluait « no-runs » → rouge par construction.
            const isWebPath = (p) =>
              p.startsWith('front/admin-dashboard/') ||
              p === '.github/workflows/web-ci.yml';
            // Issue #7511 — parité STRICTE avec les `paths:` de `tests.yml`
            // (identiques au filtre `api` de .github/paths-filters.yml) : sans
            // cette mesure, le gate ne pouvait pas distinguer « aucun run parce
            // que rien d'API n'a changé » (décision : rien à déployer) de
            // « aucun run alors que l'API a changé » (indécision réelle) et
            // échouait dans les deux cas.
            const isApiPath = (p) =>
              p.startsWith('api/') ||
              p === '.github/workflows/tests.yml' ||
              p === '.github/workflows/phpstan-baseline.yml';
            try {
              const { data: commit } = await github.rest.repos.getCommit({ owner, repo, ref: sha });
              const parent = commit.parents[0]?.sha;
              let webChanged = true; // conservateur : parent inconnu => web requise
              let apiChanged = true; // conservateur : parent inconnu => API requise
              if (parent) {
                const { data: cmp } = await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: `${parent}...${sha}`,
                });
                const files = cmp.files ?? [];
                webChanged = files.some((f) => isWebPath(f.filename));
                apiChanged = files.some((f) => isApiPath(f.filename));
              }
              core.setOutput('web_changed', webChanged ? 'true' : 'false');
              core.setOutput('api_changed', apiChanged ? 'true' : 'false');
              core.setOutput('parent_sha', parent ?? '');
            } catch (err) {
              core.warning(`resolve changes via API failed: ${err.message} — web_changed/api_changed conservateurs (true).`);
              core.setOutput('web_changed', 'true');
              core.setOutput('api_changed', 'true');
              core.setOutput('parent_sha', '');
            }

      - name: Verify required workflow conclusions for deployment SHA
        if: steps.context.outputs.should_deploy == 'pending-validation'
        id: workflow_gate
        # Issue #4723 : logique de gate partagée avec l'autre workflow de
        # déploiement via l'action composite verify-deploy-workflows.
        # CodeQL cache-poisoning (alerte #30) : ce gate 100 % API tourne AVANT
        # le checkout privilégié ; web_changed provient de changes_api (API),
        # pas d'un diff local post-checkout.
        uses: ./.github/actions/verify-deploy-workflows
        with:
          sha: ${{ steps.context.outputs.sha }}
          required_workflows: '["Tests - Leopardo RH","Web CI - Leopardo Admin"]'
          web_changed: ${{ steps.changes_api.outputs.web_changed == 'true' }}
          # Issue #7511 — mesuré AVANT la gate pour que « aucun run requis »
          # puisse être qualifié (rien à déployer) au lieu d'échouer en bloc.
          api_changed: ${{ steps.changes_api.outputs.api_changed == 'true' }}
      - name: Finalize deployment decision
        if: steps.context.outputs.should_deploy == 'pending-validation'
        id: decision
        shell: bash
        run: |
          echo "should_deploy=${{ steps.workflow_gate.outputs.should_deploy }}" >> "$GITHUB_OUTPUT"

      - name: Checkout deployment SHA
        if: steps.context.outputs.should_deploy == 'pending-validation' && steps.decision.outputs.should_deploy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false
          ref: ${{ steps.context.outputs.sha }}
          fetch-depth: 2
          persist-credentials: false

      # The trusted checkout above uses sparse mode. Disable it explicitly so
      # the shared filter file is present after the full deployment checkout.
      - name: Ensure full deployment checkout
        if: steps.context.outputs.should_deploy == 'pending-validation' && steps.decision.outputs.should_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git sparse-checkout disable 2>/dev/null || true
          git config --local core.sparseCheckout false

      - name: Resolve parent commit for change detection
        if: steps.context.outputs.should_deploy == 'pending-validation' && steps.decision.outputs.should_deploy == 'true'
        id: parent
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ steps.context.outputs.sha }}"
          parent="$(git rev-list --parents -n 1 "${sha}" | awk '{print $2}')"
          echo "sha=${parent:-${sha}}" >> "$GITHUB_OUTPUT"

      - name: Detect changed areas for deployment gating
        if: steps.context.outputs.should_deploy == 'pending-validation' && steps.decision.outputs.should_deploy == 'true'
        id: changes
        # Audit §3.3 / Plan P2: now shares .github/paths-filters.yml with
        # tests.yml's detect-changes job instead of a second hand-rolled
        # `git diff` + `grep -E` regex that could (and did) drift out of sync.
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/paths-filters.yml
          base: ${{ steps.parent.outputs.sha }}

      - name: Export web_changed + api_changed outputs
        id: export
        if: steps.context.outputs.should_deploy == 'pending-validation' && steps.decision.outputs.should_deploy == 'true'
        shell: bash
        run: |
          echo "web_changed=${{ steps.changes.outputs.web }}" >> "$GITHUB_OUTPUT"
          # api_changed : true si des fichiers api/** (ou CI backend) ont changé.
          # Conservateur : si le parent est introuvable (base=sha => diff vide,
          # paths-filter renvoie false), on déploie quand même (api_changed=true).
          parent_sha="${{ steps.parent.outputs.sha }}"
          deploy_sha="${{ steps.context.outputs.sha }}"
          if [[ "${parent_sha}" == "${deploy_sha}" ]]; then
            echo "api_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "api_changed=${{ steps.changes.outputs.api }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve program version for deploy metadata
        if: steps.context.outputs.should_deploy == 'pending-validation' && steps.decision.outputs.should_deploy == 'true'
        id: version
        shell: bash
        run: |
          set -euo pipefail
          program_version="$(sed -n 's/^# PROGRAM_VERSION = \([^ |]*\).*$/\1/p' PILOTAGE.md | head -n 1)"
          if [[ -z "${program_version}" ]]; then
            echo "Unable to resolve PROGRAM_VERSION from PILOTAGE.md"
            exit 1
          fi
          echo "app_version=${program_version}" >> "$GITHUB_OUTPUT"
          echo "Deploy APP_VERSION=${program_version}"

      - name: Expose validated deployment decision
        if: steps.context.outputs.should_deploy == 'pending-validation' && steps.decision.outputs.should_deploy == 'true'
        shell: bash
        run: |
          echo "Deployment gate resolved for ${{ steps.context.outputs.sha }}."
          echo "APP_VERSION=${{ steps.version.outputs.app_version }}"

      - name: Export final prepare outputs
        id: final
        shell: bash
        run: |
          if [[ "${{ steps.context.outputs.should_deploy }}" == "pending-validation" ]]; then
            {
              echo "should_deploy=${{ steps.decision.outputs.should_deploy }}"
              echo "gate_outcome=${{ steps.workflow_gate.outputs.gate_outcome }}"
              echo "web_changed=${{ steps.export.outputs.web_changed }}"
              echo "api_changed=${{ steps.export.outputs.api_changed }}"
              echo "app_version=${{ steps.version.outputs.app_version }}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "should_deploy=${{ steps.context.outputs.should_deploy }}"
              # Le contexte a court-circuité le gate (dispatch hors main, run
              # parent non concluant…) : aucune indécision à signaler (#7457).
              echo "gate_outcome=not-required"
              echo "web_changed=false"
              echo "api_changed=false"
              echo "app_version="
            } >> "$GITHUB_OUTPUT"
          fi

      # #3545 US3 : un skip de déploiement ne doit plus jamais être silencieux.
      - name: Report deployment decision (skip visible)
        shell: bash
        env:
          SHOULD_DEPLOY: ${{ steps.final.outputs.should_deploy }}
          GATE_OUTCOME: ${{ steps.final.outputs.gate_outcome }}
          DEPLOY_SHA: ${{ steps.context.outputs.sha }}
          APP_VERSION: ${{ steps.final.outputs.app_version }}
          TESTS_CONCLUSION: ${{ steps.workflow_gate.outputs.tests_conclusion }}
          WEB_CONCLUSION: ${{ steps.workflow_gate.outputs.web_conclusion }}
        run: |
          set -euo pipefail
          {
            echo "## Résultat du gate de déploiement"
            echo ""
            echo "- **SHA** : \`${DEPLOY_SHA:-n/a}\`"
            echo "- **APP_VERSION** : \`${APP_VERSION:-n/a}\`"
            echo "- **Conclusion Tests** : \`${TESTS_CONCLUSION:-n/a}\`"
            echo "- **Conclusion Web** : \`${WEB_CONCLUSION:-n/a}\`"
            echo "- **Motif** : \`${GATE_OUTCOME:-n/a}\`"
            echo "- **Décision** : \`${SHOULD_DEPLOY}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "${SHOULD_DEPLOY}" != "true" ]]; then
            echo "::warning::Deploy skipped — SHA ${DEPLOY_SHA:-n/a} (Tests=${TESTS_CONCLUSION:-n/a}, Web=${WEB_CONCLUSION:-n/a}, motif=${GATE_OUTCOME:-n/a}). Voir le résumé du run."
          fi


  deploy-api:
    timeout-minutes: 45
    name: Deploy API + Web to Render
    runs-on: ubuntu-latest
    needs: prepare
    # #5xxx : déploiement piloté par les chemins — ne redéployer Render que si
    # des fichiers api/** (ou CI backend) ont changé. Un merge web/mobile/docs
    # ne doit plus déclencher un rebuild de l'API (et autoDeploy Render est à
    # passer à false — voir render.yaml).
    # #6973 : force_deploy (workflow_dispatch uniquement) bypass api_changed
    # pour le rattrapage manuel/catchup quand le HEAD de main n'a pas de diff
    # api/ mais que le tier dev est en retard (SHA live ≠ HEAD). En push,
    # github.event.inputs.force_deploy est vide → comportement inchangé.
    if: needs.prepare.outputs.should_deploy == 'true' && (needs.prepare.outputs.api_changed == 'true' || github.event.inputs.force_deploy == 'true')
    permissions:
      contents: read

    steps:
      - name: Validate Render secret
        shell: bash
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${RENDER_DEPLOY_HOOK_URL}" ]]; then
            echo "Missing GitHub secret: RENDER_DEPLOY_HOOK_URL"
            exit 1
          fi

      - name: Trigger Render deploy hook
        shell: bash
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          DEPLOY_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          echo "Triggering Render deploy for APP_VERSION=${APP_VERSION} SHA=${DEPLOY_SHA}"

          # #6973 (2026-09-07) : le hook « réussissait » sans que le code arrive
          # jamais en dev (dernier sha live figé, health « version » = SHA git).
          # On capture la version live AVANT le hook : la vérification
          # post-déploiement doit prouver qu'une NOUVELLE instance a pris le
          # relais — un hook sans effet devient un échec visible, plus jamais un
          # « success » trompeur.
          baseline="$(curl --silent --show-error --max-time 20 "${DEFAULT_API_HEALTHCHECK_URL}" \
            | sed -n 's/.*"version":"\([^"]*\)".*/\1/p' || true)"
          echo "LIVE_BASELINE_VERSION=${baseline:-unknown}" >> "$GITHUB_ENV"
          echo "Instance live avant deploy : version=${baseline:-unknown}"

          curl --fail --silent --show-error --request POST "${RENDER_DEPLOY_HOOK_URL}"

      - name: Wait for new Render instance (tier dev — health version = SHA git)
        shell: bash
        env:
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          DEPLOY_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail

          # #6834/#6973 : ce workflow déploie UNIQUEMENT le service Render du tier
          # dev/continu (gestionemployerbackend). Le healthcheck doit cibler CETTE
          # instance — vars.DEV_API_BASE_URL désigne explicitement le tier
          # dev/continu depuis le renommage #6839 — et jamais un healthcheck
          # partagé via secret qui peut pointer
          # ailleurs (ex. la prod) : cause du gate vert avec dev figé sur un vieux
          # SHA (constat #6973 : deploy-main « success » pendant ~24 h, SHA live
          # inchangé, web DEV en 500).
          URL="${DEFAULT_API_HEALTHCHECK_URL}"
          if [[ -z "${URL}" ]]; then
            echo "::error::URL de santé dev absente (vars.DEV_API_BASE_URL non défini) — deploy non vérifiable (#6834)."
            exit 1
          fi

          # Tier dev : pas d'APP_VERSION sur l'instance → /api/v1/health expose
          # `version` = SHA Render tronqué (config/app.php : RENDER_GIT_COMMIT,
          # résolution « version honnête » #6835/#6905). Succès = instance
          # NOUVELLE (version ≠ baseline) servant le HEAD courant de main (Render
          # buildant toujours le HEAD de la branche, la version live converge vers
          # le sha7 d'origin/main — robuste sous rafale de merges : un run dépassé
          # observe le déploiement du suivant) OU servant déjà exactement le SHA
          # déclencheur (re-run d'un SHA déjà live).
          baseline="${LIVE_BASELINE_VERSION:-unknown}"
          expected_sha="${DEPLOY_SHA:0:7}"
          expected_version="$(echo "${APP_VERSION}" | tr -d '[:space:]')"
          echo "Baseline=${baseline} — deploy SHA=${DEPLOY_SHA} (${expected_sha}) — APP_VERSION=${expected_version:-n/a}"

          for attempt in {1..60}; do
            main_sha7="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main 2>/dev/null | awk '{print substr($1,1,7)}' || true)"
            body="$(curl --silent --show-error --max-time 20 "${URL}" || true)"
            if echo "${body}" | grep -q '"status":"ok"'; then
              version="$(echo "${body}" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p' || echo '')"
              uptime="$(echo "${body}" | sed -n 's/.*"uptime_seconds":\([0-9]*\).*/\1/p' || echo 0)"
              echo "  [${attempt}/60] instance version=${version:-inconnue} (main=${main_sha7:-?}, baseline=${baseline}, uptime=${uptime}s)"
              if [[ -n "${version}" && ( "${version}" == "${expected_sha}" \
                || ( -n "${expected_version}" && "${version}" == "${expected_version}" ) \
                || ( "${version}" != "${baseline}" && "${version}" == "${main_sha7}" ) ) ]]; then
                echo "Render dev deployment healthy — nouvelle instance live : ${version} (SHA déclencheur : ${expected_sha})."
                {
                  echo "## Déploiement Render dev vérifié"
                  echo "- **SHA live** : \`${version}\` (SHA déclencheur : \`${expected_sha}\`)"
                  echo "- **Baseline avant hook** : \`${baseline}\`"
                  echo "- **APP_VERSION** : \`${expected_version:-n/a}\`"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              [[ "${version}" == "${baseline}" ]] && echo "  instance inchangée (build en cours ou hook sans effet) — attente du nouveau déploiement..."
            else
              echo "  [${attempt}/60] health pas encore ok (instance froide ou indisponible)..."
            fi
            sleep 20
          done

          echo "::error::Render dev : aucune nouvelle instance détectée en 20 min (hook sans effet ou build en échec) — intervention dashboard Render requise (#6834/#6973)."
          exit 1

      - name: Rollback on failure
        if: failure()
        shell: bash
        env:
          RENDER_ROLLBACK_HOOK_URL: ${{ secrets.RENDER_ROLLBACK_HOOK_URL }}
        run: |
          if [[ -n "${RENDER_ROLLBACK_HOOK_URL}" ]]; then
            echo "Deployment failed. Triggering Render rollback..."
            curl --fail --silent --show-error --request POST "${RENDER_ROLLBACK_HOOK_URL}"
          else
            echo "Deployment failed but RENDER_ROLLBACK_HOOK_URL secret is missing. Cannot auto-rollback."
          fi



  # Issue #7457 — le gate de déploiement ne doit plus pouvoir « réussir » sans
  # avoir su décider. Un `should_deploy=false` recouvrait deux situations
  # opposées dans l'UI :
  #
  #  - une DÉCISION : rien de déployable, run « Tests - Leopardo RH » rouge
  #    (le rouge est déjà porté par le run Tests), ou SHA dépassé par un push
  #    plus récent → un run vert est légitime ;
  #  - une INDÉCISION : aucun run trouvé pour le SHA, polling expiré, conclusion
  #    illisible → le job `deploy-api` était *skipped* et le run restait vert.
  #    C'est ce cas qui a produit 12 « non-déploiements verts » d'affilée et
  #    laissé le tier dev ~60 merges en arrière (#7304).
  #
  # Ce job rend l'indécision visible et ROUGE (critère d'acceptation #7457).
  # Les décisions restent vertes mais sont NOMMÉES dans le résumé du run, donc
  # une décision et une indécision ne se ressemblent plus.
  #
  # `stale` : arbitrage assumé — un SHA dépassé n'est pas une indécision (le run
  # du SHA plus récent porte le déploiement) ; il resterait sinon quasiment un
  # run rouge par merge pendant une rafale. Pour le promouvoir en échec comme
  # les autres (critère #7457 pris au sens strict), déplacer `stale` de la
  # branche « décision » vers la branche « indecision » ci-dessous.
  deploy-gate-verdict:
    name: Deploy gate verdict
    needs: [prepare, deploy-api]
    # always() : ce job doit rendre son verdict même quand le déploiement a été
    # sauté (c'est précisément le cas qu'il doit qualifier).
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Render the gate verdict
        shell: bash
        env:
          GATE_OUTCOME: ${{ needs.prepare.outputs.gate_outcome }}
          SHOULD_DEPLOY: ${{ needs.prepare.outputs.should_deploy }}
          DEPLOY_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          outcome="${GATE_OUTCOME:-unknown}"
          sha="${DEPLOY_SHA:-n/a}"
          echo "gate_outcome=${outcome} should_deploy=${SHOULD_DEPLOY:-n/a} sha=${sha}"

          {
            echo "## Verdict du gate de déploiement (#7457)"
            echo ""
            echo "| Champ | Valeur |"
            echo "| --- | --- |"
            echo "| SHA | \`${sha}\` |"
            echo "| Motif (\`gate_outcome\`) | \`${outcome}\` |"
            echo "| Décision | \`${SHOULD_DEPLOY:-n/a}\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          case "${outcome}" in
            deploy)
              echo "::notice::Déploiement décidé pour ${sha} — le gate a conclu."
              ;;
            manual-dispatch)
              echo "::notice::Déploiement manuel (workflow_dispatch) : gate contourné par construction."
              ;;
            not-required)
              echo "::notice::Aucun déploiement attendu pour ce run (contexte court-circuité : dispatch hors \`main\`, run parent non concluant)."
              ;;
            pending)
              # #7559 — budget d'attente épuisé ALORS QUE des workflows requis
              # tournaient encore : ce n'est pas une indécision (l'information
              # arrive), et ce n'est pas un succès de déploiement non plus. Le
              # contrôle de fond reste « Deploy Drift Guard » (toutes les 30 min)
              # et le rattrapage « Deploy Main Catch-up » / dispatch force_deploy.
              {
                echo ""
                echo "> **Différé, pas indécis (#7559)** : le budget d'attente du gate s'est épuisé"
                echo "> alors que les workflows requis du SHA \`${sha}\` étaient **encore en cours**."
                echo "> La cause racine est documentée : budget de polling (30 min) vs timeout du job"
                echo "> backend de \`tests.yml\` (300 min) — un merge \`api/**\` ne peut pas conclure"
                echo "> dans le budget. Aucun déploiement n'a été décidé par ce run ;"
                echo "> \`deploy-drift-guard.yml\` (30 min) échoue si le tier dev dérive, et"
                echo "> \`deploy-main-catchup.yml\` rejoue le déploiement dès que la suite conclut."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::notice::Deploy différé pour ${sha} — les workflows requis tournaient encore à l'expiration du budget (#7559)."
              ;;
            stale)
              echo "::notice::SHA ${sha} dépassé par un push plus récent sur \`main\` — non déployé par construction ; le run du SHA plus récent porte le déploiement."
              ;;
            tests-success|web-success|tests-skipped|web-skipped)
              echo "::notice::Gate concluant (${outcome}) mais aucune action de déploiement requise pour ${sha}."
              ;;
            tests-failure|tests-cancelled|tests-timed_out|tests-startup_failure|web-failure|web-cancelled|web-timed_out|web-startup_failure)
              echo "::notice::Déploiement retenu pour ${sha} car ${outcome} — le rouge détaillé est porté par le run « Tests - Leopardo RH ». Le gate a bien décidé."
              ;;
            no-runs|timeout|tests-missing|web-missing|missing|unknown)
              {
                echo ""
                echo "> **Indécision** : le gate n'a pas pu établir la conclusion des workflows requis"
                echo "> pour \`${sha}\` (\`${outcome}\`). Aucun déploiement n'a été décidé, et"
                echo "> ce n'est **pas** un succès : le tier dev peut dériver de \`main\`."
                echo "> Vérifier l'API Actions (\`Tests - Leopardo RH\` pour ce SHA) puis, si le"
                echo "> contenu est vert, relancer ce workflow en \`workflow_dispatch\` (\`force_deploy\`)."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Deploy gate indécis pour ${sha} — motif « ${outcome} ». Aucun déploiement décidé : voir le résumé du run (#7457)."
              exit 1
              ;;
            *)
              echo "::error::Motif de verdict inconnu « ${outcome} » pour ${sha} — le gate et ce verdict ont divergé (#7457)."
              exit 1
              ;;
          esac
