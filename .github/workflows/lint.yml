name: Linting & Type Checking

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Run ESLint
        working-directory: ./web
        run: npm run lint -- --format json --output-file eslint-report.json || true

      - name: Run TypeScript type checking
        working-directory: ./web
        run: npx tsc --noEmit

      - name: Check for console.log statements
        working-directory: ./web
        run: |
          if grep -r "console\.\(log\|warn\|error\)" src --include="*.ts" --include="*.tsx" | grep -v "test\|spec"; then
            echo "❌ Found console statements in production code"
            exit 1
          else
            echo "✅ No console statements found"
          fi

      - name: Upload ESLint report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: eslint-report
          path: web/eslint-report.json
          retention-days: 30

  type-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Type check with strict mode
        working-directory: ./web
        run: npx tsc --strict --noEmit
