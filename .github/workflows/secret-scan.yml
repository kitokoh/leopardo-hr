name: Secret Scan

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          # --allow: regexes for known false positives. The Lob detector
          # matches `(live|test)_[a-zA-Z0-9_]{35}` — i.e. any PHPUnit method
          # named `test_<long descriptive name>` (repo-wide convention, see
          # api/tests). No Lob API is used anywhere in this repo (verified
          # 2026-08-07), so these matches are false positives.
          # --allow: regexes for known false positives. The Lob detector
          # matches `(live|test)_[a-zA-Z0-9_]{35}` — i.e. any PHPUnit method
          # named `test_<long descriptive name>` (repo-wide convention, see
          # api/tests). No Lob API is used anywhere in this repo (verified
          # 2026-08-07), so these matches are false positives. The regex below
          # allowlists exactly that pattern (added 2026-08-09 — the allowlist
          # was documented in the comment but never wired into extra_args).
          extra_args: >-
            --results=verified,unknown
            --allow='test_[a-zA-Z0-9_]{35,}'
