name: Secret Scan

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Garde arbre HEAD (#1614) : les rapports d'audit/docs ne doivent JAMAIS
      # citer un secret réel (même tronqué). TruffleHog couvre l'historique ;
      # cette étape rg couvre l'arbre de travail avec les motifs connus.
      - name: Guard — no real secrets in working tree (#1614)
        run: |
          set -euo pipefail
          # Patterns "ressemblants" uniquement (longueur réelle d'un secret),
          # pour ne pas flagger les docs qui citent la convention ou des exemples.
          patterns='npg_[A-Za-z0-9]{10,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}|sk_live_[A-Za-z0-9]{16,}|postgresql://[A-Za-z0-9_.-]+:[^/@<]{6,}@'
          # Les seules occurrences autorisées sont les patterns d'exemple dans les
          # docs (placeholders <user>:<password>@…, user:pass@, PASSWORD@…) — on
          # ignore les lignes qui ne contiennent que des placeholders génériques.
          matches=$(git grep -n -E "$patterns" -- '*.md' '*.yml' '*.yaml' '*.env*' '*.php' '*.ts' '*.js' 2>/dev/null || true)
          if [ -n "$matches" ]; then
            filtered=$(echo "$matches" | grep -vE 'user:pass@|:<password>@|PASSWORD@|<REDACTED|your:|placeholder|example' || true)
            if [ -n "$filtered" ]; then
              echo "🔴 Secret potentiel détecté dans l'arbre de travail (convention #1614) :"
              echo "$filtered"
              exit 1
            fi
          fi
          echo "✅ Aucun secret réel dans l'arbre de travail (patterns connus)."

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          # Version épinglée explicitement : le SHA de l'action épingle le code
          # de l'action, mais l'image Docker téléchargée par défaut est `latest`
          # (non reproductible, cf. AUDIT_CICD_2026-07-19 §supply-chain).
          version: 3.96.0
          # --exclude-detectors=Lob : le détecteur Lob matche
          # `(live|test)_[a-zA-Z0-9_]{35}` — i.e. n'importe quelle méthode
          # PHPUnit nommée `test_<nom descriptif long>` (convention repo-wide,
          # voir api/tests). Aucune API Lob n'est utilisée dans ce repo
          # (vérifié 2026-08-07), donc ces matches sont des faux positifs.
          # NB : l'ancien flag `--allow=test_.*` a été supprimé dans
          # trufflehog ≥ 3.78 (devenu un booléen no-op) — l'exclusion du
          # détecteur est le mécanisme moderne équivalent.
          extra_args: >-
            --results=verified,unknown
            --exclude-detectors=Lob
