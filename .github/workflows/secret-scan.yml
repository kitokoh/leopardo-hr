name: Secret Scan

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          # Version épinglée explicitement : le SHA de l'action épingle le code
          # de l'action, mais l'image Docker téléchargée par défaut est `latest`
          # (non reproductible, cf. AUDIT_CICD_2026-07-19 §supply-chain).
          version: 3.96.0
          # --exclude-detectors=Lob : le détecteur Lob matche
          # `(live|test)_[a-zA-Z0-9_]{35}` — i.e. n'importe quelle méthode
          # PHPUnit nommée `test_<nom descriptif long>` (convention repo-wide,
          # voir api/tests). Aucune API Lob n'est utilisée dans ce repo
          # (vérifié 2026-08-07), donc ces matches sont des faux positifs.
          # NB : l'ancien flag `--allow=test_.*` a été supprimé dans
          # trufflehog ≥ 3.78 (devenu un booléen no-op) — l'exclusion du
          # détecteur est le mécanisme moderne équivalent.
          extra_args: >-
            --results=verified,unknown
            --exclude-detectors=Lob
