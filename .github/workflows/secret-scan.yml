name: Secret Scan

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          # The Lob detector matches `(live|test)_[a-zA-Z0-9_]{35}`, which
          # collides with PHPUnit test method names (repo-wide convention:
          # test_<long_descriptive_name>). No Lob API is used anywhere in this
          # repo (verified 2026-08-07). We exclude the Lob detector entirely
          # rather than using --allow (which is not a valid TruffleHog v3 flag).
          extra_args: >-
            --results=verified,unknown
            --exclude-detectors=Lob
