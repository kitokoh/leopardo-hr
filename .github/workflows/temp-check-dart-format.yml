name: TEMP - Dart Format Check On Branch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/ci-red-main-2026-08-09

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter-android

      - name: What would dart format change?
        shell: bash
        run: |
          set +e
          cd front/mobile_apps/leopardo_hr
          dart format --output=none . > /tmp/hr.txt 2>&1
          echo "HR exit=$?"
          cd ../..
          cd front/mobile_apps/leopardo_core
          dart format --output=none . > /tmp/core.txt 2>&1
          echo "CORE exit=$?"
          cd ../..
          echo "===== HR ====="
          head -25 /tmp/hr.txt
          echo "===== CORE ====="
          head -25 /tmp/core.txt
          echo "===== DONE ====="
