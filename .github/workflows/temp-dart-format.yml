name: TEMP - Dart Format All Apps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: dart format + upload diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter-android

      - name: dart format across all apps
        shell: bash
        run: |
          set -euo pipefail
          for app in leopardo_core leopardo_employee leopardo_hr leopardo_manager leopardo_platform_admin leopardo_marketing; do
            if [[ -d "front/mobile_apps/$app" ]]; then
              (cd "front/mobile_apps/$app" && dart format . 2>&1 | tail -1)
            fi
          done

      - name: Upload formatted tree
        uses: actions/upload-artifact@v7
        with:
          name: dart-formatted
          path: front/mobile_apps/
          if-no-files-found: error
