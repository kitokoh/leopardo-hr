name: Release - Leopardo RH

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v1.0.0)"
        required: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${TAG}"

      - name: Extract changelog for this version
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          CHANGELOG_FILE="CHANGELOG.md"

          if [[ ! -f "${CHANGELOG_FILE}" ]]; then
            echo "body=No changelog found." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Extract section for this version from CHANGELOG.md
          # Looks for ## [version] or ## version headers
          BODY=$(awk -v ver="${VERSION}" '
            /^## / {
              if (found) exit
              if (index($0, ver) > 0) found=1
              next
            }
            found { print }
          ' "${CHANGELOG_FILE}")

          if [[ -z "${BODY}" ]]; then
            # Fallback: list commits since last tag
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [[ -n "${PREV_TAG}" ]]; then
              BODY=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
            else
              BODY=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
            fi
            BODY="## Changes\n\n${BODY}"
          fi

          # Write to file to avoid escaping issues
          echo -e "${BODY}" > /tmp/release-body.md
          echo "body_file=/tmp/release-body.md" >> "$GITHUB_OUTPUT"

      - name: Determine prerelease
        id: prerelease
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if [[ "${TAG}" == *"-alpha"* || "${TAG}" == *"-beta"* || "${TAG}" == *"-rc"* || "${TAG}" == *"-staging"* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = `${{ steps.tag.outputs.tag }}`;
            const bodyFile = `${{ steps.changelog.outputs.body_file }}`;
            const body = fs.readFileSync(bodyFile, 'utf8');
            const isPrerelease = `${{ steps.prerelease.outputs.is_prerelease }}` === 'true';

            const { owner, repo } = context.repo;

            // Check if release already exists
            try {
              const existing = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.info(`Release ${tag} already exists. Updating.`);
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: existing.data.id,
                body,
                prerelease: isPrerelease,
              });
            } catch (e) {
              if (e.status === 404) {
                core.info(`Creating new release for ${tag}.`);
                await github.rest.repos.createRelease({
                  owner,
                  repo,
                  tag_name: tag,
                  name: `Leopardo RH ${tag}`,
                  body,
                  prerelease: isPrerelease,
                  generate_release_notes: true,
                });
              } else {
                throw e;
              }
            }

  build-artifacts:
    name: Build release artifacts
    runs-on: ubuntu-latest
    needs: create-release

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Place google-services.json if available
        shell: bash
        run: |
          for SRC in "google-services.json" "api/google-services.json"; do
            if [[ -f "${SRC}" ]]; then
              mkdir -p front/mobile/android/app
              cp "${SRC}" front/mobile/android/app/google-services.json
              break
            fi
          done

      - name: Build release APK
        working-directory: front/mobile
        run: |
          flutter pub get
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://api.leopardo-rh.com/api/v1

      - name: Upload APK to release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = `${{ steps.tag.outputs.tag }}`;
            const { owner, repo } = context.repo;

            const release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            const apkPath = 'front/mobile/build/app/outputs/flutter-apk/app-release.apk';

            if (fs.existsSync(apkPath)) {
              const data = fs.readFileSync(apkPath);
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.data.id,
                name: `leopardo-rh-${tag}.apk`,
                data,
                headers: { 'content-type': 'application/vnd.android.package-archive' },
              });
              core.info('APK uploaded to release.');
            } else {
              core.warning('APK file not found, skipping upload.');
            }
