name: Web Offline CI — PWA Edge

# Issue #1486 : front/web-offline n'avait aucun pipeline (non stylé, non
# linté, TS incohérent). Ce workflow couvre lint + build + tests.

on:
  pull_request:
    branches: [main]
    paths:
      - 'front/web-offline/**'
  push:
    branches: [main]
    paths:
      - 'front/web-offline/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: web-offline-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web-offline-ci:
    timeout-minutes: 30
    name: Lint + Test + Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # jsdom 30.x (devDependency) requires Node ≥ 22 for
          # webidl.util.markAsUncloneable — see issue #4829.
          node-version: '22'
          cache: npm
          cache-dependency-path: front/web-offline/package-lock.json

      - name: Install
        working-directory: front/web-offline
        run: npm ci

      - name: Lint
        working-directory: front/web-offline
        run: npm run lint

      - name: Test (issue #3971)
        # La machine à états du health-check et les stratégies de cache SW
        # sont désormais couvertes — le workflow annonçait « lint + build +
        # tests » sans exécuter aucun test.
        working-directory: front/web-offline
        run: npm test

      - name: Build
        working-directory: front/web-offline
        run: npm run build

      - name: Manifest assets guard (issue #3963)
        # Les icônes déclarées par public/manifest.json doivent exister dans
        # public/ — sinon l'installabilité PWA est silencieusement cassée
        # (404 sur chaque icône, « Add to Home Screen » absent).
        working-directory: front/web-offline
        run: |
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("public/manifest.json", "utf8"));
            const icons = manifest.icons || [];
            if (icons.length === 0) {
              console.error("manifest.json: aucune icône déclarée");
              process.exit(1);
            }
            let failed = false;
            for (const icon of icons) {
              const file = "public" + icon.src.replace(/^\//, "/");
              if (!fs.existsSync(file)) {
                console.error("manifest icon introuvable: " + icon.src);
                failed = true;
              }
            }
            if (failed) process.exit(1);
            console.log("manifest icons OK: " + icons.map((i) => i.src).join(", "));
          '
