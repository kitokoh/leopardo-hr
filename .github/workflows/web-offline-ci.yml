name: Web Offline CI — PWA Edge

# Issue #1486 : front/web-offline n'avait aucun pipeline (non stylé, non
# linté, TS incohérent). Ce workflow couvre lint + build + tests.

on:
  pull_request:
    branches: [main]
    paths:
      - 'front/web-offline/**'
  push:
    branches: [main]
    paths:
      - 'front/web-offline/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: web-offline-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-offline-ci:
    name: Lint + Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: front/web-offline/package-lock.json

      - name: Install
        working-directory: front/web-offline
        run: npm ci

      - name: Lint
        working-directory: front/web-offline
        run: npm run lint

      - name: Build
        working-directory: front/web-offline
        run: npm run build
