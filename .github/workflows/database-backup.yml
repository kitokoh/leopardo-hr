name: Database Backup & Restore Drill

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "backup or drill"
        required: true
        default: "backup"
        type: choice
        options:
          - backup
          - drill
          - freshness
  schedule:
    - cron: "15 2 * * *"
    # #7253 — contrôle de fraîcheur : 2 h 15 après la sauvegarde quotidienne,
    # pour détecter une chaîne de sauvegarde rompue (RPO non tenu).
    - cron: "30 4 * * *"
    - cron: "15 3 1 * *"

permissions:
  contents: read

env:
  BACKUP_DIR: /tmp/leopardo-backups
  AWS_REGION: ${{ secrets.AWS_REGION || 'eu-west-3' }}
  # #7676 — stockage S3-compatible (Backblaze B2, Cloudflare R2…) : endpoint
  # explicite passé en argument à chaque appel `aws` (le fallback awscli v1
  # installé via pip ignore la variable d'environnement AWS_ENDPOINT_URL).
  # Vide = AWS S3, comportement historique inchangé.
  BACKUP_S3_ENDPOINT: ${{ secrets.AWS_ENDPOINT_URL }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: database-backup-${{ github.event_name }}-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  daily-backup:
    timeout-minutes: 60
    name: Daily PostgreSQL backup
    runs-on: ubuntu-latest
    # #7967/#8191 — les secrets de sauvegarde (BACKUP_AGE_RECIPIENT,
    # BACKUP_AGE_IDENTITY, DATABASE_URL, B2_*) sont posés au niveau de
    # l'ENVIRONNEMENT `production`, pas du dépôt. Sans cette déclaration,
    # chaque `secrets.X` se résout en chaîne vide et le job échoue en
    # « secrets manquants » alors que les secrets existent — exactement le
    # bug de portée déjà corrigé sur le rapport de quotas (#9059).
    environment: production
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'backup' || github.event_name == 'schedule' && github.event.schedule == '15 2 * * *'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false

      - name: Install backup tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          # #7657 — le serveur (Neon) est en PostgreSQL 18 : le paquet
          # `postgresql-client` d'Ubuntu 24.04 fournit pg_dump 16, qui refuse
          # de dumper un serveur plus récent (« server version mismatch »,
          # constat drill 2026-09-20). On installe le client 18 depuis PGDG.
          sudo apt-get install -y postgresql-common age
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          # #7657 — /usr/bin/pg_dump est le wrapper pg_wrapper de
          # postgresql-common : il sélectionne le cluster 16 préinstallé sur
          # l'image du runner, PAS la version la plus récente (constat drill
          # 2026-09-20, run 35487411111 : client 18 installé, pg_dump --version
          # toujours 16.15). On préfixe le PATH avec les binaires 18.
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version
          if ! command -v aws >/dev/null 2>&1; then
            python3 -m pip install --user --break-system-packages awscli
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
          aws --version

      - name: Validate backup secrets
        id: secrets
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          # #7657 — deux fournisseurs acceptés : AWS S3 (historique) ou
          # Backblaze B2 (identifiants DÉJÀ posés sur ce dépôt, utilisés par
          # db-standby-failover.yml). Exiger S3 alors que B2 est disponible
          # revenait à préférer une panne bruyante à une sauvegarde réelle.
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
        run: |
          set -euo pipefail
          missing=()
          # #7253 — BACKUP_AGE_RECIPIENT est désormais OBLIGATOIRE : la base
          # contient des données RH et de paie, un dump en clair dans S3 n'est
          # pas acceptable, même chiffré au repos par SSE-S3.
          for name in DATABASE_URL BACKUP_AGE_RECIPIENT; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("${name}")
            fi
          done

          # Le fournisseur de stockage est résolu par le script partagé : une
          # seule règle, testée (dev-hub/tools/test_backup_store.py), jamais
          # dupliquée dans le YAML.
          provider="$(bash dev-hub/scripts/backup-store.sh provider 2>&1)" || {
            echo "::error::Database backup IMPOSSIBLE — aucun fournisseur de stockage configuré (issue #7657)."
            echo "::error::Poser soit BACKUP_S3_BUCKET + AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY, soit B2_BUCKET_NAME + B2_KEY_ID + B2_APP_KEY."
            exit 1
          }
          echo "provider=${provider}" >> "$GITHUB_OUTPUT"

          if [[ ${#missing[@]} -gt 0 ]]; then
            # #6836 (P1 data-loss) : no-op silencieux interdit — aucune sauvegarde
            # n'existe tant que les secrets ne sont pas posés (Neon gratuit, pas de PITR).
            # Échec volontaire et sonore : l'alerte doit déclencher l'action du fondateur.
            echo "::error::Database backup IMPOSSIBLE — secrets manquants (issue #6836) : ${missing[*]}"
            exit 1
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "Fournisseur de stockage retenu : ${provider}"

      - name: Run pg_dump and upload to the object store
        if: steps.secrets.outputs.configured == 'true'
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STANDBY_DATABASE_URL: ${{ secrets.STANDBY_DATABASE_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_PROD_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_PROD_SERVICE_ID }}
          RENDER_API_BASE: ${{ secrets.PROD_RENDER_API_BASE_URL }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "${BACKUP_DIR}"
          timestamp="$(date -u +%Y%m%d-%H%M%S)"
          dump_file="${BACKUP_DIR}/leopardo-${timestamp}.dump"

          # #8191/#7967 — SAUVEGARDER LA BASE VIVANTE, PAS LA PRIMAIRE.
          # `DATABASE_URL` désigne la primaire Neon. Quand elle épuise son quota
          # mensuel, le watchdog `db-standby-failover` bascule l'API sur le
          # secours (`DB_URL` de Render) — mais ce job continuait de dumper la
          # primaire morte et échouait chaque nuit. Résultat constaté le
          # 2026-10-30 : dernière sauvegarde exploitable le 2026-09-22, soit
          # 897 h de RPO non tenu, alors que la base LIVE était parfaitement
          # joignable. On résout donc la cible comme le fait le watchdog.
          host_of() { sed -E 's#^[a-zA-Z+]+://([^@]*@)?([^/:]+).*#\2#' <<<"$1"; }

          DUMP_URL="${DATABASE_URL}"
          if [[ -n "${RENDER_API_KEY:-}" && -n "${RENDER_SERVICE_ID:-}" ]]; then
            api="${RENDER_API_BASE:-https://api.render.com/v1}"
            api="${api%/}"
            case "${api}" in */v1) ;; *) api="${api}/v1" ;; esac
            live_url="$(curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" \
              "${api}/services/${RENDER_SERVICE_ID}/env-vars?limit=100" \
              | jq -r '.[].envVar | select(.key=="DB_URL") | .value' 2>/dev/null || true)"
            if [[ -n "${live_url}" && "${live_url}" != "null" ]]; then
              echo "::add-mask::${live_url}"
              live_host="$(host_of "${live_url}")"
              primary_host="$(host_of "${DATABASE_URL}")"
              standby_host="$(host_of "${STANDBY_DATABASE_URL:-}")"
              if [[ "${live_host}" == "${primary_host}" || "${live_host}" == "${standby_host}" ]]; then
                DUMP_URL="${live_url}"
                echo "Cible de sauvegarde : base LIVE (${live_host}) — résolue via Render."
              else
                echo "::warning::DB_URL de Render (${live_host}) n'est ni la primaire ni le secours connus — repli sur DATABASE_URL."
              fi
            else
              echo "::warning::DB_URL de Render illisible — repli sur DATABASE_URL."
            fi
          else
            echo "::notice::RENDER_PROD_API_KEY/SERVICE_ID absents — sauvegarde de DATABASE_URL (pas de résolution LIVE)."
          fi

          pg_dump --format=custom --no-owner --no-privileges --file="${dump_file}" "${DUMP_URL}"

          # #7253 — chiffrement non optionnel (présence garantie par l'étape
          # de validation des secrets ci-dessus).
          age --recipient "${BACKUP_AGE_RECIPIENT}" --output "${dump_file}.age" "${dump_file}"
          rm -f "${dump_file}"
          dump_file="${dump_file}.age"

          object_key="postgres/daily/$(date -u +%Y/%m/%d)/$(basename "${dump_file}")"

          # #7657 — téléversement + vérification de taille délégués au script
          # partagé (S3 ou B2 natif, cf. dev-hub/scripts/backup-store.sh).
          bash dev-hub/scripts/backup-store.sh put "${dump_file}" "${object_key}"

  backup-freshness:
    timeout-minutes: 15
    name: Backup freshness check
    runs-on: ubuntu-latest
    # Même portée que `daily-backup` : le contrôle de fraîcheur interroge le
    # stockage objet avec les secrets de l'environnement `production`.
    environment: production
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'freshness' || github.event_name == 'schedule' && github.event.schedule == '30 4 * * *'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v aws >/dev/null 2>&1; then
            python3 -m pip install --user --break-system-packages awscli
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
          aws --version

      # #7253 — sans secrets, le contrôle n'a PAS lieu : on échoue bruyamment
      # plutôt que de laisser un job vert signifier « sauvegardes vérifiées ».
      - name: Validate freshness secrets
        id: secrets
        shell: bash
        env:
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
        run: |
          set -euo pipefail
          # #7657 — le contrôle de fraîcheur doit interroger LE MÊME stockage
          # que la sauvegarde, sinon il déclare « aucune sauvegarde » alors que
          # les dumps existent (faux rouge permanent).
          provider="$(bash dev-hub/scripts/backup-store.sh provider 2>&1)" || {
            echo "::error::Contrôle de fraîcheur IMPOSSIBLE — aucun fournisseur de stockage configuré (issue #7657)."
            exit 1
          }
          echo "provider=${provider}" >> "$GITHUB_OUTPUT"
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "Fournisseur de stockage retenu : ${provider}"

      - name: Fail when the latest backup is older than the RPO
        if: steps.secrets.outputs.configured == 'true'
        shell: bash
        env:
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          BACKUP_MAX_AGE_HOURS: "25"
        run: |
          set -euo pipefail
          export TZ=UTC

          # #7657 — `latest` rend « <ISO 8601 UTC> <clé> <taille> » quel que
          # soit le fournisseur (S3 ou B2 natif). Le parsing de la sortie
          # d'`aws s3 ls` vivait ici et ne connaissait que S3.
          latest="$(bash dev-hub/scripts/backup-store.sh latest postgres/daily/)"

          if [[ -z "${latest}" ]]; then
            echo "::error::Aucune sauvegarde trouvée sous postgres/daily/ (issue #7253) — RPO non tenu."
            exit 1
          fi

          latest_ts="$(awk '{print $1}' <<<"${latest}")"
          latest_key="$(awk '{print $2}' <<<"${latest}")"
          latest_age_h=$(( ( $(date -u +%s) - $(date -u -d "${latest_ts}" +%s) ) / 3600 ))

          echo "Dernière sauvegarde : ${latest_key} (${latest_ts}, il y a ${latest_age_h} h)"
          echo "Seuil RPO configuré : ${BACKUP_MAX_AGE_HOURS} h"

          if [[ "${latest_age_h}" -gt "${BACKUP_MAX_AGE_HOURS}" ]]; then
            echo "::error::Dernière sauvegarde vieille de ${latest_age_h} h (> ${BACKUP_MAX_AGE_HOURS} h) — RPO non tenu, chaîne de sauvegarde rompue (issue #7253)."
            exit 1
          fi

          echo "OK — sauvegarde récente (${latest_age_h} h)."

  monthly-restore-drill:
    timeout-minutes: 60
    name: Monthly restore drill
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'drill' || github.event_name == 'schedule' && github.event.schedule == '15 3 1 * *'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false

      - name: Install drill tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          # #7657 — même règle que le backup : client PostgreSQL 18 (PGDG),
          # le pg_dump 16 d'Ubuntu 24.04 refuse le serveur 18 (drill 2026-09-20).
          sudo apt-get install -y postgresql-common age
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          # #7657 — même contournement que le backup : pg_wrapper sélectionne
          # le cluster 16 de l'image runner, on préfixe le PATH avec les
          # binaires 18 (run 35487411111).
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version
          if ! command -v aws >/dev/null 2>&1; then
            python3 -m pip install --user --break-system-packages awscli
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
          aws --version

      - name: Validate drill secrets
        id: secrets
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESTORE_DB_URL: ${{ secrets.RESTORE_DB_URL }}
        run: |
          set -euo pipefail
          missing=()
          for name in DATABASE_URL RESTORE_DB_URL; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("${name}")
            fi
          done

          if [[ ${#missing[@]} -gt 0 ]]; then
            # #6836 : même règle que le backup — un drill de restauration no-op
            # donne une fausse assurance. Échec sonore tant que les secrets manquent.
            echo "::error::Restore drill IMPOSSIBLE — secrets manquants (issue #6836) : ${missing[*]}"
            exit 1
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

      # #7657 — `backup_drill.sh` attend un CHEMIN de fichier d'identité age
      # (`age --decrypt --identity <fichier>`), or un secret Actions ne peut
      # transporter que le CONTENU de la clé. On matérialise donc le secret
      # `BACKUP_AGE_IDENTITY` dans un fichier éphémère du runner (umask 077).
      - name: Materialize age identity file
        if: steps.secrets.outputs.configured == 'true'
        shell: bash
        env:
          BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
        run: |
          set -euo pipefail
          if [[ -n "${BACKUP_AGE_IDENTITY:-}" ]]; then
            umask 077
            printf '%s\n' "${BACKUP_AGE_IDENTITY}" > "${RUNNER_TEMP}/age-identity.txt"
            echo "BACKUP_AGE_IDENTITY_FILE=${RUNNER_TEMP}/age-identity.txt" >> "$GITHUB_ENV"
          else
            echo "::notice::Secret BACKUP_AGE_IDENTITY absent — le drill échouera si le dump est chiffré (age)."
          fi

      - name: Run backup restore drill
        if: steps.secrets.outputs.configured == 'true'
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESTORE_DB_URL: ${{ secrets.RESTORE_DB_URL }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          # #7657 — confirmation destructive exigée par backup_drill.sh (garde #3518) :
          # RESTORE_DB_URL pointe sur la base scratch dédiée `leopardo_drill`,
          # jamais sur la base de production (le script vérifie aussi la non-identité).
          CONFIRM_RESTORE: "YES"
        run: |
          set -euo pipefail
          chmod +x dev-hub/scripts/backup_drill.sh
          dev-hub/scripts/backup_drill.sh

      - name: Upload drill log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: database-restore-drill-log
          path: /tmp/leopardo-backups/last-drill.log
          if-no-files-found: ignore
          retention-days: 90
