name: Merge Quota Guard

# Issue #5634 (rétro pilotes J6, ratio fix/feat 5.24) — cause n°2 : merges en
# rafale (132 PRs en 6 jours → rebasages constants, re-travail, CI saturée).
#
# Ce gate compte les PR mergées sur main dans les 24 dernières heures et
# échoue (rouge visible) quand le quota quotidien est atteint. Le quota est
# piloté par la variable de repo `MERGE_DAILY_QUOTA` (défaut 25) — le PM peut
# l'ajuster sans modifier le workflow.
#
# NB : le gate est un signal fort, pas un verrou : il n'est pas dans la liste
# des checks requis (le PM décide de l'y ajouter une fois la cadence maîtrisée).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: merge-quota-guard
  cancel-in-progress: false

jobs:
  quota:
    timeout-minutes: 10
    name: Quota merges quotidiens (issue #5634)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main')

    steps:
      - name: Compter les merges des 24 dernières heures
        id: count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import subprocess

          repo = os.environ["REPO"]
          prs = []
          page = 1
          while True:
              url = f"repos/{repo}/pulls?state=closed&base=main&per_page=100&page={page}&sort=updated&direction=desc"
              res = subprocess.run(["gh", "api", url], capture_output=True, text=True, check=True)
              batch = json.loads(res.stdout)
              if not batch:
                  break
              prs.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          cutoff = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(hours=24)
          merged = []
          for pr in prs:
              merged_at = pr.get("merged_at")
              if not merged_at:
                  continue
              ts = datetime.datetime.fromisoformat(merged_at.replace("Z", "+00:00"))
              if ts >= cutoff:
                  merged.append(pr)

          count = len(merged)
          print(f"MERGED_24H={count}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"MERGED_24H={count}\n")
          PY

      - name: Vérifier le quota
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          QUOTA="${{ vars.MERGE_DAILY_QUOTA || '25' }}"
          echo "Merges main (24h) : ${MERGED_24H:-0} / quota ${QUOTA}"
          if [[ "${MERGED_24H:-0}" -ge "${QUOTA}" ]]; then
            echo "::error::Quota de merges quotidien atteint (${MERGED_24H:-0}/${QUOTA}) — règle #5634 : ralentir le rythme de merge (rebasages constants = re-travail + CI saturée). Reprendre demain ou faire valider une dérogation par le PM."
            exit 1
          fi
          echo "✓ Sous le quota de merges quotidien (issue #5634)."
