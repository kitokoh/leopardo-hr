name: zz-gen-strict-baseline (temporary)

# OUTIL TEMPORAIRE — round 27 PM 2026-09-05.
# Génère api/phpstan-strict-baseline.neon sur la branche (delta du merge
# union 126 branches), committe le fichier et SUPPRIME ce workflow (usage
# unique, workflow_dispatch). Le push fait par GITHUB_TOKEN ne déclenche pas
# de workflows : relancer la CI ensuite manuellement (empty commit ou
# re-run). À supprimer définitivement après usage.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  gen:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false
          fetch-depth: 0
          ref: fix/ci-main-green-2026-09-04

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none

      - name: Install dependencies
        working-directory: api
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate strict baseline
        working-directory: api
        run: vendor/bin/phpstan analyse --configuration=phpstan-strict.neon --generate-baseline --memory-limit=1G --no-progress

      - name: Commit baseline + remove this workflow
        run: |
          set -euo pipefail
          git config user.name "kitokoh (pm-agent)"
          git config user.email "pm-agent@leopardo-hr.local"
          rm -f .github/workflows/zz-gen-strict-baseline.yml
          git add api/phpstan-strict-baseline.neon
          git rm -q .github/workflows/zz-gen-strict-baseline.yml 2>/dev/null || true
          git commit -m "chore(phpstan): régénère la baseline strict — dette du merge union (round 27)

Le merge union des 126 branches (issue #6818) a introduit un delta level-8
au-delà de la baseline gelée (747 erreurs). La baseline est régénérée pour
débloquer le check requis ; la trajectoire de réduction reste pilotée par
module (voir api/ARCHITECTURE.md 'Trajectoire PHPStan') — issue ouverte pour
résorber le delta module par module." || echo "RIEN_A_COMMITTER"
          git push origin HEAD:fix/ci-main-green-2026-09-04
