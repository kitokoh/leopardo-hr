name: Branch Protection Guard

# Issue #2011 — incident 2026-08-14 : la protection de main a été vidée
# (checks requis + reviews supprimés) par un outillage de merge. Cette garde
# vérifie que la protection RÉELLE de main est identique au canonique committé.
# L’API GitHub exige un token admin dédié (`BRANCH_PROTECTION_TOKEN`).
#
# Issue #7270 — la garde n’était PAS planifiée : elle ne s’exécutait que sur
# dispatch manuel ou sur une PR touchant 3 fichiers. Autrement dit, une seconde
# disparition de la protection (l’incident même que #2011 existe pour détecter)
# serait passée inaperçue — personne ne lance une vérification manuelle sans
# raison de la lancer. Ajout d’un cron quotidien.
#
# Doctrine fail-loud (identique à `database-backup.yml` #6836 et
# `deploy-staging.yml` #6839) : tant que le token n’est pas configuré, la
# vérification n’a PAS lieu et le job échoue bruyamment. Un `::notice::` suivi
# d’un job vert laissait croire que la protection était vérifiée.

on:
  schedule:
    # Quotidien, 05:00 UTC — job court (lecture d’une API), ne concurrence pas
    # les gates PR.
    - cron: '0 5 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'dev-hub/tools/check-branch-protection.sh'
      - 'dev-hub/tools/check-branch-protection-test.sh'
      - 'dev-hub/tools/branch-protection-canonical.json'
      - 'docs/ops/CHECKS_TIERS_QUOTA.md'
      - '.github/workflows/branch-protection-guard.yml'

permissions:
  contents: read

concurrency:
  group: branch-protection-guard-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    timeout-minutes: 15
    name: Check branch protection (issue #2011)
    runs-on: ubuntu-latest
    env:
      # Fine-grained PAT/App token with administration:read on this repo.
      BRANCH_PROTECTION_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false

      - name: Self-test the guard (issues #2011 / #7480)
        # Le self-test ne dépend ni de l'API ni du token : il tourne donc même
        # quand `BRANCH_PROTECTION_TOKEN` est absent. Il verrouille l'invariant
        # « un check tiers n'est jamais requis » et la détection de dérive sur
        # une protection simulée (issue #7480).
        run: bash dev-hub/tools/check-branch-protection-test.sh

      # Le contexte `secrets` n'est pas disponible dans les `if` de job
      # (actionlint) : la présence du token est testée au niveau step via env.
      #
      # Issue #7657 — le PAT admin n'est PLUS une condition de succès. La garde
      # se rabat sur `GET /branches/{branch}` avec le GITHUB_TOKEN par défaut
      # (mode partiel : branche protégée + liste des checks requis + invariant
      # #7480) et annonce explicitement les champs qu'elle ne peut pas voir.
      # Avant ce correctif, l'absence du secret rendait le job ROUGE CHAQUE
      # JOUR sur main : un check rouge permanent ne signale plus rien (#3545).
      - name: Verify main protection matches canonical
        env:
          # Le PAT admin (si posé) débloque le mode COMPLET ; sinon le token
          # par défaut suffit au mode PARTIEL.
          GITHUB_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN || github.token }}
        run: dev-hub/tools/check-branch-protection.sh kitokoh/leopardo-hr main

      - name: Report the verification mode (issue #7657)
        if: always()
        env:
          # Jamais d'interpolation `${{ secrets.* }}` dans un `run:` : le secret
          # finirait dans le script (et dans les logs en cas d'erreur).
          HAS_ADMIN_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN != '' }}
        run: |
          set -euo pipefail
          {
            echo "## Protection de branche — mode de vérification"
            echo ""
            if [[ "${HAS_ADMIN_TOKEN}" == "true" ]]; then
              echo "**Mode COMPLET** — \`BRANCH_PROTECTION_TOKEN\` présent : strict, contexts, enforce_admins, reviews, force-push et deletions sont tous comparés au canonique."
            else
              echo "**Mode PARTIEL** — \`BRANCH_PROTECTION_TOKEN\` absent : vérifiés = branche protégée, liste des checks requis, invariant « aucun check tiers requis » (#7480)."
              echo ""
              echo "NON vérifiés dans ce mode : \`strict\`, \`enforce_admins\`, reviews, force-push, deletions."
              echo "Pour le mode complet : fine-grained PAT limité à ce dépôt, permission **Administration : Read-only**, secret \`BRANCH_PROTECTION_TOKEN\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
