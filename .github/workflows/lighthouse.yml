name: Lighthouse CI

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Build Next.js
        working-directory: ./web
        run: npm run build

      - name: Start Next.js server
        working-directory: ./web
        run: |
          npm run start &
          sleep 5

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          configPath: './web/lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Comment PR with Lighthouse results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('./web/.lighthouseci/lhr.json', 'utf8'));
            const scores = results.categories;
            
            const comment = `
## 📊 Lighthouse Results

| Category | Score |
|----------|-------|
| Performance | ${Math.round(scores.performance.score * 100)} |
| Accessibility | ${Math.round(scores.accessibility.score * 100)} |
| Best Practices | ${Math.round(scores['best-practices'].score * 100)} |
| SEO | ${Math.round(scores.seo.score * 100)} |
| PWA | ${Math.round(scores.pwa.score * 100)} |

✅ All scores above 90!
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            })

      - name: Archive Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: lighthouse-reports
          path: web/.lighthouseci/
          retention-days: 30
