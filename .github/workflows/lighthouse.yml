name: Lighthouse CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'front/web/package-lock.json'

      - name: Install dependencies
        working-directory: front/web
        run: npm ci

      - name: Build Next.js
        working-directory: front/web
        run: npm run build

      - name: Start Next.js server
        working-directory: front/web
        run: |
          npm run start &
          sleep 5

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './front/web/lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Archive Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: front/web/.lighthouseci/
          retention-days: 30
