name: Legacy Mobile CI - Flutter

# This workflow intentionally validates the historical single Flutter app in
# front/mobile. The launch/store applications live in front/mobile_apps and are
# covered by mobile-apps-ci.yml and mobile-distribute.yml.

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
    paths:
      - 'front/mobile/**'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches: [main, develop]
    paths:
      - 'front/mobile/**'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-flutter-analyze:
    name: Legacy Flutter Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: front/mobile
        run: flutter pub get --offline || flutter pub get

      - name: Run flutter analyze
        working-directory: front/mobile
        run: flutter analyze --no-fatal-infos

  legacy-flutter-test:
    name: Legacy Flutter Test + Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: front/mobile
        run: flutter pub get --offline || flutter pub get

      - name: Run tests with coverage
        id: tests
        working-directory: front/mobile
        run: |
          flutter test --coverage --machine > test-results.json 2>&1 || true
          flutter test --coverage 2>&1 | tee test-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"

      - name: Parse coverage
        id: coverage
        working-directory: front/mobile
        shell: bash
        run: |
          set -euo pipefail
          LCOV_FILE="coverage/lcov.info"
          if [[ ! -f "${LCOV_FILE}" ]]; then
            echo "percentage=0" >> "$GITHUB_OUTPUT"
            echo "No coverage file found."
            exit 0
          fi
          TOTAL_LINES=$(grep -c "^DA:" "${LCOV_FILE}" || echo "0")
          HIT_LINES=$(grep "^DA:" "${LCOV_FILE}" | grep -v ",0$" | wc -l || echo "0")
          if [[ "${TOTAL_LINES}" -eq 0 ]]; then
            echo "percentage=0" >> "$GITHUB_OUTPUT"
          else
            PERCENT=$(echo "scale=1; ${HIT_LINES} * 100 / ${TOTAL_LINES}" | bc)
            echo "percentage=${PERCENT}" >> "$GITHUB_OUTPUT"
            echo "Mobile coverage: ${PERCENT}% (${HIT_LINES}/${TOTAL_LINES} lines)"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-results
          path: |
            front/mobile/test-results.json
            front/mobile/test-output.txt
            front/mobile/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail if tests failed
        if: steps.tests.outputs.exit_code != '0'
        run: |
          echo "Flutter tests failed."
          exit 1

  legacy-flutter-build-apk:
    name: Build Legacy Debug APK
    runs-on: ubuntu-latest
    needs: [legacy-flutter-analyze, legacy-flutter-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Place google-services.json if available
        shell: bash
        run: |
          set -euo pipefail
          for SRC in "google-services.json" "api/google-services.json"; do
            if [[ -f "${SRC}" ]]; then
              mkdir -p front/mobile/android/app
              cp "${SRC}" front/mobile/android/app/google-services.json
              echo "Copied ${SRC} to front/mobile/android/app/"
              break
            fi
          done

      - name: Install dependencies
        working-directory: front/mobile
        run: flutter pub get --offline || flutter pub get

      - name: Build debug APK
        working-directory: front/mobile
        run: |
          flutter build apk --debug \
            --dart-define=API_BASE_URL=https://gestionemployerbackend.onrender.com/api/v1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: leopardo-rh-legacy-debug-apk
          path: front/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
          retention-days: 7
