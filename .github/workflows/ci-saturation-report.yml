name: CI Saturation Report

# ============================================================
# Issue #7090 (RETEX L-12, triage 2026-09-09) : saturation CI constatée à
# plusieurs reprises malgré les mesures déjà prises (BC batch, quotas merge,
# jobs gatés, annulation des runs obsolètes). Ce workflow produit le RAPPORT
# MENSUEL de saturation à partir de l'historique des runs Actions (30 jours) :
#   - volume par workflow, taux d'annulation (cancelled), file d'attente
#     moyenne, échecs, goulots potentiels ;
#   - publié en job summary + artifact (non bloquant, non commité — cohérent
#     avec la pratique du repo : un agent/PM traite le rapport et ouvre les
#     issues de durcissement si les seuils sont dépassés).
# Exécution : 1er du mois à 05:15 UTC + workflow_dispatch (à la demande).
# Seuils indicatifs documentés : docs/ops/STRATEGIE_CI_RAPIDE.md
# (« Rapport mensuel saturation CI »).
# ============================================================

on:
  schedule:
    - cron: "15 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-saturation-report
  cancel-in-progress: false

jobs:
  report:
    timeout-minutes: 20
    name: Rapport saturation CI (30 jours)
    runs-on: ubuntu-latest
    steps:
      - name: Compute CI saturation metrics
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import statistics
          import subprocess

          repo = os.environ["REPO"]
          since = (datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=30)).strftime("%Y-%m-%dT%H:%M:%SZ")

          # Paginer les runs des 30 derniers jours (Actions API, tri par created desc)
          runs = []
          page = 1
          while page <= 10:
              res = subprocess.run(
                  ["gh", "api", f"repos/{repo}/actions/runs?created=>{since}&per_page=100&page={page}"],
                  capture_output=True, text=True,
              )
              if res.returncode != 0:
                  print(f"::warning::ci-saturation-report : échec API runs ({res.stderr.strip()[:200]})")
                  break
              batch = json.loads(res.stdout).get("workflow_runs", [])
              if not batch:
                  break
              runs.extend(batch)
              page += 1

          if not runs:
              print("::warning::ci-saturation-report : aucun run trouvé sur 30 jours (permissions actions: read ?)")
              raise SystemExit(0)

          by_workflow = {}
          for r in runs:
              name = r.get("name") or r.get("display_title") or "?"
              w = by_workflow.setdefault(name, {"total": 0, "cancelled": 0, "failed": 0, "success": 0, "queued_sec": [], "durations": []})
              w["total"] += 1
              concl = r.get("conclusion")
              if concl == "cancelled":
                  w["cancelled"] += 1
              elif concl == "failure":
                  w["failed"] += 1
              elif concl == "success":
                  w["success"] += 1
              created = r.get("created_at")
              started = r.get("run_started_at")
              if created and started:
                  try:
                      c = datetime.datetime.fromisoformat(created.replace("Z", "+00:00"))
                      s = datetime.datetime.fromisoformat(started.replace("Z", "+00:00"))
                      w["queued_sec"].append(max(0, int((s - c).total_seconds())))
                  except ValueError:
                      pass

          today = datetime.date.today().isoformat()
          lines = [f"# Rapport saturation CI — {today} (30 jours)", ""]
          lines.append(f"Runs analysés : **{len(runs)}** sur {repo} (API Actions, depuis {since[:10]}).")
          lines.append("Rapport informatif — non bloquant. Seuils indicatifs : docs/ops/STRATEGIE_CI_RAPIDE.md.")
          lines.append("")
          lines.append("| Workflow | Runs | ✅ | ❌ | ⏹ annulés | Annulation % | File moy. (s) |")
          lines.append("|---|---|---|---|---|---|---|")
          for name in sorted(by_workflow, key=lambda n: -by_workflow[n]["total"]):
              w = by_workflow[name]
              pct = 100.0 * w["cancelled"] / w["total"]
              q = statistics.mean(w["queued_sec"]) if w["queued_sec"] else "-"
              qs = f"{q:.0f}" if isinstance(q, float) else "-"
              lines.append(f"| {name} | {w['total']} | {w['success']} | {w['failed']} | {w['cancelled']} | {pct:.0f} % | {qs} |")
          lines.append("")
          lines.append("## Lecture")
          lines.append("- **Annulation %** : au-delà de ~30 % sur un workflow, vérifier les groupes de concurrence et la rafale de merges (#3545).")
          lines.append("- **File moyenne** : > 60 s récurrente = saturation des runners (fast-path dorny/paths-filter, jobs gatés — #6928).")
          lines.append("- **Volumes** : dépassement du quota de merges quotidien (`MERGE_DAILY_QUOTA`, défaut 25) → espacer les merges.")
          lines.append("")
          lines.append("## Durcissement (si seuils dépassés)")
          lines.append("1. Ajuster `MERGE_DAILY_QUOTA` (repo variable) — jamais en dur dans les workflows.")
          lines.append("2. Généraliser le pattern « job lourd gaté par dorny/paths-filter, garde légère inconditionnelle » (#6928, #7090).")
          lines.append("3. Nettoyer les runs orphelins (workflow `CI Queue — Orphan Runs Cleanup`, #2413).")
          report = "\n".join(lines)
          print(report)
          with open("ci-saturation-report.md", "w", encoding="utf-8") as f:
              f.write(report + "\n")
          # Job summary (visible dans l'UI du run)
          with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"), "a", encoding="utf-8") as f:
              f.write(report + "\n")
          # Alerte douce si dépassement global
          total_cancelled = sum(w["cancelled"] for w in by_workflow.values())
          total = sum(w["total"] for w in by_workflow.values())
          if total and 100.0 * total_cancelled / total > 30.0:
              print(f"::warning::ci-saturation-report : taux d'annulation global {100.0*total_cancelled/total:.0f} % > 30 % — examiner la saturation (issue #7090)")
          PY

      - name: Upload saturation report artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-saturation-report
          path: ci-saturation-report.md
          retention-days: 90
          if-no-files-found: error
