name: Actionlint

# Audit Plan P4: dedicated lint on PRs touching .github/workflows/**, so a
# regression like the tests.yml orphaned mobile_* fragment (Audit §1.1) is
# caught at review time instead of silently shipping dead/broken steps.
# actionlint bundles shellcheck integration, so `run:` blocks get basic
# shell linting too.
#
# PA2-OPS-003: `pull_request.paths` intentionally removed so this job runs
# on every PR unconditionally (not just ones touching .github/workflows/**).
# It was added to `required_status_checks.contexts` on `main` (branch
# protection) — a required check gated behind a `paths:` filter never posts
# a status on PRs that don't match those paths, which makes GitHub treat
# the required check as permanently pending and blocks merging that PR
# indefinitely. The job itself is a fast static lint over `.github/**`, so
# running it unconditionally on every PR is cheap; `push` keeps its `paths:`
# filter since push-to-main doesn't gate any PR merge.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/paths-filters.yml'

permissions:
  contents: read
  checks: write

concurrency:
  group: actionlint-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  actionlint:
    name: actionlint (+ shellcheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true

      - name: Run actionlint
        uses: reviewdog/action-actionlint@e0207a28405ecad11953ba625a95d92f7889572a # v1
        with:
          fail_level: error
