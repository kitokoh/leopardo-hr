name: OpenAPI CI

on:
  pull_request:
    paths:
      - "api/openapi.yaml"
      - ".github/workflows/openapi-ci.yml"
  push:
    branches:
      - main
    paths:
      - "api/openapi.yaml"
      - ".github/workflows/openapi-ci.yml"

permissions:
  contents: read

jobs:
  lint-openapi:
    name: Lint OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Lint api/openapi.yaml
        run: npx --yes @redocly/cli@1.34.5 lint api/openapi.yaml
