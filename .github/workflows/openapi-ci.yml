name: OpenAPI CI

on:
  pull_request:
    paths:
      - "api/openapi.yaml"
      - "api/routes/**"
      - "dev-hub/openapi/v1.yaml"
      - "dev-hub/sdk/**"
      - "dev-hub/tools/generate-openapi-sdk.mjs"
      - "dev-hub/tools/check-openapi-route-coverage.py"
      - "dev-hub/tools/openapi-coverage-allowlist.txt"
      - ".github/workflows/openapi-ci.yml"
  push:
    branches:
      - main
    paths:
      - "api/openapi.yaml"
      - "api/routes/**"
      - "dev-hub/openapi/v1.yaml"
      - "dev-hub/sdk/**"
      - "dev-hub/tools/generate-openapi-sdk.mjs"
      - "dev-hub/tools/check-openapi-route-coverage.py"
      - "dev-hub/tools/openapi-coverage-allowlist.txt"
      - ".github/workflows/openapi-ci.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-openapi:
    name: Lint OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint api/openapi.yaml
        run: npx --yes @redocly/cli@1.34.5 lint api/openapi.yaml

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Check dev-hub OpenAPI mirror + generated SDKs are in sync (issue #1397)
        # dev-hub/openapi/v1.yaml is generated from api/openapi.yaml by
        # dev-hub/tools/generate-openapi-sdk.mjs so external integrators never
        # see a stale/divergent stub. This fails the build if api/openapi.yaml
        # changed without regenerating dev-hub/openapi/v1.yaml and the SDKs.
        run: node dev-hub/tools/generate-openapi-sdk.mjs --check

  route-coverage:
    name: Route → OpenAPI coverage guard (issue #1473)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compare routes vs openapi.yaml
        # Toute route NON documentée ET NON allowlistée fait échouer le job.
        # Gaps connus : dev-hub/tools/openapi-coverage-allowlist.txt.
        run: python3 dev-hub/tools/check-openapi-route-coverage.py
