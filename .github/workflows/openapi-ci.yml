name: OpenAPI CI

on:
  # DoD #5280 — le contrat OpenAPI est vérifié sur CHAQUE pull request :
  # une PR qui ajoute une route, dégrade la spec ou laisse le miroir/SDK
  # périmé est bloquée immédiatement, même si elle ne touche ni api/routes/**
  # ni api/openapi.yaml directement (dérive possible via schemas/refs).
  pull_request:
  push:
    branches:
      - main
    paths:
      - "api/openapi.yaml"
      - "api/routes/**"
      - "dev-hub/openapi/v1.yaml"
      - "dev-hub/sdk/**"
      - "dev-hub/tools/generate-openapi-sdk.mjs"
      - "dev-hub/tools/check-openapi-route-coverage.py"
      - "dev-hub/tools/openapi-coverage-allowlist.txt"
      - ".github/workflows/openapi-ci.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: openapi-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # #5536 : queuer au lieu d'annuler (les runs PR ne démarrent jamais sous congestion)

jobs:
  lint-openapi:
    timeout-minutes: 30
    name: Lint OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true

      - name: Lint api/openapi.yaml
        run: npx --yes @redocly/cli@1.34.5 lint api/openapi.yaml

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"

      - name: Check dev-hub OpenAPI mirror + generated SDKs are in sync (issue #1397)
        # dev-hub/openapi/v1.yaml is generated from api/openapi.yaml by
        # dev-hub/tools/generate-openapi-sdk.mjs so external integrators never
        # see a stale/divergent stub. This fails the build if api/openapi.yaml
        # changed without regenerating dev-hub/openapi/v1.yaml and the SDKs.
        run: node dev-hub/tools/generate-openapi-sdk.mjs --check

  route-coverage:
    timeout-minutes: 45
    name: Route → OpenAPI coverage guard (issue #1473)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true

      - name: Compare routes vs openapi.yaml
        # Toute route NON documentée ET NON allowlistée fait échouer le job.
        # Gaps connus : dev-hub/tools/openapi-coverage-allowlist.txt.
        # --strict-staleness (#3596) : une entrée allowlistée devenue
        # documentée doit être purgée (anti-régression remédiation #1473).
        run: python3 dev-hub/tools/check-openapi-route-coverage.py --strict-staleness
