name: OpenAPI CI

on:
  # DoD #5280 — le contrat OpenAPI est vérifié sur CHAQUE pull request :
  # une PR qui ajoute une route, dégrade la spec ou laisse le miroir/SDK
  # périmé est bloquée immédiatement, même si elle ne touche ni api/routes/**
  # ni api/openapi.yaml directement (dérive possible via schemas/refs).
  pull_request:
  push:
    branches:
      - main
    paths:
      - "api/openapi.yaml"
      - "api/routes/**"
      - "dev-hub/tools/generate-openapi-sdk.mjs"
      - "dev-hub/tools/check-openapi-route-coverage.py"
      - "dev-hub/tools/openapi-coverage-allowlist.txt"
      - ".github/workflows/openapi-ci.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: openapi-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # #5629 : annuler les runs PR obsolètes pour libérer les runners

jobs:
  lint-openapi:
    timeout-minutes: 30
    name: Lint OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false

      - name: Lint api/openapi.yaml
        run: npx --yes @redocly/cli@1.34.5 lint api/openapi.yaml

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"

      - name: Generate dev-hub OpenAPI mirror + SDKs from api/openapi.yaml (issue #7654)
        # #7654 tranche 3 : le miroir dev-hub/openapi/v1.yaml et les SDK JS/Python
        # ne sont PLUS committés (le pattern « artefact committé + garde de fraîcheur »
        # regonflait le pack à chaque régénération — ~618 MB + ~120 MB cumulés dans
        # l'historique). Ce step prouve que la génération reste fonctionnelle sur
        # chaque PR : si api/openapi.yaml casse le générateur, la PR est rouge.
        run: |
          node dev-hub/tools/generate-openapi-sdk.mjs
          for f in dev-hub/openapi/v1.yaml dev-hub/sdk/MANIFEST.json \
                   dev-hub/sdk/javascript/leopardoClient.js dev-hub/sdk/python/leopardo_client.py; do
            [ -s "$f" ] || { echo "::error::$f non généré par generate-openapi-sdk.mjs"; exit 1; }
          done

      - name: Refuse re-committed generated OpenAPI artifacts (issue #7654)
        # Anti-régression : ces artefacts générés ne doivent jamais revenir dans git.
        run: |
          tracked=$(git ls-files -- dev-hub/openapi/v1.yaml dev-hub/sdk/MANIFEST.json \
            dev-hub/sdk/javascript/leopardoClient.js dev-hub/sdk/python/leopardo_client.py)
          if [ -n "$tracked" ]; then
            echo "::error::Artefacts OpenAPI générés re-committés (#7654) : $tracked — ils sont générés par make openapi-sync et gitignorés."
            exit 1
          fi

  route-coverage:
    timeout-minutes: 45
    name: Route → OpenAPI coverage guard (issue #1473)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false

      - name: Compare routes vs openapi.yaml
        # Toute route NON documentée ET NON allowlistée fait échouer le job.
        # Gaps connus : dev-hub/tools/openapi-coverage-allowlist.txt.
        # --strict-staleness (#3596) : une entrée allowlistée devenue
        # documentée doit être purgée (anti-régression remédiation #1473).
        run: python3 dev-hub/tools/check-openapi-route-coverage.py --strict-staleness
