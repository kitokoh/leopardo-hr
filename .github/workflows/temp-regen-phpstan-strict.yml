name: TEMP - Regenerate PHPStan Strict Baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regen:
    name: Regenerate phpstan-strict-baseline.neon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          tools: composer

      - name: Install dependencies
        working-directory: api
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate strict baseline
        working-directory: api
        run: |
          vendor/bin/phpstan analyse --configuration=phpstan-strict.neon \
            --generate-baseline=phpstan-strict-baseline.neon \
            --memory-limit=2G --no-progress || true

      - name: Upload generated baseline
        uses: actions/upload-artifact@v7
        with:
          name: phpstan-strict-baseline
          path: api/phpstan-strict-baseline.neon
          if-no-files-found: error
