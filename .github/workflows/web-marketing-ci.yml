name: Web CI - Leopardo Vitrine

on:
  workflow_dispatch:
  push:
    branches: [main]                         # push CI uniquement sur main
    paths:
      - 'front/web/**'
      - '.github/workflows/web-marketing-ci.yml'
  pull_request:
    branches: [main]                         # PRs vers main uniquement
    paths:
      - 'front/web/**'
      - '.github/workflows/web-marketing-ci.yml'

permissions:
  contents: read

concurrency:
  group: web-marketing-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  web-marketing-lint:
    name: Web Marketing Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'front/web/package-lock.json'

      - name: Install dependencies
        working-directory: front/web
        run: npm ci

      - name: Run ESLint
        working-directory: front/web
        run: npm run lint

  web-marketing-build:
    name: Web Marketing Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'front/web/package-lock.json'

      - name: Install dependencies
        working-directory: front/web
        run: npm ci

      - name: Build Next.js vitrine
        working-directory: front/web
        env:
          NEXT_PUBLIC_API_URL: https://gestionemployerbackend.onrender.com/api/v1
        run: npm run build

  web-marketing-funnel-e2e:
    name: Web Marketing Funnel E2E
    runs-on: ubuntu-latest
    needs: web-marketing-build

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'front/web/package-lock.json'

      - name: Install dependencies
        working-directory: front/web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: front/web
        run: npx playwright install --with-deps chromium

      - name: Run preview funnel tests
        working-directory: front/web
        env:
          NEXT_PUBLIC_API_URL: https://gestionemployerbackend.onrender.com/api/v1
          PLAYWRIGHT_WEB_SERVER_COMMAND: npm run build && npm run start
        run: npx playwright test e2e/marketing-funnel.spec.ts --project=chromium --workers=1

      - name: Run preview authenticated client smokes
        working-directory: front/web
        env:
          NEXT_PUBLIC_API_URL: https://gestionemployerbackend.onrender.com/api/v1
          PLAYWRIGHT_WEB_SERVER_COMMAND: npm run start
        run: npx playwright test e2e/auth-client-smoke.spec.ts e2e/manager-workday-smoke.spec.ts e2e/client-feature-gates.spec.ts e2e/client-visual-smoke.spec.ts --project=chromium --workers=1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-client-playwright-report
          path: front/web/playwright-report
          if-no-files-found: ignore
