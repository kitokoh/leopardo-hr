name: Secret History Scan (weekly)

# Spec A-2 (#1680) — Alerte automatisée « secrets exposés dans l'historique git ».
#
# TruffleHog sur le workflow PR/push (secret-scan.yml) ne couvre que les
# NOUVEAUX commits ; les secrets réels déjà présents dans l'historique public
# (Redis Upstash #1472, Neon #1601, clés Google #1467) restent récupérables
# par quiconque clone le repo tant que la purge historique (action humaine)
# n'est pas faite.
#
# Ce workflow fait un scan hebdomadaire de l'HISTORIQUE COMPLET
# (scan complet sur schedule/workflow_dispatch) en tant que JOB D'INFORMATION NON BLOQUANT :
# il ne fait jamais échouer la CI (continue-on-error + ::warning), mais publie
# un artefact + un résumé dans l'onglet Actions pour suivre l'évolution du
# nombre de secrets exposés et vérifier l'efficacité de la purge.
#
# Attendu tant que la purge n'est pas faite : le scan signale les secrets
# CONNUS et déjà inventoriés dans docs/security/HISTORIQUE_SECRETS.md.

on:
  schedule:
    # Lundi 06:00 UTC — en dehors des heures de pointe CI.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Le scan est informatif et non bloquant : conserver uniquement l’exécution la
# plus récente pour éviter deux scans complets de l’historique en parallèle.
concurrency:
  group: secret-history-scan-${{ github.workflow }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  history-scan:
    timeout-minutes: 60
    name: TruffleHog full-history (informational)
    runs-on: ubuntu-latest
    # A-2 : job d'information — les secrets connus sont inventoriés
    # (HISTORIQUE_SECRETS.md) ; le scan ne bloque jamais les merges.
    continue-on-error: true

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false
          fetch-depth: 0

      - name: Run TruffleHog on full history
        id: trufflehog
        continue-on-error: true
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318 # v3.97.0
        with:
          version: 3.96.0
          # Scan de TOUT l'historique git : sur events schedule/workflow_dispatch
          # l'action passe elle-meme `--since-commit ''` (base vide) => scan complet.
          # Ne PAS re-passser --since-commit dans extra_args : doublon -> le CLI
          # echoue avec « flag 'since-commit' cannot be repeated » (corrige 2026-08-11,
          # le scan A-2 ne s'etait jamais execute pour cette raison).
          # Memes exclusions que secret-scan.yml (detecteur Lob = faux positifs PHPUnit).
          extra_args: >-
            --results=verified,unknown
            --exclude-detectors=Lob

      - name: Report known secrets from the inventory
        if: always()
        run: |
          set +e
          {
            echo "## 🔍 Scan hebdomadaire de l'historique — résumé"
            echo ""
            echo "Ce scan est **informatif (non bloquant)** — Spec A-2 (#1680)."
            echo ""
            if [ -f docs/security/HISTORIQUE_SECRETS.md ]; then
              echo "### Secrets connus inventoriés (docs/security/HISTORIQUE_SECRETS.md)"
              echo '```'
              grep -E '^\| `?[A-Za-z]' docs/security/HISTORIQUE_SECRETS.md | head -30
              echo '```'
            fi
            echo ""
            echo "> ✅ Purge historique effectuee le 2026-08-11 (POST_MORTEM_PURGE_2026-08-11.md)."
            echo "> Verifier que les resultats du scan ci-dessus ne contiennent PAS de NOUVEAU secret"
            echo "> non inventorie dans docs/security/HISTORIQUE_SECRETS.md."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail loudly on NEW unlisted secrets
        if: always()
        run: |
          # Le job reste non bloquant (continue-on-error), mais on affiche un
          # avertissement clair si TruffleHog a trouvé des résultats : l'équipe
          # doit alors comparer avec l'inventaire HISTORIQUE_SECRETS.md.
          echo "Scan terminé (résultats ci-dessus). Si de nouveaux secrets apparaissent,"
          echo "les ajouter à docs/security/HISTORIQUE_SECRETS.md et ouvrir une issue."
