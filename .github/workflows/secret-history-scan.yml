name: Secret History Scan (Hebdo)

# Spec A-2 (#1680) — Alerte automatisée « secrets exposés dans l'historique git ».
#
# Le scan TruffleHog du workflow `secret-scan.yml` ne couvre que les NOUVEAUX
# commits (diff sur la PR / push). Tant que la purge historique (#1472 Redis
# Upstash, #1601 Neon) n'est pas exécutée (action humaine, voir
# docs/security/RUNBOOK_ROTATION_REDIS_1472.md et RUNBOOK_SECRET_ROTATION_PURGE.md),
# aucun garde-fou ne signalait la présence des secrets réels restés dans
# l'historique public.
#
# Ce workflow scanne l'HISTORIQUE COMPLET (depuis le commit racine) une fois par
# semaine, en job d'INFORMATION (non bloquant) : les secrets connus y sont
# attendus et inventoriés dans docs/security/HISTORIQUE_SECRETS.md ; tout secret
# nouveau (ou une régression d'arbre de travail) doit déclencher une revue.
#
# Critère d'acceptation (A-2) : workflow hebdo vert (ou signalant uniquement les
# secrets connus) ; inventaire à jour.

on:
  schedule:
    - cron: '0 3 * * 1' # lundi 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  history-scan:
    name: TruffleHog — Historique complet (informatif)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code (historique complet)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute root commit
        id: root
        run: |
          set -euo pipefail
          ROOT_SHA="$(git rev-list --max-parents=0 HEAD)"
          echo "root_sha=${ROOT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Root commit: ${ROOT_SHA}"

      # Job d'information : le scan complet trouve TOUJOURS les secrets connus
      # (#1472/#1601) tant que la purge humaine n'est pas faite — on ne bloque
      # pas la CI dessus (continue-on-error), mais le résultat reste visible
      # dans les logs du run hebdo.
      - name: Scan complet (depuis la racine, non bloquant)
        continue-on-error: true
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          version: 3.96.0
          extra_args: >-
            --results=verified,unknown
            --exclude-detectors=Lob
            --since-commit ${{ steps.root.outputs.root_sha }}

      - name: Résumé — état de l'historique
        run: |
          echo "## Scan hebdo de l'historique git (A-2 #1680)"
          echo ""
          echo "Les secrets RÉELS connus restent dans l'historique public tant que la"
          echo "purge humaine n'est pas exécutée (voir ci-dessous) : ils sont ATTENDUS"
          echo "dans les résultats du scan ci-dessus."
          echo ""
          echo "- **Redis Upstash (#1472)** — mot de passe + hostname réels committés en"
          echo "  clair (docs/audits/AUDIT.md, docs/PLAN_ACTION/POST_AUDIT_2026/*)."
          echo "  Rotation : FAITE par le propriétaire (2026-08-09). Purge historique :"
          echo "  à exécuter (git filter-repo + force-push coordonné) —"
          echo "  docs/security/RUNBOOK_ROTATION_REDIS_1472.md."
          echo "- **Neon (#1601)** — secret rédacté dans l'arbre, purge historique à"
          echo "  exécuter — docs/security/RUNBOOK_SECRET_ROTATION_PURGE.md."
          echo ""
          echo "⚠️ Si le scan révèle un secret NON inventorié dans"
          echo "docs/security/HISTORIQUE_SECRETS.md, ouvrir une issue de sécurité"
          echo "immédiatement (SECURITY.md)."
