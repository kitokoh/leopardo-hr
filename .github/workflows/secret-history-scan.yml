name: Secret History Scan (hebdo)

# Spec A-2 (#1680) — Alerte automatisée « secrets exposés dans l'historique git ».
#
# TruffleHog sur PR/push ne couvre que les commits nouveaux. Tant que la purge
# historique (#1472, action humaine) n'est pas faite, l'historique complet d'un
# repo PUBLIC reste récupérable (`git log -p`) : ce workflow scanne TOUT
# l'historique (depuis la racine) chaque semaine en job d'INFORMATION (non
# bloquant) et poste le résultat sur l'issue tracker #1472.
#
# Pourquoi non bloquant : l'historique contient des secrets CONNUS (Redis
# Upstash #1472, Neon #1601) — un scan bloquant serait rouge en permanence
# jusqu'à la purge. La sortie ne liste JAMAIS les valeurs, seulement les
# fichiers/commits + types de détecteurs.

on:
  workflow_dispatch:
  schedule:
    # Chaque lundi 06:30 UTC
    - cron: '30 6 * * 1'

permissions:
  contents: read
  issues: write

jobs:
  history-scan:
    name: TruffleHog Historique Complet (info)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historique complet)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan de l'historique complet (depuis la racine)
        id: scan
        continue-on-error: true # job d'information — ne bloque jamais la CI
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          version: 3.96.0
          # Aucun --since-commit : scan depuis la racine du dépôt (spec A-2).
          # --results=verified,unknown : les secrets connus (#1472/#1601) sont
          #   « unverified » mais doivent rester visibles du suivi.
          # --exclude-detectors=Lob : faux positifs PHPUnit (cf. secret-scan.yml).
          extra_args: >-
            --results=verified,unknown
            --exclude-detectors=Lob

      - name: Résumé (valeurs jamais affichées)
        if: always()
        run: |
          echo "## Scan hebdo historique complet (A-2, #1680)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.scan.outcome }}" = "success" ]; then
            echo "✅ Aucun nouveau secret détecté dans l'historique." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Secrets détectés dans l'historique (inventaire connu : " >> "$GITHUB_STEP_SUMMARY"
            echo "docs/security/HISTORIQUE_SECRETS.md — Redis Upstash #1472, Neon #1601)." >> "$GITHUB_STEP_SUMMARY"
            echo "Le détail des chemins/commits est dans les logs du job (valeurs masquées par TruffleHog)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commenter l'issue tracker (#1472)
        if: always() && steps.scan.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const outcome = '${{ steps.scan.outcome }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1472,
              body: [
                `## 🔎 Scan hebdo historique (A-2, #1680) — ${new Date().toISOString().slice(0, 10)}`,
                '',
                outcome === 'success'
                  ? '✅ **Aucun secret supplémentaire détecté** (seuls les secrets déjà inventoriés restent présents dans l\'historique).'
                  : '⚠️ **Secrets détectés dans l\'historique complet** — cf. `docs/security/HISTORIQUE_SECRETS.md`. Rappel : la purge historique (#1472) reste **bloquée sur action humaine** (rotation Upstash + `git filter-repo`).',
                '',
                '_Commentaire automatique du workflow `secret-history-scan.yml` (non bloquant)._',
              ].join('\n'),
            });
