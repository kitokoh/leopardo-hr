name: Public Web CI - Flutter Web (verticale restaurant)

# Mission parité web ↔ mobile de la verticale restaurant.
#
# ## Le trou que ce workflow comble
#
# `leopardo_public` est une app Flutter qui n'avait AUCUNE cible web publiée :
# `web/index.html` était le placeholder Flutter par défaut, `main.dart` ne
# posait pas de stratégie d'URL (donc toutes les routes en `#/…`, non
# indexables), et aucun job ne compilait `flutter build web`. Une régression de
# la cible web — un import qui ne compile pas en JS, une dépendance non
# web-compatible — restait donc invisible jusqu'à ce qu'un humain lance la
# commande à la main.
#
# ## Pourquoi un workflow séparé et pas un job de `mobile-apps-ci.yml`
#
# `mobile-apps-ci.yml` construit des APK/AAB : il installe le SDK Android, Java
# 17 et le NDK. La cible web n'en a besoin d'AUCUN — elle ne demande que le SDK
# Flutter. Ajouter le job là-bas aurait fait payer ~10 min de setup Android à
# chaque build web. Ici, le setup se limite à Flutter.
#
# ## Version Flutter épinglée
#
# 3.50.0, la même que `.github/actions/setup-flutter-android` (#9432) : suivre
# `stable` ferait arriver une nouvelle vague de dépréciations sans qu'aucune PR
# ne l'ait demandée. Un bump est une PR dédiée.

on:
  pull_request:
    branches: [main]
    paths:
      - 'front/mobile_apps/leopardo_public/**'
      - 'front/mobile_apps/leopardo_core/**'
      - '.github/workflows/public-web-ci.yml'
  push:
    branches: [main]
    paths:
      - 'front/mobile_apps/leopardo_public/**'
      - 'front/mobile_apps/leopardo_core/**'
      - '.github/workflows/public-web-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: public-web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Build web + tests (leopardo_public)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - name: Cache pub (deps Dart)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pub-cache
          key: pub-web-${{ runner.os }}-3.50.0-${{ hashFiles('front/mobile_apps/leopardo_public/pubspec.lock', 'front/mobile_apps/leopardo_core/pubspec.lock') }}

      - name: Dépendances
        working-directory: front/mobile_apps/leopardo_public
        run: flutter pub get

      - name: Analyse statique
        working-directory: front/mobile_apps/leopardo_public
        run: flutter analyze --no-fatal-infos

      - name: Tests unitaires
        working-directory: front/mobile_apps/leopardo_public
        run: flutter test

      # Le build web est le SEUL contrôle qui prouve que la cible existe : un
      # `flutter test` passe sur la VM Dart et ne compile jamais en JavaScript.
      # Une dépendance non web-compatible (dart:io, dart:ffi) ne se voit qu'ici.
      - name: Build web (release)
        working-directory: front/mobile_apps/leopardo_public
        run: |
          flutter build web --release \
            --base-href=/ \
            --pwa-strategy=none \
            --dart-define=API_BASE_URL=https://api.leopardo.africa/api/v1

      # Vérifie que les marqueurs de la cible web sont bien dans l'artefact :
      # un `index.html` resté au placeholder Flutter, ou un `main.dart.js`
      # absent, signifierait que le build n'a pas produit ce qu'on croit.
      - name: Vérifier l'artefact web
        working-directory: front/mobile_apps/leopardo_public
        run: |
          set -euo pipefail

          test -f build/web/index.html || { echo "::error::build/web/index.html absent"; exit 1; }
          test -f build/web/main.dart.js || { echo "::error::build/web/main.dart.js absent"; exit 1; }
          test -f build/web/restaurant_web_bootstrap.js || { echo "::error::restaurant_web_bootstrap.js absent"; exit 1; }

          grep -q 'og:title' build/web/index.html || { echo "::error::balises Open Graph absentes de index.html"; exit 1; }
          grep -q 'restaurant_web_bootstrap.js' build/web/index.html || { echo "::error::bootstrap restaurant non référencé"; exit 1; }

          # Le placeholder Flutter ne doit plus être le titre de la page.
          if grep -q 'A new Flutter project' build/web/index.html; then
            echo "::error::index.html porte encore le placeholder Flutter"
            exit 1
          fi

          echo "✅ Artefact web conforme (index.html, main.dart.js, bootstrap restaurant)"

      - name: Publier l'artefact web
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: leopardo-public-web
          path: front/mobile_apps/leopardo_public/build/web
          retention-days: 14
          if-no-files-found: error
