name: Tests - Leopardo RH

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEFAULT_BACKEND_COVERAGE_MIN: "0"
  DEFAULT_MOBILE_COVERAGE_MIN: "25"

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    outputs:
      api_changed: ${{ steps.changes.outputs.api_changed }}
      mobile_changed: ${{ steps.changes.outputs.mobile_changed }}
      web_changed: ${{ steps.changes.outputs.web_changed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed directories
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          changed_files=""

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            changed_files="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            if [ -n "${BEFORE}" ] && [ "${BEFORE}" != "0000000000000000000000000000000000000000" ]; then
              changed_files="$(git diff --name-only "${BEFORE}" "${AFTER}")"
            else
              changed_files="$(git show --name-only --pretty='' "${AFTER}")"
            fi
          fi

          api_changed=false
          mobile_changed=false
          web_changed=false

          if printf '%s\n' "${changed_files}" | grep -Eq '^(api/|\.github/workflows/tests\.yml|\.github/workflows/phpstan-baseline\.yml)'; then
            api_changed=true
          fi

          if printf '%s\n' "${changed_files}" | grep -Eq '^mobile/'; then
            mobile_changed=true
          fi

          if printf '%s\n' "${changed_files}" | grep -Eq '^(admin-dashboard/|\.github/workflows/web-ci\.yml)'; then
            web_changed=true
          fi

          echo "api_changed=${api_changed}" >> "$GITHUB_OUTPUT"
          echo "mobile_changed=${mobile_changed}" >> "$GITHUB_OUTPUT"
          echo "web_changed=${web_changed}" >> "$GITHUB_OUTPUT"
          echo "API changed: ${api_changed}"
          echo "Mobile changed: ${mobile_changed}"
          echo "Web changed: ${web_changed}"

  backend-tests:
    name: Backend (PHP 8.4 + PostgreSQL 16 + Redis 7)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api_changed == 'true'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: leopardo_test
          POSTGRES_USER: leopardo_user
          POSTGRES_PASSWORD: leopardo_pass_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo, pdo_pgsql, pdo_sqlite, sqlite3, redis, bcmath, mbstring, xml, zip, gd
          coverage: none

      - name: Resolve Composer cache directory
        id: composer-cache
        working-directory: ./api
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php84-${{ hashFiles('api/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php84-

      - name: Validate composer.json
        working-directory: ./api
        run: composer validate --no-check-publish --strict

      - name: Prepare environment
        working-directory: ./api
        run: |
          cat > .env <<'EOF'
          APP_NAME=LeopardoRH
          APP_ENV=testing
          APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_DEBUG=true
          APP_URL=http://localhost

          DB_CONNECTION=pgsql
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_DATABASE=leopardo_test
          DB_USERNAME=leopardo_user
          DB_PASSWORD=leopardo_pass_test
          DB_SEARCH_PATH=shared_tenants,public

          CACHE_STORE=array
          QUEUE_CONNECTION=sync
          SESSION_DRIVER=array
          REDIS_HOST=127.0.0.1
          REDIS_PORT=6379
          EOF

      - name: Install Composer dependencies
        working-directory: ./api
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Bootstrap migration repositories
        working-directory: ./api
        run: |
          php <<'PHP'
          <?php
          $dsn = 'pgsql:host=127.0.0.1;port=5432;dbname=leopardo_test';
          $pdo = new PDO($dsn, 'leopardo_user', 'leopardo_pass_test', [
              PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION,
          ]);

          $pdo->exec(<<<'SQL'
          CREATE SCHEMA IF NOT EXISTS shared_tenants;
          CREATE TABLE IF NOT EXISTS public.migrations (
              id serial PRIMARY KEY,
              migration varchar(255) NOT NULL,
              batch integer NOT NULL
          );
          CREATE TABLE IF NOT EXISTS shared_tenants.migrations (
              id serial PRIMARY KEY,
              migration varchar(255) NOT NULL,
              batch integer NOT NULL
          );
          SQL);

          echo "Migration repositories ensured for public/shared_tenants.\n";
          PHP

      - name: Run public migrations
        working-directory: ./api
        run: DB_SEARCH_PATH=public php artisan migrate --path=database/migrations/public --force --isolated

      - name: Run tenant migrations
        working-directory: ./api
        run: DB_SEARCH_PATH=shared_tenants php artisan migrate --path=database/migrations/tenant --force --isolated

      - name: Run backend unit tests
        id: backend_unit_tests
        continue-on-error: true
        working-directory: ./api
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_DATABASE: leopardo_test
          DB_SEARCH_PATH: public,shared_tenants
        run: php artisan test --testsuite=Unit --log-junit=storage/test-results/unit.xml

      - name: Run backend feature tests
        id: backend_feature_tests
        continue-on-error: true
        working-directory: ./api
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_DATABASE: leopardo_test
          DB_SEARCH_PATH: public,shared_tenants
        run: php artisan test --testsuite=Feature --log-junit=storage/test-results/feature.xml

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            api/storage/test-results/*.xml
            api/storage/logs/*.log
          if-no-files-found: ignore

      - name: Fail backend job if unit tests failed
        if: steps.backend_unit_tests.outcome == 'failure'
        run: |
          echo "Backend unit tests failed."
          exit 1

      - name: Fail backend job if feature tests failed
        if: steps.backend_feature_tests.outcome == 'failure'
        run: |
          echo "Backend feature tests failed."
          exit 1

  backend-security:
    name: Backend Security (Composer Audit)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api_changed == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Run Composer audit
        working-directory: ./api
        run: composer audit --locked --no-dev

  backend-quality:
    name: Backend Quality (Pint + PHP Syntax + PHPStan/Larastan)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api_changed == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo, pdo_pgsql, pdo_sqlite, sqlite3, bcmath, mbstring, xml, zip, gd
          tools: composer:v2
          coverage: none

      - name: Resolve Composer cache directory
        id: composer-cache
        working-directory: ./api
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php84-${{ hashFiles('api/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php84-

      - name: Validate composer.json
        id: validate_composer
        working-directory: ./api
        run: composer validate --no-check-publish --strict

      - name: Install Composer dependencies
        id: install_composer
        working-directory: ./api
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run Pint
        id: pint
        working-directory: ./api
        run: ./vendor/bin/pint

      - name: Lint PHP source files
        id: php_lint
        working-directory: ./api
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t php_files < <(find app bootstrap config database public routes tests -type f -name '*.php' | sort)
          for file in "${php_files[@]}"; do
            php -l "$file" >/dev/null
          done

      - name: Run PHPStan + Larastan
        id: phpstan
        working-directory: ./api
        shell: bash
        env:
          DIFF_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          cat > phpstan.ci.neon <<EOF
          includes:
              - phpstan.neon
              - vendor/larastan/larastan/extension.neon
          EOF
          mkdir -p storage/test-results
          base_sha="${DIFF_BASE_SHA:-}"
          head_sha="${DIFF_HEAD_SHA:-}"

          if [[ -z "${base_sha}" || "${base_sha}" == "0000000000000000000000000000000000000000" ]]; then
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              base_sha="$(git rev-parse HEAD~1)"
            else
              base_sha="$(git rev-parse HEAD)"
            fi
          fi

          if [[ -z "${head_sha}" ]]; then
            head_sha="$(git rev-parse HEAD)"
          fi

          mapfile -t changed_php_files < <(
            git diff --name-only "${base_sha}" "${head_sha}" \
              | grep -E '^api/(app|routes|tests)/.*\.php$' \
              | sort -u || true
          )

          if [[ ${#changed_php_files[@]} -eq 0 ]]; then
            echo "No changed backend PHP files matched the PHPStan gate." | tee storage/test-results/phpstan.txt
            exit 0
          fi

          printf '%s\n' "${changed_php_files[@]}" > storage/test-results/phpstan-targets.txt
          phpstan_targets=()
          while IFS= read -r file; do
            phpstan_targets+=("${file#api/}")
          done < storage/test-results/phpstan-targets.txt

          ./vendor/bin/phpstan analyse -c phpstan.ci.neon --no-progress --error-format=raw "${phpstan_targets[@]}" | tee storage/test-results/phpstan.txt

      - name: Build backend quality summary
        if: always()
        working-directory: ./api
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p storage/test-results
          findings="0"
          if [[ -f storage/test-results/phpstan.txt ]]; then
            findings="$(awk 'END { print NR }' storage/test-results/phpstan.txt)"
          fi
          target_scope="full backend scope"
          if [[ -f storage/test-results/phpstan-targets.txt ]]; then
            target_scope="$(tr '\n' ',' < storage/test-results/phpstan-targets.txt | sed 's/,$//')"
          fi
          cat > storage/test-results/backend-quality-summary.md <<EOF
          - Composer validate: ${{ steps.validate_composer.outcome }}
          - Composer install: ${{ steps.install_composer.outcome }}
          - Pint: ${{ steps.pint.outcome }}
          - PHP syntax lint: ${{ steps.php_lint.outcome }}
          - PHPStan/Larastan: ${{ steps.phpstan.outcome }}
          - PHPStan findings captured: ${findings}
          - PHPStan scope: ${target_scope}
          - Baseline support: api/phpstan.neon + api/phpstan-baseline.neon
          EOF

      - name: Upload backend quality summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-quality-summary
          path: api/storage/test-results/backend-quality-summary.md
          if-no-files-found: error

      - name: Upload backend quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-quality-reports
          path: |
            api/storage/test-results/phpstan.txt
            api/storage/test-results/phpstan-targets.txt
            api/storage/test-results/backend-quality-summary.md
            api/phpstan.neon
            api/phpstan-baseline.neon
          if-no-files-found: ignore

      - name: Fail backend quality job if PHPStan failed
        if: steps.phpstan.outcome == 'failure'
        run: |
          echo "PHPStan/Larastan failed."
          exit 1

  backend-coverage:
    name: Backend Coverage (PHPUnit)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api_changed == 'true'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: leopardo_test
          POSTGRES_USER: leopardo_user
          POSTGRES_PASSWORD: leopardo_pass_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP 8.4 with PCOV
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo, pdo_pgsql, pdo_sqlite, sqlite3, redis, bcmath, mbstring, xml, zip, gd
          tools: composer:v2
          coverage: pcov

      - name: Resolve Composer cache directory
        id: composer-cache
        working-directory: ./api
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php84-${{ hashFiles('api/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php84-

      - name: Prepare environment
        working-directory: ./api
        run: |
          cat > .env <<'EOF'
          APP_NAME=LeopardoRH
          APP_ENV=testing
          APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_DEBUG=true
          APP_URL=http://localhost

          DB_CONNECTION=pgsql
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_DATABASE=leopardo_test
          DB_USERNAME=leopardo_user
          DB_PASSWORD=leopardo_pass_test
          DB_SEARCH_PATH=shared_tenants,public

          CACHE_STORE=array
          QUEUE_CONNECTION=sync
          SESSION_DRIVER=array
          REDIS_HOST=127.0.0.1
          REDIS_PORT=6379
          EOF

      - name: Install Composer dependencies
        working-directory: ./api
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Bootstrap migration repositories
        working-directory: ./api
        run: |
          php <<'PHP'
          <?php
          $dsn = 'pgsql:host=127.0.0.1;port=5432;dbname=leopardo_test';
          $pdo = new PDO($dsn, 'leopardo_user', 'leopardo_pass_test', [
              PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION,
          ]);

          $pdo->exec(<<<'SQL'
          CREATE SCHEMA IF NOT EXISTS shared_tenants;
          CREATE TABLE IF NOT EXISTS public.migrations (
              id serial PRIMARY KEY,
              migration varchar(255) NOT NULL,
              batch integer NOT NULL
          );
          CREATE TABLE IF NOT EXISTS shared_tenants.migrations (
              id serial PRIMARY KEY,
              migration varchar(255) NOT NULL,
              batch integer NOT NULL
          );
          SQL);

          echo "Migration repositories ensured for public/shared_tenants.\n";
          PHP

      - name: Run public migrations
        working-directory: ./api
        run: DB_SEARCH_PATH=public php artisan migrate --path=database/migrations/public --force --isolated

      - name: Run tenant migrations
        working-directory: ./api
        run: DB_SEARCH_PATH=shared_tenants php artisan migrate --path=database/migrations/tenant --force --isolated

      - name: Run backend test suite with coverage
        id: backend_coverage_tests
        continue-on-error: true
        working-directory: ./api
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_DATABASE: leopardo_test
          DB_SEARCH_PATH: public,shared_tenants
        run: |
          mkdir -p storage/test-results storage/coverage-html
          php artisan test \
            --coverage-clover=storage/test-results/clover.xml \
            --coverage-html=storage/coverage-html

      - name: Build backend coverage summary
        if: always()
        id: backend_coverage_summary
        working-directory: ./api
        shell: bash
        env:
          BACKEND_COVERAGE_MIN: ${{ vars.BACKEND_COVERAGE_MIN }}
        run: |
          set -euo pipefail
          threshold="${BACKEND_COVERAGE_MIN:-${DEFAULT_BACKEND_COVERAGE_MIN}}"
          mkdir -p storage/test-results

          if [[ ! -f storage/test-results/clover.xml ]]; then
            {
              echo "- Threshold configured: ${threshold}%"
              echo "- Backend statement coverage: unavailable"
              echo "- Coverage test step: ${{ steps.backend_coverage_tests.outcome }}"
              echo "- HTML artifact: unavailable"
              echo "- Clover artifact: unavailable"
            } > storage/test-results/backend-coverage-summary.md
            printf "Backend statement coverage: unavailable\n" > storage/test-results/coverage-summary.txt
            cat storage/test-results/backend-coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          php <<'PHP' > storage/test-results/coverage-summary.txt
          <?php
          $xml = simplexml_load_file('storage/test-results/clover.xml');
          if ($xml === false) {
              fwrite(STDERR, "Unable to read clover.xml\n");
              exit(1);
          }

          $metrics = $xml->project->metrics ?? null;
          if ($metrics === null) {
              fwrite(STDERR, "Missing project metrics in clover.xml\n");
              exit(1);
          }

          $covered = (int) ($metrics['coveredstatements'] ?? 0);
          $total = (int) ($metrics['statements'] ?? 0);
          $percent = $total > 0 ? round(($covered / $total) * 100, 2) : 0.0;

          echo "Backend statement coverage: {$percent}% ({$covered}/{$total})\n";
          PHP

          coverage_line="$(cat storage/test-results/coverage-summary.txt)"
          {
            echo "- Threshold configured: ${threshold}%"
            echo "- ${coverage_line}"
            echo "- HTML artifact: api/storage/coverage-html/"
            echo "- Clover artifact: api/storage/test-results/clover.xml"
          } > storage/test-results/backend-coverage-summary.md

          cat storage/test-results/backend-coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce backend coverage threshold
        id: backend_coverage_gate
        continue-on-error: true
        if: always() && steps.backend_coverage_tests.outcome == 'success'
        working-directory: ./api
        shell: bash
        env:
          BACKEND_COVERAGE_MIN: ${{ vars.BACKEND_COVERAGE_MIN }}
        run: |
          set -euo pipefail
          threshold="${BACKEND_COVERAGE_MIN:-${DEFAULT_BACKEND_COVERAGE_MIN}}"
          percent="$(python - <<'PY'
          from pathlib import Path
          import re
          line = Path('storage/test-results/coverage-summary.txt').read_text(encoding='utf-8').strip()
          match = re.search(r'coverage:\s*([0-9]+(?:\.[0-9]+)?)%', line)
          print(match.group(1) if match else '0')
          PY
          )"
          printf "Threshold: %s%%\nResult: %s%%\n" "${threshold}" "${percent}" > storage/test-results/backend-coverage-threshold.txt
          awk -v percent="${percent}" -v threshold="${threshold}" 'BEGIN { exit ((percent + 0) < (threshold + 0)) ? 1 : 0 }'

      - name: Upload backend coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-summary
          path: |
            api/storage/test-results/backend-coverage-summary.md
            api/storage/test-results/coverage-summary.txt
            api/storage/test-results/backend-coverage-threshold.txt
          if-no-files-found: error

      - name: Upload backend coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-reports
          path: |
            api/storage/test-results/clover.xml
            api/storage/coverage-html/**
          if-no-files-found: ignore

      - name: Fail coverage job if test suite failed
        if: steps.backend_coverage_tests.outcome == 'failure'
        run: |
          echo "Backend coverage test suite failed before summary generation."
          exit 1

      - name: Fail coverage job if threshold gate failed
        if: steps.backend_coverage_gate.outcome == 'failure'
        run: |
          echo "Backend coverage threshold not met."
          exit 1

  mobile-tests:
    name: Mobile Flutter (Stable Channel)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.mobile_changed == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: ./mobile
        run: flutter pub get --offline || flutter pub get

      - name: Place google-services.json if provided in repo
        shell: bash
        run: |
          set -euo pipefail
          ROOT_FILE="google-services.json"
          API_FILE="api/google-services.json"
          APP_FILE="mobile/android/app/google-services.json"
          if [[ -f "$ROOT_FILE" && ! -f "$APP_FILE" ]]; then
            cp "$ROOT_FILE" "$APP_FILE"
          elif [[ -f "$API_FILE" && ! -f "$APP_FILE" ]]; then
            cp "$API_FILE" "$APP_FILE"
          fi

      - name: Check formatting
        id: mobile_format
        working-directory: ./mobile
        run: dart format .

      - name: Analyze
        id: mobile_analyze
        working-directory: ./mobile
        run: flutter analyze

      - name: Run Flutter tests
        id: mobile_tests
        working-directory: ./mobile
        shell: bash
        run: |
          set -euo pipefail
          flutter test --coverage --machine > test-results.json

      - name: Build mobile coverage summary
        id: mobile_coverage_summary
        working-directory: ./mobile
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f coverage/lcov.info ]]; then
            COVERAGE_LINE="$(awk '
              /^LF:/ { lf += substr($0, 4) }
              /^LH:/ { lh += substr($0, 4) }
              END {
                if (lf > 0) {
                  printf "Mobile line coverage: %.2f%% (%d/%d)\n", (lh / lf) * 100, lh, lf;
                } else {
                  print "Mobile line coverage: unavailable";
                }
              }
            ' coverage/lcov.info)"
            printf "%s\n" "$COVERAGE_LINE" > coverage/summary.txt
            printf "%s\n" "$COVERAGE_LINE"
          fi

      - name: Enforce mobile coverage threshold
        id: mobile_coverage_gate
        working-directory: ./mobile
        shell: bash
        env:
          MOBILE_COVERAGE_MIN: ${{ vars.MOBILE_COVERAGE_MIN }}
        run: |
          set -euo pipefail
          threshold="${MOBILE_COVERAGE_MIN:-${DEFAULT_MOBILE_COVERAGE_MIN}}"
          if [[ ! -f coverage/lcov.info ]]; then
            echo "Missing coverage/lcov.info"
            exit 1
          fi

          read -r covered total percent <<< "$(awk '
            BEGIN { lh = 0; lf = 0 }
            /^LH:/ { lh += substr($0, 4) }
            /^LF:/ { lf += substr($0, 4) }
            END {
              if (lf > 0) {
                printf "%d %d %.2f", lh, lf, (lh / lf) * 100;
              } else {
                printf "0 0 0.00";
              }
            }
          ' coverage/lcov.info)"

          cat > coverage/threshold.txt <<EOF
          Threshold: ${threshold}%
          Result: ${percent}% (${covered}/${total})
          EOF

          awk -v percent="${percent}" -v threshold="${threshold}" 'BEGIN { exit ((percent + 0) < (threshold + 0)) ? 1 : 0 }'

      - name: Build Android smoke artifact
        id: mobile_smoke_build
        working-directory: ./mobile
        run: flutter build apk --debug --dart-define=API_BASE_URL=https://gestionemployerbackend.onrender.com/api/v1

      - name: Build mobile quality summary
        if: always()
        working-directory: ./mobile
        shell: bash
        env:
          MOBILE_COVERAGE_MIN: ${{ vars.MOBILE_COVERAGE_MIN }}
        run: |
          set -euo pipefail
          threshold="${MOBILE_COVERAGE_MIN:-${DEFAULT_MOBILE_COVERAGE_MIN}}"
          summary_file="quality-summary.md"
          {
            echo "- Workspace detected: true"
            echo "- Mobile changes detected: true"
            echo "- Format: ${{ steps.mobile_format.outcome }}"
            echo "- Analyze: ${{ steps.mobile_analyze.outcome }}"
            echo "- Tests: ${{ steps.mobile_tests.outcome }}"
            echo "- Coverage gate: ${{ steps.mobile_coverage_gate.outcome }}"
            echo "- Coverage threshold: ${threshold}%"
            if [[ -f coverage/summary.txt ]]; then
              echo "- $(cat coverage/summary.txt)"
            else
              echo "- Mobile line coverage: unavailable"
            fi
            echo "- Smoke build: ${{ steps.mobile_smoke_build.outcome }}"
          } > "${summary_file}"

      - name: Upload mobile quality summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-quality-summary
          path: mobile/quality-summary.md
          if-no-files-found: error

      - name: Upload mobile test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-reports
          path: |
            mobile/coverage/lcov.info
            mobile/coverage/summary.txt
            mobile/coverage/threshold.txt
            mobile/test-results.json
            mobile/quality-summary.md
            mobile/test/**/*
          if-no-files-found: ignore

      - name: Fail mobile job if analyze failed
        if: steps.mobile_analyze.outcome == 'failure'
        run: |
          echo "Flutter analyze failed."
          exit 1

      - name: Fail mobile job if tests failed
        if: steps.mobile_tests.outcome == 'failure'
        run: |
          echo "Flutter tests failed."
          exit 1

      - name: Fail mobile job if coverage gate failed
        if: steps.mobile_coverage_gate.outcome == 'failure'
        run: |
          echo "Mobile coverage threshold not met."
          exit 1

      - name: Fail mobile job if smoke build failed
        if: steps.mobile_smoke_build.outcome == 'failure'
        run: |
          echo "Android smoke build failed."
          exit 1

  governance-gates:
    name: Governance Gates (changelog + canonical files)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate governance and changelog
        run: pwsh tools/check-governance.ps1 -BaseRef ${{ github.event.pull_request.base.sha }} -HeadRef ${{ github.event.pull_request.head.sha }}

  dependency-review:
    name: Dependency Review (PR Security)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Review dependency changes
        id: dependency_review
        continue-on-error: true
        uses: actions/dependency-review-action@v4

      - name: Note dependency review unavailability
        if: steps.dependency_review.outcome == 'failure'
        run: |
          echo "Dependency review unavailable on this repository. Enable GitHub Dependency Graph/security analysis to enforce this gate."

  notify:
    name: Notify Result
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - backend-tests
      - backend-security
      - backend-quality
      - backend-coverage
      - mobile-tests
      - governance-gates
      - dependency-review
    if: always()
    env:
      CI_SMTP_SERVER: ${{ secrets.CI_SMTP_SERVER }}
      CI_SMTP_USERNAME: ${{ secrets.CI_SMTP_USERNAME }}
      CI_SMTP_PASSWORD: ${{ secrets.CI_SMTP_PASSWORD }}
      CI_REPORT_TO: ${{ vars.CI_REPORT_TO }}
      CI_REPORT_FROM: ${{ vars.CI_REPORT_FROM }}

    steps:
      - name: Download backend quality summary
        if: always() && !contains(fromJson('["cancelled","timed_out","skipped"]'), needs.backend-quality.result)
        uses: actions/download-artifact@v4
        with:
          name: backend-quality-summary
          path: artifacts/backend-quality-summary

      - name: Download backend coverage summary
        if: always() && !contains(fromJson('["cancelled","timed_out","skipped"]'), needs.backend-coverage.result)
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage-summary
          path: artifacts/backend-coverage-summary

      - name: Download mobile quality summary
        if: always() && !contains(fromJson('["cancelled","timed_out","skipped"]'), needs.mobile-tests.result)
        uses: actions/download-artifact@v4
        with:
          name: mobile-quality-summary
          path: artifacts/mobile-quality-summary

      - name: Build CI report
        id: report
        shell: bash
        run: |
          set -euo pipefail
          BACKEND_SUMMARY="artifacts/backend-quality-summary/backend-quality-summary.md"
          BACKEND_COVERAGE_SUMMARY="artifacts/backend-coverage-summary/backend-coverage-summary.md"
          MOBILE_SUMMARY="artifacts/mobile-quality-summary/quality-summary.md"
          cat > ci-report.md <<EOF
          # CI Report — Leopardo RH

          - Workflow: ${{ github.workflow }}
          - Run ID: ${{ github.run_id }}
          - Run Number: ${{ github.run_number }}
          - Branch/Ref: ${{ github.ref }}
          - Commit: ${{ github.sha }}
          - Actor: ${{ github.actor }}
          - URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ## Job Results
          - Backend Tests: ${{ needs.backend-tests.result }}
          - Backend Security: ${{ needs.backend-security.result }}
          - Backend Quality: ${{ needs.backend-quality.result }}
          - Backend Coverage: ${{ needs.backend-coverage.result }}
          - Mobile Tests: ${{ needs.mobile-tests.result }}
          - Governance Gates: ${{ needs.governance-gates.result }}
          - Dependency Review: ${{ needs.dependency-review.result }}

          ## Scenario References
          - Test registry: docs/GESTION_PROJET/REGISTRE_SCENARIOS_TESTS.md
          - Backend API scenarios: docs/GESTION_PROJET/SCENARIOS_TEST_API_GITHUB_ACTIONS.md
          - Mobile Flutter scenarios: docs/GESTION_PROJET/SCENARIOS_TEST_MOBILE_FLUTTER.md
          - Web admin scenarios: docs/GESTION_PROJET/SCENARIOS_TEST_WEB_ADMIN_GITHUB_ACTIONS.md
          - Backend quality artifacts: backend-quality-reports
          - Backend quality summary artifact: backend-quality-summary
          - Backend coverage artifacts: backend-coverage-reports
          - Backend coverage summary artifact: backend-coverage-summary
          - Mobile quality artifacts: mobile-test-reports
          - Mobile quality summary artifact: mobile-quality-summary

          ## Backend Coverage Intent
          - Unit: services et logique metier pure
          - Feature: auth, auth guardrails, RBAC, multitenant, attendance, estimation, health, contrats JSON mobile
          - Gate strategy: visible immediately, threshold progressive via BACKEND_COVERAGE_MIN

          ## Quality Notes
          - PHP static analysis: PHPStan + Larastan with versioned baseline support
          - Backend coverage: clover + HTML artifact + threshold summary
          - Mobile tests: machine-readable output + coverage summary artifact
          - Deploy policy: main deploy is allowed only after the required workflows for the same SHA conclude successfully
          EOF

          if [[ -f "${BACKEND_SUMMARY}" ]]; then
            {
              echo
              echo "## Backend Quality Summary"
              cat "${BACKEND_SUMMARY}"
            } >> ci-report.md
          fi

          if [[ -f "${BACKEND_COVERAGE_SUMMARY}" ]]; then
            {
              echo
              echo "## Backend Coverage Summary"
              cat "${BACKEND_COVERAGE_SUMMARY}"
            } >> ci-report.md
          fi

          if [[ -f "${MOBILE_SUMMARY}" ]]; then
            {
              echo
              echo "## Mobile Quality Summary"
              cat "${MOBILE_SUMMARY}"
            } >> ci-report.md
          fi

          cat ci-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CI report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report
          path: ci-report.md
          if-no-files-found: error

      - name: Send CI report email (if SMTP configured)
        if: always() && env.CI_SMTP_SERVER != '' && env.CI_SMTP_USERNAME != '' && env.CI_SMTP_PASSWORD != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.CI_SMTP_SERVER }}
          server_port: 587
          username: ${{ env.CI_SMTP_USERNAME }}
          password: ${{ env.CI_SMTP_PASSWORD }}
          secure: false
          subject: "Leopardo RH CI Report — Run #${{ github.run_number }}"
          to: ${{ env.CI_REPORT_TO != '' && env.CI_REPORT_TO || 'nouractu.com@gmail.com' }}
          from: ${{ env.CI_REPORT_FROM != '' && env.CI_REPORT_FROM || env.CI_SMTP_USERNAME }}
          body: file://ci-report.md

      - name: All checks passed
        if: |
          (needs.backend-tests.result == 'success' || needs.backend-tests.result == 'skipped') &&
          (needs.backend-security.result == 'success' || needs.backend-security.result == 'skipped') &&
          (needs.backend-quality.result == 'success' || needs.backend-quality.result == 'skipped') &&
          (needs.backend-coverage.result == 'success' || needs.backend-coverage.result == 'skipped') &&
          (needs.mobile-tests.result == 'success' || needs.mobile-tests.result == 'skipped') &&
          (needs.governance-gates.result == 'success' || needs.governance-gates.result == 'skipped') &&
          (needs.dependency-review.result == 'success' || needs.dependency-review.result == 'skipped')
        run: echo "All checks passed - PR can be merged or main can be deployed"

      - name: Checks failed
        if: |
          contains(fromJson('["failure","cancelled","timed_out"]'), needs.backend-tests.result) ||
          contains(fromJson('["failure","cancelled","timed_out"]'), needs.backend-security.result) ||
          contains(fromJson('["failure","cancelled","timed_out"]'), needs.backend-quality.result) ||
          contains(fromJson('["failure","cancelled","timed_out"]'), needs.backend-coverage.result) ||
          contains(fromJson('["failure","cancelled","timed_out"]'), needs.mobile-tests.result) ||
          contains(fromJson('["failure","cancelled","timed_out"]'), needs.governance-gates.result) ||
          contains(fromJson('["failure","cancelled","timed_out"]'), needs.dependency-review.result)
        run: |
          echo "Checks failed - merge or deployment blocked"
          exit 1
