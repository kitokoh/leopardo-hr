name: Fix — Regenerate composer.lock

# Généralisé depuis un hack one-off (branche aléatoire
# feat/growth-module-6687823184469251636, issue #1500) vers un outil manuel
# documenté : utilisé pour régénérer composer.lock lors d'advisories de
# sécurité (ex. guzzle/phpseclib, #1463). À lancer via workflow_dispatch.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: fix-composer-lock-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regen-lock:
    name: composer update predis → commit lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, pdo_sqlite, sqlite3, bcmath, mbstring, xml, zip, gd
          tools: composer:v2

      - name: Regenerate lock for security dependencies
        working-directory: ./api
        run: |
          composer update guzzlehttp/psr7 phpseclib/phpseclib guzzlehttp/guzzle --no-interaction --prefer-dist

      - name: Commit updated composer.lock
        run: |
          git config user.email "bot@kiloclaw.ai"
          git config user.name "KiloClaw [bot]"
          git add api/composer.json api/composer.lock
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "fix(ci): regenerate composer.lock for security dependencies [skip ci]"
            git push
          fi
