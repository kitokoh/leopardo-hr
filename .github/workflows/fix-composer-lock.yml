name: Fix — Regenerate composer.lock

# Généralisé depuis un hack one-off (branche aléatoire
# feat/growth-module-6687823184469251636, issue #1500) vers un outil manuel
# documenté : utilisé pour régénérer composer.lock lors d'advisories de
# sécurité (ex. guzzle/phpseclib, #1463). À lancer via workflow_dispatch.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: fix-composer-lock-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  regen-lock:
    timeout-minutes: 30
    name: composer update predis → commit lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, pdo_sqlite, sqlite3, bcmath, mbstring, xml, zip, gd
          tools: composer:v2

      - name: Regenerate lock for security dependencies
        working-directory: ./api
        run: |
          composer update guzzlehttp/psr7 phpseclib/phpseclib guzzlehttp/guzzle --no-interaction --prefer-dist

      - name: Open PR with updated composer.lock
        # Issue #3534 : plus de push direct sur la branche (bypass des 5 checks
        # requis + de l'historique de revue) — le workflow ouvre une PR.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "bot@kiloclaw.ai"
          git config user.name "KiloClaw [bot]"
          git add api/composer.json api/composer.lock
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          branch="chore/composer-lock-regen-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$branch"
          git commit -m "fix(ci): regenerate composer.lock for security dependencies"
          git push -u origin "$branch"
          gh pr create \
            --title "fix(ci): composer.lock régénéré (dépendances sécurité)" \
            --body "Régénéré par le workflow \`fix-composer-lock.yml\` (workflow_dispatch). Revue + checks requis avant merge — aucun push direct sur la branche protégée (issue #3534)." \
            --base "${{ github.ref_name }}" \
            --head "$branch"
