name: Mobile Apps CI - Flutter

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    # Issue #7541 (option 3) — le filtre `paths` existait en `push` mais PAS en
    # `pull_request` : la seule asymétrie du dépôt. Chaque PR docs/web/backend
    # enfilait donc quand même les jobs de ce workflow (dont `mobile-apps-guard`,
    # inconditionnel). Les `paths` ci-dessous sont le miroir EXACT de ceux de
    # `push` — ils contiennent tout ce qui peut modifier la chaîne mobile :
    # `front/mobile_apps/**`, les validateurs `dev-hub/tools/validate-mobile-*.ps1`,
    # les outils de garde, l'action composite partagée
    # `.github/actions/setup-flutter-android` (leçon #7519, qui a cassé la chaîne
    # sans qu'aucune PR ne le voie) et **le fichier de workflow lui-même** — sans
    # quoi ses propres jobs d'auto-validation (`validate-mobile-plan29.ps1` asserte
    # le contenu de son propre workflow) ne se re-déclencheraient plus.
    # La couverture structurelle est donc préservée à l'identique : ce qui change
    # est qu'une PR qui ne touche AUCUN de ces chemins n'occupe plus de runners
    # pour des jobs d'analyse (dorny/paths-filter continue par ailleurs de gater
    # les jobs lourds, cf. #6928).
    paths:
      - 'front/mobile_apps/**'
      - 'dev-hub/tools/validate-mobile-apps-split.ps1'
      - 'dev-hub/tools/validate-mobile-release-readiness.ps1'
      - 'dev-hub/tools/validate-mobile-runtime-smoke.ps1'
      - 'dev-hub/tools/validate-mobile-location-readiness.ps1'
      - 'dev-hub/tools/validate-mobile-tenant-branding.ps1'
      - 'dev-hub/tools/validate-mobile-notification-production-proof.ps1'
      - 'dev-hub/tools/validate-mobile-workflow-contracts.ps1'
      - 'dev-hub/tools/validate-mobile-plan28.ps1'
      - 'dev-hub/tools/validate-mobile-plan29.ps1'
      - 'dev-hub/tools/validate-mobile-color-tokens.ps1'
      - 'dev-hub/tools/check-mobile-number-locale.sh'
      - 'dev-hub/tools/check-mobile-l10n-sync.sh'
      - 'dev-hub/tools/check-mobile-manifest-routes.sh'
      - 'dev-hub/tools/mobile-workflow-contracts.json'
      - 'api/app/Modules/HR/Infrastructure/Services/MobileExperienceService.php'
      - '.github/workflows/mobile-apps-ci.yml'
      - '.github/actions/setup-flutter-android/action.yml'
      - 'dev-hub/tools/check-android-sdk-packages.sh'
  push:
    branches: [main]
    paths:
      - 'front/mobile_apps/**'
      - 'dev-hub/tools/validate-mobile-apps-split.ps1'
      - 'dev-hub/tools/validate-mobile-release-readiness.ps1'
      - 'dev-hub/tools/validate-mobile-runtime-smoke.ps1'
      - 'dev-hub/tools/validate-mobile-location-readiness.ps1'
      - 'dev-hub/tools/validate-mobile-tenant-branding.ps1'
      - 'dev-hub/tools/validate-mobile-notification-production-proof.ps1'
      - 'dev-hub/tools/validate-mobile-workflow-contracts.ps1'
      - 'dev-hub/tools/validate-mobile-plan28.ps1'
      - 'dev-hub/tools/validate-mobile-plan29.ps1'
      - 'dev-hub/tools/validate-mobile-color-tokens.ps1'
      - 'dev-hub/tools/check-mobile-number-locale.sh'
      - 'dev-hub/tools/check-mobile-l10n-sync.sh'
      - 'dev-hub/tools/check-mobile-manifest-routes.sh'
      - 'dev-hub/tools/mobile-workflow-contracts.json'
      - 'api/app/Modules/HR/Infrastructure/Services/MobileExperienceService.php'
      - '.github/workflows/mobile-apps-ci.yml'
      # Issue #7519 — l'action composite partagée par TOUS les jobs mobiles
      # doit re-déclencher la CI mobile quand elle change : c'est elle qui a
      # cassé la chaîne (paquet `tools` inexistant dans cmdline-tools 20.0)
      # sans qu'aucune PR ne le voie.
      - '.github/actions/setup-flutter-android/action.yml'
      - 'dev-hub/tools/check-android-sdk-packages.sh'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  API_BASE_URL: ${{ vars.DEV_API_BASE_URL }}

concurrency:
  group: mobile-apps-ci-${{ github.ref }}
  # Issue #2131 : sur main, ne jamais annuler le run du commit précédent
  # (builds Flutter longs relancés en cascade). Runs PR annulés.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # #5629 : annuler les runs PR obsolètes pour libérer les runners

jobs:
  changes:
    name: Detect mobile changes
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      # dorny/paths-filter exige un dépôt git cloné — sans checkout, le job
      # échouait sur chaque push main (git rev-parse: not a git repository).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            mobile:
              - 'front/mobile_apps/**'
              - 'api/app/Modules/HR/Infrastructure/Services/MobileExperienceService.php'
              - '.github/workflows/mobile-apps-ci.yml'
              # Issue #7519 — un changement de l'action de setup Android/Flutter
              # partagée doit lancer les jobs mobiles lourds (sinon le défaut
              # reste invisible jusqu'à la distribution Firebase sur main).
              - '.github/actions/setup-flutter-android/action.yml'
              - 'dev-hub/tools/check-android-sdk-packages.sh'

  mobile-apps-guard:
    timeout-minutes: 90
    name: Mobile apps split guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false
          fetch-depth: 0

      - name: Guard DEV_API_BASE_URL (#4524)
        shell: bash
        run: |
          if [[ -z "${{ vars.DEV_API_BASE_URL }}" ]]; then
            echo "::error::DEV_API_BASE_URL must be set (fail-open fallback removed, issue #4524)."
            exit 1
          fi
          echo "DEV_API_BASE_URL=${{ vars.DEV_API_BASE_URL }}"

      - name: Validate mobile apps boundaries
        shell: pwsh
        run: '& ./dev-hub/tools/validate-mobile-apps-split.ps1'

      - name: Validate mobile app product identity (#9110)
        # Une app scaffoldée par copie garde l'identité de l'app d'origine :
        # manifeste web, index.html, Info.plist et AndroidManifest nomment une
        # AUTRE app. C'est ce qui est arrivé à `leopardo_public`, qui se
        # présentait comme le produit RH. Le garde fige la dette existante
        # (baseline) et refuse toute NOUVELLE identité empruntée.
        shell: bash
        run: 'bash ./dev-hub/tools/check-mobile-app-identity.sh'

      - name: Validate mobile stock web/mobile parity (#9275)
        # Règle produit : le mobile reste une OPTION. Tout endpoint de stock
        # appelé par un écran mobile doit avoir une surface web documentée
        # dans docs/mobile/STOCK_MOBILE.md.
        shell: bash
        run: 'bash ./dev-hub/tools/check-mobile-stock-parity.sh'

      - name: Validate mobile release readiness
        shell: pwsh
        run: '& ./dev-hub/tools/validate-mobile-release-readiness.ps1'

      - name: Validate mobile runtime smoke
        shell: pwsh
        run: '& ./dev-hub/tools/validate-mobile-runtime-smoke.ps1'

      - name: Validate mobile location readiness
        shell: pwsh
        run: '& ./dev-hub/tools/validate-mobile-location-readiness.ps1'

      - name: Validate mobile tenant branding
        shell: pwsh
        run: '& ./dev-hub/tools/validate-mobile-tenant-branding.ps1'

      - name: Validate mobile notification production proof
        shell: pwsh
        run: '& ./dev-hub/tools/validate-mobile-notification-production-proof.ps1'

      - name: Validate mobile workflow contracts
        shell: pwsh
        run: '& ./dev-hub/tools/validate-mobile-workflow-contracts.ps1'

      - name: Validate Plan 28 multi-app excellence
        shell: pwsh
        run: '& ./dev-hub/tools/validate-mobile-plan28.ps1'

      - name: Validate Plan 29 platform admin app
        shell: pwsh
        run: '& ./dev-hub/tools/validate-mobile-plan29.ps1'

      - name: Validate mobile color tokens (no hardcoded hex outside AppColors)
        shell: pwsh
        run: '& ./dev-hub/tools/validate-mobile-color-tokens.ps1'

      - name: Validate manifest routes exist in app GoRouter routers
        # #2212 : chaque route servie par MobileExperienceService doit exister
        # dans le routeur GoRouter de l'app cible, sinon context.push() crashe.
        shell: bash
        run: 'bash ./dev-hub/tools/check-mobile-manifest-routes.sh'

      - name: Validate no hardcoded FR number formats (locale-aware)
        # #4197 : NumberFormat.decimalPattern('fr') / deviceIntlDateLocale
        # sur des montants = locale forcée FR pour les utilisateurs AR/TR/EN.
        shell: bash
        run: 'bash ./dev-hub/tools/check-mobile-number-locale.sh'

      # Note #6590 : le check l10n (check-mobile-l10n-sync.sh) a été déplacé
      # dans le job flutter-analyze, APRÈS `flutter gen-l10n` : les fichiers
      # générés (lib/l10n/generated/*) ne sont plus commités, ils n'existent
      # donc pas dans le checkout brut où tourne ce job guard.

      - name: Validate no mojibake drift on duplicated mobile files (#7091)
        # RETEX L-09/L-07 : correctifs d'encodage répétés sur des fichiers
        # byte-identiques dupliqués entre employee/manager/hr (chantier #2661)
        # — un fix appliqué à une seule copie laisse le mojibake chez les
        # sœurs. Détecte les copies divergentes sur le diff de la PR.
        #
        # #7198 : hors `pull_request` et hors `push`, `github.event.before`
        # n'existe pas (workflow_dispatch, relance manuelle des builds Flutter
        # après une saturation de runners). Le garde, lui, exige 2 SHA et sort
        # en `exit 1` avec « Usage: » — il rougissait donc `main` à chaque
        # relance manuelle (constaté sur le run 34517288447, job 103015978924).
        # Même repli que l'étape « Identify changed Dart files » ci-dessous :
        # base absente ou tout-à-zéro → `HEAD^` (checkout en fetch-depth: 0).
        shell: bash
        env:
          DIFF_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base="${DIFF_BASE_SHA:-}"
          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            base="$(git rev-parse HEAD^)"
            echo "::notice::DIFF_BASE_SHA absent (event=${{ github.event_name }}) — repli sur HEAD^ (${base})."
          fi
          bash ./dev-hub/tools/check-mobile-duplicated-drift.sh "$base" "${DIFF_HEAD_SHA:-$(git rev-parse HEAD)}"

  flutter-analyze:
    timeout-minutes: 90
    name: Analyze ${{ matrix.project.name }}
    runs-on: ubuntu-latest
    needs: [changes, mobile-apps-guard]
    # #6928 / saturation CI (2026-09-08) : la matrice 8× Flutter (pub get +
    # analyze + gate Dart incrémental, ~5-15 min/app) ne tourne QUE si les
    # apps mobiles (ou le workflow lui-même) ont changé. Vérifié 2026-09-08 :
    # ces checks ne sont PAS dans les contexts requis de la protection main
    # (seuls PHPStan Strict, Module Validator, ESLint+TS, actionlint le sont)
    # → un skip est sans effet sur la mergeabilité. Le `mobile-apps-guard`
    # (validations structurelles légères) reste inconditionnel.
    if: needs.changes.outputs.mobile == 'true'
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: leopardo_accounting
            path: front/mobile_apps/leopardo_accounting
          - name: leopardo_core
            path: front/mobile_apps/leopardo_core
          - name: leopardo_employee
            path: front/mobile_apps/leopardo_employee
          - name: leopardo_manager
            path: front/mobile_apps/leopardo_manager
          - name: leopardo_hr
            path: front/mobile_apps/leopardo_hr
          - name: leopardo_platform_admin
            path: front/mobile_apps/leopardo_platform_admin
          - name: leopardo_marketing
            path: front/mobile_apps/leopardo_marketing
          - name: leopardo_travel_agent
            path: front/mobile_apps/leopardo_travel_agent
          - name: leopardo_cameras
            path: front/mobile_apps/leopardo_cameras
          # COULOIR 16 — surface publique. Sans cette ligne, « CI verte »
          # serait vrai tout en ne testant PAS la nouvelle app : analyze et
          # test ne tourneraient jamais dessus. Même patron que les autres.
          - name: leopardo_public
            path: front/mobile_apps/leopardo_public
          # Caisses tablette POS (#9271) : livrees en #9214/#9215 mais absentes
          # de la matrice — une regression de compilation y passait au vert.
          - name: leopardo_pos_retail
            path: front/mobile_apps/leopardo_pos_retail
          - name: leopardo_pos_restaurant
            path: front/mobile_apps/leopardo_pos_restaurant
          # Applications grand public DÉDIÉES, une par verticale. Elles ne
          # portent aucune logique métier : le moteur vit dans
          # `leopardo_surface`, partagé. Ce qui est propre à chacune tient en
          # `main.dart`, `app_router.dart` et son identité produit — donc une
          # régression y est silencieuse sans cette matrice.
          - name: leopardo_restaurant_app
            path: front/mobile_apps/leopardo_restaurant_app
          - name: leopardo_retail_app
            path: front/mobile_apps/leopardo_retail_app
          - name: leopardo_hospitality_app
            path: front/mobile_apps/leopardo_hospitality_app
          - name: leopardo_trade_app
            path: front/mobile_apps/leopardo_trade_app
          - name: leopardo_travel_app
            path: front/mobile_apps/leopardo_travel_app
          - name: leopardo_pharmacy_app
            path: front/mobile_apps/leopardo_pharmacy_app
          - name: leopardo_mobility_app
            path: front/mobile_apps/leopardo_mobility_app
          - name: leopardo_careers_app
            path: front/mobile_apps/leopardo_careers_app
          # Le MOTEUR partagé : sans lui dans la matrice, une régression du
          # socle ne serait vue que par ricochet, via les apps.
          - name: leopardo_surface
            path: front/mobile_apps/leopardo_surface

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false

      - name: Setup Flutter + Java
        uses: ./.github/actions/setup-flutter-android

      - name: Install dependencies
        working-directory: ${{ matrix.project.path }}
        run: flutter pub get

      - name: Regenerate shared localizations
        # #4762 : les apps consomment AppLocalizations depuis le package core.
        # Régénérer avec la version Flutter de CI évite une interface générée
        # obsolète après pub get ou restauration de cache.
        working-directory: front/mobile_apps/leopardo_core
        run: flutter gen-l10n

      - name: Regenerate codegen (build_runner — drift / json_serializable)
        # #6590 : les *.g.dart (drift `edge_database`, json_serializable
        # `*_schema.g.dart`, `feature*.g.dart`) ne sont PLUS commités (cf.
        # .gitignore) — ils sont régénérés ici avant analyze/test. Le pub get
        # local du package core est requis pour résoudre ses dev_dependencies
        # (build_runner, drift_dev, json_serializable) dans ce job.
        working-directory: front/mobile_apps/leopardo_core
        run: |
          flutter pub get
          dart run build_runner build

      - name: Validate ARB keys exist in generated localizations
        # #4762 (récurrence) : toute clé ARB absente des générés casse la
        # compile des apps qui la référencent. #6590 : exécuté APRÈS
        # `flutter gen-l10n` (les générés ne sont plus commités) — une seule
        # exécution suffit (package core), d'où la condition sur le projet.
        if: matrix.project.name == 'leopardo_core'
        shell: bash
        run: 'bash ./dev-hub/tools/check-mobile-l10n-sync.sh'

      - name: Fetch diff base for incremental Dart gate
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n "${BASE_SHA}" && "${BASE_SHA}" != "0000000000000000000000000000000000000000" ]] && ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          fi

      - name: Identify changed Dart files
        id: changed-dart
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n "${BASE_SHA}" && "${BASE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            git diff -z --diff-filter=ACMR --name-only "${BASE_SHA}" HEAD -- '*.dart' > /tmp/changed-dart-files
          else
            git diff -z --diff-filter=ACMR --name-only HEAD^ HEAD -- '*.dart' > /tmp/changed-dart-files
          fi
          project_prefix="${{ matrix.project.path }}/"
          : > /tmp/changed-dart-files-relative
          while IFS= read -r -d '' file; do
            if [[ "${file}" == "${project_prefix}"* ]]; then
              printf '%s\0' "${file#"$project_prefix"}" >> /tmp/changed-dart-files-relative
            fi
          done < /tmp/changed-dart-files
          if [[ -s /tmp/changed-dart-files-relative ]]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            echo "Dart files changed in this project:"
            tr '\0' '\n' < /tmp/changed-dart-files-relative
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "No Dart files changed in this project."
          fi

      - name: Check formatting of changed Dart files
        if: steps.changed-dart.outputs.changed == 'true'
        working-directory: ${{ matrix.project.path }}
        shell: bash
        run: |
          xargs -r -0 dart format --set-exit-if-changed < /tmp/changed-dart-files-relative || {
            echo "::error::dart format mismatch detected. Diff below:"
            git --no-pager diff
            exit 1
          }

      # #9433 : migration `package:flutter/material.dart` → `material_ui` terminée.
      # Le flag `--no-fatal-infos` (baseline #9432) est retiré : `flutter analyze`
      # strict (erreurs + warnings + infos fatals) — toute régression est rouge.
      - name: Run flutter analyze
        working-directory: ${{ matrix.project.path }}
        run: flutter analyze

      # #3822 : chaque app livrée exécute ses tests en CI. Avant, seuls
      # leopardo_core et leopardo_employee lançaient `flutter test` — les
      # 43 fichiers de test de HR (21), Manager (21) et Platform Admin (1)
      # ne tournaient jamais, et une régression de compile (#3952) passait
      # inaperçue. Marketing n'a pas encore de dossier test/ (socle smoke en
      # follow-up) : l'étape est sautée proprement avec un warning.
      - name: Run app test suite
        working-directory: ${{ matrix.project.path }}
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "::warning::Pas de dossier test/ — aucune suite à exécuter pour ${{ matrix.project.name }} (voir #3822)."
          fi

  flutter-build-debug:
    needs: [changes, flutter-analyze]
    if: needs.changes.outputs.mobile == 'true'
    timeout-minutes: 90
    name: Build Debug ${{ matrix.project.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: leopardo_employee
            path: front/mobile_apps/leopardo_employee
            artifact: leopardo-employee-debug-apk
          - name: leopardo_manager
            path: front/mobile_apps/leopardo_manager
            artifact: leopardo-manager-debug-apk
          - name: leopardo_hr
            path: front/mobile_apps/leopardo_hr
            artifact: leopardo-hr-debug-apk
          - name: leopardo_platform_admin
            path: front/mobile_apps/leopardo_platform_admin
            artifact: leopardo-platform-admin-debug-apk
          - name: leopardo_marketing
            path: front/mobile_apps/leopardo_marketing
            artifact: leopardo-marketing-debug-apk
          - name: leopardo_accounting
            path: front/mobile_apps/leopardo_accounting
            artifact: leopardo-accounting-debug-apk
          - name: leopardo_travel_agent
            path: front/mobile_apps/leopardo_travel_agent
            artifact: leopardo-travel-agent-debug-apk
          - name: leopardo_cameras
            path: front/mobile_apps/leopardo_cameras
            artifact: leopardo-cameras-debug-apk
          - name: leopardo_public
            path: front/mobile_apps/leopardo_public
            artifact: leopardo-public-debug-apk
          # Caisses tablette POS (#9271).
          - name: leopardo_pos_retail
            path: front/mobile_apps/leopardo_pos_retail
            artifact: leopardo-pos-retail-debug-apk
          - name: leopardo_pos_restaurant
            path: front/mobile_apps/leopardo_pos_restaurant
            artifact: leopardo-pos-restaurant-debug-apk
          # Applications grand public dédiées (une par verticale).
          - name: leopardo_restaurant_app
            path: front/mobile_apps/leopardo_restaurant_app
            artifact: leopardo-restaurant-debug-apk
          - name: leopardo_retail_app
            path: front/mobile_apps/leopardo_retail_app
            artifact: leopardo-retail-debug-apk
          - name: leopardo_hospitality_app
            path: front/mobile_apps/leopardo_hospitality_app
            artifact: leopardo-hospitality-debug-apk
          - name: leopardo_trade_app
            path: front/mobile_apps/leopardo_trade_app
            artifact: leopardo-trade-debug-apk
          - name: leopardo_travel_app
            path: front/mobile_apps/leopardo_travel_app
            artifact: leopardo-travel-debug-apk
          - name: leopardo_pharmacy_app
            path: front/mobile_apps/leopardo_pharmacy_app
            artifact: leopardo-pharmacy-debug-apk
          - name: leopardo_mobility_app
            path: front/mobile_apps/leopardo_mobility_app
            artifact: leopardo-mobility-debug-apk
          - name: leopardo_careers_app
            path: front/mobile_apps/leopardo_careers_app
            artifact: leopardo-careers-debug-apk

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false

      - name: Setup Flutter + Java
        uses: ./.github/actions/setup-flutter-android

      - name: Install dependencies
        working-directory: ${{ matrix.project.path }}
        run: flutter pub get

      - name: Regenerate core generated files (l10n + codegen)
        # #6590 : fichiers générés non commités — régénérés avant le build
        # debug (compile le package core : AppLocalizations + *.g.dart).
        working-directory: front/mobile_apps/leopardo_core
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build

      - name: Restore Firebase config from secret (issue #1467)
        # google-services.json n'est PLUS committé (clé API réelle exposée) :
        # un stub à clés factices est versionné pour les builds locaux/forks ;
        # le fichier réel est restauré depuis le secret GOOGLE_SERVICES_JSON.
        shell: bash
        run: |
          if [[ -n "${GOOGLE_SERVICES_JSON}" ]]; then
            for target in front/mobile_apps/leopardo_employee front/mobile_apps/leopardo_hr front/mobile_apps/leopardo_manager front/mobile_apps/leopardo_platform_admin; do
              printf '%s' "${GOOGLE_SERVICES_JSON}" > "${target}/android/app/google-services.json"
            done
            echo "Firebase config restaurée depuis le secret."
          else
            echo "::warning::GOOGLE_SERVICES_JSON non défini — build avec le stub (clés factices)."
          fi
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Build debug APK
        working-directory: ${{ matrix.project.path }}
        run: flutter build apk --debug --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.project.artifact }}
          path: ${{ matrix.project.path }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Cible WEB grand public — l'app multi-verticales ET les huit apps dédiées.
  #
  # `flutter build web` est le SEUL contrôle qui prouve que la cible web existe.
  # `flutter test` tourne sur la VM Dart et ne compile jamais en JavaScript —
  # une dépendance non web-compatible (dart:io, dart:ffi) ne se voit qu'ici.
  # Le job est volontairement séparé de `flutter-build-debug` (APK) : la cible
  # web n'a besoin ni du SDK Android ni de Java, et payer ~10 min de setup
  # Android par build web serait du gaspillage pur.
  #
  # ## Pourquoi une matrice et pas neuf jobs
  #
  # Les neuf cibles partagent exactement la même chaîne (pub get, gen-l10n,
  # build, vérification d'artefact). Neuf jobs copiés seraient neuf endroits où
  # oublier une correction — et le budget CI du dépôt est gelé à 89 workflows
  # (#9979), donc un fichier par app est exclu. La matrice donne neuf cibles
  # pour un seul job.
  #
  # ## Pourquoi chaque app dédiée est vérifiée séparément
  #
  # Une app dédiée ne porte que son identité, son routeur et son `main.dart`.
  # Une erreur de compilation y est donc invisible depuis les autres : c'est
  # précisément ce que la matrice attrape.
  # ---------------------------------------------------------------------------
  flutter-build-web:
    needs: [changes, flutter-analyze]
    if: needs.changes.outputs.mobile == 'true'
    timeout-minutes: 30
    name: Build web (${{ matrix.project.name }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project:
          # L'app multi-verticales : elle sert les huit verticales à la fois.
          - name: leopardo_public
            path: front/mobile_apps/leopardo_public
            artifact: leopardo-public-web
            # Le bootstrap de cette app couvre QUATRE verticales ; les apps
            # dédiées n'en couvrent qu'une. La vérification d'artefact doit
            # donc savoir laquelle des deux formes attendre.
            multi_vertical: 'true'
          - name: leopardo_restaurant_app
            path: front/mobile_apps/leopardo_restaurant_app
            artifact: leopardo-restaurant-web
            multi_vertical: 'false'
          - name: leopardo_retail_app
            path: front/mobile_apps/leopardo_retail_app
            artifact: leopardo-retail-web
            multi_vertical: 'false'
          - name: leopardo_hospitality_app
            path: front/mobile_apps/leopardo_hospitality_app
            artifact: leopardo-hospitality-web
            multi_vertical: 'false'
          - name: leopardo_trade_app
            path: front/mobile_apps/leopardo_trade_app
            artifact: leopardo-trade-web
            multi_vertical: 'false'
          - name: leopardo_travel_app
            path: front/mobile_apps/leopardo_travel_app
            artifact: leopardo-travel-web
            multi_vertical: 'false'
          - name: leopardo_pharmacy_app
            path: front/mobile_apps/leopardo_pharmacy_app
            artifact: leopardo-pharmacy-web
            multi_vertical: 'false'
          - name: leopardo_mobility_app
            path: front/mobile_apps/leopardo_mobility_app
            artifact: leopardo-mobility-web
            multi_vertical: 'false'
          - name: leopardo_careers_app
            path: front/mobile_apps/leopardo_careers_app
            artifact: leopardo-careers-web
            multi_vertical: 'false'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - name: Install dependencies
        working-directory: ${{ matrix.project.path }}
        run: flutter pub get

      - name: Regenerate shared localizations
        # #6590 : les fichiers générés (lib/l10n/generated/*) ne sont plus
        # commités — sans cette étape, `AppLocalizations` est introuvable et le
        # build web échoue sur `leopardo_core/lib/l10n/l10n.dart`.
        working-directory: front/mobile_apps/leopardo_core
        run: flutter gen-l10n

      - name: Build web (release)
        working-directory: ${{ matrix.project.path }}
        run: |
          # `--no-wasm-dry-run` : le dry-run wasm est un contrôle OPTIONNEL que
          # Flutter exécute en plus de dart2js. Sur les SDK récents il échoue
          # (`Unexpected wasm dry run failure`) et fait échouer tout le build
          # alors que la compilation dart2js, elle, réussit. Le drapeau ne
          # change PAS l'artefact produit : il retire un contrôle dont l'échec
          # n'est pas un échec de compilation.
          flutter build web --release \
            --base-href=/ \
            --pwa-strategy=none \
            --no-wasm-dry-run \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}

      # Vérifie que les marqueurs de la cible web sont bien dans l'artefact :
      # un `index.html` resté au placeholder Flutter, ou un `main.dart.js`
      # absent, signifierait que le build n'a pas produit ce qu'on croit.
      - name: Vérifier l'artefact web
        working-directory: ${{ matrix.project.path }}
        env:
          MULTI_VERTICAL: ${{ matrix.project.multi_vertical }}
        run: |
          set -euo pipefail

          test -f build/web/index.html || { echo "::error::build/web/index.html absent"; exit 1; }
          test -f build/web/main.dart.js || { echo "::error::build/web/main.dart.js absent"; exit 1; }
          test -f build/web/vertical_web_bootstrap.js || { echo "::error::vertical_web_bootstrap.js absent"; exit 1; }

          grep -q 'og:title' build/web/index.html || { echo "::error::balises Open Graph absentes de index.html"; exit 1; }
          grep -q 'vertical_web_bootstrap.js' build/web/index.html || { echo "::error::bootstrap verticales non référencé"; exit 1; }

          if [ "$MULTI_VERTICAL" = "true" ]; then
            # L'app multi-verticales doit couvrir les quatre verticales de sa
            # table : une verticale oubliée ne produit aucune erreur à
            # l'exécution, elle rend juste un titre générique.
            for prefix in '/restaurants/' '/boutiques/' '/stay/' '/billets/'; do
              grep -q "prefix: '$prefix'" build/web/vertical_web_bootstrap.js \
                || { echo "::error::verticale $prefix absente du bootstrap"; exit 1; }
            done
          else
            # Une app dédiée ne sert qu'UNE verticale : son bootstrap doit
            # porter exactement un préfixe. Zéro signifierait que le fichier a
            # été copié sans être réécrit ; plus d'un, que l'app prétend servir
            # des verticales qu'elle n'assemble pas.
            count=$(grep -c "prefix: '" build/web/vertical_web_bootstrap.js || true)
            if [ "$count" -ne 1 ]; then
              echo "::error::le bootstrap d'une app dédiée doit porter exactement 1 verticale (trouvé: $count)"
              exit 1
            fi
          fi

          # Le placeholder Flutter ne doit plus être le titre de la page.
          if grep -q 'A new Flutter project' build/web/index.html; then
            echo "::error::index.html porte encore le placeholder Flutter"
            exit 1
          fi

          echo "✅ Artefact web conforme (${{ matrix.project.name }})"

      - name: Publier l'artefact web
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.project.artifact }}
          path: ${{ matrix.project.path }}/build/web
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Tests E2E Maestro — parcours commande restaurant (#9996)
  #
  # ## Pourquoi ce job vit ICI et pas dans un fichier à lui
  #
  # Le budget CI du dépôt est gelé à 89 workflows (#9979) : un fichier de plus
  # le dépasserait et `check-ci-workflow-budget.py` échouerait. Ce job rejoint
  # donc la chaîne mobile existante, qui couvre déjà `leopardo_public` en
  # analyze, test et build web — Maestro est le maillon « app réellement
  # installée » de la même chaîne.
  #
  # ## Pourquoi il n'est PAS un check requis
  #
  # Un émulateur Android met 3 à 6 minutes à démarrer et le parcours dépend
  # d'un backend de démonstration joignable. En faire un check requis
  # bloquerait toutes les PR sur une infrastructure instable — exactement
  # l'incident que #9979 documente (checks requis ABSENTS, aucune PR
  # mergeable). Il tourne donc en information, et un échec se lit dans l'onglet
  # Actions sans bloquer le merge.
  #
  # ## Ce qu'il prouve que `flutter test` ne prouve pas
  #
  # Les tests widget simulent le serveur et ne voient ni le clavier logiciel ni
  # le défilement réel. Ce job installe l'APK sur un émulateur et pilote
  # l'app comme un client : c'est le seul contrôle qui attrape « le bouton de
  # validation est masqué par le clavier ».
  # ---------------------------------------------------------------------------
  maestro-restaurant-e2e:
    needs: [changes, flutter-analyze]
    # Deux conditions, et chacune a une raison precise :
    #
    # 1. `mobile == 'true'` : inutile de demarrer un emulateur pour une PR qui
    #    ne touche que le backend.
    # 2. `E2E_API_BASE_URL != ''` : les flows pilotent l'app CONTRE UN SERVEUR.
    #    Sans backend joignable depuis un runner GitHub, ils echouent sur un
    #    timeout reseau — un rouge qui ne dit rien sur le code et qui apprend a
    #    l'equipe a ignorer ce check. Tant que la variable de depot n'est pas
    #    definie, le job est SKIPPED avec une notice qui dit comment l'activer.
    if: |
      needs.changes.outputs.mobile == 'true' &&
      vars.E2E_API_BASE_URL != ''
    timeout-minutes: 45
    name: E2E Maestro (restaurant)
    runs-on: ubuntu-latest
    # Non bloquant : un emulateur met 3 a 6 minutes a demarrer et le parcours
    # depend d'un backend de demonstration. En faire un check requis bloquerait
    # toutes les PR sur une infrastructure instable — l'incident que #9979
    # documente (checks requis ABSENTS, aucune PR mergeable).
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false

      - name: Setup Flutter + Java
        uses: ./.github/actions/setup-flutter-android
        with:
          flutter-version: '3.50.0'

      - name: Install dependencies
        working-directory: front/mobile_apps/leopardo_public
        run: flutter pub get

      - name: Regenerate shared localizations
        working-directory: front/mobile_apps/leopardo_core
        run: flutter gen-l10n

      - name: Restore Firebase config from secret (issue #1467)
        working-directory: front/mobile_apps/leopardo_public
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [[ -n "${GOOGLE_SERVICES_JSON:-}" ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo "::notice::GOOGLE_SERVICES_JSON absent — build sans Firebase."
          fi

      - name: Build debug APK
        working-directory: front/mobile_apps/leopardo_public
        run: |
          flutter build apk --debug \
            --dart-define=API_BASE_URL=${{ vars.E2E_API_BASE_URL }}

      # ── Maestro ──────────────────────────────────────────────────────────
      # Installe AVANT l'etape emulateur : `android-emulator-runner` execute son
      # `script` dans un shell qui herite du PATH du job, donc le binaire doit
      # deja etre la et sur le PATH.
      - name: Install Maestro
        run: |
          set -euo pipefail
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # ── Emulateur ────────────────────────────────────────────────────────
      # Sans cette etape, `maestro test` n'a AUCUN appareil a piloter et echoue
      # sur « no devices connected ». C'etait le defaut de la premiere version
      # de ce job : l'APK etait construit, Maestro installe, et le run echouait
      # faute de cible.
      #
      # `reactivecircus/android-emulator-runner` demarre l'AVD ET execute la
      # commande passee dans `script` sur cet emulateur — c'est le seul moyen
      # fiable de garder l'emulateur vivant pendant les tests.
      - name: Run Maestro flows on emulator
        uses: reactivecircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b # v2.35.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            cd front/mobile_apps/leopardo_public

            # L'APK doit etre installe AVANT Maestro : `launchApp` ne
            # telecharge rien, il lance un package deja present.
            adb install -r build/app/outputs/flutter-apk/app-debug.apk

            maestro test maestro/restaurant/ \
              --format junit \
              --output maestro-report.xml
        env:
          RESTO_SLUG: ${{ vars.E2E_RESTO_SLUG || 'le-bistrot' }}
          RESTO_PRODUCT_CODE: ${{ vars.E2E_RESTO_PRODUCT_CODE || 'demo-1' }}

      - name: Publier le rapport Maestro
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: maestro-restaurant-report
          path: front/mobile_apps/leopardo_public/maestro-report.xml
          if-no-files-found: warn
          retention-days: 14
