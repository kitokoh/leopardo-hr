name: Mobile Apps CI - Flutter

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'front/mobile_apps/**'
      - 'dev-hub/tools/validate-mobile-apps-split.ps1'
      - 'dev-hub/tools/validate-mobile-release-readiness.ps1'
      - 'dev-hub/tools/validate-mobile-runtime-smoke.ps1'
      - 'dev-hub/tools/validate-mobile-location-readiness.ps1'
      - 'dev-hub/tools/validate-mobile-tenant-branding.ps1'
      - 'dev-hub/tools/validate-mobile-notification-production-proof.ps1'
      - 'dev-hub/tools/validate-mobile-workflow-contracts.ps1'
      - 'dev-hub/tools/validate-mobile-plan28.ps1'
      - 'dev-hub/tools/validate-mobile-plan29.ps1'
      - 'dev-hub/tools/validate-mobile-color-tokens.ps1'
      - 'dev-hub/tools/check-mobile-number-locale.sh'
      - 'dev-hub/tools/check-mobile-l10n-sync.sh'
      - 'dev-hub/tools/check-mobile-manifest-routes.sh'
      - 'dev-hub/tools/mobile-workflow-contracts.json'
      - 'api/app/Modules/HR/Infrastructure/Services/MobileExperienceService.php'
      - '.github/workflows/mobile-apps-ci.yml'
  push:
    branches: [main]
    paths:
      - 'front/mobile_apps/**'
      - 'dev-hub/tools/validate-mobile-apps-split.ps1'
      - 'dev-hub/tools/validate-mobile-release-readiness.ps1'
      - 'dev-hub/tools/validate-mobile-runtime-smoke.ps1'
      - 'dev-hub/tools/validate-mobile-location-readiness.ps1'
      - 'dev-hub/tools/validate-mobile-tenant-branding.ps1'
      - 'dev-hub/tools/validate-mobile-notification-production-proof.ps1'
      - 'dev-hub/tools/validate-mobile-workflow-contracts.ps1'
      - 'dev-hub/tools/validate-mobile-plan28.ps1'
      - 'dev-hub/tools/validate-mobile-plan29.ps1'
      - 'dev-hub/tools/validate-mobile-color-tokens.ps1'
      - 'dev-hub/tools/check-mobile-number-locale.sh'
      - 'dev-hub/tools/check-mobile-l10n-sync.sh'
      - 'dev-hub/tools/check-mobile-manifest-routes.sh'
      - 'dev-hub/tools/mobile-workflow-contracts.json'
      - 'api/app/Modules/HR/Infrastructure/Services/MobileExperienceService.php'
      - '.github/workflows/mobile-apps-ci.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  API_BASE_URL: ${{ vars.PROD_API_BASE_URL }}

concurrency:
  group: mobile-apps-ci-${{ github.ref }}
  # Issue #2131 : sur main, ne jamais annuler le run du commit précédent
  # (builds Flutter longs relancés en cascade). Runs PR annulés.
  cancel-in-progress: false  # #5536 : queuer au lieu d'annuler (les runs PR ne démarrent jamais sous congestion)

jobs:
  mobile-apps-guard:
    timeout-minutes: 90
    name: Mobile apps split guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
          fetch-depth: 0

      - name: Guard PROD_API_BASE_URL (#4524)
        shell: bash
        run: |
          if [[ -z "${{ vars.PROD_API_BASE_URL }}" ]]; then
            echo "::error::PROD_API_BASE_URL must be set (fail-open fallback removed, issue #4524)."
            exit 1
          fi
          echo "PROD_API_BASE_URL=${{ vars.PROD_API_BASE_URL }}"

      - name: Validate mobile apps boundaries
        shell: pwsh
        run: '& ./dev-hub/tools/validate-mobile-apps-split.ps1'

      - name: Validate mobile release readiness
        shell: pwsh
        run: '& ./dev-hub/tools/validate-mobile-release-readiness.ps1'

      - name: Validate mobile runtime smoke
        shell: pwsh
        run: '& ./dev-hub/tools/validate-mobile-runtime-smoke.ps1'

      - name: Validate mobile location readiness
        shell: pwsh
        run: '& ./dev-hub/tools/validate-mobile-location-readiness.ps1'

      - name: Validate mobile tenant branding
        shell: pwsh
        run: '& ./dev-hub/tools/validate-mobile-tenant-branding.ps1'

      - name: Validate mobile notification production proof
        shell: pwsh
        run: '& ./dev-hub/tools/validate-mobile-notification-production-proof.ps1'

      - name: Validate mobile workflow contracts
        shell: pwsh
        run: '& ./dev-hub/tools/validate-mobile-workflow-contracts.ps1'

      - name: Validate Plan 28 multi-app excellence
        shell: pwsh
        run: '& ./dev-hub/tools/validate-mobile-plan28.ps1'

      - name: Validate Plan 29 platform admin app
        shell: pwsh
        run: '& ./dev-hub/tools/validate-mobile-plan29.ps1'

      - name: Validate mobile color tokens (no hardcoded hex outside AppColors)
        shell: pwsh
        run: '& ./dev-hub/tools/validate-mobile-color-tokens.ps1'

      - name: Validate manifest routes exist in app GoRouter routers
        # #2212 : chaque route servie par MobileExperienceService doit exister
        # dans le routeur GoRouter de l'app cible, sinon context.push() crashe.
        shell: bash
        run: 'bash ./dev-hub/tools/check-mobile-manifest-routes.sh'

      - name: Validate no hardcoded FR number formats (locale-aware)
        # #4197 : NumberFormat.decimalPattern('fr') / deviceIntlDateLocale
        # sur des montants = locale forcée FR pour les utilisateurs AR/TR/EN.
        shell: bash
        run: 'bash ./dev-hub/tools/check-mobile-number-locale.sh'

      - name: Validate ARB keys exist in generated localizations
        # #4762 (récurrence) : toute clé ARB absente des générés casse la
        # compile des apps qui la référencent. Garde = `flutter gen-l10n`
        # doit être exécuté dans leopardo_core à chaque ajout de clé.
        shell: bash
        run: 'bash ./dev-hub/tools/check-mobile-l10n-sync.sh'

      - name: Validate ARB keys exist in generated localizations
        # #4762 (récurrence) : toute clé ARB absente des générés casse la
        # compile des apps qui la référencent. Garde = `flutter gen-l10n`
        # doit être exécuté dans leopardo_core à chaque ajout de clé.
        shell: bash
        run: 'bash ./dev-hub/tools/check-mobile-l10n-sync.sh'

  flutter-analyze:
    timeout-minutes: 90
    name: Analyze ${{ matrix.project.name }}
    runs-on: ubuntu-latest
    needs: mobile-apps-guard
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: leopardo_accounting
            path: front/mobile_apps/leopardo_accounting
          - name: leopardo_core
            path: front/mobile_apps/leopardo_core
          - name: leopardo_employee
            path: front/mobile_apps/leopardo_employee
          - name: leopardo_manager
            path: front/mobile_apps/leopardo_manager
          - name: leopardo_hr
            path: front/mobile_apps/leopardo_hr
          - name: leopardo_platform_admin
            path: front/mobile_apps/leopardo_platform_admin
          - name: leopardo_marketing
            path: front/mobile_apps/leopardo_marketing

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true

      - name: Setup Flutter + Java
        uses: ./.github/actions/setup-flutter-android

      - name: Install dependencies
        working-directory: ${{ matrix.project.path }}
        run: flutter pub get --offline || flutter pub get

      - name: Regenerate shared localizations
        # #4762 : les apps consomment AppLocalizations depuis le package core.
        # Régénérer avec la version Flutter de CI évite une interface générée
        # obsolète après pub get ou restauration de cache.
        working-directory: front/mobile_apps/leopardo_core
        run: flutter gen-l10n

      - name: Fetch diff base for incremental Dart gate
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n "${BASE_SHA}" && "${BASE_SHA}" != "0000000000000000000000000000000000000000" ]] && ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          fi

      - name: Identify changed Dart files
        id: changed-dart
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n "${BASE_SHA}" && "${BASE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            git diff -z --name-only "${BASE_SHA}" HEAD -- '*.dart' > /tmp/changed-dart-files
          else
            git diff -z --name-only HEAD^ HEAD -- '*.dart' > /tmp/changed-dart-files
          fi
          project_prefix="${{ matrix.project.path }}/"
          : > /tmp/changed-dart-files-relative
          while IFS= read -r -d '' file; do
            if [[ "${file}" == "${project_prefix}"* ]]; then
              printf '%s\0' "${file#"$project_prefix"}" >> /tmp/changed-dart-files-relative
            fi
          done < /tmp/changed-dart-files
          if [[ -s /tmp/changed-dart-files-relative ]]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            echo "Dart files changed in this project:"
            tr '\0' '\n' < /tmp/changed-dart-files-relative
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "No Dart files changed in this project."
          fi

      - name: Check formatting of changed Dart files
        if: steps.changed-dart.outputs.changed == 'true'
        working-directory: ${{ matrix.project.path }}
        shell: bash
        run: xargs -r -0 dart format --set-exit-if-changed < /tmp/changed-dart-files-relative

      - name: Run flutter analyze
        working-directory: ${{ matrix.project.path }}
        run: flutter analyze

      # #3822 : chaque app livrée exécute ses tests en CI. Avant, seuls
      # leopardo_core et leopardo_employee lançaient `flutter test` — les
      # 43 fichiers de test de HR (21), Manager (21) et Platform Admin (1)
      # ne tournaient jamais, et une régression de compile (#3952) passait
      # inaperçue. Marketing n'a pas encore de dossier test/ (socle smoke en
      # follow-up) : l'étape est sautée proprement avec un warning.
      - name: Run app test suite
        working-directory: ${{ matrix.project.path }}
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "::warning::Pas de dossier test/ — aucune suite à exécuter pour ${{ matrix.project.name }} (voir #3822)."
          fi

  flutter-build-debug:
    timeout-minutes: 90
    name: Build Debug ${{ matrix.project.name }}
    runs-on: ubuntu-latest
    needs: flutter-analyze
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: leopardo_employee
            path: front/mobile_apps/leopardo_employee
            artifact: leopardo-employee-debug-apk
          - name: leopardo_manager
            path: front/mobile_apps/leopardo_manager
            artifact: leopardo-manager-debug-apk
          - name: leopardo_hr
            path: front/mobile_apps/leopardo_hr
            artifact: leopardo-hr-debug-apk
          - name: leopardo_platform_admin
            path: front/mobile_apps/leopardo_platform_admin
            artifact: leopardo-platform-admin-debug-apk
          - name: leopardo_marketing
            path: front/mobile_apps/leopardo_marketing
            artifact: leopardo-marketing-debug-apk
          - name: leopardo_accounting
            path: front/mobile_apps/leopardo_accounting
            artifact: leopardo-accounting-debug-apk

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true

      - name: Setup Flutter + Java
        uses: ./.github/actions/setup-flutter-android

      - name: Install dependencies
        working-directory: ${{ matrix.project.path }}
        run: flutter pub get --offline || flutter pub get

      - name: Restore Firebase config from secret (issue #1467)
        # google-services.json n'est PLUS committé (clé API réelle exposée) :
        # un stub à clés factices est versionné pour les builds locaux/forks ;
        # le fichier réel est restauré depuis le secret GOOGLE_SERVICES_JSON.
        shell: bash
        run: |
          if [[ -n "${GOOGLE_SERVICES_JSON}" ]]; then
            for target in front/mobile_apps/leopardo_employee front/mobile_apps/leopardo_hr front/mobile_apps/leopardo_manager front/mobile_apps/leopardo_platform_admin; do
              printf '%s' "${GOOGLE_SERVICES_JSON}" > "${target}/android/app/google-services.json"
            done
            echo "Firebase config restaurée depuis le secret."
          else
            echo "::warning::GOOGLE_SERVICES_JSON non défini — build avec le stub (clés factices)."
          fi
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Build debug APK
        working-directory: ${{ matrix.project.path }}
        run: flutter build apk --debug --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.project.artifact }}
          path: ${{ matrix.project.path }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
