name: Web CI - Leopardo Admin

on:
  workflow_dispatch:
  push:
    branches: [main, develop, staging]
    paths:
      - 'admin-dashboard/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    branches: [main, develop, staging]
    paths:
      - 'admin-dashboard/**'
      - '.github/workflows/web-ci.yml'

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-lint:
    name: Web Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'admin-dashboard/package-lock.json'

      - name: Install dependencies
        working-directory: ./admin-dashboard
        run: npm ci

      - name: Install ESLint parsers
        working-directory: ./admin-dashboard
        run: npm install --no-save vue-eslint-parser @babel/eslint-parser

      - name: Run ESLint
        working-directory: ./admin-dashboard
        run: npm run lint

  web-build:
    name: Web Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'admin-dashboard/package-lock.json'

      - name: Install dependencies
        working-directory: ./admin-dashboard
        run: npm ci

      - name: Build admin dashboard
        working-directory: ./admin-dashboard
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-dashboard-dist
          path: admin-dashboard/dist/
          if-no-files-found: error
          retention-days: 7

  web-e2e-playwright:
    name: Web E2E Playwright
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'admin-dashboard/package-lock.json'

      - name: Install dependencies
        working-directory: ./admin-dashboard
        run: npm ci

      - name: Install Playwright test runner
        working-directory: ./admin-dashboard
        run: npm install --no-save @playwright/test

      - name: Install Chromium
        working-directory: ./admin-dashboard
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        working-directory: ./admin-dashboard
        env:
          CI: true
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            admin-dashboard/playwright-report/
            admin-dashboard/test-results/
          if-no-files-found: ignore
          retention-days: 14
