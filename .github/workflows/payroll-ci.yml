name: Payroll CI — Golden & Conformité

# Programme FOCUS (F-15) : pipeline paie dédié, rapide et bloquant.
# Déclenché sur les chemins paie + référentiel de conformité.
# Jobs :
#   golden        — tests golden (cas calculés à la main, F-03)
#   payroll-tests — tests du module Payroll (Feature/Unit)
#   coverage      — gate de coverage module Payroll ≥ 80 % (F-14)
#   phpstan       — analyse statique du module (niveau modules)

on:
  pull_request:
    branches: [main]
    paths:
      - 'api/app/Modules/Payroll/**'
      - 'api/database/migrations/**'
      - 'api/tests/Feature/Payroll/**'
      - 'docs/payroll/**'
      - '.github/workflows/payroll-ci.yml'
  push:
    branches: [main]
    paths:
      - 'api/app/Modules/Payroll/**'
      - 'api/database/migrations/**'
      - 'api/tests/Feature/Payroll/**'
      - 'docs/payroll/**'
      - '.github/workflows/payroll-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: payroll-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden:
    name: Golden tests paie DZ
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: leopardo_test
          POSTGRES_USER: leopardo_user
          POSTGRES_PASSWORD: leopardo_pass_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, sqlite3, bcmath, mbstring, xml, zip, gd
          tools: composer:v2

      - name: Install
        working-directory: api
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run golden payroll tests (F-03)
        working-directory: api
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: leopardo_test
          DB_USERNAME: leopardo_user
          DB_PASSWORD: leopardo_pass_test
        run: php artisan test --filter=Golden --stop-on-failure

      - name: Golden report (F-03)
        run: dev-hub/tools/payroll-golden-report.sh

  payroll-tests:
    name: Tests module Payroll
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: leopardo_test
          POSTGRES_USER: leopardo_user
          POSTGRES_PASSWORD: leopardo_pass_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, sqlite3, bcmath, mbstring, xml, zip, gd
          tools: composer:v2

      - name: Install
        working-directory: api
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run payroll test suite (F-13 baseline)
        working-directory: api
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: leopardo_test
          DB_USERNAME: leopardo_user
          DB_PASSWORD: leopardo_pass_test
        run: php artisan test tests/Feature/Payroll --stop-on-failure

  coverage:
    name: Coverage Payroll ≥ 80 %
    runs-on: ubuntu-latest
    # S-4 (#1664) : gate BLOQUANTE — la migration RefreshTenantDatabase
    # (#1543/#1569) est terminée et le plan de tests (#1602) a porté la
    # couverture du module au-dessus de 80 %. continue-on-error retiré : un
    # coverage < 80 % fait échouer la PR.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: leopardo_test
          POSTGRES_USER: leopardo_user
          POSTGRES_PASSWORD: leopardo_pass_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          coverage: pcov
          extensions: pdo, pdo_pgsql, sqlite3, bcmath, mbstring, xml, zip, gd
          tools: composer:v2

      - name: Install
        working-directory: api
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Tests with coverage (module Payroll)
        working-directory: api
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: leopardo_test
          DB_USERNAME: leopardo_user
          DB_PASSWORD: leopardo_pass_test
        run: |
          set -euo pipefail
          mkdir -p storage/coverage
          # Include ALL payroll-related tests (F-14) — not just tests/Feature/Payroll:
          #   - tests/Feature/Payroll* → integration & controller tests
          #   - tests/Unit/Payroll*    → pure country-rules & calculator unit tests
          # Note: set -o pipefail ensures test failures propagate through the tee pipe.
          # S-4 (#1664) : tests paie hors tests/Feature/Payroll (générateurs,
          # controllers, jobs) portés dans la mesure — couverture réelle du
          # noyau paie.
          php artisan test \
            tests/Feature/Payroll \
            tests/Feature/PayrollCycleIntegrationTest.php \
            tests/Feature/PayrollCyclePreviewTest.php \
            tests/Feature/PayrollCycleSettingsTest.php \
            tests/Feature/PayrollRunControllerTest.php \
            tests/Feature/PayrollAccountingExportTest.php \
            tests/Feature/PayrollCountryRulesTemporalVersioningTest.php \
            tests/Unit/PayrollCountryRulesTest.php \
            tests/Unit/PayrollCalculatorCountryRulesTest.php \
            tests/Unit/PayrollCalculatorEdgeCasesTest.php \
            tests/Feature/Payroll/PayrollCalculatorRunEdgeTest.php \
            tests/Feature/GenerateBankExportJobTest.php \
            tests/Feature/BankExportControllerTest.php \
            tests/Feature/BulkPaymentControllerTest.php \
            tests/Feature/PaymentBatchControllerTest.php \
            tests/Feature/ProcessBulkPaymentJobTest.php \
            tests/Feature/PaymentDocumentControllerTest.php \
            tests/Feature/GeneratePaymentDocumentJobTest.php \
            tests/Feature/CotisationSimulationControllerTest.php \
            tests/Feature/EmployeeLoanControllerTest.php \
            tests/Feature/LedgerTest.php \
            tests/Feature/PaySlipControllerTest.php \
            tests/Feature/SocialDeclarationControllerTest.php \
            tests/Feature/SalaryAdvanceProofTest.php \
            tests/Feature/DemoDzSeederTest.php \
            tests/Feature/Security/PayrollCrossTenantAdversarialTest.php \
            tests/Unit/BankExportGeneratorTest.php \
            tests/Unit/SocialDeclarationGeneratorTest.php \
            tests/Unit/PaymentConsentSignatureServiceTest.php \
            --coverage-clover=storage/coverage/payroll-clover.xml \
            --coverage-text 2>&1 | tee storage/coverage/payroll-summary.txt

      - name: Gate coverage Payroll ≥ 80 % (F-14)
        run: |
          # Calcule le coverage uniquement sur app/Modules/Payroll depuis le clover.
          # Note: PHPUnit Clover XML place les compteurs sur l'élément <metrics> enfant
          # de <file>, pas directement sur <file>. Le premier <metrics> direct d'un
          # <file> donne les totaux au niveau du fichier (statement coverage).
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          import os, sys

          clover_path = 'api/storage/coverage/payroll-clover.xml'
          if not os.path.exists(clover_path):
              print('::error::payroll-clover.xml introuvable — la génération de coverage a peut-être échoué.')
              sys.exit(1)

          tree = ET.parse(clover_path)
          root = tree.getroot()
          total_stmt = 0
          covered_stmt = 0
          for f in root.iter('file'):
              path = f.get('name', '').replace('\\', '/')
              if '/app/Modules/Payroll/' not in path:
                  continue
              # Le premier élément <metrics> direct du <file> contient les totaux
              # au niveau fichier (PHPUnit Clover format).
              metrics = f.find('metrics')
              if metrics is not None:
                  total_stmt   += int(metrics.get('statements', 0))
                  covered_stmt += int(metrics.get('coveredstatements', 0))
          pct = (covered_stmt / total_stmt * 100) if total_stmt else 0.0
          print(f'Payroll coverage: {pct:.1f}% ({covered_stmt}/{total_stmt})')
          # S-4 (#1664) : gate BLOQUANTE (F-14) — ≥ 80 % requis, sinon échec.
          if pct < 80.0:
              print(f'::error::Coverage Payroll {pct:.1f}% < 80% (F-14) — gate bloquante S-4 (#1664).')
              sys.exit(1)
          print('Coverage Payroll ≥ 80 % : gate OK.')
          PY

  phpstan:
    name: PHPStan module Payroll
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, sqlite3, bcmath, mbstring, xml, zip, gd
          tools: composer:v2

      - name: Install
        working-directory: api
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: PHPStan module (niveau modules)
        working-directory: api
        run: vendor/bin/phpstan analyse --configuration=phpstan-modules.neon --memory-limit=1G --no-progress -- paths app/Modules/Payroll || true
