name: Payroll CI — Golden & Conformité

# Programme FOCUS (F-15) : pipeline paie dédié, rapide et bloquant.
# Déclenché sur les chemins paie + référentiel de conformité.
# Jobs :
#   golden        — tests golden (cas calculés à la main, F-03)
#   payroll-tests — tests du module Payroll (Feature/Unit)
#   coverage      — gate de coverage module Payroll ≥ 80 % (F-14)
#   phpstan       — analyse statique du module (niveau modules)

on:
  pull_request:
    branches: [main]
    paths:
      - 'api/app/Modules/Payroll/**'
      - 'api/database/migrations/**'
      - 'api/tests/Feature/Payroll/**'
      - 'docs/payroll/**'
      - '.github/workflows/payroll-ci.yml'
  push:
    branches: [main]
    paths:
      - 'api/app/Modules/Payroll/**'
      - 'api/database/migrations/**'
      - 'api/tests/Feature/Payroll/**'
      - 'docs/payroll/**'
      - '.github/workflows/payroll-ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  # #5178 : l'étape « Comment payroll coverage on PR » (actions/github-script)
  # poste un commentaire — sans issues: write, l'API renvoie 403
  # « Resource not accessible by integration » → le check Coverage Payroll
  # échoue même quand le gate ≥ 80 % est passé (87,1 % constaté).
  issues: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: payroll-ci-${{ github.workflow }}-${{ github.ref }}
  # Issue #2131 : sur main, ne jamais annuler le run du commit précédent
  # (chaque merge relançait l'annulation en cascade des runs paie utiles).
  # Les runs PR gardent l'annulation (feedback rapide sur une même branche).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  golden:
    timeout-minutes: 45
    name: Golden tests paie DZ
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: leopardo_test
          POSTGRES_USER: leopardo_user
          POSTGRES_PASSWORD: leopardo_pass_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      # #5178 : le bulk-pay (ProcessBulkPaymentJob/BulkPaymentController) est
      # fail-closed à 503 sans Redis (#3857). Redis 7 est un service requis
      # pour les tests du module Payroll, comme dans tests.yml.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, sqlite3, bcmath, mbstring, xml, zip, gd
          tools: composer:v2

      - name: Install
        working-directory: api
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run golden payroll tests (F-03)
        working-directory: api
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: leopardo_test
          DB_USERNAME: leopardo_user
          DB_PASSWORD: leopardo_pass_test
        run: php artisan test --filter=Golden --stop-on-failure

      - name: Golden report (F-03)
        run: dev-hub/tools/payroll-golden-report.sh

  payroll-tests:
    timeout-minutes: 45
    name: Tests module Payroll
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: leopardo_test
          POSTGRES_USER: leopardo_user
          POSTGRES_PASSWORD: leopardo_pass_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      # #5178 : le bulk-pay (ProcessBulkPaymentJob/BulkPaymentController) est
      # fail-closed à 503 sans Redis (#3857). Redis 7 est un service requis
      # pour les tests du module Payroll, comme dans tests.yml.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, sqlite3, bcmath, mbstring, xml, zip, gd
          tools: composer:v2

      - name: Install
        working-directory: api
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run payroll test suite (F-13 baseline)
        working-directory: api
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: leopardo_test
          DB_USERNAME: leopardo_user
          DB_PASSWORD: leopardo_pass_test
        run: php artisan test tests/Feature/Payroll --stop-on-failure

  coverage:
    timeout-minutes: 45
    name: Coverage Payroll ≥ 80 %
    runs-on: ubuntu-latest
    # S-4 (#1664) : gate BLOQUANTE — la migration RefreshTenantDatabase
    # (#1543/#1569) est terminée et le plan de tests (#1602) a porté la
    # couverture du module au-dessus de 80 %. continue-on-error retiré : un
    # coverage < 80 % fait échouer la PR.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: leopardo_test
          POSTGRES_USER: leopardo_user
          POSTGRES_PASSWORD: leopardo_pass_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      # #5178 : le bulk-pay (ProcessBulkPaymentJob/BulkPaymentController) est
      # fail-closed à 503 sans Redis (#3857). Redis 7 est un service requis
      # pour les tests du module Payroll, comme dans tests.yml.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          coverage: pcov
          extensions: pdo, pdo_pgsql, sqlite3, bcmath, mbstring, xml, zip, gd
          tools: composer:v2

      - name: Install
        working-directory: api
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Tests with coverage (module Payroll)
        working-directory: api
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: leopardo_test
          DB_USERNAME: leopardo_user
          DB_PASSWORD: leopardo_pass_test
        run: |
          set -euo pipefail
          mkdir -p storage/coverage
          # Include ALL payroll-related tests (F-14) — not just tests/Feature/Payroll:
          #   - tests/Feature/Payroll* → integration & controller tests
          #   - tests/Unit/Payroll*    → pure country-rules & calculator unit tests
          # Note: set -o pipefail ensures test failures propagate through the tee pipe.
          # S-4 (#1664) : tests paie hors tests/Feature/Payroll (générateurs,
          # controllers, jobs) portés dans la mesure — couverture réelle du
          # noyau paie.
          php artisan test \
            tests/Feature/Payroll \
            tests/Feature/PayrollCycleIntegrationTest.php \
            tests/Feature/PayrollCyclePreviewTest.php \
            tests/Feature/PayrollCycleSettingsTest.php \
            tests/Feature/PayrollRunControllerTest.php \
            tests/Feature/PayrollAccountingExportTest.php \
            tests/Feature/PayrollCountryRulesTemporalVersioningTest.php \
            tests/Unit/PayrollCountryRulesTest.php \
            tests/Unit/PayrollCalculatorCountryRulesTest.php \
            tests/Unit/PayrollCalculatorEdgeCasesTest.php \
            tests/Feature/Payroll/PayrollCalculatorRunEdgeTest.php \
            tests/Feature/GenerateBankExportJobTest.php \
            tests/Feature/BankExportControllerTest.php \
            tests/Feature/BulkPaymentControllerTest.php \
            tests/Feature/PaymentBatchControllerTest.php \
            tests/Feature/ProcessBulkPaymentJobTest.php \
            tests/Feature/PaymentDocumentControllerTest.php \
            tests/Feature/GeneratePaymentDocumentJobTest.php \
            tests/Feature/CotisationSimulationControllerTest.php \
            tests/Feature/EmployeeLoanControllerTest.php \
            tests/Feature/LedgerTest.php \
            tests/Feature/PaySlipControllerTest.php \
            tests/Feature/SocialDeclarationControllerTest.php \
            tests/Feature/SalaryAdvanceProofTest.php \
            tests/Feature/DemoDzSeederTest.php \
            tests/Feature/Security/PayrollCrossTenantAdversarialTest.php \
            tests/Unit/BankExportGeneratorTest.php \
            tests/Unit/SocialDeclarationGeneratorTest.php \
            tests/Unit/PaymentConsentSignatureServiceTest.php \
            --coverage-clover=storage/coverage/payroll-clover.xml \
            --coverage-text 2>&1 | tee storage/coverage/payroll-summary.txt

      - name: Gate coverage Payroll ≥ 80 % (F-14)
        id: coverage
        run: |
          # Calcule le coverage uniquement sur app/Modules/Payroll depuis le clover.
          # Note: PHPUnit Clover XML place les compteurs sur l'élément <metrics> enfant
          # de <file>, pas directement sur <file>. Le premier <metrics> direct d'un
          # <file> donne les totaux au niveau du fichier (statement coverage).
          # Issue #2415 : le résultat est exposé (GITHUB_OUTPUT + artifact + comment
          # PR) pour distinguer « couverture réellement < 80 % » d'un gate cassé.
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          import os, sys

          clover_path = 'api/storage/coverage/payroll-clover.xml'
          if not os.path.exists(clover_path):
              print('::error::payroll-clover.xml introuvable — la génération de coverage a peut-être échoué.')
              sys.exit(1)

          tree = ET.parse(clover_path)
          root = tree.getroot()
          total_stmt = 0
          covered_stmt = 0
          files = []  # (pct, total, covered, path)
          for f in root.iter('file'):
              path = f.get('name', '').replace('\\', '/')
              if '/app/Modules/Payroll/' not in path:
                  continue
              # Le premier élément <metrics> direct du <file> contient les totaux
              # au niveau fichier (PHPUnit Clover format).
              metrics = f.find('metrics')
              if metrics is not None:
                  t = int(metrics.get('statements', 0))
                  c = int(metrics.get('coveredstatements', 0))
                  total_stmt += t
                  covered_stmt += c
                  files.append((c / t * 100 if t else 100.0, t, c, path))
          pct = (covered_stmt / total_stmt * 100) if total_stmt else 0.0
          print(f'Payroll coverage: {pct:.1f}% ({covered_stmt}/{total_stmt})')
          # Écrit le résultat pour les steps suivants (artifact + comment PR).
          with open(os.environ.get('GITHUB_OUTPUT', '/dev/null'), 'a') as out:
              out.write(f'payroll_pct={pct:.1f}\n')
              out.write(f'payroll_covered={covered_stmt}\n')
              out.write(f'payroll_total={total_stmt}\n')
          # Top 10 fichiers les moins couverts du module — diagnostic direct si < 80 %.
          worst = sorted(files, key=lambda x: (x[0], -x[1]))[:10]
          if worst:
              print('\nFichiers Payroll les moins couverts :')
              for fpct, ft, fc, fpath in worst:
                  print(f'  {fpct:5.1f}%  {ft - fc:4d} stmt non couverts  {os.path.basename(fpath)}')
          # S-4 (#1664) : gate BLOQUANTE (F-14) — ≥ 80 % requis, sinon échec.
          if pct < 80.0:
              print(f'::error::Coverage Payroll {pct:.1f}% < 80% (F-14) — gate bloquante S-4 (#1664).')
              sys.exit(1)
          print('Coverage Payroll ≥ 80 % : gate OK.')
          PY

      # Issue #2415 : artefact systématique (même en échec) pour mesurer la
      # couverture réelle du module sans rejouer toute la suite.
      - name: Upload payroll coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: payroll-coverage-report
          path: |
            api/storage/coverage/payroll-clover.xml
            api/storage/coverage/payroll-summary.txt
          if-no-files-found: ignore
          retention-days: 30

      # Issue #2415 : le % est affiché sur la PR — fini le gate rouge sans chiffre.
      - name: Comment payroll coverage on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const pct = `${{ steps.coverage.outputs.payroll_pct }}`;
            const covered = `${{ steps.coverage.outputs.payroll_covered }}`;
            const total = `${{ steps.coverage.outputs.payroll_total }}`;
            const ok = pct !== '' && parseFloat(pct) >= 80;
            const icon = ok ? ':white_check_mark:' : ':x:';
            const body = [
              `## ${icon} Payroll Coverage (module Payroll, F-14)`,
              '',
              '| Metric | Value |',
              '|--------|-------|',
              `| **Coverage** | ${pct || 'n/a'}% |`,
              `| **Statements** | ${covered || 'n/a'} / ${total || 'n/a'} |`,
              `| **Threshold (S-4 #1664)** | ≥ 80 % |`,
              `| **Status** | ${ok ? 'PASSED' : pct === '' ? 'n/a (échec en amont)' : 'FAILED'} |`,
              '',
              '> Mesure : statements couverts dans `api/app/Modules/Payroll/**` (issue #2415).',
              '> Artefacts `payroll-coverage-report` (clover + summary) téléchargeables sur le run.',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Payroll Coverage (module Payroll, F-14)')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  phpstan:
    timeout-minutes: 45
    name: PHPStan module Payroll
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, sqlite3, bcmath, mbstring, xml, zip, gd
          tools: composer:v2

      - name: Install
        working-directory: api
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: PHPStan module (niveau modules)
        working-directory: api
        run: vendor/bin/phpstan analyse --configuration=phpstan-modules.neon --memory-limit=1G --no-progress -- paths app/Modules/Payroll || true
