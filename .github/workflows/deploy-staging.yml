name: Deploy Staging - Leopardo RH

# Audit §4.1 / Plan P3 — BEHAVIOR CHANGE, flagged for explicit team review:
#
# Previously triggered on `push: [main]` with a manual JS polling loop
# (up to 10 min) looking for a check run whose *name* merely `includes`
# both "Backend" and "PHP" — fragile to renames, and on timeout it deployed
# anyway ("optimistic" deploy with no CI signal). This resolves both
# documented problems at once by switching to `workflow_run`, the same
# pattern already proven in deploy-main.yml: the job simply never starts
# until "Tests - Leopardo RH" concludes, so there is no polling window and
# no timeout to be optimistic about — the previous optimistic-deploy
# fallback is removed rather than reconfigured, since workflow_run has no
# equivalent failure mode to be optimistic about.
#
# If the team specifically wants to preserve a way to deploy staging without
# waiting on full CI (e.g. hotfix), workflow_dispatch still allows that
# explicitly, same as before.
on:
  workflow_run:
    workflows: ["Tests - Leopardo RH"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  deployments: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  gate:
    name: Verify CI passed
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - name: Check required CI workflow conclusion
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('should_deploy', 'true');
              core.setOutput('sha', context.sha);
              core.info('Manual trigger — deploying.');
              return;
            }

            const conclusion = context.payload.workflow_run?.conclusion;
            const headBranch = context.payload.workflow_run?.head_branch;
            const headSha = context.payload.workflow_run?.head_sha;
            const headRepoFullName = context.payload.workflow_run?.head_repository?.full_name;
            const baseRepoFullName = `${context.repo.owner}/${context.repo.repo}`;

            // Same defense-in-depth as deploy-main.yml: only ever deploy for a
            // workflow_run that (a) succeeded, (b) targeted main, and (c) ran
            // in this base repository (never a fork).
            if (conclusion === 'success' && headBranch === 'main' && headRepoFullName === baseRepoFullName) {
              core.setOutput('should_deploy', 'true');
              core.setOutput('sha', headSha);
              core.info(`Tests - Leopardo RH succeeded for ${headSha}.`);
            } else {
              core.setOutput('should_deploy', 'false');
              core.setOutput('sha', headSha ?? '');
              core.warning(`Tests - Leopardo RH conclusion=${conclusion} branch=${headBranch} repo=${headRepoFullName}. Skipping staging deploy.`);
            }

  deploy-staging-api:
    name: Deploy API to Staging (Render)
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.should_deploy == 'true'
    environment:
      name: staging
      url: ${{ vars.STAGING_API_URL }}

    steps:
      - name: Check staging environment is configured
        id: check
        shell: bash
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
          RENDER_STAGING_DEPLOY_HOOK_URL: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          # Issue #1485 : un vrai environnement staging n'existe pas encore
          # (pas d'app Render séparée, pas de branche staging). On REFUSE
          # toujours de cibler l'URL de production, mais on saute proprement
          # (même convention que database-backup.yml : "saute proprement si
          # les secrets ne sont pas configurés") au lieu de faire échouer
          # main à chaque push. Configurer un staging réel (app Render +
          # vars.STAGING_API_URL + secrets.RENDER_STAGING_DEPLOY_HOOK_URL)
          # réactive ce job sans autre changement.
          if [[ -z "${STAGING_API_URL}" || -z "${RENDER_STAGING_DEPLOY_HOOK_URL}" ]]; then
            echo "::warning::Staging non configuré (issue #1485) : STAGING_API_URL / RENDER_STAGING_DEPLOY_HOOK_URL absents. Déploiement staging ignoré — la production n'est jamais utilisée comme cible."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Render staging deploy
        if: steps.check.outputs.configured == 'true'
        shell: bash
        env:
          RENDER_STAGING_HOOK_URL: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          echo "Triggering Render staging deployment..."
          curl --fail --silent --show-error --request POST "${RENDER_STAGING_HOOK_URL}"
          echo "Deploy hook triggered successfully."

      - name: Wait for staging health
        if: steps.check.outputs.configured == 'true'
        shell: bash
        env:
          STAGING_URL: ${{ vars.STAGING_API_URL }}
        run: |
          set -euo pipefail
          URL="${STAGING_URL}/api/v1/health"
          echo "Waiting for staging to be healthy at ${URL}..."

          for attempt in {1..20}; do
            echo "Health check attempt ${attempt}/20..."
            if curl --fail --silent --show-error --max-time 10 "${URL}" | grep -q '"status"'; then
              echo "Staging is healthy!"
              exit 0
            fi
            sleep 15
          done

          echo "::warning::Staging health check timed out after 5 minutes."
          exit 1

  notify:
    name: Post-deploy summary
    runs-on: ubuntu-latest
    needs: [gate, deploy-staging-api]
    if: always()
    steps:
      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "## Staging Deployment Summary"
            echo ""
            echo "| Step | Status |"
            echo "|------|--------|"
            echo "| CI Gate | ${{ needs.gate.result }} |"
            echo "| API Deploy | ${{ needs.deploy-staging-api.result }} |"
            echo ""
            echo "**Commit:** \`${{ needs.gate.outputs.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
