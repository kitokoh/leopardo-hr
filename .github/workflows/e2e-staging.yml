name: E2E - Playwright Staging

on:
  workflow_dispatch:
    inputs:
      staging_url:
        description: "API/admin staging base URL to test"
        required: false
        default: ""
      web_staging_url:
        description: "Web vitrine staging base URL to test"
        required: false
        default: ""
      demo_auth_smoke:
        description: "Run real demo auth smoke with staging/demo credentials"
        required: false
        default: "false"
  workflow_run:
    workflows: ["Deploy - Leopardo RH"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEFAULT_STAGING_URL: https://gestionemployerbackend.onrender.com
  DEFAULT_WEB_STAGING_URL: https://gestionemployer-backend.vercel.app

concurrency:
  group: e2e-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  should-run:
    name: Check deployment status
    runs-on: ubuntu-latest
    outputs:
      run_e2e: ${{ steps.check.outputs.run_e2e }}
    steps:
      # Audit §4.2 / Plan P3: previously gated on the parent "Deploy - Leopardo RH"
      # workflow_run's overall conclusion, which also depends on the
      # distribute-mobile job (Flutter/Firebase). A broken mobile build could
      # mark the whole workflow failed and skip these API/admin/web E2E smoke
      # tests even when the API deploy itself succeeded. This now checks the
      # specific `deploy-api` job's conclusion via the Checks API, matching
      # the level of specificity deploy-main.yml already uses for its own
      # gating, and the same approach applied to owasp-zap.yml.
      - name: Determine if E2E should run
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('run_e2e', 'true');
              return;
            }

            if (context.payload.workflow_run?.conclusion !== 'success' &&
                context.payload.workflow_run?.conclusion !== 'failure') {
              // cancelled/skipped/timed_out parent run: nothing useful to check.
              core.setOutput('run_e2e', 'false');
              return;
            }

            const { owner, repo } = context.repo;
            const runId = context.payload.workflow_run.id;

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner,
              repo,
              run_id: runId,
              per_page: 100,
            });

            const deployApiJob = jobs.find((job) => job.name === 'Deploy API + Web to Render');
            const deployApiConclusion = deployApiJob ? deployApiJob.conclusion : null;

            core.info(`deploy-api job conclusion: ${deployApiConclusion}`);
            core.setOutput('run_e2e', deployApiConclusion === 'success' ? 'true' : 'false');

  e2e-api-smoke:
    name: API Smoke Tests
    runs-on: ubuntu-latest
    needs: should-run
    if: needs.should-run.outputs.run_e2e == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve staging URL
        id: url
        shell: bash
        run: |
          INPUT_URL="${{ github.event.inputs.staging_url }}"
          URL="${INPUT_URL:-${DEFAULT_STAGING_URL}}"
          echo "base_url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Testing against: ${URL}"

      - name: API health check
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ steps.url.outputs.base_url }}/api/v1/health"
          echo "Checking API health at ${URL}..."
          for attempt in {1..5}; do
            if curl --fail --silent --show-error "${URL}" | grep -q '"status"'; then
              echo "API is healthy."
              exit 0
            fi
            echo "Attempt ${attempt}/5 failed, retrying in 10s..."
            sleep 10
          done
          echo "API health check failed after 5 attempts."
          exit 1

      - name: API endpoint smoke tests
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ steps.url.outputs.base_url }}/api/v1"
          FAILED=0

          test_endpoint() {
            local name="$1"
            local url="$2"
            local expected_status="${3:-200}"
            echo -n "Testing ${name}... "
            STATUS=$(curl -s -H 'Accept: application/json' -o /dev/null -w '%{http_code}' "${url}" || echo "000")
            if [[ "${STATUS}" == "${expected_status}" ]]; then
              echo "OK (${STATUS})"
            else
              echo "FAIL (got ${STATUS}, expected ${expected_status})"
              FAILED=$((FAILED + 1))
            fi
          }

          test_endpoint "Health" "${BASE}/health"
          test_endpoint "Health Live" "${BASE}/health/live"
          test_endpoint "Health Ready" "${BASE}/health/ready"
          test_endpoint "Auth (no token)" "${BASE}/auth/me" "401"

          if [[ "${FAILED}" -gt 0 ]]; then
            echo "${FAILED} endpoint(s) failed."
            exit 1
          fi
          echo "All API smoke tests passed."

      - name: Optional demo auth smoke
        shell: bash
        env:
          BASE_URL: ${{ steps.url.outputs.base_url }}
          STAGING_DEMO_AUTH_SMOKE: ${{ github.event.inputs.demo_auth_smoke || secrets.STAGING_DEMO_AUTH_SMOKE || 'false' }}
          STAGING_MANAGER_EMAIL: ${{ secrets.STAGING_MANAGER_EMAIL }}
          STAGING_MANAGER_PASSWORD: ${{ secrets.STAGING_MANAGER_PASSWORD }}
          STAGING_EMPLOYEE_EMAIL: ${{ secrets.STAGING_EMPLOYEE_EMAIL }}
          STAGING_EMPLOYEE_PASSWORD: ${{ secrets.STAGING_EMPLOYEE_PASSWORD }}
          STAGING_PLATFORM_EMAIL: ${{ secrets.STAGING_PLATFORM_EMAIL }}
          STAGING_PLATFORM_PASSWORD: ${{ secrets.STAGING_PLATFORM_PASSWORD }}
        run: bash dev-hub/tools/staging-demo-auth-smoke.sh "${BASE_URL}"

  e2e-admin-dashboard:
    name: Admin Dashboard E2E (Playwright)
    runs-on: ubuntu-latest
    needs: should-run
    if: needs.should-run.outputs.run_e2e == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'front/admin-dashboard/package-lock.json'

      - name: Install dependencies
        working-directory: front/admin-dashboard
        run: npm ci

      - name: Install Playwright
        working-directory: front/admin-dashboard
        run: |
                    npx playwright install --with-deps chromium

      - name: Warm up staging instance (Render cold-start, issue #1725)
        working-directory: front/admin-dashboard
        env:
          BASE_URL: ${{ github.event.inputs.staging_url || env.DEFAULT_STAGING_URL }}
        run: |
          set -euo pipefail
          URL="${BASE_URL}/login"
          echo "Warming up ${URL} (instance Render free tier s'endort apres ~15 min d'inactivite)..."
          for attempt in {1..30}; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${URL}" || echo 000)
            if [[ "${code}" != "000" ]]; then
              echo "Warm-up OK (HTTP ${code}) apres ${attempt} tentative(s) — attente de stabilisation 20s"
              sleep 20
              exit 0
            fi
            echo "Tentative ${attempt}/30 : HTTP ${code} — nouvel essai dans 5s"
            sleep 5
          done
          echo "Warm-up KO apres 30 tentatives (instance injoignable)"
          exit 1

      - name: Run Playwright E2E tests
        working-directory: front/admin-dashboard
        env:
          CI: true
          BASE_URL: ${{ github.event.inputs.staging_url || env.DEFAULT_STAGING_URL }}
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-admin-playwright-report
          path: |
            front/admin-dashboard/playwright-report/
            front/admin-dashboard/test-results/
          if-no-files-found: ignore
          retention-days: 14

  e2e-web-vitrine:
    name: Web Vitrine E2E (Playwright)
    runs-on: ubuntu-latest
    needs: should-run
    if: needs.should-run.outputs.run_e2e == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'front/web/package-lock.json'

      - name: Install dependencies
        working-directory: front/web
        run: npm ci

      - name: Install Playwright
        working-directory: front/web
        run: |
                    npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        working-directory: front/web
        env:
          CI: true
          BASE_URL: ${{ github.event.inputs.web_staging_url || env.DEFAULT_WEB_STAGING_URL }}
        run: npx playwright test e2e/staging-smoke.spec.ts --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-web-playwright-report
          path: |
            front/web/playwright-report/
            front/web/test-results/
          if-no-files-found: ignore
          retention-days: 14
