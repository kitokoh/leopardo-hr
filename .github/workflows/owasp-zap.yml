name: OWASP ZAP Baseline

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Base URL to scan"
        required: false
        default: ""
  workflow_run:
    workflows: ["Deploy - Leopardo RH"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

env:
  DEFAULT_ZAP_TARGET_URL: https://gestionemployerbackend.onrender.com
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: owasp-zap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  should-run:
    name: Check deployment status
    runs-on: ubuntu-latest
    outputs:
      run_scan: ${{ steps.check.outputs.run_scan }}
    steps:
      # Audit §4.2 / Plan P3: previously gated on the parent "Deploy - Leopardo RH"
      # workflow_run's overall conclusion, which also depends on the
      # distribute-mobile job (Flutter/Firebase). A broken mobile build could
      # mark the whole workflow failed and skip this API-only smoke scan even
      # when the API deploy itself succeeded. This now checks the specific
      # `deploy-api` job's conclusion via the Checks API, matching the level
      # of specificity deploy-main.yml already uses for its own gating.
      - name: Determine if ZAP should run
        id: check
        uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('run_scan', 'true');
              return;
            }

            if (context.payload.workflow_run?.conclusion !== 'success' &&
                context.payload.workflow_run?.conclusion !== 'failure') {
              // cancelled/skipped/timed_out parent run: nothing useful to check.
              core.setOutput('run_scan', 'false');
              return;
            }

            const { owner, repo } = context.repo;
            const runId = context.payload.workflow_run.id;

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner,
              repo,
              run_id: runId,
              per_page: 100,
            });

            const deployApiJob = jobs.find((job) => job.name === 'Deploy API + Web to Render');
            const deployApiConclusion = deployApiJob ? deployApiJob.conclusion : null;

            core.info(`deploy-api job conclusion: ${deployApiConclusion}`);
            core.setOutput('run_scan', deployApiConclusion === 'success' ? 'true' : 'false');

  zap-baseline:
    name: ZAP Baseline Scan
    runs-on: ubuntu-latest
    needs: should-run
    if: needs.should-run.outputs.run_scan == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve target URL
        id: target
        shell: bash
        run: |
          INPUT_URL="${{ github.event.inputs.target_url }}"
          URL="${INPUT_URL:-${DEFAULT_ZAP_TARGET_URL}}"
          URL="${URL%/}"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Scanning ${URL}"

      - name: Wait for health endpoint
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ steps.target.outputs.url }}/api/v1/health"
          for attempt in {1..6}; do
            if curl --fail --silent --show-error "${URL}" | grep -q '"status"'; then
              echo "API health endpoint is ready."
              exit 0
            fi
            echo "Health check attempt ${attempt}/6 failed; retrying in 10s."
            sleep 10
          done
          echo "API health endpoint did not become ready: ${URL}"
          exit 1

      - name: Run OWASP ZAP baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p zap-reports
          docker run --rm \
            -v "${PWD}/zap-reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t "${{ steps.target.outputs.url }}" \
              -J zap-baseline.json \
              -r zap-baseline.html \
              -w zap-baseline.md \
              -I

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owasp-zap-baseline
          path: zap-reports/
          if-no-files-found: ignore
          retention-days: 30
