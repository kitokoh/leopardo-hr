name: OWASP ZAP Baseline

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Base URL to scan"
        required: false
        default: ""
  workflow_run:
    workflows: ["Deploy - Leopardo RH"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

env:
  DEFAULT_ZAP_TARGET_URL: ${{ vars.PROD_API_BASE_URL }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  # Issue #2131 : groupe par SHA du déploiement déclencheur (et non par ref) —
  # même anti-cascade que e2e-staging.yml (cf. commentaire là-bas).
  # #3906 : cible = PRODUCTION (aucun staging réel, #1485) — scan honnêtement
  # présenté comme baseline prod.
  # workflow_run/dispatch n’émettent jamais l’événement pull_request : la
  # condition précédente désactivait donc la déduplication en pratique.
  group: owasp-zap-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  should-run:
    timeout-minutes: 45
    name: Check deployment status
    runs-on: ubuntu-latest
    outputs:
      run_scan: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true

      # #4723 : logique extraite dans l'action composite partagée
      # .github/actions/check-deployment-status (e2e-staging + owasp-zap).
      - name: Determine if ZAP should run
        id: check
        uses: ./.github/actions/check-deployment-status
        with:
          required_url_vars: 'PROD_API_BASE_URL'
          smoke_label: 'ZAP'

  zap-baseline:
    timeout-minutes: 30
    name: ZAP Baseline Scan
    runs-on: ubuntu-latest
    needs: should-run
    if: needs.should-run.outputs.run_scan == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true

      - name: Resolve target URL
        id: target
        shell: bash
        run: |
          INPUT_URL="${{ github.event.inputs.target_url }}"
          URL="${INPUT_URL:-${DEFAULT_ZAP_TARGET_URL}}"
          URL="${URL%/}"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Scanning ${URL}"

      - name: Wait for health endpoint
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ steps.target.outputs.url }}/api/v1/health"
          for attempt in {1..6}; do
            if curl --fail --silent --show-error "${URL}" | grep -q '"status"'; then
              echo "API health endpoint is ready."
              exit 0
            fi
            echo "Health check attempt ${attempt}/6 failed; retrying in 10s."
            sleep 10
          done
          echo "API health endpoint did not become ready: ${URL}"
          exit 1

      - name: Run OWASP ZAP baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p zap-reports
          docker run --rm \
            -v "${PWD}/zap-reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t "${{ steps.target.outputs.url }}" \
              -J zap-baseline.json \
              -r zap-baseline.html \
              -w zap-baseline.md \
              -I

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: owasp-zap-baseline
          path: zap-reports/
          if-no-files-found: ignore
          retention-days: 30
