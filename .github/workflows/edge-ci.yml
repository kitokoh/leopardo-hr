name: Edge stack guards

on:
  # Issue #9078 — les trois gardes de ce workflow ne lisent QUE `edge/**`
  # (check-edge-migrations-path.sh, install-manifest-parse.sh,
  # install-manifest-signature.sh). Le `push` était déjà filtré, mais le
  # `pull_request` ne l'était pas : chaque PR du dépôt — y compris une PR
  # `docs/**` qui ne touche pas une ligne de `edge/` — payait ~18 min de
  # runner pour rejouer exactement les mêmes gardes sur un code identique à
  # `main`. Le filtre est aligné sur celui du `push` : même couverture, coût
  # supprimé. `api/database/migrations/**` reste déclencheur (la garde #6604
  # vérifie le placement des migrations edge) et `front/web-offline/**` aussi
  # (contrat de synchronisation offline).
  pull_request:
    branches: [main]
    paths:
      - "edge/**"
      - "api/database/migrations/**"
      - "front/web-offline/**"
      - ".github/workflows/edge-ci.yml"
  push:
    branches: [main]
    paths:
      - "edge/**"
      - "api/database/migrations/**"
      - "front/web-offline/**"
      - ".github/workflows/edge-ci.yml"

# CodeQL #33 (actions/missing-workflow-permissions) : le workflow n'avait aucun
# bloc `permissions` → il héritait des permissions par défaut du dépôt pour le
# GITHUB_TOKEN. Ce workflow ne fait que lire le dépôt (checkout + scripts de
# garde), donc le strict minimum suffit (principe du moindre privilège).
permissions:
  contents: read

concurrency:
  group: edge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  edge-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false
      - name: Migration paths guard (issue #6604)
        run: bash edge/tests/check-edge-migrations-path.sh
      - name: Install manifest parse guard (issue #4007)
        run: bash edge/tests/install-manifest-parse.sh
      - name: Install manifest signature guard (issue #7653)
        run: bash edge/tests/install-manifest-signature.sh
