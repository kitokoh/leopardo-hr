name: TEMP - Verify Dart Format On Branch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify + upload formatted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/ci-red-main-2026-08-09

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter-android

      - name: dart format (check only, list changes)
        shell: bash
        run: |
          set -euo pipefail
          cd front/mobile_apps/leopardo_hr
          dart format --output=none --set-exit-if-changed . 2>&1 | head -30 || true
          cd ../..
          cd front/mobile_apps/leopardo_employee
          dart format --output=none --set-exit-if-changed . 2>&1 | head -30 || true
          cd ../..
          cd front/mobile_apps/leopardo_core
          dart format --output=none --set-exit-if-changed . 2>&1 | head -30 || true
          echo "=== CHECK DONE ==="
