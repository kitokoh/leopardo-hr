# Catalogue d'événements versionnés — Leopardo (MAT-006).
#
# Référentiel : docs/architecture/EVENT_CATALOGUE.md
# Garde CI : dev-hub/tools/check-event-catalogue.sh
# Test : api/tests/Feature/Events/EventCatalogueTest.php
#
# Chaque événement : nom stable (snake_case pointé), version semver, BC
# propriétaire, classe PHP, schema (JSON Schema draft-07, sous-ensemble),
# sample (payload concret — doit valider le schema), consumers, dépréciation.
# Aucun champ PII en clair dans les payloads (identifiants uniquement).

version: "1.0"
owner: platform
conventions:
  versioning: semver (major = rupture, minor = ajout compatible, patch = doc)
  deprecation: période de dépréciation d'au moins deux majors avant suppression
  consumer_compat: un consumer déclare consumes.from ; CI bloque une version incompatible

events:
  - name: catalog.inquiry_received
    version: 1.0.0
    bc: catalog
    class: App\Events\CatalogInquiryReceived
    description: Demande de devis B2B recue via le formulaire public du catalogue d'un tenant (BC-28 C-LEAD #6884). Consommee par CRM (creation d'un lead BC-11) et notifications (BC-13).
    consumers:
      - App\Listeners\CreateCrmLeadFromCatalogInquiry
    schema:
      type: object
      required: [event_name, version, occurred_at, company_id, data]
      properties:
        event_name: { type: string, enum: [catalog.inquiry_received] }
        version: { type: string }
        occurred_at: { type: string, format: date-time }
        company_id: { type: string, format: uuid }
        data:
          type: object
          required: [inquiry_id]
          properties:
            inquiry_id: { type: integer }
    sample:
      event_name: catalog.inquiry_received
      version: "1.0.0"
      occurred_at: "2026-09-09T12:00:00+00:00"
      company_id: "11111111-1111-4111-8111-111111111111"
      data: { inquiry_id: 42 }
    deprecation: null

