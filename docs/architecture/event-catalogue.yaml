    description: >-
      Un événement de présence a été enregistré (check-in, check-out, import
      externe/offline), quel que soit le mode de vérification (mobile,
      kiosque, QR, géo, terminal ZKTeco). Contrat versionné ATT-003 (#6768) :
      toute modification de champ impose une v2 et une nouvelle entrée.
    consumers:
      - App\Listeners\AuditLogger
    schema:
      type: object
      required: [event_name, version, occurred_at, company_id, data]
      properties:
        event_name: { type: string, enum: [attendance.recorded] }
        version: { type: string }
        occurred_at: { type: string, format: date-time }
        company_id: { type: string, format: uuid }
        data:
          type: object
          required: [attendance_log_id, employee_id, event_type, occurred_at_utc]
          properties:
            attendance_log_id: { type: integer, minimum: 1 }
            employee_id: { type: integer, minimum: 1 }
            workplace_id: { type: integer, minimum: 1 }
            event_type: { type: string, enum: [check_in, check_out] }
            occurred_at_utc: { type: string, format: date-time }
            verification_method: { type: string, minLength: 1 }
            verification_result: { type: string }
            kiosk_id: { type: integer, minimum: 1 }
            correlation_id: { type: string, minLength: 1 }
    sample:
      event_name: attendance.recorded
      version: "1.0.0"
      occurred_at: "2026-08-28T08:02:00+00:00"
      company_id: "11111111-1111-4111-8111-111111111111"
      data:
        attendance_log_id: 4242
        employee_id: 7
        workplace_id: 3
        event_type: check_in
        occurred_at_utc: "2026-08-28T08:02:00+00:00"
        verification_method: qr
        correlation_id: "33333333-3333-4333-8333-333333333333"
    deprecation: null

