<?xml version="1.0" encoding="UTF-8"?>
<!--
  COULOIR 16 — M1 · Maquette 360 px · parcours « fiche → contact » (LTR).

  Livrable de maquette, pas de code applicatif : le fichier documente les
  écrans réellement implémentés dans lib/features/business_profile et
  lib/features/discovery, à la largeur de référence 360 px du cahier des
  charges.

  Choix de représentation : SVG écrit à la main plutôt qu'une capture d'écran.
  Une capture vieillirait au premier changement de couleur sans que personne
  ne s'en aperçoive ; ici la maquette EST le contrat de mise en page, et une
  divergence se voit en revue.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="740" viewBox="0 0 1140 740" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="1140" height="740" fill="#F8FAFC"/>

  <text x="24" y="36" font-size="17" font-weight="800" fill="#0F172A">Couloir 16 — parcours fiche → contact (360 px, LTR)</text>
  <text x="24" y="58" font-size="12" fill="#64748B">3 écrans · 3 touches maximum entre la fiche et le champ de message · aucun compte demandé avant</text>

  <!-- ══════════ ÉCRAN 1 — FICHE (lecture seule) ══════════ -->
  <g transform="translate(24,80)">
    <rect width="340" height="620" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="12" y="-8" font-size="11" font-weight="700" fill="#334155">1 · FICHE (sans compte)</text>

    <!-- Barre de statut -->
    <rect x="0" y="0" width="340" height="26" rx="20" fill="#FFFFFF"/>
    <text x="16" y="18" font-size="10" fill="#94A3B8">9:41</text>
    <rect x="296" y="9" width="26" height="8" rx="2" fill="#CBD5E1"/>

    <!-- Photos (carrousel) — 16:9, budget de poids fixé en M0 -->
    <rect x="0" y="26" width="340" height="150" fill="#E2E8F0"/>
    <rect x="0" y="26" width="340" height="150" fill="url(#photoGrad)"/>
    <g opacity="0.55">
      <circle cx="62" cy="86" r="20" fill="#FFFFFF"/>
      <circle cx="150" cy="112" r="14" fill="#FFFFFF"/>
      <circle cx="252" cy="82" r="18" fill="#FFFFFF"/>
    </g>
    <rect x="272" y="140" width="52" height="18" rx="9" fill="#0F172A" opacity="0.55"/>
    <text x="298" y="153" font-size="9" text-anchor="middle" fill="#FFFFFF">1 / 4</text>

    <!-- Retour + partage -->
    <circle cx="24" cy="52" r="14" fill="#FFFFFF" opacity="0.92"/>
    <path d="M28 52 L20 52 M24 46 L18 52 L24 58" stroke="#0F172A" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="316" cy="52" r="14" fill="#FFFFFF" opacity="0.92"/>
    <path d="M311 50 v-3 h10 v3 M312 50 v8 h8 v-8" stroke="#0F172A" stroke-width="1.4" fill="none"/>

    <!-- Titre + badge vérifié -->
    <text x="20" y="206" font-size="17" font-weight="800" fill="#0F172A">Le Bosphore</text>
    <g transform="translate(20,216)">
      <rect width="62" height="16" rx="8" fill="#D1FAE5"/>
      <path d="M8 8.6 l2 2 4-4.4" stroke="#059669" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="19" y="11.4" font-size="8.5" font-weight="700" fill="#047857">vérifié</text>
    </g>
    <!-- « ouvert maintenant » -->
    <g transform="translate(90,216)">
      <rect width="96" height="16" rx="8" fill="#F0FDF4" stroke="#BBF7D0"/>
      <circle cx="9" cy="8" r="3" fill="#10B981"/>
      <text x="17" y="11.2" font-size="8.5" font-weight="600" fill="#047857">ouvert · 23h30</text>
    </g>

    <!-- Catégorie + distance -->
    <text x="20" y="248" font-size="10.5" fill="#64748B">Restaurant · Kadıköy · 850 m</text>

    <!-- Adresse + itinéraire -->
    <g transform="translate(20,260)">
      <rect width="300" height="42" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <path d="M14 21 c0 -3.3 2.7 -6 6 -6 s6 2.7 6 6 c0 4.5 -6 10 -6 10 s-6 -5.5 -6 -10 z" stroke="#10B981" stroke-width="1.4" fill="none"/>
      <circle cx="20" cy="21" r="1.8" fill="#10B981"/>
      <text x="36" y="18" font-size="9.5" fill="#334155">Moda Cad. 12, Kadıköy</text>
      <text x="36" y="31" font-size="8.5" fill="#94A3B8">Ouvrir dans Plans</text>
      <path d="M282 21 h8 M286 17 l4 4 -4 4" stroke="#10B981" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Horaires -->
    <text x="20" y="326" font-size="11" font-weight="700" fill="#0F172A">Horaires</text>
    <text x="20" y="342" font-size="9.5" fill="#64748B">Aujourd'hui 11:00 – 23:30</text>
    <text x="20" y="356" font-size="9.5" fill="#94A3B8">Demain 11:00 – 23:30</text>

    <!-- Actions — source unique : supportedActions(). Contacter est présent,
         Commander/Réserver ne le sont que si le provider les déclare. -->
    <text x="20" y="382" font-size="11" font-weight="700" fill="#0F172A">Actions</text>
    <g transform="translate(20,392)">
      <rect width="96" height="34" rx="10" fill="#10B981"/>
      <text x="48" y="21.5" font-size="11" font-weight="700" text-anchor="middle" fill="#FFFFFF">Contacter</text>
    </g>
    <g transform="translate(122,392)">
      <rect width="96" height="34" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
      <text x="48" y="21.5" font-size="11" font-weight="600" text-anchor="middle" fill="#334155">Commander</text>
    </g>
    <g transform="translate(224,392)">
      <rect width="96" height="34" rx="10" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.4" stroke-dasharray="3 3"/>
      <text x="48" y="20" font-size="9" font-weight="600" text-anchor="middle" fill="#94A3B8">Réserver</text>
      <text x="48" y="29" font-size="7" text-anchor="middle" fill="#CBD5E1">non proposé</text>
    </g>
    <text x="20" y="440" font-size="8" fill="#94A3B8">Aucun bouton mort : « Réserver » n'apparaît que si le provider le déclare.</text>

    <!-- Signalement -->
    <g transform="translate(20,452)">
      <rect width="118" height="22" rx="11" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="59" y="14.5" font-size="8.5" text-anchor="middle" fill="#64748B">Signaler cette fiche</text>
    </g>

    <!-- Barre d'onglets -->
    <line x1="0" y1="560" x2="340" y2="560" stroke="#E2E8F0"/>
    <g font-size="8" text-anchor="middle">
      <text x="42" y="588" fill="#10B981" font-weight="700">Accueil</text>
      <text x="128" y="588" fill="#94A3B8">Messages</text>
      <text x="212" y="588" fill="#94A3B8">Activités</text>
      <text x="296" y="588" fill="#94A3B8">Profil</text>
      <circle cx="42" cy="572" r="4" fill="#10B981"/>
      <circle cx="128" cy="572" r="4" fill="#CBD5E1"/>
      <circle cx="212" cy="572" r="4" fill="#CBD5E1"/>
      <circle cx="296" cy="572" r="4" fill="#CBD5E1"/>
    </g>
  </g>

  <!-- ══════════ ÉCRAN 2 — CONTACT (téléphone + code) ══════════ -->
  <g transform="translate(400,80)">
    <rect width="340" height="620" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="12" y="-8" font-size="11" font-weight="700" fill="#334155">2 · CONTACT — le compte n'est demandé qu'ICI</text>

    <rect x="0" y="0" width="340" height="26" rx="20" fill="#FFFFFF"/>
    <text x="16" y="18" font-size="10" fill="#94A3B8">9:41</text>

    <circle cx="26" cy="50" r="13" fill="#F1F5F9"/>
    <path d="M30 50 L22 50 M26 44 L20 50 L26 56" stroke="#0F172A" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="20" y="90" font-size="16" font-weight="800" fill="#0F172A">Envoyer un message</text>
    <text x="20" y="108" font-size="10" fill="#64748B">à Le Bosphore · réponse sous 2 h en général</text>

    <!-- Champ message (actif avant le compte) -->
    <g transform="translate(20,124)">
      <rect width="300" height="86" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="12" y="22" font-size="9.5" fill="#94A3B8">Bonjour, je souhaite réserver pour…</text>
      <line x1="12" y1="76" x2="286" y2="76" stroke="#E2E8F0"/>
      <text x="12" y="68" font-size="8" fill="#CBD5E1">0 / 500</text>
    </g>

    <!-- Téléphone -->
    <text x="20" y="236" font-size="10" font-weight="700" fill="#334155">Votre numéro</text>
    <g transform="translate(20,244)">
      <rect width="300" height="38" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="1.8"/>
      <text x="12" y="24" font-size="11" font-weight="600" fill="#0F172A">+90 5•• ••• •• 42</text>
    </g>
    <text x="20" y="300" font-size="8.5" fill="#64748B">Jamais affiché au commerce sans votre accord explicite.</text>

    <!-- Champ de code OTP -->
    <text x="20" y="326" font-size="10" font-weight="700" fill="#334155">Code reçu par SMS</text>
    <g transform="translate(20,334)">
      <rect width="44" height="44" rx="9" fill="#F8FAFC" stroke="#E2E8F0"/><text x="22" y="29" font-size="15" font-weight="700" text-anchor="middle" fill="#0F172A">4</text>
      <rect x="50" width="44" height="44" rx="9" fill="#F8FAFC" stroke="#E2E8F0"/><text x="72" y="29" font-size="15" font-weight="700" text-anchor="middle" fill="#0F172A">8</text>
      <rect x="100" width="44" height="44" rx="9" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/><text x="122" y="29" font-size="15" font-weight="700" text-anchor="middle" fill="#0F172A">1</text>
      <rect x="150" width="44" height="44" rx="9" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="188" y="27" font-size="9" fill="#10B981" font-weight="600">Renvoyer</text>
      <text x="188" y="38" font-size="8" fill="#94A3B8">dans 42 s</text>
    </g>

    <!-- SMS indisponible : alternative e-mail, jamais de faux succès -->
    <g transform="translate(20,392)">
      <rect width="300" height="40" rx="9" fill="#FFFBEB" stroke="#FDE68A"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#92400E">Vous ne recevez pas le SMS ?</text>
      <text x="10" y="29" font-size="8.5" fill="#B45309">Recevoir le code par e-mail</text>
    </g>

    <!-- Erreur de code — état obligatoire -->
    <g transform="translate(20,442)">
      <rect width="300" height="30" rx="9" fill="#FEF2F2" stroke="#FECACA"/>
      <text x="10" y="19" font-size="8.5" fill="#B91C1C">Code expiré. Demandez-en un nouveau.</text>
    </g>

    <g transform="translate(20,486)">
      <rect width="300" height="42" rx="11" fill="#10B981"/>
      <text x="150" y="26" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">Envoyer le message</text>
    </g>

    <text x="20" y="552" font-size="8" fill="#94A3B8">Aucun mot de passe n'est créé ni envoyé. Vous vous connectez au code.</text>
    <text x="20" y="566" font-size="8" fill="#94A3B8">Un code à usage unique, valable 10 minutes.</text>
  </g>

  <!-- ══════════ ÉCRAN 3 — CONVERSATION ══════════ -->
  <g transform="translate(776,80)">
    <rect width="340" height="620" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="12" y="-8" font-size="11" font-weight="700" fill="#334155">3 · CONVERSATION (issue du parcours)</text>

    <rect x="0" y="0" width="340" height="26" rx="20" fill="#FFFFFF"/>
    <text x="16" y="18" font-size="10" fill="#94A3B8">9:43</text>

    <line x1="0" y1="62" x2="340" y2="62" stroke="#E2E8F0"/>
    <circle cx="26" cy="44" r="13" fill="#F1F5F9"/>
    <path d="M30 44 L22 44 M26 38 L20 44 L26 50" stroke="#0F172A" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="50" y="41" font-size="11" font-weight="700" fill="#0F172A">Le Bosphore</text>
    <circle cx="50" cy="50" r="2.4" fill="#10B981"/>
    <text x="57" y="53" font-size="8" fill="#64748B">en ligne</text>

    <!-- Message client -->
    <g transform="translate(20,84)">
      <rect width="230" height="54" rx="12" fill="#10B981"/>
      <text x="12" y="21" font-size="9.5" fill="#FFFFFF">Bonjour, je souhaite réserver</text>
      <text x="12" y="35" font-size="9.5" fill="#FFFFFF">pour 4 personnes ce soir,</text>
      <text x="12" y="49" font-size="9.5" fill="#FFFFFF">vers 20h.</text>
    </g>
    <text x="20" y="150" font-size="7.5" fill="#94A3B8">Envoyé · 9:43</text>

    <!-- Réponse commerce -->
    <g transform="translate(90,164)">
      <rect width="230" height="40" rx="12" fill="#F1F5F9"/>
      <text x="12" y="18" font-size="9.5" fill="#0F172A">Bonsoir ! Oui, table de 4</text>
      <text x="12" y="31" font-size="9.5" fill="#0F172A">à 20h, c'est noté.</text>
    </g>

    <!-- Indicateur de réponse -->
    <g transform="translate(90,216)">
      <rect width="46" height="26" rx="12" fill="#F1F5F9"/>
      <circle cx="14" cy="13" r="2.6" fill="#94A3B8"/>
      <circle cx="23" cy="13" r="2.6" fill="#94A3B8"/>
      <circle cx="32" cy="13" r="2.6" fill="#94A3B8"/>
    </g>

    <!-- Séparation Léa l'assistante IA -->
    <g transform="translate(20,268)">
      <rect width="300" height="46" rx="10" fill="#F5F3FF" stroke="#DDD6FE"/>
      <rect x="10" y="10" width="26" height="26" rx="8" fill="#7C3AED"/>
      <text x="23" y="27" font-size="10" font-weight="800" text-anchor="middle" fill="#FFFFFF">L</text>
      <text x="46" y="20" font-size="9" font-weight="700" fill="#5B21B6">Léa · assistante IA</text>
      <text x="46" y="33" font-size="8" fill="#7C3AED">Séparée du commerce — clairement identifiée comme IA</text>
    </g>

    <!-- Champ de saisie -->
    <line x1="0" y1="546" x2="340" y2="546" stroke="#E2E8F0"/>
    <g transform="translate(16,558)">
      <rect width="252" height="36" rx="18" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="14" y="22" font-size="9.5" fill="#94A3B8">Écrire un message…</text>
    </g>
    <circle cx="306" cy="576" r="18" fill="#10B981"/>
    <path d="M300 576 h12 M307 571 l5 5 -5 5" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Légende -->
  <g transform="translate(24,690)">
    <text x="0" y="0" font-size="10" font-weight="700" fill="#334155">Trois touches : fiche → Contacter → champ de message.</text>
    <text x="0" y="16" font-size="9.5" fill="#64748B">Écran 1 : aucun compte. Écran 2 : le numéro n'est demandé qu'après le premier geste volontaire. Écran 3 : la conversation appartient au BC-13, rien n'est dupliqué.</text>
  </g>

  <defs>
    <linearGradient id="photoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>
</svg>
