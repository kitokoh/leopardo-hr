    <path d="M312 52 L320 52 M316 46 L322 52 L316 58" stroke="#0F172A" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="24" cy="52" r="14" fill="#FFFFFF" opacity="0.92"/>
    <path d="M29 50 v-3 h-10 v3 M28 50 v8 h-8 v-8" stroke="#0F172A" stroke-width="1.4" fill="none"/>

