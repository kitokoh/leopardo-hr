<?xml version="1.0" encoding="UTF-8"?>
<!--
  COULOIR 16 — M1 · Maquette 360 px · parcours « fiche → contact » en RTL.

  Version miroir arabe du parcours. Ce n'est PAS un `transform="scale(-1,1)"`
  du fichier LTR : un miroir mécanique retourne aussi les photos, le logo et
  les chiffres — or en arabe les nombres restent écrits de gauche à droite.
  La maquette est donc retournée structurellement, puis le contenu
  (nombres, « +90 », « 1/4 ») est réécrit en LTR à l'intérieur des zones
  miroir. C'est exactement ce que fait `Directionality.rtl` dans Flutter,
  et ce que la maquette doit montrer.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="740" viewBox="0 0 1140 740" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Naskh Arabic', sans-serif">
  <rect width="1140" height="740" fill="#F8FAFC"/>

  <g direction="rtl">
  <text x="24" y="36" font-size="17" font-weight="800" fill="#0F172A" text-anchor="start">Couloir 16 — parcours fiche → contact (360 px, RTL / العربية)</text>
  <text x="24" y="58" font-size="12" fill="#64748B" text-anchor="start">Miroir structurel, pas une inversion mécanique : les nombres et les indicatifs restent LTR</text>

  <!-- ══════════ ÉCRAN 1 — FICHE ══════════ -->
  <g transform="translate(24,80)">
